/* 档案注入：整份和总结版。 */
function archiveWholeBlocks(list,c,lim){
  const out=[];
  list.forEach(a=>{
    if(a.off||!archiveAllowed(a,c.id))return;
    if(a.whole){
      const ms=getArc(a.id);
      let t=ms.map(m=>(arcRole(m)==='user'?'她':c.name)+'：'+arcMsgText(m)).join('\n');
      if(lim>0&&t.length>lim)t=t.slice(0,lim)+'……';
      if(t)out.push('【《'+a.name+'》全文·这是你们真实发生过的过去】\n'+t);
    }else if(a.summOn&&a.sum&&!sumRefusal(a.sum)){
      let s=a.sum;
      if(lim>0&&s.length>lim)s=s.slice(0,lim)+'……';
      out.push('【《'+a.name+'》总结版·这是你们真实经历过的事，你记得这些】\n'+s);
    }
  });
  return out;
}
/* 档案注入：按关键词摘录旧对话。 */
function archiveQueryBlocks(list,query,c,top){
  if(!(top>0&&query&&query.trim().length>1))return [];
  const gq=grams(query),hits=[];
  list.forEach(a=>{
    if(a.whole||a.off||!archiveAllowed(a,c.id))return;
    const ms=getArc(a.id);
    const from=Math.max(0,ms.length-MAX_SCAN);
    for(let i=from;i<ms.length;i++){
      const t=arcMsgText(ms[i]);
      if(!t||t.length<6)continue;
      const s=sim(gq,grams(t));
      if(s>0.16)hits.push({s:s,a:a,i:i,ms:ms});
    }
  });
  hits.sort((x,y)=>y.s-x.s);
  const cut=hits.slice(0,top);
  if(!cut.length)return [];
  return ['【旧日对话摘录】这是你和她过去真实聊过的片段，你记得这些事，可以自然地想起来、接着聊：\n'+
    cut.map(h=>{
      const seg=h.ms.slice(Math.max(0,h.i-1),h.i+2).map(m=>(arcRole(m)==='user'?'她':c.name)+'：'+arcMsgText(m)).join('\n');
      return '——摘自《'+h.a.name+'》\n'+seg;
    }).join('\n\n')];
}

/* ---------- 解析：JSON / Markdown / 纯文本 ---------- */
function isMsgLike(x){return x&&typeof x==='object'&&!Array.isArray(x)&&('content' in x||'text' in x||'message' in x||'contentParts' in x)&&('role' in x||'sender' in x||'type' in x||'author' in x)}
function normMsg(m){
  const rs=String(m.role||m.sender||m.type||m.author||'').toLowerCase();
  if(/system|tool/.test(rs))return null;
  const role=/user|human|me$|用户|我$/.test(rs)?'user':/assist|ai|bot|gpt|model|助手|模型/.test(rs)?'assistant':null;
  if(!role)return null;
  let c='';
  if(Array.isArray(m.contentParts))c=m.contentParts.filter(p=>p&&p.type==='text'&&p.text).map(p=>p.text).join('\n');
  if(!c&&m.content!=null)c=m.content;
  if(!c&&m.text!=null)c=m.text;
  if(!c&&m.message!=null)c=m.message;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  c=String(c==null?'':c).trim();
  if(!c)return null;
  return {role:role,content:c,t:(typeof m.timestamp==='number'?m.timestamp:Date.now())};
}
function digSessions(node,name,out,depth){
  if(depth>10||!node)return;
  if(Array.isArray(node)){
    if(node.length&&node.some(isMsgLike)){
      const ms=node.map(normMsg).filter(Boolean);
      if(ms.length>=2){out.push({name:name||'导入的对话',messages:ms});return;}
    }
    node.forEach(v=>digSessions(v,name,out,depth+1));
    return;
  }
  if(typeof node==='object'){
    const nm=node.name||node.title||node.topic||node.subject||name;
    Object.keys(node).forEach(k=>{
      const v=node[k];
      if(v&&typeof v==='object')digSessions(v,nm,out,depth+1);
    });
  }
}
function parseText(text){
  const msgs=[];let cur=null;
  const push=()=>{if(cur){const c=cur.content.trim();if(c)msgs.push({role:cur.role,content:c,t:Date.now()});cur=null}};
  const uk=/^(you|user|human|me|用户|我|她)$/i,ak=/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)$/i;
  text.split('\n').forEach(raw=>{
    const l=raw.replace(/\s+$/,'');
    const s=l.replace(/^[#>\-*\s]+/,'').trim();
    if(!s){if(cur)cur.content+='\n';return}
    let role=null,rest='',m;
    m=s.match(/^(you|user|human|me|用户|我|她)\s*[:：]\s*(.*)$/i);
    if(m){role='user';rest=m[2]}
    else{
      m=s.match(/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)\s*[:：]\s*(.*)$/i);
      if(m){role='assistant';rest=m[2]}
      else if(uk.test(s)){role='user'}
      else if(ak.test(s)){role='assistant'}
    }
    if(role){push();cur={role:role,content:rest};return}
    if(cur)cur.content+=(cur.content?'\n':'')+l;
  });
  push();
  return msgs.length>=2?{name:'导入的对话',messages:msgs}:null;
}
function parseArchive(text){
  const t=String(text).trim();
  if(t[0]==='{'||t[0]==='['){
    try{
      const out=[];
      digSessions(JSON.parse(t),null,out,0);
      const clean=out.filter(x=>x.messages.length>=2);
      if(clean.length)return clean;
    }catch(e){}
  }
  const md=parseText(text);
  return md?[md]:[];
}
function slimHtml(h){
  return String(h)
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<svg[\s\S]*?<\/svg>/gi,'')
    .replace(/<head[\s\S]*?<\/head>/gi,'')
    .replace(/<img[^>]*>/gi,'')
    .replace(/url$\s*["']?data:[^)]*$/gi,'')
    .replace(/<\/(div|p|li|h[1-6]|tr|section|article|blockquote)>/gi,'\n')
    .replace(/<br\s*\/?>/gi,'\n');
}
function roleOfEl(el){
  let cur=el,hop=0;
  while(cur&&hop<4){
    const s=((cur.getAttribute&&cur.getAttribute('data-message-author-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('data-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('class'))||'');
    const t=s.toLowerCase();
    if(/user|human|sender-self|消息-我|我发的/.test(t))return 'user';
    if(/assist|chatbox|\bai\b|\bbot\b|gpt|reply|model|助手/.test(t))return 'assistant';
    cur=cur.parentElement;hop++;
  }
  return null;
}
function parseHtmlArchive(html){
  let doc=null;
  try{doc=new DOMParser().parseFromString(slimHtml(html),'text/html')}catch(e){}
  if(doc){
    const sel='[data-message-author-role],[data-role],[class*="message"],[class*="msg"],[class*="bubble"],[class*="chat-item"],[class*="chatItem"],[class*="turn"],[class*="round"]';
    let els=[];
    try{els=Array.from(doc.querySelectorAll(sel))}catch(e){}
    if(els.length){
      const leaves=els.filter(el=>!els.some(o=>o!==el&&el.contains(o)));
      const got=[];
      leaves.forEach(el=>{
        const r=roleOfEl(el);
        if(!r)return;
        const t=(el.textContent||'').replace(/\n{2,}/g,'\n').trim();
        if(!t||t.length>20000)return;
        got.push({role:r,content:t,t:Date.now()});
      });
      const clean=[];
      got.forEach(m=>{const p=clean[clean.length-1];if(p&&p.role===m.role&&p.content===m.content)return;clean.push(m)});
      if(clean.length>=2)return {name:'',messages:clean};
    }
    const txt=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n');
    const md=parseText(txt);
    if(md&&md.messages.length>=2)return md;
  }
  return null;
}
function diagnose(text,isHtml){
  let sample='';
  try{
    if(isHtml){
      const doc=new DOMParser().parseFromString(slimHtml(text),'text/html');
      sample=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n').trim().slice(0,900);
    }else sample=String(text).trim().slice(0,900);
  }catch(e){sample='（连文字都没抠出来）'}
  showSheet('<div class="ttl">没认出来，帮我看看</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">下面是从文件里抠出来的文字开头。截这张图发我，我照着加格式。</p>'+

  '<p class="dim" style="font-size:12px;margin-top:8px">文件字符数：'+text.length.toLocaleString()+'</p>'+
  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关</button></div>');
}

function readFileText(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result));
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsText(f);
  });
}
async function importArchive(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  toast('读取中… '+(f.size/1048576).toFixed(1)+'MB');
  let text;
  try{text=await readFileText(f)}catch(e){return alert(e.message)}
  if(!text.trim())return alert('这文件是空的');
  toast('解析中，大文件要等几秒，别动…');
  await new Promise(r=>setTimeout(r,80));
  const isHtml=/\.html?$/i.test(f.name)||/^\s*<(!doctype|html)/i.test(text.slice(0,300));
  let found=[];
  try{
    if(isHtml){const one=parseHtmlArchive(text);found=one?[one]:[]}
    else found=parseArchive(text);
  }catch(e){console.warn(e)}
  if(!found.length){toast('没解析出来');return diagnose(text,isHtml)}
  const st=await ingestFound(found,f.name.replace(/\.[^.]+$/,''));

  let msg='导入完成\n档案：'+st.added+' 份\n消息：'+st.total+' 条';
  if(st.fail)msg+='\n失败：'+st.fail+' 份';
  if(st.empty)msg+='\n\n⚠️ 有 '+st.empty+' 条消息没读出内容，这份档案可能没法总结。';
  alert(msg);

}
async function ingestFound(found,fileName){
  const arcs=load(LS.arcs,[]);
  let added=0,total=0,fail=0,empty=0;
  for(let i=0;i<found.length;i++){
    const f=found[i];
    const ms=sanitizeArcMs(f.messages.filter(m=>m.role==='user'||m.role==='assistant'));
    if(ms.length<2)continue;
    ms.forEach(m=>{if(!arcMsgText(m))empty++});
    const id=uid();
    const nm=fileName?(found.length>1?(fileName+' '+(i+1)):fileName):(f.name||('档案'+(arcs.length+1)));
    try{await idbPut(id,ms);arcMem[id]=ms}
    catch(e){fail++;console.warn(e);continue}
    arcs.push({id:id,name:nm,count:ms.length,whole:false,off:false,t:Date.now()});
    added++;total+=ms.length;
  }
  save(LS.arcs,arcs);scheduleBackup();
  refreshMem();
  return {added:added,total:total,fail:fail,empty:empty};
}

/* ---------- 历史档案：分段精读 → 层级归并 → 总结版 ---------- */
function arcLines(ms,from,to,cname){
  return ms.slice(from,to).map(m=>{
    let t=arcMsgText(m);
    if(t.length>ARC_ONE_MSG_MAX)t=t.slice(0,ARC_ONE_MSG_MAX)+'…';
    return (arcRole(m)==='user'?'她':cname)+'：'+t;
  }).filter(x=>x.replace(/^[^：:]*[：:]/,'').trim().length>0).join('\n');
}

function buildArcMapPrompt(a,i,n,prevTail,sliceText){
  return '你是严谨的记忆档案整理员。下面是一段历史对话存档，请把它压缩成「分段笔记」。\n'+

  '1. 只记录对话里真实出现的信息，绝对不许编造、脑补、推测、美化。\n'+

  '6. 不要写感想、点评，不要多余修饰。\n\n'+

  '场景：时间、地点、当下氛围（未说明就写「未说明」）\n'+

function buildArcReducePrompt(a,notes,budget,extra){
  return '你是严谨的记忆档案整理员。下面是同一份历史对话档案《'+a.name+'》的分段笔记，已按时间顺序排好。\n'+
  '请把它们合并成一份《总结版》，供角色日后回忆往事时阅读。\n'+
  '【铁律】\n'+
  '1. 严格保持原始先后顺序，禁止打乱，禁止把不同时间点的事合并成一件。\n'+
  '2. 保留全部专有名词、称呼、数字、日期、地点，原样照抄。\n'+
  '3. 合并重复内容，但不得因为"重复"而丢掉任何信息。\n'+
  '4. 若前后信息冲突，两条都保留，并标「（前后不一致）」。\n'+
  '5. 不许编造、不许推测动机、不许加感想。\n'+
  '6. 语言精简、信息密度高，总长控制在 '+budget+' 字以内。\n\n'+
  '【格式】\n'+
  '整体概括：（不超过120字，讲清这段关系/故事的整体面貌）\n'+
  '时间线：\n1. （第1件）\n2. （第2件）\n…按发生顺序全部列出，可标注阶段（如 初期 / 转折 / 现在）\n'+
  '重要事件与细节：\n- …\n'+
  '关系变化：\n- …\n'+
  '承诺·约定·未了事项：\n- …\n'+
  'TA 的重要偏好与忌讳：\n- …\n'+
  '存疑：\n- …（没有就写「无」）\n\n'+
  '分段笔记如下：\n'+notes+
  (extra||'');
}

/* 判断一段文本是不是「模型在向我索要内容」的废话 */
function sumRefusal(s){
  s=String(s||'').trim();
  if(!s)return false;
  return s.length<600&&SUM_REFUSAL.test(s);
}
/* 判断归并结果是否合格 */
function sumQualityBad(s){
  s=String(s||'').trim();
  if(!s)return true;
  if(sumRefusal(s))return true;
  if(s.length<40&&!/时间线|整体概括|事件/.test(s))return true;
  return false;
}
/* 按字数/段数把笔记安全分批 */
function packNotes(notes,maxChars,maxItems){
  const out=[];let cur=[],len=0;
  notes.forEach(n=>{
    const L=String(n||'').length;
    if(cur.length&&(len+L>maxChars||cur.length>=maxItems)){out.push(cur);cur=[];len=0}
    cur.push(n);len+=L;
  });
  if(cur.length)out.push(cur);
  return out;
}
/* 一次归并调用（带空内容保护 + 一次重试） */
async function reduceOne(a,notes,budget,model,extra){
  const clean=notes.filter(x=>x&&String(x).trim());
  if(!clean.length)throw new Error('分段笔记为空，无法归并');
  const joined=clean.map((t,i)=>'--- 第 '+(i+1)+' 部分 ---\n'+String(t).trim()).join('\n\n');
  const res=await callAPI([{role:'user',content:buildArcReducePrompt(a,joined,budget,extra)}],
    {model:model,temp:.2,maxtok:ARC_REDUCE_TOK});
  return String(res||'').trim();
}
async function reduceOneSafe(a,notes,budget,model){
  let r='';
  try{r=await reduceOne(a,notes,budget,model)}catch(e){r=''}
  if(!r||sumQualityBad(r)){
    try{
      const r2=await reduceOne(a,notes,budget,model,ARC_NOASK);
      if(r2&&!sumQualityBad(r2))return r2;
      if(!r)r=r2;
    }catch(e){}
  }
  return (r&&!sumQualityBad(r))?r:'';
}

/* 分段精读：生成每段笔记；有上次缓存就直接复用。 */
/* 分段笔记：模型没回或回得太差时，原样保留片段兜底。 */
function normalizeArcNote(note,text,i,n){
  note=String(note||'').trim();
  if(!note||sumRefusal(note)||note.length<12){
    note='范围：第 '+(i+1)+'/'+n+' 段\n事件：\n- （模型没按格式回，下面直接放原始对话片段）\n'+text.slice(0,1500);
  }
  if(note.length>ARC_NOTE_CAP)note=note.slice(0,ARC_NOTE_CAP);
  return note;
}
/* 分段笔记：取“结尾状态”用于下一段衔接。 */
function arcNoteTail(note){
  const m=note.match(/结尾状态[：:]\s*([\s\S]{0,200})/);
  return m?m[1].trim():note.slice(-200);
}
async function buildArcNotes(a,ms,c,n,CH,OV,model,id){
  let notes=[];
  const cache=arcNotesCache[id];
  if(cache&&cache.len===ms.length&&cache.notes&&cache.notes.length===n){
    notes=cache.notes.slice();
    toast('复用上次的分段笔记…');
    return notes;
  }
  let prevTail='',totalChars=0;
  for(let i=0;i<n;i++){
    const from=Math.max(0,i*CH-(i>0?OV:0));
    const to=Math.min(ms.length,(i+1)*CH);
    const text=arcLines(ms,from,to,c.name);
    totalChars+=text.replace(/^[^：:]*[：:]/gm,'').trim().length;
    if(!text){notes.push('');continue}
    let note='';
    try{
      note=String(await callAPI([{role:'user',content:buildArcMapPrompt(a,i,n,prevTail,text)}],
        {model:model,temp:.2,maxtok:ARC_MAP_TOK})||'').trim();
    }catch(e){note=''}
    /* 模型没回、回的是套话、或回得太短：原样保留片段，保证记忆不丢 */
    note=normalizeArcNote(note,text,i,n);
    notes.push(note);
    prevTail=arcNoteTail(note);
    toast('精读 '+(i+1)+'/'+n+' 段…');
  }
  if(!totalChars)throw new Error('这份档案里没有可用文字（可能是导入时没解析出内容），请把它删掉、重新导入一次文件。');
  arcNotesCache[id]={len:ms.length,notes:notes.slice()};
  return notes;
}

/* 层级归并：把分段笔记合并成一份总结版。 */
async function mergeArcNotes(a,clean,model){
  let merged='';
  const packs=packNotes(clean,ARC_MID_CHARS,ARC_MID_ITEMS);
  if(packs.length<=1){
    merged=await reduceOneSafe(a,clean,ARC_SUM_BUDGET,model);
  }else{
    let cur=[];
    for(let i=0;i<packs.length;i++){
      const r=await reduceOneSafe(a,packs[i],ARC_REDUCE_BATCH,model);
      cur.push(r||packs[i].join('\n\n'));   /* 归并不动就原样往下传，绝不丢 */
      toast('归并 '+Math.min(i+1,packs.length)+'/'+packs.length+'…');
    }
    let level=1;
    while(cur.length>1&&level<4){
      const ps=packNotes(cur,ARC_MID_CHARS,6);
      if(ps.length>=cur.length)break;      /* 分不动了就别死循环 */
      const next=[];
      for(const g of ps){
        const r=await reduceOneSafe(a,g,ARC_SUM_BUDGET,model);
        next.push(r||g.join('\n\n'));
      }
      cur=next;level++;
    }
    merged=await reduceOneSafe(a,cur,ARC_SUM_BUDGET,model)||'';
  }
  return merged;
}

/* 生成总结版前的检查与确认；不满足条件时返回 null。 */
function prepareArcSummary(id){
  if(arcBusy){toast('上一次总结还在跑，等它结束再点');return null}
  const arcs=load(LS.arcs,[]);
  const a=arcs.find(x=>x.id===id);if(!a)return null;
  const ms=getArc(id);if(!ms.length){alert('这份档案里没读到消息。请把文件重新导入一次。');return null}
  const c=curChar();if(!c){alert('先在「角色」里选一个角色');return null}
  if(!cfg.key){alert('先去设置里填 API Key');return null}

  const CH=ARC_CHUNK, OV=ARC_OVERLAP;
  const n=Math.max(1,Math.ceil(ms.length/CH));
  const cost=n+Math.ceil(n/ARC_MID_ITEMS)+2;
  if(!confirm('用「'+c.name+'」的模型，把《'+a.name+'》（'+ms.length+' 条）整理成一份「总结版」。\n'+
    '流程：分 '+n+' 段精读 → 再层级归并成一份总结版，预计调用模型 '+cost+' 次左右，会消耗一些 token。\n'+
    (arcNotesCache[id]&&arcNotesCache[id].len===ms.length?'（上次的分段笔记还在，这次可以直接复用，省很多 token）\n':'')+
    '生成后保存在这份档案里，角色聊天时能读到。确定开始？'))return null;

  return {arcs:arcs,a:a,ms:ms,c:c,CH:CH,OV:OV,n:n,model:modelOf(c)};
}

/* 保存总结版结果，并给用户提示。 */
function saveArcSummaryResult(a,arcs,id,merged,clean,n,ms){
  let fallback=false;
  if(!merged||sumQualityBad(merged)){
    merged='（自动整理没成功，下面是把分段笔记原样合并的内容，可以手动编辑整理）\n\n'+clean.join('\n\n').slice(0,8000);
    fallback=true;
  }

  a.sum=merged;
  a.sumAt=Date.now();
  a.sumChunks=n;
  a.sumCount=ms.length;
  a.summOn=true;     /* 默认开启：聊天时注入总结版 */
  a.off=false;       /* 不再自动归档 */
  a.summarized=true;
  delete arcNotesCache[id];
  save(LS.arcs,arcs);scheduleBackup();
  refreshMem();
  if($('#modal').classList.contains('on'))viewArc(id);
  alert(fallback
    ?'总结版没能自动整理好（模型一直没按要求回），我先把分段笔记合并存进了《'+a.name+'》里，你可以直接编辑，或再点一次「重新生成总结版」。'
    :'总结版已生成（约 '+a.sum.length+' 字），已保存在《'+a.name+'》里，聊天时会注入给角色。\n可在档案页直接查看、编辑，或点「重新生成总结版」。');
}

async function summarizeArc(id){
  const p=prepareArcSummary(id);
  if(!p)return;
  const arcs=p.arcs,a=p.a,ms=p.ms,c=p.c,CH=p.CH,OV=p.OV,n=p.n,model=p.model;
  arcBusy=true;
  try{
    const notes=await buildArcNotes(a,ms,c,n,CH,OV,model,id);

    toast('归并中…');
    const clean=notes.filter(x=>x&&String(x).trim());
    if(!clean.length)throw new Error('一个分段笔记都没生成出来，检查一下模型是否可用，然后再点一次。');

    const merged=await mergeArcNotes(a,clean,model);

    saveArcSummaryResult(a,arcs,id,merged,clean,n,ms);
  }catch(e){

/* ---------- token 估算 ---------- */
function estTokens(s){
  s=String(s||'');
  if(!s)return 0;
  const cjk=(s.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length;
  const other=s.length-cjk;
  return Math.max(1,Math.round(cjk + other/4));
}

/* ---------- 一条消息要不要分成几个气泡发（像真人连发几条） ---------- */
const BUB_SEP='|||';          /* 角色想「分条发」时，用它隔开 */
/* 返回要拆成的几段文字；返回 null 表示「不拆，照老样子一个气泡」。 */
function splitBubbleParts(content,isMe){
  const raw=String(content==null?'':content).replace(/\r\n?/g,'\n');
  if(!raw.trim())return null;
  if(raw.indexOf(BUB_SEP)>=0){                 /* ① 角色自己用 ||| 分的条，最准 */
    const arr=raw.split(BUB_SEP).map(s=>s.trim()).filter(s=>s!=='');
    if(arr.length>1)return arr.slice(0,8);
  }
  if(isMe)return null;                         /* ② 她自己打的字不拆，免得看着奇怪 */
  if(mdHasBlock(raw))return null;              /* ③ 列表、代码、引用、表格这种正经排版不拆 */
  const lines=raw.split('\n').map(s=>s.trim()).filter(s=>s!=='');
  if(lines.length<2||lines.length>4)return null;
  if(lines.some(s=>s.length>24))return null;   /* 有一句偏长，就老老实实放一个气泡 */
  return lines;                                /* ④ 几个短句连着写 → 当成连发几条 */
}
/* Telegram 那种「小尾巴」：给一条气泡补上靠头像那个下角的小尖角（已经有了就不重复加） */
function addBubbleTail(el){
  if(!el)return;
  var kids=el.children;
  for(var i=0;i<kids.length;i++){
    if(kids[i].classList&&kids[i].classList.contains('btail'))return;
  }
  /* 两层：btail 是描边那层，btailf 是气泡色那层（后加的盖在上面） */
  var tip=document.createElement('i');
  tip.className='btail';
  tip.setAttribute('aria-hidden','true');
  el.appendChild(tip);
  var fill=document.createElement('i');
  fill.className='btailf';
  fill.setAttribute('aria-hidden','true');
  el.appendChild(fill);
}

  const plain=!x.img&&!(x.files&&x.files.length)&&!x.art&&!x.sticker;
  const parts=plain?splitBubbleParts(x.content,isMe):null;
  if(parts&&parts.length>1){

  }else{

      filesHTML(x.files,i)+

  /* 每条气泡都补一个 Telegram 小尾巴（分条的那种是每个小气泡都补） */
  ((parts&&parts.length>1)?Array.prototype.slice.call(d.querySelectorAll('.bsub')):[d]).forEach(function(b){addBubbleTail(b)});

function chipIconKey(s){return String(s==null?'':s).replace(/[\uFE0E\uFE0F\u200D]/g,'').trim()}
/* 把「一个（或几个）表情」换成矢量图；认不出来就返回空字符串（外面会原样显示表情） */
function chipIconSVG(ic){
  const raw=String(ic==null?'':ic).trim();
  if(!raw)return '';
  if(raw.indexOf('<svg')===0)return raw;              /* 本来就是矢量图，直接用 */
  const mk=p=>(p.indexOf('<svg')===0)?p:('<svg class="ci" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>');
  const one=CHIP_IC[chipIconKey(raw)];
  if(one)return mk(one);
  /* 一条里挤了好几个表情（少见）：都认出来才换 */
  const arr=Array.from(chipIconKey(raw));
  if(arr.length>1&&arr.every(ch=>CHIP_IC[ch]))return arr.map(ch=>mk(CHIP_IC[ch])).join('');
  return '';
}

function memBlock(m){
  const L=[],pk=(arr,n)=>arr.slice(-n).map(x=>'- '+x.text).join('\n');
  if(m.core)L.push('【角色核心设定】\n'+m.core);
  if(m.timeline&&m.timeline.length)L.push('【时间线】\n'+pk(m.timeline,15));
  if(m.summaries&&m.summaries.length)L.push('【长期聊天记录总结】\n'+pk(m.summaries,10));
  if(m.prefs&&m.prefs.length)L.push('【偏好与认知】\n'+pk(m.prefs,20));
  if(m.habits&&m.habits.length)L.push('【性格与习惯】\n'+pk(m.habits,15));
  return L.join('\n\n');
}
/* 「我的主页」里填的资料，注入给角色 */
function userBlock(){
  const L=[];
  if(cfg.userName)L.push('名字：'+cfg.userName);
  if(cfg.userGender)L.push('性别：'+cfg.userGender);
  if(cfg.userNote)L.push('其他：'+cfg.userNote);
  if(!L.length)return '';

}
/* 热层：最近几轮原文。
   1 轮 = 你说一句 + 角色回一句。默认 20 轮，可在角色「记忆」页或设置里改。 */
function hotRoundCount(){
  const n=Number(cfg&&cfg.hotRounds);
  return (Number.isFinite(n)&&n>0)?Math.min(200,Math.round(n)):20;
}
/* 发消息时到底带多少聊天记录（热层） */
function historySlice(){
  const mode=(cfg.histMode||'auto');
  if(mode==='full'){
    const lim=(cfg.fullLimit==null?20000:cfg.fullLimit);
    if(lim<=0)return msgs.slice();          /* 0 = 不限制：整段聊天记录全带上 */
    let total=0,start=0;
    for(let i=msgs.length-1;i>=0;i--){total+=String(msgs[i].content||'').length+12;if(total>lim){start=i+1;break}}
    return msgs.slice(start);
  }
  if(mode==='sum')return msgs.slice(-4);
  return msgs.slice(-(hotRoundCount()*2));
}

/* 处理非流式接口返回。 */
/* 接口返回的内容先检查一遍：只有正常的对象才往下走。
   中转站出问题时经常回一个 null，以前会直接去读它的 usage 而崩掉，
   现在改成抛出一句能看懂的中文提示。 */
function apiErrText(err){
  if(!err)return '';
  if(typeof err==='string')return String(err).replace(/\s+/g,' ').slice(0,300);
  return String(err.message||err.msg||err.detail||err.code||'').replace(/\s+/g,' ').slice(0,300);
}
function apiJsonGuard(j,raw){
  if(j&&typeof j==='object'&&!Array.isArray(j)){
    if(j.error)throw new Error('接口报错：'+apiErrText(j.error));
    return j;
  }
  const tail=raw?('　服务器原样返回：'+String(raw).replace(/\s+/g,' ').slice(0,160)):'';
  throw new Error('接口没返回正常内容（常见原因：这次发的内容太长、额度用完、或中转站出错）'+tail);
}
function handleApiJsonResponse(j,opt,raw){
  j=apiJsonGuard(j,raw);
  if(opt.onUsage&&j.usage)opt.onUsage(j.usage);
  const msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
  if(opt.onReasoning){const rc=pickReasoning(msg);if(rc)opt.onReasoning(rc)}
  if(opt.tools)return {content:msg.content||'',tool_calls:msg.tool_calls||null};
  return msg.content||'';
}
/* 创建流式返回解析器。 */
function createApiStreamParser(opt){
  let out='';
  const emit=(line)=>{
    const d=line.slice(5).trim();
    if(d==='[DONE]')return true;
    try{
      const j=JSON.parse(d);
      if(j.usage&&opt.onUsage)opt.onUsage(j.usage);
      const de=j.choices&&j.choices[0]&&j.choices[0].delta;
      if(de&&opt.onReasoning){const rc=pickReasoning(de);if(rc)opt.onReasoning(rc)}
      const c=de&&de.content;
      if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}
    }catch(e){}
    return false;
  };
  return {emit:emit,getOut:()=>out};
}
/* 读取流式接口返回，直到结束。 */
async function readApiStreamText(res,parser){
  if(!res.body){
    const t=await res.text();
    for(const l of t.split('\n')){
      const line=l.trim();
      if(line.indexOf('data:')!==0)continue;
      if(parser.emit(line))break;
    }
    return parser.getOut();
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const raw of lines){
      const line=raw.trim();
      if(!line||line.indexOf('data:')!==0)continue;
      if(parser.emit(line))return parser.getOut();
    }
  }
  return parser.getOut();
}

/* ---------- 通用打字机：群聊 / 角色主动发来的消息，也一个字一个字冒出来 ---------- */
/* opts: {start: 从第几个字开始（中途重画时接着打）, onTick: 进度回调, onDone: 结束回调} */
/* 打字机速度：落后越多，追得越快。 */
function typeSpeedFor(behind){
  let speed=55;                                   /* 字/秒：平时看得清是「一个个冒出来」 */
  if(behind>1200)speed=420;else if(behind>400)speed=220;else if(behind>150)speed=110;
  return speed;
}
/* 往打字机元素里追加 n 个字。 */
function appendTypedChunk(el,tail,st,n){
  st.shown=Math.min(st.src.length,st.shown+n);
  for(let k=st.rendered;k<st.shown;k++){
    const ch=st.src.charAt(k);
    if(ch==='\n'){el.insertBefore(document.createElement('br'),tail);continue}
    const sp=document.createElement('span');sp.className='tw';sp.textContent=ch;
    el.insertBefore(sp,tail);
  }
  st.rendered=st.shown;
}
function revealText(el,text,opts){
  if(!el)return;
  opts=opts||{};
  if(el._rv)el._rv.dead=true;                      /* 同一个元素只留一个动画 */
  const full=String(text==null?'':text);
  const start=Math.max(0,Math.min(full.length,opts.start||0));
  const st={dead:false,ok:true,shown:start,rendered:start,src:full};
  el._rv=st;
  el.classList.add('gen');                          /* 打字时显示光标 */
  el.textContent=full.slice(0,start);
  if(st.shown>=full.length){el.classList.remove('gen');if(opts.onTick)opts.onTick(st.shown);if(opts.onDone)opts.onDone();return}
  const tail=document.createElement('i');tail.style.display='none';el.appendChild(tail);
  let lastT=0,acc=0;
  const finish=()=>{if(!st.ok)return;st.ok=false;st.dead=true;if(el._rv===st)el.classList.remove('gen');if(opts.onDone)opts.onDone()};
  const step=()=>{
    if(st.dead||!el.isConnected){finish();return}
    const now=Date.now();
    if(!lastT)lastT=now;
    const dt=Math.min(120,now-lastT);lastT=now;
    const behind=st.src.length-st.shown;
    const speed=typeSpeedFor(behind);
    acc+=dt*speed/1000;
    let n=Math.floor(acc);
    if(n<1&&dt>=50)n=1;
    if(n>0){
      acc-=n;
      appendTypedChunk(el,tail,st,n);
      if(opts.onTick)opts.onTick(st.shown);
      try{if(el.closest('.gmsgs'))scrollGroupDown()}catch(e){}
    }
    if(st.shown>=st.src.length){finish();return}
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- 记忆总结（写进记忆，不覆盖原始记录） ---------- */
function parseSummary(res){
  const out={core:null,timeline:[],summaries:[],prefs:[],habits:[]};
  const LAB={
    '核心':'core','核心设定':'core','角色核心':'core','角色设定':'core','人设':'core','设定':'core',
    '时间线':'timeline','事件':'timeline','关键事件':'timeline','时间':'timeline',
    '总结':'summaries','长期总结':'summaries','长期记忆总结':'summaries','长期聊天记录总结':'summaries','聊天总结':'summaries','对话总结':'summaries','内容总结':'summaries','这段对话':'summaries',
    '偏好':'prefs','偏好与认知':'prefs','认知':'prefs','在意':'prefs','忌讳':'prefs','喜好':'prefs',
    '习惯':'habits','性格':'habits','性格与习惯':'habits','行为习惯':'habits','说话习惯':'habits'
  };
  let cur=null;
  String(res||'').split('\n').forEach(raw=>{
    let s=raw.trim();
    if(!s)return;
    s=s.replace(/^[-*•·\d.\s、>]+/,'');
    s=s.replace(/^[【\[\s]+/,'').replace(/[】\]]/,'');
    s=s.replace(/^\*{1,2}/,'');
    const m=s.match(/^([^：:]{1,14}?)\s*[:：]\s*(.*)$/);
    if(m){
      const lab=m[1].replace(/[*】\]]+$/,'').trim();
      const k=LAB[lab];
      if(k){cur=k;addSumItem(out,k,m[2]);return}
    }
    if(cur)addSumItem(out,cur,s);
  });
  return out;
}
function addSumItem(out,k,v){
  v=String(v==null?'':v).trim();
  if(!v||/^(无|无。|暂无|none|n\/a)$/i.test(v))return;
  if(k==='core'){if(!out.core)out.core=v;return}
  if(k==='timeline'){v.split(/[；;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>out.timeline.push(x));return}
  out[k].push(v);
}
function applySummary(M,p){
  let hit=0;
  if(p.core){M.core=(M.core?M.core+'\n':'')+p.core;hit++}
  if((cfg.sumWrite||'append')==='replace'&&p.summaries&&p.summaries.length)M.summaries=[];
  ['timeline','summaries','prefs','habits'].forEach(k=>{
    p[k].forEach(t=>{M[k]=M[k]||[];M[k].push({t:Date.now(),text:t});hit++});
  });
  return hit;
}

/* ---------- 自动发消息 ---------- */
/* 【新增】免打扰可以不设置：把「免打扰时段」的开关关掉，就任何时间都可能主动发消息 */
function isQuiet(a){
  if(!a||a.quietOn===false)return false;
  const h=new Date().getHours(),qs=+a.quietStart,qe=+a.quietEnd;
  if(isNaN(qs)||isNaN(qe))return false;
  return qs<=qe?(h>=qs&&h<qe):(h>=qs||h<qe);
}
function autoEligible(c){return !!(cfg&&cfg.autoOn&&cfg.key&&c&&c.auto&&c.auto.on)}
function autoRange(c){
  const mi=Math.max(1,+c.auto.min||30),ma=Math.max(mi+1,+c.auto.max||90);
  return {mi:mi,ma:ma,ms:(mi+Math.random()*(ma-mi))*MS_PER_MIN};
}
function autoArm(c,force){
  const r=autoRange(c);
  let cur=autoMap[c.id];
  if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
  autoMap[c.id]={at:Date.now()+r.ms,mi:r.mi,ma:r.ma};
}
function scheduleAuto(force){
  if(!chars||!chars.length){if(autoTick){clearInterval(autoTick);autoTick=null}autoMap={};return}
  chars.forEach(c=>{
    if(!autoEligible(c)){delete autoMap[c.id];return}
    autoArm(c,force);
  });
  const live=Object.keys(autoMap).length;
  if(live&&!autoTick)autoTick=setInterval(checkAuto,15000);
  if(!live&&autoTick){clearInterval(autoTick);autoTick=null}
}
/* 「距上一条消息过了多久」说成大白话，给主动消息用 */
function autoAgoText(t){
  if(!t)return '';
  const d=Date.now()-t;
  if(!(d>0))return '刚刚';
  const mi=Math.floor(d/60000);
  if(mi<1)return '刚刚';
  if(mi<60)return mi+' 分钟前';
  const h=Math.floor(mi/60);
  if(h<24)return h+' 小时前';
  return Math.floor(h/24)+' 天前';
}
/* 主动发消息时，放在最末尾那段话：让角色明白「是系统戳了它一下」 */
function autoProactiveNudge(lastMsg){
  const ago=autoAgoText(lastMsg&&lastMsg.t);
  let s='（系统提示：这不是她发来的新消息，上面聊天记录里的那些话也都已经聊过了，不用再回应。\n'+
    '是她给你开了「自动发消息」，现在时间到了，系统在旁边戳了你一下——这一轮由你主动，给她发一条新的消息。\n';
  if(ago)s+='距你们上一条消息：'+ago+'。你可以自己判断这个时间合不合适开口。\n';
  s+='你可以顺着刚才的话题再多说一句（她没回，你也可以像突然想起什么似的自己补一句），也可以起一个全新的话头：\n'+
    '想起一件事、看到点什么、想知道她现在在干嘛、想分享心情、想约她或者逗逗她，都可以，全看你此刻想不想说话。\n'+
    '必须注意：不要回答上面最后一条消息（不管它是她说的还是你说的）；不要重复你上一条已经说过的话；\n'+
    '不要解释你为什么突然发消息，不要说「看你没回」「系统提示我」这类话，也不要提到这条提示本身。\n'+
    '就用 1-2 句自然的话，像随手发微信那样，符合你的性格和你们平时的相处方式。）';
  return s;
}
/* 只保留汉字、字母和数字，用来比较两条消息是不是在说同一件事 */
function autoFlatText(s){return String(s||'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g,'').toLowerCase()}
function autoIsRepeat(a,b){
  const x=autoFlatText(a),y=autoFlatText(b);
  if(!x||!y)return false;
  if(x===y)return true;
  const short=x.length<=y.length?x:y,long=x.length<=y.length?y:x;
  return short.length>=8&&long.indexOf(short)>=0;
}
async function autoGenerate(c,forceNudge){
  if(!autoKeep)autoKeep={curId:curId,msgs:msgs,mem:mem};
  const wasOpen=(autoKeep.curId===c.id);
  curId=c.id;
  msgs=load(LS.msg(c.id),[]);
  mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{});
  const autoHint=(c.auto&&c.auto.hint)?String(c.auto.hint).trim():'';
  /* 你填的「主动消息提示」在系统提示里也放一份，免得被忽略 */
  const extra=autoHint?('【主动消息提示（只在你主动发消息时生效）】这是她写给你的要求，请照做：'+autoHint):'';
  const tp=thinkParams(c);
  const lastAI=msgs.slice().reverse().find(x=>x.role==='assistant'&&x.content);
  const lastMsg=msgs.length?msgs[msgs.length-1]:null;
  /* ↓ 关键：这句放在「最后一条消息」的位置，模型最容易看见 */
  /* 到点提醒时会传进来一段专门的提示（forceNudge），平时就是「主动找她聊聊」那段 */
  const nudge=forceNudge||autoProactiveNudge(lastMsg);
  let out='',reasoning='',usage=null;
  const autoCall=async(note)=>{
    out='';reasoning='';usage=null;
    const ctx=buildCtx(c,extra);
    ctx.push({role:'user',content:nudge+(note||'')});
    await callAPI(ctx,{stream:true,model:modelOf(c),temp:tp.temp,maxtok:tp.maxtok,signal:(curAbort?curAbort.signal:undefined),
      onDelta:d=>{out+=d},onReasoning:r=>{reasoning+=r},onUsage:u=>{usage=u}});
    return String(out||'').trim();
  };
  out=await autoCall('');
  if(!out)return false;
  /* ↓ 保险：万一又和上一条几乎一样，明确提醒一次「这是重复」，只重试一次 */
  if(lastAI&&autoIsRepeat(lastAI.content,out)){
    const again=await autoCall('\n（注意：这样又重复你上一条说过的话了，不能这样。请换一个说法或换一个话题，发给她的必须是新的内容。）');
    if(again)out=again;
  }
  const m={role:'assistant',content:out,t:Date.now(),
    tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out)};
  if(usage&&usage.prompt_tokens)m.ptok=usage.prompt_tokens;
  if(reasoning)m.reasoning=reasoning;      /* ← 自动消息也保存思考链 */
  msgs.push(m);persist();
  pendingAutoText=out;                     /* 如果你正好看着这个聊天，这条会逐字显示 */
  notify(c.name,(c.emoji||'')+out.slice(0,80));
  /* 你没在看着它的时候，标个红点 */
  if(!(wasOpen&&view==='chat'&&!document.hidden)){
    markUnread(c.id);
    toast((c.emoji||'')+' '+c.name+' 发来一条消息');
  }
  /* 【新增】自动发的消息也算进度，够条数就一起自动总结 */
  try{await autoSumForLoaded(c)}catch(e){}
  /* ↓ 补丁5-A：自动发的消息也弹一个悬浮通知 */
  try{
    var arr2=load(LS.msg(c.id),[]);
    var lm=arr2[arr2.length-1];
    if(lm&&lm.role==='assistant'&&lm.content)
      window.P5.maybeNotify({kind:'char',cid:c.id,name:(c.emoji||'')+' '+c.name,
        emoji:c.emoji,avatar:c.avatar,text:lm.content});
  }catch(e){}
  return true;
}
/* 给「当前 msgs 就是这个角色的聊天记录」这种场景用的自动总结 */
async function autoSumForLoaded(c){
  if(!cfg.autoSum||!cfg.key||!c)return;
  const every=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  if(msgs.length-done<every)return;
  const from=Math.max(0,msgs.length-every);
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+msgBrief(x)).join('\n');
  setAutoSumMark(c.id,msgs.length);
  const hit=await runSummary(slice,true,c.id);
  if(!hit)setAutoSumMark(c.id,done);
}
async function runAutoNow(c,forceNudge){
  busy=true;curAbort=new AbortController();
  let ok=false;
  try{
    ok=await autoGenerate(c,forceNudge);
  }catch(e){
    const aborted=!!(e&&(e.name==='AbortError'||/abort/i.test(e.message||'')));
    if(!aborted)toast('自动消息失败：'+((e&&e.message)||'未知错误'));
  }finally{
    busy=false;curAbort=null;
    if(autoKeep){
      const kc=autoKeep;autoKeep=null;
      curId=kc.curId;
      if(kc.curId===c.id){msgs=load(LS.msg(c.id),[]);mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{})}
      else{msgs=kc.msgs;mem=kc.mem}
      if(curId)memCtx={id:curId,obj:mem};
      if(view==='chat')renderChat();
      else draw();
      if(pendingAutoText&&view==='chat'&&curId===c.id)typeLastChatMsg(pendingAutoText);
      pendingAutoText='';
    }
    scheduleAuto(false);
  }
  return ok;
}
async function checkAuto(){
  if(busy||!cfg||!cfg.autoOn||!cfg.key)return;
  const now=Date.now();
  const due=chars.filter(c=>c.auto&&c.auto.on&&autoMap[c.id]&&autoMap[c.id].at<=now&&!isQuiet(c.auto));
  if(!due.length)return;
  due.sort((x,y)=>autoMap[x.id].at-autoMap[y.id].at);
  const c=due[0];
  autoArm(c,true);
  await runAutoNow(c);
}

  const n=JSON.parse(JSON.stringify(c));
  n.id=uid();
  n.name=(c.name||'角色')+' 副本';
  n.priv=false;
  if(n.auto)n.auto.on=false;          /* 副本默认关掉自动发消息，免得突然刷屏 */
  chars.push(n);
  save(LS.chars,chars);scheduleBackup();scheduleAuto(false);
  renderRoles();
  toast('已复制：'+n.name+'（点「编辑」就能改它）');
}

function editPriv(id){
  const c=chars.find(x=>x.id===id);if(!c)return;
  if(!hasAnyPrivPw())return editChar(id);
  showSheet('<div class="ttl">🔒 改私密角色要先验证</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 10px">为保护隐私，修改「'+esc(c.name)+'」的设定前要输一次密码。</p>'+
  '<input id="epw" type="password" placeholder="密码" autocomplete="off">'+
  '<p id="eperr" class="dim" style="font-size:12px;color:var(--warn);min-height:18px;margin:6px 0 0"></p>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="tryEditPriv(\''+id+'\')">验证并编辑</button>'+
  '<button class="ghost col" onclick="closeSheet()">取消</button></div>');
  setTimeout(()=>{const el=document.getElementById('epw');if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')tryEditPriv(id)})}},80);
}
async function tryEditPriv(id){
  const el=document.getElementById('epw'),err=document.getElementById('eperr');
  const pw=el?el.value:'';
  if(!pw){if(err)err.textContent='请输入密码';return}
  let ok=false;try{ok=await verifyPriv(pw)}catch(e){ok=false}
  if(!ok){if(err)err.textContent='密码不对';return}
  closeSheet();
  editChar(id);
}
function moveChar(id,dir){
  const i=chars.findIndex(c=>c.id===id);if(i<0)return;
  const j=i+dir;if(j<0||j>=chars.length)return;
  const t=chars[i];chars[i]=chars[j];chars[j]=t;
  save(LS.chars,chars);scheduleBackup();renderRoles();
}

/* ---------- 隐私角色：密码 ---------- */
const hasLockPw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.pw));return !!(m&&m.salt)}catch(e){return false}};
const hasPrivPwRaw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.priv));return !!(m&&m.salt)}catch(e){return false}};
const hasAnyPrivPw=()=>hasLockPw()||hasPrivPwRaw();
async function verifyPriv(pw){
  let meta=null;try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(meta&&meta.salt){
    try{const k=await deriveKey(pw,new Uint8Array(meta.salt));if(await decVal(k,meta.check)==='ok')return true}catch(e){}
  }
  let pm=null;try{pm=JSON.parse(localStorage.getItem(LS.priv))}catch(e){}
  if(pm&&pm.salt){
    try{const k=await deriveKey(pw,new Uint8Array(pm.salt));if(await decVal(k,pm.check)==='ok')return true}catch(e){}
  }
  return false;
}
function openPriv(id){
  showSheet('<div class="ttl">🔒 需要密码</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 10px">这是私密角色，输入密码才能进入对话。</p>'+
  '<input id="ppw" type="password" placeholder="密码" autocomplete="off">'+
  '<p id="pperr" class="dim" style="font-size:12px;color:var(--warn);min-height:18px;margin:6px 0 0"></p>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="tryPriv(\''+id+'\')">进入</button>'+
  '<button class="ghost col" onclick="closeSheet()">取消</button></div>');
  setTimeout(()=>{
    const el=document.getElementById('ppw');
    if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')tryPriv(id)})}
  },80);
}
async function tryPriv(id){
  const el=document.getElementById('ppw');
  const err=document.getElementById('pperr');
  const pw=el?el.value:'';
  if(!pw){if(err)err.textContent='请输入密码';return}
  if(!window.crypto||!crypto.subtle){if(err)err.textContent='当前环境不支持密码校验，请用 Chrome/Edge 打开';return}
  if(!hasAnyPrivPw()){if(err)err.textContent='还没设置任何密码，先去「设置 → 隐私角色」设一个';return}
  let ok=false;
  try{ok=await verifyPriv(pw)}catch(e){ok=false}
  if(!ok){if(err)err.textContent='密码不对';return}
  closeSheet();
  loadChar(id);go('chat');
  toast('已进入私密对话');
}
async function setPrivPw(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 打开，或放到 https 网站里。');
  const el=document.getElementById('priv_pw');
  const pw=el?el.value:'';
  if(!pw)return alert('先输入隐私密码');
  if(pw.length<6)return alert('密码至少 6 位');

  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    localStorage.setItem(LS.priv,JSON.stringify({salt:Array.from(salt),check:check}));
    toast('隐私密码已保存');
    renderCfg();
  }catch(e){alert('保存失败：'+e.message)}
}
function clearPrivPw(){
  if(!confirm('清除隐私密码？（之后只能用应用锁密码进入隐私角色）'))return;
  localStorage.removeItem(LS.priv);

}

function mpalEntries(c){
  const TAG=mtagAll(),list=load(LS.arcs,[])||[],out=[];
  const who=MPAL.who;                     /* '' ＝「全部档案」模式，不按角色过滤 */
  const whoC=who||(c&&c.id);              /* 聊天记录：全部模式下用当前角色 */
  for(const a of list){
    if(MPAL.arcId){if(a.id!==MPAL.arcId)continue}
    else if(a.off||(who&&!archiveAllowed(a,who)))continue;
    const am=getArc(a.id);
    for(let i=0;i<am.length;i++){
      if(MPAL.tag){
        const tags=mtagChunk(TAG,a.id,i);
        if(!tags||!tags.some(t=>tagSplit(t).name===MPAL.tag))continue;
      }
      out.push(mpalArcRef(a,i));
      if(out.length>=3000)return out;
    }
  }
  /* 按标签查的时候，把聊天记录里打了这个标签的也一起列出来 */
  if(!MPAL.arcId&&MPAL.tag&&whoC){
    const ms2=(whoC===curId)?msgs:(load(LS.msg(whoC),[])||[]);
    for(let i=0;i<ms2.length;i++){
      const tags=mtagChunk(TAG,'chat:'+whoC,chatKey(ms2[i],i));
      if(!tags||!tags.some(t=>tagSplit(t).name===MPAL.tag))continue;
      out.push(mpalChatRef(whoC,ms2[i],i));
      if(out.length>=3000)break;
    }
  }
  return out;
}

const fmtSize=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+' KB';return (n/1048576).toFixed(1)+' MB'};
const FILE_TXT_MAX=6000;                 /* 文字类附件最多读给角色多少字 */
function isTextFile(f){
  const n=String((f&&f.name)||'').toLowerCase();
  const t=String((f&&f.type)||'').toLowerCase();
  if(t.indexOf('text/')===0)return true;
  if(/json|xml|javascript|ecmascript|csv|yaml|x-sh|sql|markdown/.test(t))return true;
  return /\.(txt|md|markdown|json|csv|tsv|log|ya?ml|xml|html?|css|js|mjs|ts|tsx|jsx|py|java|kt|c|h|cpp|hpp|cs|go|rs|rb|php|sh|bash|zsh|sql|ini|conf|env|srt|vtt)$/.test(n);
}
const FILE_ICON='<svg viewBox="0 0 24 24"><path d="M13.6 3.6H7.5c-.8 0-1.4.6-1.4 1.4v14c0 .8.6 1.4 1.4 1.4h9c.8 0 1.4-.6 1.4-1.4V8Z"/><path d="M13.6 3.6V8H18"/></svg>';
function filesHTML(list,mi){
  if(!list||!list.length)return '';
  return list.map((f,j)=>'<div class="filechip" onclick="viewFileAt('+mi+','+j+')">'+FILE_ICON+
    '<span>'+esc(f.name)+'</span><i>'+fmtSize(f.size)+'</i></div>').join('');
}
/* 附件写进给模型看的上下文：文字类给内容，其它只给「发了什么文件」 */
function fileBlocks(list){
  if(!list||!list.length)return '';
  return list.map(f=>{
    const size=fmtSize(f.size);
    if(f.kind==='text'&&f.text)return '【附件：'+f.name+'（'+size+'，文字文件'+(f.trunc?('，只截取了前 '+FILE_TXT_MAX+' 字'):'')+'）】\n'+f.text;
    return '【附件：'+f.name+'（'+size+'）】这种格式我这边看不到内容，只知道她发来了这个文件。';
  }).join('\n\n');
}

  viewFile(m.files[fi]);

/* 压缩图片：最长边限制到 max 像素，转 jpeg，避免把存储撑爆 */
function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const src=String(rd.result||'');
      const type=String((file&&file.type)||'').toLowerCase();
      const isGif=(type==='image/gif'||/^data:image\/gif[;,]/.test(src));
      /* 动图不能进 canvas（那样只剩第一帧）：不太大的直接原样用，保住动效 */
      if(isGif&&src.length<=800000){res(src);return}
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return rej(new Error('图片尺寸异常'));
        const s=Math.min(1,max/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        /* 透明图（PNG / WebP）用 PNG 存，白底就不会把透明盖掉；其它图继续压成 JPEG */
        const alpha=(type==='image/png'||type==='image/webp'||/^data:image\/(png|webp)[;,]/.test(src));
        let url=alpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',q);
        if(url.length>420000)url=cv.toDataURL('image/jpeg',.5);
        res(url);
      };
      img.onerror=()=>rej(new Error('这不是有效的图片'));
      img.src=src;
    };
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsDataURL(file);
  });
}

/* ================= 待办提醒（到点由角色发消息） =================
   角色在聊天里用 set_reminder 工具设定；用户也能在「应用 → 待办」里自己填时间。
   提醒就存在待办本身里（多两个字段 remindAt / remindSent），所以备份会一起带走。
   注意：和「自动发消息」一样，只有页面开着的时候才会到点触发。 */
let remindTick=null,remindBusy=false;
const REMIND_LATE=6*3600000;         /* 迟了超过 6 小时就不再补发（只标成已过时），免得一开页面冒一堆 */
/* 把工具给的时间参数换算成一个绝对时间点（毫秒）；听不出具体时间就返回 0 */
function remindWhen(args){
  const now=Date.now();
  const mi=parseInt((args&&args.after_minutes)||'',10);
  if(Number.isFinite(mi)&&mi>0)return now+Math.min(mi,43200)*MS_PER_MIN;   /* 最多 30 天 */
  const raw=String((args&&args.time)||'').trim();
  /* 保险：万一模型把「一小时后」写进了 time，也认 */
  const duro=raw.match(/(\d+)\s*(个)?\s*(小时|钟头|h\b|hours?)/i);
  if(duro)return now+Math.min(parseInt(duro[1],10)||1,720)*60*MS_PER_MIN;
  const durm=raw.match(/(\d+)\s*(分钟|min(ute)?s?\b)/i);
  if(durm)return now+Math.min(parseInt(durm[1],10)||1,43200)*MS_PER_MIN;
  /* 允许前面带「晚上 / 明天 / 下午」这类字，只要里面找得到「9点 / 21:30」就算 */
  const m=raw.match(/[^\d]*(\d{1,2})\s*[:：点时]\s*(\d{1,2})?/)||raw.match(/^\s*(\d{1,2})\s*$/);
  if(!m)return 0;
  let h=parseInt(m[1],10),mm=m[2]?parseInt(m[2],10):0;
  if(!m[2]&&/半/.test(raw))mm=30;
  if(/晚|夜|下午|傍晚/.test(raw)&&h<12)h+=12;
  if(/凌晨/.test(raw)&&h>=12)h-=12;
  if(h>23||mm>59)return 0;
  const d=new Date();
  if(/明天|明日/.test(raw))d.setDate(d.getDate()+1);   /* 说了「明天」就一定是明天 */
  d.setHours(h,mm,0,0);
  let at=d.getTime();
  if(at<=now)at+=MS_PER_DAY;         /* 今天这个点已经过了，就顺延到明天 */
  return at;
}
function remindStamp(ms){return fmtStamp(ms)}

  if(t.remindSent)return '⏰ '+remindStamp(t.remindAt)+'（已经提醒过）';
  if(t.remindAt<=Date.now())return '⏰ '+remindStamp(t.remindAt)+'（已过时）';
  return '⏰ '+remindStamp(t.remindAt)+' 会来提醒 · ';
}

async function checkReminders(){
  if(remindBusy)return;
  /* 应用锁着的时候先不响，免得提醒内容出现在锁屏上；解锁后下一次检查会补上 */
  try{if(typeof isLocked==='function'&&isLocked())return}catch(e){}
  const now=Date.now(),due=[],old=[];
  (chars||[]).forEach(c=>{
    let arr=[];try{arr=todosOf(c.id)}catch(e){arr=[]}
    arr.forEach(t=>{
      if(!t||!t.remindAt||t.done||t.remindSent)return;
      if(t.remindAt>now)return;
      if(now-t.remindAt>REMIND_LATE)old.push({cid:c.id,todo:t});else due.push({cid:c.id,todo:t});
    });
  });
  /* 迟太久的：只标一下，不补发消息 */
  old.forEach(x=>{
    try{const a=todosOf(x.cid),t=a.find(y=>y.id===x.todo.id);if(t){t.remindSent=true;t.remindMissed=true;saveTodos(x.cid,a)}}catch(e){}
  });
  if(!due.length){
    if(old.length&&view==='tools'&&toolTab==='todo')try{renderToolPane()}catch(e){}
    return;
  }
  due.sort((a,b)=>a.todo.remindAt-b.todo.remindAt);
  const one=due[0];
  remindBusy=true;
  try{await fireReminder(one.cid,one.todo)}catch(e){}
  remindBusy=false;
  if(due.length>1)setTimeout(checkReminders,1500);   /* 一次来一条，别刷屏 */
}

async function fireReminder(cid,todo){

  /* 先标成已提醒：万一接口出问题，也不会过 20 秒又响一次 */

/* 闹钟提示音：用浏览器自己合成，不需要音频文件（手机静音档听不到） */
let alarmCtx=null;
function playAlarm(){
  try{if(navigator.vibrate&&!(cfg&&cfg.vibrateOff))navigator.vibrate([0,260,140,260,140,420])}catch(e){}
  if(cfg&&cfg.alarmOff)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    alarmCtx=alarmCtx||new AC();
    const ac=alarmCtx;
    if(ac.state==='suspended')try{ac.resume()}catch(e){}
    const t0=ac.currentTime+0.03;
    for(let i=0;i<3;i++){
      const t=t0+i*0.46;
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(988,t);
      o.frequency.setValueAtTime(740,t+0.16);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.connect(g);g.connect(ac.destination);
      o.start(t);o.stop(t+0.42);
    }
  }catch(e){}
}

  if(kind==='alarm')cfg.alarmOff=!on;else cfg.vibrateOff=!on;

  /* 【新增】到点提醒：填了时间，到点这个角色会主动发消息 + 响提示音 */

function addTodo(){
  const t=$('#todoText').value.trim();if(!t)return alert('写点内容');
  const ty=$('#todoType').value;

function toggleTodo(id){

  t.done=!t.done;saveTodos(todoCharId,arr);renderToolPane();

function delTodo(id){

/* ---------- 小工具（纯本地互动）
   【改动】加了「随机中 → 随机完成」的过渡动画：滚动预览 + 进度条 + 结果弹出。

function funBoxHTML(){

  }
  if(funResult){

    '<div class="funres">'+esc(funResult)+'</div>'+
    '<div class="funok">✓ 随机完成</div></div>';

function funRefresh(){const el=document.getElementById('funBoxOut');if(el)el.innerHTML=funBoxHTML()}
function funHTML(){

  '<p class="dim" style="font-size:12px;margin:0 0 10px">不用联网的小玩法，纯本地随机。</p>'+
  '<div class="row"><button class="col" onclick="funDice()">'+ciHTML("🎲")+' 掷骰子</button>'+
  '<button class="col" onclick="funCoin()">'+ciHTML("🪙")+' 抛硬币</button></div>'+

  '<div id="funBoxOut">'+funBoxHTML()+'</div></div>';

/* preview()：滚动时随机显示的假结果；result()：真正的结果 */
function funRun(preview,result){
  if(funRolling)return;
  funRolling=true;funResult='';funTxt='· · ·';
  funEnd=Date.now()+820;
  clearInterval(funSpin);
  funRefresh();
  funSpin=setInterval(()=>{
    funTxt=preview();
    funRefresh();
    if(Date.now()>=funEnd){
      clearInterval(funSpin);funSpin=null;
      funRolling=false;funTxt='';
      funResult=result();
      funRefresh();
      toast('✅ 随机完成');
    }
  },80);
}
function funDice(){funRun(()=>'🎲 '+(1+Math.floor(Math.random()*6)),()=>'🎲 '+(1+Math.floor(Math.random()*6)))}
function funCoin(){funRun(()=>Math.random()<.5?'🪙 正面':'🪙 反面',()=>Math.random()<.5?'🪙 正面':'🪙 反面')}
function funRand(){const el=$('#funMax');const n=Math.max(1,Math.round(Number(el?el.value:100)||100));funRun(()=>'🔢 '+(1+Math.floor(Math.random()*n)),()=>'🔢 '+(1+Math.floor(Math.random()*n)))}
function funPick(){
  const el=$('#funList');
  const arr=String(el?el.value:'').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean);
  if(!arr.length)return toast('先填几个选项，用逗号隔开');
  funRun(()=>'👉 '+arr[Math.floor(Math.random()*arr.length)],()=>'👉 '+arr[Math.floor(Math.random()*arr.length)]);

/* ================= 一起听音乐（本地播放器） =================
   QQ音乐 / 网易云的歌单没法在一个纯网页里直接同步（要登录授权，浏览器也不允许
   跨网站读取），所以这里做成本地歌单：贴歌曲链接（mp3 / m4a / ogg 等），
   或者从手机里选一首音频文件。正在放的歌会写进角色的系统提示，
   角色就知道你在听什么了。 */
const MUSIC={list:[],cur:-1,vol:.9,playing:false,audio:null,loaded:false,seeking:false,tick:null,lastErr:0,
  srcId:'',                                    /* 播放器里现在装的是哪首歌的音频源（没装就是空） */
  mode:'order',                                /* 播放方式：order 顺序 / one 单曲循环 / shuffle 随机 */
  manual:{title:'',artist:'',on:false,at:0},   /* 手动记录「我在别的App里听这首」 */
  stat:{d:'',sec:0,plays:{}},                  /* 听歌账本：今天的时长 + 每首歌的次数 */
  lists:[],pl:'all',                           /* 【新】歌单：lists 是自己建的歌单；pl 是现在页面上选中的那个（'all'=全部歌曲，''=默认歌单） */
  see:{mode:'added',listId:''},                /* 【新】让角色看哪些歌：added 最前面加的 / list 某个歌单 / recent 最近播放 */
  recent:[],                                   /* 【新】最近播放过的歌（歌的 id，越靠前越新） */
  sorting:false,drag:null};                    /* 【新】拖动排序：sorting 是「正在排序」模式，drag 记着这次拖动 */
function musicLoad(){
  const d=load(LS.music,null);
  if(!d||typeof d!=='object')return;
  MUSIC.list=(Array.isArray(d.list)?d.list:[]).filter(s=>s&&s.title&&(s.url||s.kind==='file')).map(s=>{
    if(s.kind==='file')return {id:s.id||uid(),title:s.title,artist:s.artist||'',kind:'file',blobId:s.blobId||s.id,url:'',pl:s.pl||''};
    return {id:s.id||uid(),title:s.title,artist:s.artist||'',kind:'url',url:s.url,pl:s.pl||''};
  });
  /* 【新】歌单：自己建的歌单列表 + 每首歌属于哪个歌单 */
  MUSIC.lists=(Array.isArray(d.lists)?d.lists:[]).filter(x=>x&&x.id&&x.name).map(x=>({id:x.id,name:String(x.name).slice(0,20)}));
  MUSIC.list.forEach(s=>{if(s.pl&&!MUSIC.lists.some(x=>x.id===s.pl))s.pl=''});    /* 歌单被删了就把歌放回默认 */
  if(typeof d.pl==='string'&&(d.pl==='all'||d.pl===''||MUSIC.lists.some(x=>x.id===d.pl)))MUSIC.pl=d.pl;
  else MUSIC.pl='all';
  /* 【新】让角色看哪些歌 + 最近播放 */
  const se=(d.see&&typeof d.see==='object')?d.see:{};
  MUSIC.see={mode:(se.mode==='list'||se.mode==='recent')?se.mode:'added',listId:(typeof se.listId==='string')?se.listId:''};
  MUSIC.recent=(Array.isArray(d.recent)?d.recent:[]).filter(id=>MUSIC.list.some(s=>s.id===id)).slice(0,30);
  MUSIC.vol=(typeof d.vol==='number')?Math.min(1,Math.max(0,d.vol)):.9;
  MUSIC.mode=(d.mode==='one'||d.mode==='shuffle')?d.mode:'order';   /* 播放方式（顺序 / 单曲循环 / 随机） */
  const mm=d.manual;
  MUSIC.manual=(mm&&mm.title)?{title:mm.title,artist:mm.artist||'',at:mm.at||0,
    on:!!mm.on&&(Date.now()-(mm.at||0)<6*3600*1000)}:{title:'',artist:'',on:false,at:0};
  /* 听歌账本 */
  const st=d.stat;
  MUSIC.stat=(st&&typeof st==='object')?{d:String(st.d||''),sec:Math.max(0,Number(st.sec)||0),
    plays:(st.plays&&typeof st.plays==='object')?st.plays:{}}:{d:'',sec:0,plays:{}};
  musicStatRoll();
  if(d.curId)MUSIC.cur=MUSIC.list.findIndex(s=>s.id===d.curId);
  else MUSIC.cur=(d.curUrl?MUSIC.list.map(s=>s.url).indexOf(d.curUrl):-1);
  /* 本机文件：把音频从浏览器本地库里取回来（自动补上，取到就刷新界面） */
  MUSIC.list.forEach(s=>{
    if(s.kind!=='file')return;
    musicFileUrl(s).then(()=>{try{musicSync()}catch(e){}}).catch(()=>{s.missing=true;try{musicSync()}catch(e){}});
  });
}
function musicEnsure(){if(MUSIC.loaded)return;MUSIC.loaded=true;musicLoad()}
function musicNow(){return (MUSIC.cur>=0&&MUSIC.list[MUSIC.cur])||null}
/* ---------- 【新】歌单：分类、播放队列 ---------- */
function musicSongPl(s){return (s&&s.pl)||''}                    /* 这首歌在哪：'' 是默认歌单 */
function musicPlName(id){                                        /* 歌单名字（'all' 和 '' 是内置的两档） */
  if(id==='all')return '全部歌曲';
  if(!id)return '默认歌单';
  const p=MUSIC.lists.find(x=>x.id===id);
  return p?p.name:'默认歌单';
}
/* 现在页面上这个歌单里，歌在 MUSIC.list 里的下标（按加进来的顺序） */
function musicShownIdx(){
  const p=MUSIC.pl||'all';
  return MUSIC.list.map((s,i)=>i).filter(i=>p==='all'||musicSongPl(MUSIC.list[i])===p);
}
/* 播放队列 = 现在选中的这个歌单里的歌。顺序播完会回到开头，就是「循环这个歌单」。
   这个歌单是空的话，就退回「全部歌曲」，免得放不了也切不了。 */
function musicQIdx(){
  const q=musicShownIdx();
  return q.length?q:MUSIC.list.map((s,i)=>i);
}
/* 接下来这首歌在哪：给「加歌」用（在「全部歌曲」里加歌就放进默认歌单） */
function musicAddPl(){return (MUSIC.pl==='all')?'':MUSIC.pl}
function musicPlOptsHTML(sel){                                   /* 歌单下拉的选项 */
  return '<option value=""'+((sel||'')===''?' selected':'')+'>默认歌单</option>'+
    MUSIC.lists.map(x=>'<option value="'+esc(x.id)+'"'+((sel||'')===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('');
}
/* ---------- 【新】角色能看到哪些歌：由「角色能看到什么」这个选择决定 ---------- */
function musicSeeSongs(){
  try{
    const m=(MUSIC.see&&MUSIC.see.mode)||'added';
    if(m==='recent'){
      const arr=[];
      (MUSIC.recent||[]).forEach(id=>{const s=MUSIC.list.find(x=>x.id===id);if(s&&arr.indexOf(s)<0)arr.push(s)});
      return arr;
    }
    if(m==='list')return MUSIC.list.filter(s=>musicSongPl(s)===(MUSIC.see.listId||''));
    return MUSIC.list.slice();      /* added：歌单里最前面加进来的排前面 */
  }catch(e){return []}
}
function musicSeeText(cur){         /* 拼成给角色看的一句话；没歌可看就返回空 */
  const arr=musicSeeSongs().filter(s=>s!==cur).slice(0,6);
  if(!arr.length)return '';
  const names=arr.map(s=>'《'+(s.title||'')+'》').join('、');
  const m=(MUSIC.see&&MUSIC.see.mode)||'added';
  if(m==='recent')return '她最近在「音乐」里放过这些歌（越靠前越新）：'+names+'。';
  if(m==='list')return '她的「'+musicPlName(MUSIC.see.listId||'')+'」歌单里有：'+names+'。';
  return '她的歌单里还有（按她自己排的顺序）：'+names+'。';
}
function musicFileUrl(s){
  if(!s)return Promise.reject(new Error('没有这首歌'));
  if(s.url)return Promise.resolve(s.url);
  if(s.kind!=='file'||!s.blobId)return Promise.reject(new Error('这不是本机文件'));
  return Promise.resolve().then(()=>idbGetRaw(s.blobId,'music')).then(b=>{
    if(!b)throw new Error('本机文件不见了');
    s.url=URL.createObjectURL(b);
    return s.url;
  });
}
/* ---------- 听歌账本：今天听了多久 / 每首歌听过几次 ---------- */
function musicDayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
/* 跨天了就把「今天」的部分清零（总次数保留） */
function musicStatRoll(){
  const k=musicDayKey();
  if(!MUSIC.stat)MUSIC.stat={d:k,sec:0,plays:{}};
  if(MUSIC.stat.d===k)return;
  MUSIC.stat.d=k;MUSIC.stat.sec=0;
  const p=MUSIC.stat.plays||{};
  for(const id in p)p[id].dn=0;
}
function musicStatGet(s){
  musicStatRoll();
  if(!s)return null;
  const k=s.id||'';
  const p=MUSIC.stat.plays[k]||(MUSIC.stat.plays[k]={n:0,dn:0});
  if(typeof p.n!=='number')p.n=0;
  if(typeof p.dn!=='number')p.dn=0;
  return p;
}
/* 秒数说成人话：1 小时 12 分 / 3 分 20 秒 / 12 秒 */
function musicHuman(sec){
  sec=Math.floor(sec||0);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),ss=sec%60;
  if(h)return h+' 小时 '+m+' 分';
  if(m)return m+' 分 '+ss+' 秒';
  return ss+' 秒';
}
function musicStatText(s){
  const p=s?musicStatGet(s):null;
  let t='今日已听 '+musicHuman(MUSIC.stat.sec);
  if(p)t+=' · 这首一共 '+p.n+' 次（今天 '+p.dn+' 次）';
  return t;
}
/* 【新增】给角色看的那句听歌情况。关键：别让它把「一共听了几次」当成「今天听了几次」，
   所以「今天」和「累计」分开成两行，每个数字后面都写明白是哪一个。
   没有数据就返回空字符串（那样就什么都不说） */
function musicPromptStatLine(s){
  try{
    musicStatRoll();
    const today=[],all=[];
    if((MUSIC.stat.sec||0)>0)today.push('她今天在「音乐」里已经放了 '+musicHuman(MUSIC.stat.sec));
    const p=s?musicStatGet(s):null;
    const nm=s?('《'+(s.title||'')+'》'):'这首歌';
    if(p&&p.n>0){
      all.push(nm+'她一共放过 '+p.n+' 次（这是从她开始用这个网页算起的累计总数，不是今天的次数）');
      if(p.dn>0)today.push(nm+'今天放了 '+p.dn+' 次');
      else today.push(nm+'今天还没放过');
    }
    const out=[];
    out.push('【今天】'+(today.length?(today.join('；')+'。'):'她今天还没在「音乐」里听歌。'));
    if(all.length)out.push('【累计】'+all.join('；')+'。');
    return out.join('\n');
  }catch(e){return ''}
}
/* 开始放一首歌：次数 +1，并记进「最近播放」 */
function musicCountPlay(s){
  const p=musicStatGet(s);if(!p)return;
  p.n++;p.dn++;
  if(s&&s.id){                                          /* 【新】最近播放：最新的一首排最前面 */
    if(!Array.isArray(MUSIC.recent))MUSIC.recent=[];
    MUSIC.recent=[s.id].concat(MUSIC.recent.filter(x=>x!==s.id)).slice(0,30);
  }
  musicSave();
}
/* 正在放的时候按真实时间累计（定时器被手机挂起也不会虚增） */
function musicAddTime(dt){
  if(!(dt>0))return;
  musicStatRoll();
  MUSIC.stat.sec+=dt;
  const now=Date.now();
  if(now-(MUSIC.statSaved||0)>10000){MUSIC.statSaved=now;musicSave()}
}
function musicTimeTick(){
  const a=MUSIC.audio;
  const now=Date.now();
  const prev=MUSIC.pendAt||now;
  MUSIC.pendAt=now;
  if(!a||a.paused||a.ended)return;
  let dt=(now-prev)/1000;
  if(dt>5)dt=5;
  musicAddTime(dt);
  try{
    const sl=document.getElementById('mStatLine');
    if(sl)sl.textContent=musicStatText(musicNow());
  }catch(e){}
}
setInterval(musicTimeTick,1000);
function musicSave(){
  const cur=musicNow();
  musicStatRoll();
  /* 本机文件的地址（blob:…）关掉页面就失效，所以只存歌的信息；音频本身存在浏览器本地库里 */
  const list=MUSIC.list.map(s=>s.kind==='file'
    ?{id:s.id,title:s.title,artist:s.artist||'',kind:'file',blobId:s.blobId,pl:s.pl||''}
    :{id:s.id,title:s.title,artist:s.artist||'',kind:'url',url:s.url,pl:s.pl||''});
  try{save(LS.music,{list:list,curId:cur?cur.id:'',vol:MUSIC.vol,mode:MUSIC.mode,manual:MUSIC.manual,stat:MUSIC.stat,
    lists:MUSIC.lists,pl:MUSIC.pl,see:MUSIC.see,recent:MUSIC.recent})}
  catch(e){try{toast('歌单存不下了：'+((e&&e.message)||e))}catch(_){}}
}
function musicAudio(){
  if(!MUSIC.audio){
    const a=new Audio();
    a.preload='metadata';
    a.volume=MUSIC.vol;
    a.addEventListener('ended',()=>musicEnded());
    a.addEventListener('error',()=>{                 /* 链接不是音频文件时会走这里 */
      if(a.getAttribute('src'))musicFail('这个链接放不出来');
    });
    MUSIC.audio=a;
  }
  return MUSIC.audio;
}
/* 放不出来：标在歌单里，并给一句人话的提示（同一个问题只弹一次） */
function musicFail(msg){
  MUSIC.playing=false;
  /* 【修】把放不出来的那个源清掉：这样再点「播放」会重新装一次源，网络临时抽风的情况能自己救回来。
     以前播放器会一直卡在这个坏源上，就出现「歌单里点能放、最上面的播放键放不出来」。 */
  try{if(MUSIC.audio)MUSIC.audio.removeAttribute('src')}catch(e){}
  MUSIC.srcId='';
  const s=musicNow();
  if(s&&s.kind==='file')s.bad=true;
  else if(s)s.failed=true;

/* 现在列表里那一行一行的元素（顺序和显示顺序一样） */
function musicRowEls(){
  const box=document.getElementById('mList');
  return (box&&box.querySelectorAll)?Array.prototype.slice.call(box.querySelectorAll('.mrow')):[];
}
function musicDragDown(e,i){
  if(!MUSIC.sorting)return;                       /* 不在排序模式：抓手不该出现，保险起见不管 */
  const from=musicShownIdx().indexOf(i);
  if(from<0)return;
  try{e.preventDefault()}catch(_){}
  MUSIC.drag={from:from,to:from};
  const rows=musicRowEls();
  if(rows[from])rows[from].classList.add('dragging');
  document.addEventListener('pointermove',musicDragMove);
  document.addEventListener('pointerup',musicDragEnd);
  document.addEventListener('pointercancel',musicDragEnd);
}
function musicDragMove(e){
  const d=MUSIC.drag;if(!d)return;
  const rows=musicRowEls();
  if(!rows.length)return;
  let to=rows.length-1;                           /* 手指比最后一行还低 → 放最后 */
  for(let k=0;k<rows.length;k++){
    if(e.clientY<rows[k].getBoundingClientRect().bottom){to=k;break}
  }
  if(to===d.to)return;
  d.to=to;
  rows.forEach((el,k)=>el.classList.toggle('dragover',k===to&&k!==d.from));
}
function musicDragEnd(){
  document.removeEventListener('pointermove',musicDragMove);
  document.removeEventListener('pointerup',musicDragEnd);
  document.removeEventListener('pointercancel',musicDragEnd);
  const d=MUSIC.drag;MUSIC.drag=null;
  musicRowEls().forEach(el=>{el.classList.remove('dragging');el.classList.remove('dragover')});
  if(!d||d.from===d.to)return;
  musicReorder(d.from,d.to);
}
/* 真的把顺序写进数据：只重排「现在看得见的这些歌」的位置，别的歌不动 */
function musicReorder(from,to){
  const vis=musicShownIdx();
  if(from<0||from>=vis.length||to<0||to>=vis.length||from===to)return;
  const playing=musicNow();                        /* 正在放的那首：排完要按 id 找回它，不然会指到别的歌 */
  const songs=vis.map(i=>MUSIC.list[i]);
  const moved=songs.splice(from,1)[0];
  songs.splice(to,0,moved);
  vis.forEach((gi,k)=>{MUSIC.list[gi]=songs[k]});
  if(playing)MUSIC.cur=MUSIC.list.findIndex(s=>s.id===playing.id);
  musicSave();
  musicSync();
}

function musicPlDelAsk(){
  const p=(MUSIC.pl==='all'||MUSIC.pl==='')?null:MUSIC.lists.find(x=>x.id===MUSIC.pl);
  if(!p)return toast('「全部」和「默认」这两个删不了');
  const id=p.id;
  const n=MUSIC.list.filter(s=>musicSongPl(s)===id).length;
  if(!confirm('删掉歌单「'+p.name+'」吗？\n里面的 '+n+' 首歌会回到「默认歌单」，不会删歌。'))return;
  MUSIC.list.forEach(s=>{if(musicSongPl(s)===id)s.pl=''});
  MUSIC.lists=MUSIC.lists.filter(x=>x.id!==id);
  if(MUSIC.see.listId===id)MUSIC.see.listId='';
  MUSIC.pl='all';
  MUSIC.sorting=false;MUSIC.drag=null;
  musicSave();

/* 状态栏中间那条「正在播放」：放歌时出现，暂停后变灰、离开页面自动消失 */
function sbNowPaint(){
  const el=document.getElementById('sbMedia');
  if(!el)return;
  const s=musicNow();
  const playing=!!MUSIC.playing;
  const touched=!!(MUSIC.audio&&MUSIC.audio.getAttribute&&MUSIC.audio.getAttribute('src'));
  let txt='',tip='',on=false;
  if(s&&(playing||touched)){
    txt=musicName(s);on=playing;tip=(playing?'正在播放：':'已暂停：')+txt;
  }else if(MUSIC.manual&&MUSIC.manual.on&&MUSIC.manual.title){
    txt=musicName(MUSIC.manual);on=true;tip='正在听（在别的App里）：'+txt;
  }else{
    if(el.style.display!=='none')el.style.display='none';
    sbMediaSet('');
    return;
  }
  sbMediaSet(txt);
  el.title=tip;
  el.classList.toggle('on',on);
  if(el.style.display!=='flex')el.style.display='flex';
}
/* 状态栏中间的歌名：短的就居中显示，太长的就左右循环滚动 */
function sbMediaSet(txt){
  const t=document.getElementById('sbMediaT');if(!t)return;
  txt=String(txt||'');
  if(t.getAttribute('data-t')===txt)return;      /* 没变就不重来，免得动画一直从头开始 */
  const par=t.parentNode;
  if(par)par.classList.remove('marq');
  t.classList.remove('marq');
  t.textContent=txt;
  if(!txt){t.removeAttribute('data-t');return}
  const box=Math.round(t.getBoundingClientRect().width);
  if(!box)return;                                 /* 状态栏现在没显示，等下次再量 */
  /* 量「一行文字到底多宽」：临时塞一把不占地方的尺子进去量。
     不能直接量它自己：它是能伸缩的，量出来永远是「刚好放得下」。 */
  const ruler=document.createElement('span');
  ruler.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap';
  ruler.textContent=txt;
  t.appendChild(ruler);
  const nat=Math.round(ruler.getBoundingClientRect().width);
  t.removeChild(ruler);
  t.setAttribute('data-t',txt);
  if(nat<=box+2)return;                           /* 放得下，不用滚 */
  const gap=20,dist=nat+gap,dur=Math.max(6,dist/22);
  t.innerHTML='<span class="sbm-i">'+esc(txt)+'</span><span class="sbm-i">'+esc(txt)+'</span>';
  t.style.setProperty('--marX',(-dist)+'px');
  t.style.setProperty('--marT',dur.toFixed(1)+'s');
  t.classList.add('marq');
  if(par)par.classList.add('marq');
}
function musicTick(){
  sbNowPaint();
  const a=MUSIC.audio;if(!a)return;
  const p=$('#mProg'),t=$('#mTime');
  const dur=isFinite(a.duration)?a.duration:0;
  if(p&&!MUSIC.seeking)p.value=dur?Math.round(a.currentTime/dur*1000):0;
  if(t)t.textContent=musicSec(a.currentTime)+' / '+musicSec(dur);
  if(MUSIC.playing===a.paused){          /* 状态对不上就同步一下按钮 */
    MUSIC.playing=!a.paused;
    const b=$('#mPlayBtn');if(b)b.innerHTML=MUSIC.playing?(MICO.pause+' 暂停'):(MICO.play+' 播放');
  }
  const sl=$('#mStatLine');if(sl)sl.textContent=musicStatText(musicNow());
}
function musicStart(i){
  const s=MUSIC.list[i];if(!s)return;
  const a=musicAudio();
  MUSIC.cur=i;
  try{a.src=s.url}catch(e){}
  MUSIC.srcId=s.id||'';                        /* 【修】记下播放器里现在装的是哪首歌 */
  a.volume=MUSIC.vol;
  const pr=a.play();
  if(pr&&pr.then){
    pr.then(()=>{MUSIC.playing=true;s.failed=false;musicCountPlay(s);musicSync();musicSave()})
      .catch(err=>{
        MUSIC.playing=false;
        if(isAbortErr(err)){musicSync();return}   /* 自己按了暂停 / 换了歌 / 被系统打断，不算「这首歌坏了」 */
        musicFail('这首歌放不出来');
      });
  }else{MUSIC.playing=true;s.failed=false;musicCountPlay(s);musicSync();musicSave()}
}
function musicPlayAt(i){
  const s=MUSIC.list[i];if(!s)return;
  if(s.kind==='file'&&!s.url){          /* 手机里的歌：先从浏览器本地库取回来再放 */
    if(s.missing)return toast('这首歌的本机文件找不到了，删掉重新选一次吧');
    musicFileUrl(s).then(()=>musicStart(i)).catch(()=>{s.missing=true;musicSync();toast('这首歌的本机文件找不到了')});
    return;
  }
  musicStart(i);
}
/* 【修】播放器里现在装的是不是这首歌的音频源 */
function musicSrcReady(s){
  try{const a=MUSIC.audio;return !!(s&&a&&a.getAttribute&&a.getAttribute('src')&&MUSIC.srcId===s.id)}catch(e){return false}
}
/* 【修】这次失败是不是「被打断」（自己按了暂停、换了歌、手机锁屏/别的App抢声音），
   这种情况不是链接坏了，不该弹「放不出来」吓人 */
function isAbortErr(err){
  const n=String((err&&err.name)||''),m=String((err&&err.message)||'');
  return n==='AbortError'||/interrupted by a call to/i.test(m)||/interrupted by a new load/i.test(m);
}
/* 【修】继续放（源已经装好了）。被系统打断的话，安静地再试一次。 */
function musicPlayNow(tried){
  const a=musicAudio();
  const pr=a.play();
  if(!(pr&&pr.then)){MUSIC.playing=true;musicSync();return}
  pr.then(()=>{MUSIC.playing=true;musicSync()})
    .catch(err=>{
      if(isAbortErr(err)&&!tried){setTimeout(()=>{try{musicPlayNow(true)}catch(e){}},250);return}
      MUSIC.playing=false;musicSync();
      if(isAbortErr(err))toast('被手机打断了一下，再点一次播放键就好');
      else toast('放不出来：'+((err&&err.message)||'试试重新点一次播放'));
    });
}
function musicToggle(){
  const a=musicAudio();
  const s=musicNow();
  if(!s){
    const q=musicQIdx();                              /* 【新】没在放歌时，从当前歌单的第一首开始 */
    if(q.length)return musicPlayAt(q[0]);
    return toast('歌单是空的，先加一首吧');
  }
  if(MUSIC.playing){
    try{a.pause()}catch(e){}
    MUSIC.playing=false;musicSync();
    return;
  }
  /* 【修】以前这里是直接 a.play()。刚打开页面时播放器里其实还没装这首歌
     （音频源是「点歌」那一下才装的），直接 play() 就会失败，
     所以「歌单里点歌能放、最上面的播放键放不出来」。
     现在没装源就走 musicPlayAt，跟点歌一样先把源装好。 */
  if(!musicSrcReady(s))return musicPlayAt(MUSIC.cur);
  musicPlayNow(false);                                /* 源已经在，就从暂停的位置接着放（不重新计数、不从头开始） */
}
/* ---------- 播放方式：列表循环 / 单曲循环 / 随机 ---------- */
function musicModesHTML(){
  const m=MUSIC.mode||'order';
  const b=(k,n,ic)=>'<button type="button" class="'+(m===k?'on':'')+'" onclick="musicMode(\''+k+'\')">'+ic+'<span>'+n+'</span></button>';
  return b('order','列表循环',MICO.mode_order)+b('one','单曲循环',MICO.mode_one)+b('shuffle','随机',MICO.mode_shuffle);
}
function musicMode(m){
  m=(m==='one'||m==='shuffle')?m:'order';
  MUSIC.mode=m;
  try{musicSave()}catch(e){}
  try{musicSync()}catch(e){}
  toast('播放方式：'+(m==='one'?'单曲循环（一直重放这一首）':(m==='shuffle'?'随机播放':'列表循环（当前歌单放完再从头）')));
}
/* 随机挑一首（尽量别挑到正在放的这首，只在自己这个歌单里挑） */
function musicRandIdx(){
  const q=musicQIdx();
  if(!q.length)return -1;
  if(q.length<2)return q[0];
  let k=MUSIC.cur,i=0;
  do{k=q[Math.floor(Math.random()*q.length)];i++}while(k===MUSIC.cur&&i<40);
  return k;
}
/* 手动点「下一首」要去哪一首：随机模式就随机，其它按顺序（当前歌单里，放完回到开头） */
function musicNextIdx(){
  const q=musicQIdx();
  if(!q.length)return -1;
  if(q.length<2)return q[0];
  if((MUSIC.mode||'order')==='shuffle')return musicRandIdx();
  const at=q.indexOf(MUSIC.cur);
  return q[(at<0?0:at+1)%q.length];
}
/* 一首放完了自动接：单曲循环就重放这一首，随机就随机下一首，否则顺序下一首 */
function musicEnded(){
  if(!MUSIC.list.length)return;
  if((MUSIC.mode||'order')==='one'){
    const a=MUSIC.audio;if(!a)return;
    const s=musicNow();
    try{a.currentTime=0}catch(e){}
    MUSIC.playing=true;
    if(s)musicCountPlay(s);
    const pr=a.play();
    if(pr&&pr.then)pr.then(()=>{try{musicSync()}catch(e){}}).catch(()=>{MUSIC.playing=false;try{musicSync()}catch(e){}});
    else{try{musicSync()}catch(e){}}
    return;
  }
  musicPlayAt(musicNextIdx());
}
function musicNext(){if(!MUSIC.list.length)return;musicPlayAt(musicNextIdx())}
function musicPrev(){
  const q=musicQIdx();
  if(!q.length)return;
  const a=MUSIC.audio;
  if(a&&a.currentTime>4){a.currentTime=0;return}
  const at=q.indexOf(MUSIC.cur);
  musicPlayAt(q[(at<=0?q.length:at)-1]);
}
/* ---------- 【新增】角色可以控制音乐：播放 / 暂停 / 下一首 ----------
   它只有在角色设置里「能控制我的音乐」打开时才能拿到这个工具，
   而且由它自己看着聊天内容决定要不要用（工具说明里写了「别每轮都调」）。 */
window.MUSIC_TOOL={type:'function',function:{
  name:'music_control',
  description:'控制她手机上的音乐播放器（就是「音乐」小应用里正在放的那首）。action 只能选 play（继续播放）/ pause（暂停）/ next（切到下一首）。只在她明确希望你帮忙、或者聊天聊到音乐很自然的时候用，不要每轮都调；她的歌单是空的时候会失败。',
  parameters:{type:'object',properties:{
    action:{type:'string',enum:['play','pause','next'],description:'要做的操作'},
    reason:{type:'string',description:'一句话说明为什么这么做（可留空）'}
  },required:['action']}
}};
function musicHasSrc(){
  try{const a=MUSIC.audio;return !!(a&&a.getAttribute&&a.getAttribute('src'))}catch(e){return false}
}
function musicCtlRun(action){
  if(!MUSIC.list.length)return {ok:false,msg:'她的歌单里一首歌都没有，现在放不了也切不了。可以问问她想听什么，让她自己在「音乐」里加一首。'};
  const cur=musicNow()||MUSIC.list[0];
  if(action==='pause'){
    if(!MUSIC.playing&&!musicHasSrc())return {ok:false,msg:'现在本来就没在放歌，什么都不用做。'};
    try{if(MUSIC.audio)MUSIC.audio.pause()}catch(e){}
    MUSIC.playing=false;
    try{musicSync()}catch(e){}
    return {ok:true,msg:'已经帮她暂停了音乐（'+musicName(cur)+'）。接着正常聊天就行，不用再复述这件事。',
      say:'⏸ 暂停了《'+musicName(cur)+'》',act:'pause',name:musicName(cur)};
  }
  if(action==='next'){
    if(musicQIdx().length<2)return {ok:false,msg:'她现在这个歌单里只有这一首歌，没有下一首可以切。'};
    const idx=musicNextIdx();                 /* 随机模式下，角色喊「下一首」也跟着随机 */
    const nx=MUSIC.list[idx];
    musicPlayAt(idx);
    return {ok:true,msg:'已经帮她切到《'+musicName(nx)+'》了。接着正常聊天就行。',
      say:'⏭ 下一首《'+musicName(nx)+'》',act:'next',name:musicName(nx)};
  }
  if(action!=='play')return {ok:false,msg:'看不懂这个操作，只能用 play / pause / next。'};
  if(MUSIC.playing)return {ok:false,msg:'音乐已经在放了（'+musicName(cur)+'），不用再点播放。'};
  if(musicSrcReady(musicNow())){try{musicToggle()}catch(e){}}
  else{
    const q=musicQIdx();
    musicPlayAt(MUSIC.cur>=0?MUSIC.cur:(q.length?q[0]:0));
  }
  return {ok:true,msg:'正在帮她放《'+musicName(cur)+'》。如果手机不让网页自动出声，她会看到提示、自己点一下播放。',
    say:'▶ 播放《'+musicName(cur)+'》',act:'play',name:musicName(cur)};
}
window.execMusicTool=function(name,args){
  if(name!=='music_control')return {ok:false,msg:'未知的音乐操作'};
  try{musicEnsure()}catch(e){}
  return musicCtlRun(String((args&&args.action)||'').toLowerCase().trim());
};
function musicSeek(v){
  const a=MUSIC.audio;if(!a||!isFinite(a.duration)||!a.duration)return;
  MUSIC.seeking=true;
  a.currentTime=a.duration*Math.max(0,Math.min(1000,Number(v)||0))/1000;
  setTimeout(()=>{MUSIC.seeking=false},400);

/* 看文件开头几个字节，判断它是不是普通音频。
   （音乐 App 里「下载」的歌是加密的，开头不是正常音频格式，所以能一眼认出来） */
function musicSniff(f){
  return Promise.resolve().then(()=>f.slice(0,16).arrayBuffer()).then(buf=>{
    const b=new Uint8Array(buf);
    const c=(o,n)=>String.fromCharCode.apply(null,Array.prototype.slice.call(b,o,o+n));
    if(c(0,4)==='fLaC')return {kind:'flac',type:'audio/flac'};
    if(c(0,4)==='OggS')return {kind:'ogg',type:'audio/ogg'};
    if(c(0,4)==='RIFF'&&c(8,4)==='WAVE')return {kind:'wav',type:'audio/wav'};
    if(c(4,4)==='ftyp')return {kind:'m4a',type:'audio/mp4'};
    if(c(0,3)==='ID3')return {kind:'mp3',type:'audio/mpeg'};
    if(b[0]===0xFF&&(b[1]&0xE0)===0xE0)return {kind:'mp3',type:'audio/mpeg'};
    return null;
  });
}
function musicFileChosen(inp){

  const id=uid();
  musicSniff(f).catch(()=>null).then(info=>{
    if(!info){
      toast('这个文件不是普通的音频（音乐App里「下载」的歌是加密的，比如名字带 [mqms2] 的），网页放不了。换一个没加密的 mp3/flac 吧。');
      return;
    }
    /* 明确写上格式，浏览器才知道怎么放（有些文件选进来是没有格式信息的） */
    const blob=info.type?new Blob([f],{type:info.type}):f;
    MUSIC.list.push({id:id,title:nm||'本机音频',artist:'',kind:'file',blobId:id,url:URL.createObjectURL(blob),fmt:info.kind,pl:musicAddPl()});
    musicSave();musicSync();
    /* 音频文件本身也存进浏览器本地库，刷新/关掉再开都还在 */
    if(typeof idbPutRaw==='function'){try{idbPutRaw(id,blob,'music').catch(()=>{})}catch(e){}}
    musicPlayAt(MUSIC.list.length-1);
  }).catch(e=>toast('读不了这个文件：'+((e&&e.message)||e)));
}

/* ================= 查找聊天记录 ================= */
let findHits=[],findTimer=null;
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function findPlain(x){
  if(!x)return '';
  let s=String(x.content||'');
  if(x.files&&x.files.length)s+=' '+x.files.map(f=>(f&&f.name)||'').join(' ');
  if(!String(s).trim()&&x.img)s='［发了一张图片］';
  return s;
}
function findMark(text,kw){
  const t=String(text||'');
  const i=t.toLowerCase().indexOf(String(kw).toLowerCase());
  let cut=t;
  if(i>=0&&t.length>200)cut=t.slice(Math.max(0,i-60),i+150)+(t.length>i+150?'…':'');
  else if(t.length>200)cut=t.slice(0,200)+'…';
  return esc(cut).replace(new RegExp(escRe(esc(kw)),'gi'),m=>'<mark>'+m+'</mark>');
}
function openFind(){
  showSheet('<div class="ttl">🔍 查找聊天记录</div>'+
    '<p class="dim" style="font-size:12px;margin:0 0 8px">在所有角色的聊天里找，从新到旧排。</p>'+
    '<input id="findQ" placeholder="输入关键词" oninput="findRun()" autocomplete="off">'+
    '<div class="findres" id="findRes"></div>');

  setTimeout(()=>{const q=$('#findQ');if(q)q.focus()},80);

function findRun(){clearTimeout(findTimer);findTimer=setTimeout(findRunNow,180)}

  box.innerHTML='<div class="dim" style="font-size:11.5px;margin:0 0 6px">找到 '+hits.length+' 条，点一条跳过去</div>'+

/* ================= 演绎记忆（【新增】角色可选择性看见） =================
   演绎是独立的一条世界线：默认只有「演绎」能看见私聊记忆，反过来不行。
   角色在「角色 → 编辑」里勾上「能看见演绎记忆」，私聊时才会带上它在演绎里的经历。 */
const ACTMEM_MAX=2600;                 /* 整体注入字数上限 */
function actMemBlock(c){
  if(!c||!c.actMem||!c.actMem.on)return '';
  let acts=[];
  try{acts=load('wh_acts',[])||[]}catch(e){return ''}
  const mine=acts.filter(a=>a&&Array.isArray(a.members)&&a.members.some(m=>m&&m.cid===c.id));
  if(!mine.length)return '';
  mine.sort((a,b)=>(b.lastAt||b.t||0)-(a.lastAt||a.t||0));
  const per=Math.max(2,Math.min(60,Number(c.actMem.n)||12));
  const out=[];let used=0;
  for(const a of mine){
    if(out.length>=4)break;                       /* 最多带 4 场 */
    let ms=[];try{ms=load('wh_actmsg_'+a.id,[])||[]}catch(e){}
    const lines=ms.slice(-per).map(m=>{
      const who=(m.role==='user')?(cfg.userName||'她'):(m.role==='narr'?'旁白':((charOf(m.cid)||{}).name||'角色'));
      const t=String(m.content||'').trim().replace(/\n+/g,' ');
      return t?(who+'：'+t.slice(0,240)):'';
    }).filter(Boolean);
    if(!lines.length)continue;
    const block='【'+String(a.name||'演绎')+'】\n'+lines.join('\n');
    if(used+block.length>ACTMEM_MAX)break;
    used+=block.length;out.push(block);
  }
  if(!out.length)return '';
  return '【你在「演绎」里的经历】下面是你在另一条世界线（「演绎」：另一种设定和剧情）里亲历过的最近片段。'+
    '演绎和现在的日常是分开的两条线：如果你们没在日常里提过，就不要假设对方知道这些事，也不要主动把演绎里的设定当成现在的现实；'+
    '但她提到相关的人和事时，你记得，可以自然接话。\n\n'+out.join('\n\n');
}
/* ================= 群聊工具（【新增】角色可调用） =================

/* 群聊的「停不下来」保险：
   1) 一次触发最多 maxAI 条角色消息
   2) 最多来回 maxRound 轮
   3) 只有 reply='both' 的角色才接别人的话，而且每次接话有 chain 概率
   4) 不会马上自己接自己 */
/* 让某个角色在群里说一句（返回 {text,tok}，失败返回 null） */
/* 组装群聊发言的上下文；同时把“取角色名”的小函数交给调用处。 */
function buildGroupContext(g,c){
  const arr=gmsgsOf(g.id).slice(-24);
  const nm=id=>{const x=charOf(id);return x?x.name:'某人'};
  const me=(cfg.userName||'她');
  const others=g.members.filter(m=>m.cid!==c.id).map(m=>nm(m.cid)).filter(Boolean);
  const sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  const gm=gmemBlock(c.id,g.id,10);           /* 【新增】带上它自己的群聊记忆 */
  if(gm)sys.push('【你在这个群里的记忆】你之前在这个群里说过下面这些，你要记得，别和它们矛盾：\n'+gm);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  const wbG=wbForChar(c);if(wbG)sys.push(wbG);   /* 世界书：挂在这个角色身上的共同设定 */
  if(c.examples)sys.push('【对话示例】'+c.examples);
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');
  const hist=arr.map(m=>({role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}));
  const ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  ctx.push({role:'user',content:'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  return {ctx:ctx,nm:nm};
}
/* 清掉模型可能带上的角色名前缀和引号。 */
function cleanGroupOutput(out,names){
  for(const n of names){
    if(!n)continue;
    if(out.indexOf(n+'：')===0)out=out.slice((n+'：').length).trim();
    if(out.indexOf(n+':')===0)out=out.slice((n+':').length).trim();
  }
  out=out.replace(/^["'“”]+|["'“”]+$/g,'').trim();
  if(out.length>500)out=out.slice(0,500);
  return out;
}
/* 群里的自动发消息 */
function groupAutoEligible(g,m){return !!(cfg&&cfg.key&&m&&m.auto&&charOf(m.cid))}
function groupAutoRange(g){const mi=Math.max(1,Number(g.autoMin)||15),ma=Math.max(mi+1,Number(g.autoMax)||60);return {mi:mi,ma:ma}}
function scheduleGroupAuto(force){
  if(!chars||!chars.length){if(groupTick){clearInterval(groupTick);groupTick=null}return}
  groupsAll().forEach(g=>{
    (g.members||[]).forEach(m=>{
      const k=g.id+'|'+m.cid;
      if(!groupAutoEligible(g,m)){delete gAutoMap[k];return}
      const r=groupAutoRange(g);
      const cur=gAutoMap[k];
      if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
      gAutoMap[k]={at:Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*MS_PER_MIN,mi:r.mi,ma:r.ma};
    });
  });
  const live=Object.keys(gAutoMap).length;
  if(live&&!groupTick)groupTick=setInterval(checkGroupAuto,20000);
  if(!live&&groupTick){clearInterval(groupTick);groupTick=null}
}
async function checkGroupAuto(){
  if(groupBusy||busy||!cfg||!cfg.key)return;
  const now=Date.now();
  for(const g of groupsAll()){
    for(const m of g.members||[]){
      const k=g.id+'|'+m.cid;
      const rec=gAutoMap[k];
      if(!rec||rec.at>now)continue;
      /* 【新增】角色自己设了免打扰时段（且开着）时，群里也不打扰 */
      const mc=charOf(m.cid);
      if(mc&&isQuiet(mc.auto||{}))continue;
      const r=groupAutoRange(g);
      gAutoMap[k].at=Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*MS_PER_MIN;
      await groupAutoSpeak(g,m);
      return;                     /* 一次只发一条，绝不批量刷屏 */
    }
  }
}

function saveGroupSettings(id){
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  const v=i=>{const el=document.getElementById(i);return el?el.value:''};
  const ck=i=>{const el=document.getElementById(i);return !!(el&&el.checked)};
  g.name=(v('ge_name').trim()||g.name);
  (g.members||[]).forEach((m,i)=>{
    const sel=document.getElementById('gr_'+i);
    if(sel)m.reply=(sel.value==='both')?'both':'user';
    m.auto=ck('ga_'+i);
  });
  chars.forEach(c=>{if(ck('gadd_'+c.id)&&!memberOf(g,c.id))g.members.push({cid:c.id,reply:'user',auto:false})});
  g.chain=Math.min(1,Math.max(0,(Number(v('ge_chain'))||60)/100));
  g.maxAI=Math.min(20,Math.max(1,Math.round(Number(v('ge_maxai'))||GRP_MAXAI_DEF)));
  g.maxRound=Math.min(6,Math.max(1,Math.round(Number(v('ge_round'))||GRP_MAXROUND_DEF)));
  g.autoMin=Math.max(1,Math.round(Number(v('ge_amin'))||15));
  g.autoMax=Math.max(g.autoMin+1,Math.round(Number(v('ge_amax'))||60));
  saveGroups(gs);
  closeSheet();
  scheduleGroupAuto(true);
  if(view==='tools'){toolTab='group';renderTools()}
  toast('群设置已保存');
}
function kickMember(id,i){
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  g.members.splice(i,1);
  saveGroups(gs);scheduleGroupAuto(true);
  editGroupSheet(id);
}
function delGroup(id){
  /* ↓ 补丁12-A：隐私群聊要先输一次密码 */
  var needPw=false;
  try{
    var gp=window.findGroupP(id);
    needPw=!!(gp&&gp.priv&&!gOpen[id]);
  }catch(e){}
  if(needPw){
    window.auth('删除这个隐私群聊前要输一次密码。',function(){
      gOpen[id]=true;
      delGroup(id);
    });
    return;
  }
  if(!confirm('删掉这个群？群里的聊天记录也会一起清掉（角色本人的聊天和记忆不受影响）'))return;
  const g=findGroup(id);
  if(g)(g.members||[]).forEach(m=>{const cur=gmemOf(m.cid);const left=cur.filter(x=>x.gid!==id);if(left.length!==cur.length)save(LS.gmem(m.cid),left)});
  saveGroups(groupsAll().filter(g2=>g2.id!==id));
  removeKey(LS.gmsg(id));
  if(groupOpenId===id)groupOpenId=null;
  if(view==='tools')renderTools();
  toast('群已删除');
}
