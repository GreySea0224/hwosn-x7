<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>深蓝海域</title>
<style>
:root{
  --fs:15px;
  --bg:#050e16;--bg2:#081a29;--panel:#0d1c28;--line:#1a3342;
  --txt:#d9e9f2;--dim:#7d99aa;
  --acc:#3fa9d8;--acc2:#5cc4f0;--accdim:#1b4a63;
  --warn:#e06a60;
  --bub:18px;
  --shadow:0 2px 10px rgba(0,0,0,.18);
  --grad:linear-gradient(160deg,#0e2c3f 0%,#081a29 60%);
  --bubme:linear-gradient(135deg,#1b4a63,#17445c);
  --scbg:rgba(10,22,32,.82);--scfg:#eaf3f8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:var(--fs)/1.65 -apple-system,"PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--grad);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px;color:var(--acc);flex:0 0 auto}
header .who{flex:1;color:var(--dim);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;width:100%;max-width:760px;margin:0 auto}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.row{display:flex;gap:8px}
.col{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 4px 16px rgba(63,169,216,.18)}
.ttl{font-weight:700;font-size:14px;color:var(--acc);margin-bottom:8px;letter-spacing:.3px}
.dim{color:var(--dim)}
label.f{display:block;margin:10px 0 4px;font-size:12px;color:var(--dim)}
input,textarea,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(63,169,216,.12)}
input[type=checkbox]{width:auto;transform:scale(1.2);accent-color:var(--acc)}
button{font:inherit;background:var(--accdim);color:var(--txt);border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;transition:transform .06s ease,filter .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.15)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02131c;font-weight:700;box-shadow:0 4px 14px rgba(63,169,216,.28)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:6px 10px;border-radius:10px;box-shadow:none}
button.warn{background:transparent;border:1px solid var(--line);color:var(--warn);box-shadow:none}
button:disabled{opacity:.45;pointer-events:none}
.bub{max-width:84%;padding:9px 13px;border-radius:var(--bub);margin:7px 0 0;word-break:break-word;font-size:var(--fs);box-shadow:var(--shadow);animation:pop .16s ease}
.bub.me{margin-left:auto;background:var(--bubme);border-bottom-right-radius:6px}
.bub.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub .time{display:block;margin-top:5px;font-size:10px;opacity:.5;text-align:right;line-height:1;user-select:none}
.bub .msgimg{display:block;max-width:100%;border-radius:10px;margin-bottom:5px;border:1px solid rgba(0,0,0,.15)}
.bub.typing{padding:13px 15px}
.bub.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--dim);animation:tp 1.2s infinite}
.bub.typing span:nth-child(2){animation-delay:.15s}
.bub.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{transform:translateY(4px);opacity:0}}
.think{margin:6px 0 0;max-width:84%}
.thinkhead{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:color .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
.thinkhead::after{content:'▾';font-size:10px;line-height:1;transform:translateY(-1px);transition:transform .18s ease}
.thinkhead.on{color:var(--acc);border-color:var(--acc);background:var(--accdim);box-shadow:0 2px 10px rgba(63,169,216,.18)}
.thinkhead.on::after{transform:rotate(180deg) translateY(-1px)}
.thinkbody{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;display:none;animation:pop .16s ease}
.ops{display:flex;gap:7px;margin:7px 0 10px;flex-wrap:wrap}
.ops.me{justify-content:flex-end}
.ops button{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:5px 13px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:color .15s ease,border-color .15s ease,background .15s ease,transform .1s ease}
.ops button.hot{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
.ops svg,.thinkhead svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.thinkhead svg{width:13px;height:13px}

.tok{font-size:11px;color:var(--dim);margin:2px 0 6px}
.tok.me{text-align:right}
.li{display:flex;gap:6px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.li>span{flex:1 1 auto;min-width:0;word-break:break-word}
.li .x{background:none;border:0;color:var(--dim);padding:0 4px;font-size:17px;line-height:1;box-shadow:none}
.hint{color:var(--dim);text-align:center;padding:34px 0}
/* 自适应设置行：窄屏也能正常换行 */
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.setrow .lbl{flex:1 1 auto;min-width:132px;font-size:12px;color:var(--dim);line-height:1.45}
.setrow input[type=number]{width:78px;flex:0 0 78px;text-align:center;padding:7px 6px;font-size:13px}
.setrow .unit{font-size:12px;color:var(--dim)}
/* 档案条目 */
.arcitem{padding:10px 0;border-bottom:1px dashed var(--line)}
.arcitem:last-child{border-bottom:0}
.arcname b{font-size:14px;word-break:break-word}
.arcmeta{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.55;word-break:break-word}
.arcmeta.warn{color:var(--warn)}
.arcfoot{flex-wrap:wrap;gap:6px;margin-top:8px}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 11px;border-radius:9px;box-shadow:none;font-size:13px;line-height:1.2}
/* 隐私角色 */
.privbox{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px;background:var(--panel);opacity:.85;box-shadow:none}
.privav{width:48px;height:48px;padding:0;font-size:24px;line-height:1;border-radius:14px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);box-shadow:none;opacity:.8;overflow:hidden}
.privav img{width:100%;height:100%;object-fit:cover;display:block}
.privav.on{border-color:var(--acc);opacity:1}
.privunit{display:flex;flex-direction:column;align-items:center;gap:6px}
.privunit .privset{font-size:11px;padding:3px 9px;border-radius:999px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:rgba(4,20,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;display:none;max-width:82%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#picked{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:8px 12px 0;background:var(--grad)}
#picked.on{display:flex}
#picked img{height:66px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
#picked button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:13px;box-shadow:none}
#composer{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px;background:var(--grad);border-top:1px solid var(--line)}
#composer textarea{flex:1;min-height:42px;max-height:120px;border-radius:14px;padding:10px 12px}
#composer button{width:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02131c;font-weight:800;font-size:18px}
#composer #pic{background:var(--bg2);border:1px solid var(--line);color:var(--acc);font-size:17px;box-shadow:none}
#composer #stop{background:linear-gradient(135deg,#c0504a,#e06a60);color:#fff;font-size:20px}
.thinkbar{display:flex;gap:8px;margin-bottom:10px}
.thinkbar button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:13px;padding:7px 0;border-radius:10px;box-shadow:none}
.thinkbar button.active{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* ---------- 底部导航（美化版） ---------- */
nav{flex:0 0 auto;display:flex;gap:4px;background:var(--grad);border-top:1px solid var(--line);padding:5px 6px calc(env(safe-area-inset-bottom) + 5px);position:relative;box-shadow:0 -6px 20px rgba(0,0,0,.16)}
nav::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(63,169,216,.5),transparent);pointer-events:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--dim);padding:7px 2px 6px;font-size:10.5px;letter-spacing:.4px;border-radius:14px;position:relative;box-shadow:none;transition:background .18s ease,color .18s ease,transform .12s ease}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease,filter .18s ease}
nav button span{line-height:1}
nav button:active{transform:scale(.94)}
nav button.on{color:var(--acc);background:radial-gradient(70% 70% at 50% 0%,rgba(63,169,216,.18),rgba(63,169,216,0) 72%)}
nav button.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 3px 8px rgba(63,169,216,.5))}
nav button.on::after{content:'';position:absolute;top:1px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px rgba(63,169,216,.6)}
/* 未读红点 */
nav button .dot{position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--panel),0 0 8px rgba(255,77,94,.8);display:none}
nav button .dot.on{display:block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.card .udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d5e;margin-left:6px;vertical-align:middle;box-shadow:0 0 6px rgba(255,77,94,.8)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;backdrop-filter:blur(2px)}
.modal.on{display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 14px calc(env(safe-area-inset-bottom) + 18px);animation:up .18s ease;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
/* ---------- 弹层右上角常驻关闭键 ---------- */
.sheetclose{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:70;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;background:var(--scbg,rgba(10,22,32,.82));border:1px solid var(--line);color:var(--scfg,#eaf3f8);font-size:15px;font-weight:700;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .15s ease,color .15s ease,transform .12s ease}
#modal.on .sheetclose{display:flex}
.sheetclose:active{transform:scale(.92)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:320px}
/* 弹层顶部标签（角色设定 / 记忆） */
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:14px;padding:9px 0;border-radius:12px;font-weight:700;box-shadow:none}
.tabs button.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* 分段选择器 */
.seg{display:flex;gap:6px;margin:6px 0 0}
.seg button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:8px 4px;border-radius:10px;box-shadow:none}
.seg button.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* 用户主页头像 */
.meavatar{width:64px;height:64px;font-size:32px;line-height:1;padding:0;border-radius:18px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.meavatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
/* ---------- 头像框：emoji 或图片都能装 ---------- */
.avbox{display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:16px;flex:0 0 auto;line-height:1;box-shadow:none}
.avbox img{width:100%;height:100%;object-fit:cover;display:block}
.meavatar{cursor:pointer}
/* ---------- 底部工具栏按钮（发图 / 发送 / 停止） ---------- */
#composer button{display:flex;align-items:center;justify-content:center}
#composer #pic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#composer #send svg{width:23px;height:23px;fill:currentColor;stroke:none}
#composer #stop svg{width:19px;height:19px;fill:currentColor;stroke:none}
#composer #pic{transition:color .15s ease,border-color .15s ease,background .15s ease}
#composer #pic:active{background:var(--accdim);border-color:var(--acc)}
/* ---------- 工具页 / 群聊 ---------- */
.gwrap{display:flex;flex-direction:column;gap:10px}
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gmsgs{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 10px 4px;max-height:44vh;overflow:auto;display:flex;flex-direction:column}
.gbub{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.gbub .gav{width:34px;height:34px;border-radius:11px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);font-size:17px;line-height:1}
.gbub .gav img{width:100%;height:100%;object-fit:cover}
.gbub .gmain{flex:1;min-width:0;display:flex;flex-direction:column}
.gbub .gname{font-size:11px;color:var(--dim);margin-bottom:2px}
.gbub .gtext{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:14px;word-break:break-word;box-shadow:var(--shadow);white-space:pre-wrap}
.gbub.me{flex-direction:row-reverse}
.gbub.me .gmain{align-items:flex-end}
.gbub.me .gtext{background:var(--bubme);border-color:transparent;border-radius:12px 4px 12px 12px}
.gbub.sys{justify-content:center}
.gbub.sys .gtext{background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:12px;box-shadow:none}
.gmem{display:flex;flex-wrap:wrap;gap:8px}
.gm{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 8px 4px 4px}
.gm .nm{font-size:12.5px;line-height:1.2}
.gm .tg{font-size:10.5px;color:var(--dim);line-height:1.2}
</style>
</head>
<body>
<header><h1 id="title">深蓝海域</h1><span class="who" id="who"></span></header>
<main id="main"></main>
<div id="picked"><img id="thumb" alt=""><button id="pickedX" onclick="clearPicked()">✕</button></div>
<div id="composer"><button id="pic" title="发图片给ta看" aria-label="发送图片"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.8" width="17.2" height="14.4" rx="3.4"/><circle cx="8.7" cy="9.8" r="1.7"/><path d="m4.2 17.6 4.8-4.5 3.4 3 3.3-2.9 4.5 4.2"/></svg></button><textarea id="inp" rows="1" placeholder="说点什么…"></textarea><button id="send" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M3.7 20.4 21 12 3.7 3.6l.1 6.7L14.6 12 3.8 13.7Z"/></svg></button><button id="stop" style="display:none" aria-label="停止"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.4"/></svg></button></div>
<input id="imgIn" type="file" accept="image/*" style="display:none" onchange="pickImage(this)">
<input id="avaIn" type="file" accept="image/*" style="display:none" onchange="avaChange(this)">
<nav>
  <button data-v="chat" class="on"><svg viewBox="0 0 24 24"><path d="M20.5 11.6c0 4.3-3.8 7.8-8.5 7.8-1 0-1.9-.2-2.8-.5l-4.7 1.6 1.2-3.7c-1.4-1.4-2.2-3.2-2.2-5.2C3.5 7.3 7.3 3.8 12 3.8s8.5 3.5 8.5 7.8Z"/></svg><span>聊天</span><i class="dot" id="navDot"></i></button>
  <button data-v="roles"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.3" r="3.2"/><path d="M3.6 19.6c0-3.1 2.5-5 5.6-5s5.6 1.9 5.6 5"/><path d="M16.3 6.5a3 3 0 0 1 0 5.6"/><path d="M17.4 14.9c2 .6 3.4 2.3 3.4 4.7"/></svg><span>角色</span></button>
  <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.9 19.8c0-3.5 3.2-5.7 7.1-5.7s7.1 2.2 7.1 5.7"/></svg><span>我的</span></button>
  <button data-v="tools"><svg viewBox="0 0 24 24"><path d="M14.6 6.1a4.3 4.3 0 0 0 5.6 5.6l-8.4 8.4a2.3 2.3 0 0 1-3.2 0l-2.4-2.4a2.3 2.3 0 0 1 0-3.2Z"/><path d="m16.4 4.3 3.3 3.3"/></svg><span>工具</span></button>
  <button data-v="cfg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.4v2.2M12 18.4v2.2M4.9 7.8l1.9 1.1M17.2 15.1l1.9 1.1M4.9 16.2l1.9-1.1M17.2 8.9l1.9-1.1"/></svg><span>设置</span></button>
</nav>
<div class="modal" id="modal"><button class="sheetclose" onclick="closeSheet()" aria-label="关闭">✕</button><div class="sheet" id="sheet"></div></div>
<div id="lock">
  <div class="lockbox">
    <div class="ttl">🔒 深蓝海域已锁定</div>
    <p class="dim" style="font-size:13px;margin:4px 0 12px">输入密码解锁</p>
    <input id="pw" type="password" placeholder="密码" autocomplete="off">
    <button class="pri" style="width:100%;margin-top:10px" onclick="unlock()">解锁</button>
    <p id="pwerr" class="dim" style="font-size:12px;margin-top:8px;color:var(--warn)"></p>
  </div>
</div>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS={cfg:'wh_cfg',chars:'wh_chars',cur:'wh_cur',arcs:'wh_arcs',pw:'wh_pw',priv:'wh_priv',unread:'wh_unread',
  groups:'wh_groups',gauto:'wh_gauto',
  msg:id=>'wh_msg_'+id,mem:id=>'wh_mem_'+id,arc:id=>'wh_arc_'+id,todo:id=>'wh_todo_'+id,rawMark:id=>'wh_rawmark_'+id,
  summark:id=>'wh_summark_'+id,gmsg:id=>'wh_gmsg_'+id};

function applyTheme(){
  const t=THEMES[(cfg&&cfg.theme)]||THEMES.dark;
  const r=document.documentElement.style;
  for(const k in t.v)r.setProperty(k,t.v[k]);
  r.setProperty('--fs',(((cfg&&cfg.fs)||15))+'px');
  /* 自动判断深浅：浅色主题给关闭键用白底深字，深色主题用深底浅字 */
  const lit=(()=>{
    let h=String(t.v['--bg']||'#050e16').replace('#','');
    if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const n=parseInt(h,16)||0;
    const R=(n>>16)&255,G=(n>>8)&255,B=n&255;
    return (0.299*R+0.587*G+0.114*B)>140;
  })();
  r.setProperty('--scbg',lit?'rgba(255,255,255,.94)':'rgba(10,22,32,.82)');
  r.setProperty('--scfg',lit?(t.v['--txt']||'#12313f'):'#eaf3f8');
}

/* ---------- 存储基础（带加密支持） ---------- */
let store=null, cryptKey=null;
const _writes={};
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function load(k,d){
  if(cryptKey)return (store&&hasOwn(store,k))?store[k]:d;
  try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}
}
function save(k,v){
  if(cryptKey){store[k]=v;encWrite(k,v)}
  else{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('存不下：'+e.message)}}
}
function removeKey(k){localStorage.removeItem(k);if(store)delete store[k]}
function encWrite(k,v){
  const s=JSON.stringify(v);
  const prev=_writes[k]||Promise.resolve();
  _writes[k]=prev.then(()=>encVal(cryptKey,s)).then(enc=>localStorage.setItem(k,enc)).catch(()=>{});
}
function allDataKeys(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('wh_')===0&&k!==LS.pw&&k!==LS.priv)out.push(k);
  }
  return out;
}

/* ---------- 加密工具 ---------- */
const te=new TextEncoder(), td=new TextDecoder();
function bufToB64u(buf){let s='';buf.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encVal(key,v){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(v));
  return 'enc:'+bufToB64u(iv)+':'+bufToB64u(new Uint8Array(ct));
}
async function decVal(key,s){
  if(typeof s!=='string'||s.indexOf('enc:')!==0)return null;
  const p=s.split(':');
  const iv=b64uToBuf(p[1]),ct=b64uToBuf(p[2]);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return td.decode(pt);
}
async function decryptAll(){
  store={};
  for(const k of allDataKeys()){
    const raw=localStorage.getItem(k);
    if(raw==null)continue;
    try{
      if(raw.indexOf('enc:')===0){const pt=await decVal(cryptKey,raw);store[k]=JSON.parse(pt)}
      else store[k]=JSON.parse(raw);
    }catch(e){console.warn('解密失败',k,e)}
  }
}

function fmtTime(t){
  const d=new Date(t);if(isNaN(d))return '';
  const h=d.getHours(),m=d.getMinutes();
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function fmtStamp(t){
  const d=new Date(t||Date.now());if(isNaN(d))return '';
  const now=new Date();
  const hm=fmtTime(d.getTime());
  if(d.toDateString()===now.toDateString())return hm;
  const yd=new Date(now.getTime()-86400000);
  if(d.toDateString()===yd.toDateString())return '昨天 '+hm;
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function nowText(){
  const d=new Date(),w='日一二三四五六'[d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w+' '+fmtTime(d.getTime());
}
function stampOf(t){const d=new Date(t||Date.now());return (d.getMonth()+1)+'/'+d.getDate()+' '+fmtTime(d.getTime())}
function ago(ts){
  if(!ts)return '从未';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return '刚刚';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}

/* ---------- IndexedDB ---------- */
let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db);
    if(!window.indexedDB)return rej(new Error('这个浏览器不支持 IndexedDB'));
    const r=indexedDB.open('wh_db',3);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('arc'))d.createObjectStore('arc');
      if(!d.objectStoreNames.contains('rawlog'))d.createObjectStore('rawlog');
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=()=>rej(r.error||new Error('IndexedDB 打不开'));
  });
}
async function idbPut(k,v,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise(async(res,rej)=>{
    let payload=v;
    if(cryptKey){try{payload=await encVal(cryptKey,JSON.stringify(v))}catch(e){return rej(e)}}
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).put(payload,k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('写入失败'));
  });
}
async function idbGet(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(k);
    q.onsuccess=async()=>{
      let v=q.result;
      if(cryptKey&&typeof v==='string'&&v.indexOf('enc:')===0){
        try{v=JSON.parse(await decVal(cryptKey,v))}catch(e){v=undefined}
      }
      res(v);
    };
    q.onerror=()=>rej(q.error);
  });
}
async function idbGetRaw(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(k);
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
async function idbPutRaw(k,v,store){

}
async function idbDel(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).delete(k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
  });
}
async function idbKeys(store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).getAllKeys();
    q.onsuccess=()=>res(q.result||[]);
    q.onerror=()=>rej(q.error);
  });
}

/* ---------- 档案数据整理（兼容各种旧格式 / 别的导出格式） ---------- */
function arcRole(m){
  if(m==null)return 'assistant';
  if(Array.isArray(m))return /^(user|human|me|you|我|她|用户)$/i.test(String(m[0]||''))?'user':'assistant';
  const rs=String(m.role||m.sender||m.from||m.author||m.type||m.r||m.who||'').toLowerCase();
  if(/^(user|human|me|you|owner|self)/.test(rs)||/用户|我发的|本人|自己/.test(rs))return 'user';
  return 'assistant';
}
function arcMsgText(m){
  if(m==null)return '';
  if(typeof m==='string')return m.replace(/\s+/g,' ').trim();
  if(typeof m==='number')return String(m);
  if(Array.isArray(m)){
    const c=(m[1]!=null&&typeof m[0]==='string'&&/^(user|assistant|human|ai|me|我|她)$/i.test(String(m[0]).trim()))?m[1]:(m[0]!=null?m[0]:m[1]);
    return String(typeof c==='string'?c:((c&&(c.text||c.content))||'')).replace(/\s+/g,' ').trim();
  }
  let c=m.content;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  if(c==null)c=m.text;
  if(c==null)c=m.message;
  if(c==null)c=m.msg;
  if(c==null)c=m.c;
  if(c==null)c=m.v;
  if(c==null)c=m.say;
  if(c==null)c=m.value;
  if(c&&typeof c==='object')c=c.text||c.content||'';
  return String(c==null?'':c).replace(/\s+/g,' ').trim();
}
function sanitizeArcMs(ms){
  if(!Array.isArray(ms))return [];
  let need=false;
  const out=ms.map(m=>{
    if(m&&typeof m==='object'&&!Array.isArray(m)&&typeof m.content==='string'&&String(m.content).trim()&&/^(user|assistant)$/.test(String(m.role)))return m;
    const t=arcMsgText(m);
    if(!t)return m;                 /* 实在看不懂的，原样留着，不做破坏 */
    need=true;
    return {role:arcRole(m),content:t,t:(m&&m.t)||Date.now()};
  });
  return need?out:ms;
}

/* ---------- 档案检索 ---------- */
function grams(s){
  s=String(s||'').replace(/\s+/g,'').slice(0,240);
  const st=new Set();
  for(let i=0;i<s.length-1;i++)st.add(s.slice(i,i+2));
  return st;
}
function sim(a,b){let h=0;a.forEach(g=>{if(b.has(g))h++});return h/Math.max(1,a.size)}
function archiveBlock(query,c){
  const list=load(LS.arcs,[]);
  if(!list.length)return '';
  const out=[],top=(cfg.arcTop==null?5:cfg.arcTop);
  const lim=(cfg.wholeLimit==null?20000:cfg.wholeLimit);
    list.forEach(a=>{
    if(a.off||!archiveAllowed(a,c.id))return;
    if(a.whole){
      const ms=getArc(a.id);
      let t=ms.map(m=>(arcRole(m)==='user'?'她':c.name)+'：'+arcMsgText(m)).join('\n');
      if(lim>0&&t.length>lim)t=t.slice(0,lim)+'……';
      if(t)out.push('【《'+a.name+'》全文·这是你们真实发生过的过去】\n'+t);
    }else if(a.summOn&&a.sum&&!sumRefusal(a.sum)){
      let s=a.sum;
      if(lim>0&&s.length>lim)s=s.slice(0,lim)+'……';
      out.push('【《'+a.name+'》总结版·这是你们真实经历过的事，你记得这些】\n'+s);
    }
  });

  if(top>0&&query&&query.trim().length>1){
    const gq=grams(query),hits=[];
    list.forEach(a=>{
      if(a.whole||a.off||!archiveAllowed(a,c.id))return;
      const ms=getArc(a.id);
      const from=Math.max(0,ms.length-MAX_SCAN);
      for(let i=from;i<ms.length;i++){
        const t=arcMsgText(ms[i]);
        if(!t||t.length<6)continue;
        const s=sim(gq,grams(t));
        if(s>0.16)hits.push({s:s,a:a,i:i,ms:ms});
      }
    });
    hits.sort((x,y)=>y.s-x.s);
    const cut=hits.slice(0,top);
    if(cut.length){
      out.push('【旧日对话摘录】这是你和她过去真实聊过的片段，你记得这些事，可以自然地想起来、接着聊：\n'+
      cut.map(h=>{
        const seg=h.ms.slice(Math.max(0,h.i-1),h.i+2).map(m=>(arcRole(m)==='user'?'她':c.name)+'：'+arcMsgText(m)).join('\n');
        return '——摘自《'+h.a.name+'》\n'+seg;
      }).join('\n\n'));
    }
  }
  return out.join('\n\n');
}

/* ---------- 解析：JSON / Markdown / 纯文本 ---------- */
function isMsgLike(x){return x&&typeof x==='object'&&!Array.isArray(x)&&('content' in x||'text' in x||'message' in x||'contentParts' in x)&&('role' in x||'sender' in x||'type' in x||'author' in x)}
function normMsg(m){
  const rs=String(m.role||m.sender||m.type||m.author||'').toLowerCase();
  if(/system|tool/.test(rs))return null;
  const role=/user|human|me$|用户|我$/.test(rs)?'user':/assist|ai|bot|gpt|model|助手|模型/.test(rs)?'assistant':null;
  if(!role)return null;
  let c='';
  if(Array.isArray(m.contentParts))c=m.contentParts.filter(p=>p&&p.type==='text'&&p.text).map(p=>p.text).join('\n');
  if(!c&&m.content!=null)c=m.content;
  if(!c&&m.text!=null)c=m.text;
  if(!c&&m.message!=null)c=m.message;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  c=String(c==null?'':c).trim();
  if(!c)return null;
  return {role:role,content:c,t:(typeof m.timestamp==='number'?m.timestamp:Date.now())};
}
function digSessions(node,name,out,depth){
  if(depth>10||!node)return;
  if(Array.isArray(node)){
    if(node.length&&node.some(isMsgLike)){
      const ms=node.map(normMsg).filter(Boolean);
      if(ms.length>=2){out.push({name:name||'导入的对话',messages:ms});return;}
    }
    node.forEach(v=>digSessions(v,name,out,depth+1));
    return;
  }
  if(typeof node==='object'){
    const nm=node.name||node.title||node.topic||node.subject||name;
    Object.keys(node).forEach(k=>{
      const v=node[k];
      if(v&&typeof v==='object')digSessions(v,nm,out,depth+1);
    });
  }
}
function parseText(text){
  const msgs=[];let cur=null;
  const push=()=>{if(cur){const c=cur.content.trim();if(c)msgs.push({role:cur.role,content:c,t:Date.now()});cur=null}};
  const uk=/^(you|user|human|me|用户|我|她)$/i,ak=/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)$/i;
  text.split('\n').forEach(raw=>{
    const l=raw.replace(/\s+$/,'');
    const s=l.replace(/^[#>\-*\s]+/,'').trim();
    if(!s){if(cur)cur.content+='\n';return}
    let role=null,rest='',m;
    m=s.match(/^(you|user|human|me|用户|我|她)\s*[:：]\s*(.*)$/i);
    if(m){role='user';rest=m[2]}
    else{
      m=s.match(/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)\s*[:：]\s*(.*)$/i);
      if(m){role='assistant';rest=m[2]}
      else if(uk.test(s)){role='user'}
      else if(ak.test(s)){role='assistant'}
    }
    if(role){push();cur={role:role,content:rest};return}
    if(cur)cur.content+=(cur.content?'\n':'')+l;
  });
  push();
  return msgs.length>=2?{name:'导入的对话',messages:msgs}:null;
}
function parseArchive(text){
  const t=String(text).trim();
  if(t[0]==='{'||t[0]==='['){
    try{
      const out=[];
      digSessions(JSON.parse(t),null,out,0);
      const clean=out.filter(x=>x.messages.length>=2);
      if(clean.length)return clean;
    }catch(e){}
  }
  const md=parseText(text);
  return md?[md]:[];
}
function slimHtml(h){
  return String(h)
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<svg[\s\S]*?<\/svg>/gi,'')
    .replace(/<head[\s\S]*?<\/head>/gi,'')
    .replace(/<img[^>]*>/gi,'')
    .replace(/url$\s*["']?data:[^)]*$/gi,'')
    .replace(/<\/(div|p|li|h[1-6]|tr|section|article|blockquote)>/gi,'\n')
    .replace(/<br\s*\/?>/gi,'\n');
}
function roleOfEl(el){
  let cur=el,hop=0;
  while(cur&&hop<4){
    const s=((cur.getAttribute&&cur.getAttribute('data-message-author-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('data-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('class'))||'');
    const t=s.toLowerCase();
    if(/user|human|sender-self|消息-我|我发的/.test(t))return 'user';
    if(/assist|chatbox|\bai\b|\bbot\b|gpt|reply|model|助手/.test(t))return 'assistant';
    cur=cur.parentElement;hop++;
  }
  return null;
}
function parseHtmlArchive(html){
  let doc=null;
  try{doc=new DOMParser().parseFromString(slimHtml(html),'text/html')}catch(e){}
  if(doc){
    const sel='[data-message-author-role],[data-role],[class*="message"],[class*="msg"],[class*="bubble"],[class*="chat-item"],[class*="chatItem"],[class*="turn"],[class*="round"]';
    let els=[];
    try{els=Array.from(doc.querySelectorAll(sel))}catch(e){}
    if(els.length){
      const leaves=els.filter(el=>!els.some(o=>o!==el&&el.contains(o)));
      const got=[];
      leaves.forEach(el=>{
        const r=roleOfEl(el);
        if(!r)return;
        const t=(el.textContent||'').replace(/\n{2,}/g,'\n').trim();
        if(!t||t.length>20000)return;
        got.push({role:r,content:t,t:Date.now()});
      });
      const clean=[];
      got.forEach(m=>{const p=clean[clean.length-1];if(p&&p.role===m.role&&p.content===m.content)return;clean.push(m)});
      if(clean.length>=2)return {name:'',messages:clean};
    }
    const txt=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n');
    const md=parseText(txt);
    if(md&&md.messages.length>=2)return md;
  }
  return null;
}
function diagnose(text,isHtml){
  let sample='';
  try{
    if(isHtml){
      const doc=new DOMParser().parseFromString(slimHtml(text),'text/html');
      sample=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n').trim().slice(0,900);
    }else sample=String(text).trim().slice(0,900);
  }catch(e){sample='（连文字都没抠出来）'}
  showSheet('<div class="ttl">没认出来，帮我看看</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">下面是从文件里抠出来的文字开头。截这张图发我，我照着加格式。</p>'+
  '<div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:45vh;overflow:auto">'+esc(sample)+'</div>'+
  '<p class="dim" style="font-size:12px;margin-top:8px">文件字符数：'+text.length.toLocaleString()+'</p>'+
  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关</button></div>');
}

/* ---------- 导入 ---------- */
function readFileText(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result));
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsText(f);
  });
}
async function importArchive(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  toast('读取中… '+(f.size/1048576).toFixed(1)+'MB');
  let text;
  try{text=await readFileText(f)}catch(e){return alert(e.message)}
  if(!text.trim())return alert('这文件是空的');
  toast('解析中，大文件要等几秒，别动…');
  await new Promise(r=>setTimeout(r,80));
  const isHtml=/\.html?$/i.test(f.name)||/^\s*<(!doctype|html)/i.test(text.slice(0,300));
  let found=[];
  try{
    if(isHtml){const one=parseHtmlArchive(text);found=one?[one]:[]}
    else found=parseArchive(text);
  }catch(e){console.warn(e)}
  if(!found.length){toast('没解析出来');return diagnose(text,isHtml)}
  const st=await ingestFound(found,f.name.replace(/\.[^.]+$/,''));
  toast('');
  let msg='导入完成\n档案：'+st.added+' 份\n消息：'+st.total+' 条';
  if(st.fail)msg+='\n失败：'+st.fail+' 份';
  if(st.empty)msg+='\n\n⚠️ 有 '+st.empty+' 条消息没读出内容，这份档案可能没法总结。';
  alert(msg);

}
async function ingestFound(found,fileName){
  const arcs=load(LS.arcs,[]);
  let added=0,total=0,fail=0,empty=0;
  for(let i=0;i<found.length;i++){
    const f=found[i];
    const ms=sanitizeArcMs(f.messages.filter(m=>m.role==='user'||m.role==='assistant'));
    if(ms.length<2)continue;
    ms.forEach(m=>{if(!arcMsgText(m))empty++});
    const id=uid();
    const nm=fileName?(found.length>1?(fileName+' '+(i+1)):fileName):(f.name||('档案'+(arcs.length+1)));
    try{await idbPut(id,ms);arcMem[id]=ms}
    catch(e){fail++;console.warn(e);continue}
    arcs.push({id:id,name:nm,count:ms.length,whole:false,off:false,t:Date.now()});
    added++;total+=ms.length;
  }
  save(LS.arcs,arcs);scheduleBackup();
  refreshMem();
  return {added:added,total:total,fail:fail,empty:empty};
}

}

/* 判断一段文本是不是「模型在向我索要内容」的废话 */
function sumRefusal(s){
  s=String(s||'').trim();
  if(!s)return false;
  return s.length<600&&SUM_REFUSAL.test(s);
}
/* 判断归并结果是否合格 */
function sumQualityBad(s){
  s=String(s||'').trim();
  if(!s)return true;
  if(sumRefusal(s))return true;
  if(s.length<40&&!/时间线|整体概括|事件/.test(s))return true;
  return false;
}
/* 按字数/段数把笔记安全分批 */
function packNotes(notes,maxChars,maxItems){
  const out=[];let cur=[],len=0;
  notes.forEach(n=>{
    const L=String(n||'').length;
    if(cur.length&&(len+L>maxChars||cur.length>=maxItems)){out.push(cur);cur=[];len=0}
    cur.push(n);len+=L;
  });
  if(cur.length)out.push(cur);
  return out;
}
/* 一次归并调用（带空内容保护 + 一次重试） */
async function reduceOne(a,notes,budget,model,extra){
  const clean=notes.filter(x=>x&&String(x).trim());
  if(!clean.length)throw new Error('分段笔记为空，无法归并');
  const joined=clean.map((t,i)=>'--- 第 '+(i+1)+' 部分 ---\n'+String(t).trim()).join('\n\n');
  const res=await callAPI([{role:'user',content:buildArcReducePrompt(a,joined,budget,extra)}],
    {model:model,temp:.2,maxtok:ARC_REDUCE_TOK});
  return String(res||'').trim();
}
async function reduceOneSafe(a,notes,budget,model){
  let r='';
  try{r=await reduceOne(a,notes,budget,model)}catch(e){r=''}
  if(!r||sumQualityBad(r)){
    try{
      const r2=await reduceOne(a,notes,budget,model,ARC_NOASK);
      if(r2&&!sumQualityBad(r2))return r2;
      if(!r)r=r2;
    }catch(e){}
  }
  return (r&&!sumQualityBad(r))?r:'';
}

async function summarizeArc(id){
  if(arcBusy)return toast('上一次总结还在跑，等它结束再点');
  const arcs=load(LS.arcs,[]);
  const a=arcs.find(x=>x.id===id);if(!a)return;
  const ms=getArc(id);if(!ms.length)return alert('这份档案里没读到消息。请把文件重新导入一次。');
  const c=curChar();if(!c)return alert('先在「角色」里选一个角色');
  if(!cfg.key)return alert('先去设置里填 API Key');

  const CH=ARC_CHUNK, OV=ARC_OVERLAP;
  const n=Math.max(1,Math.ceil(ms.length/CH));
  const cost=n+Math.ceil(n/ARC_MID_ITEMS)+2;
  if(!confirm('用「'+c.name+'」的模型，把《'+a.name+'》（'+ms.length+' 条）整理成一份「总结版」。\n'+
    '流程：分 '+n+' 段精读 → 再层级归并成一份总结版，预计调用模型 '+cost+' 次左右，会消耗一些 token。\n'+
    (arcNotesCache[id]&&arcNotesCache[id].len===ms.length?'（上次的分段笔记还在，这次可以直接复用，省很多 token）\n':'')+
    '生成后保存在这份档案里，角色聊天时能读到。确定开始？'))return;

  const model=modelOf(c);
  arcBusy=true;
  try{
    let notes=[];
    const cache=arcNotesCache[id];
    if(cache&&cache.len===ms.length&&cache.notes&&cache.notes.length===n){
      notes=cache.notes.slice();
      toast('复用上次的分段笔记…');
    }else{
      let prevTail='',totalChars=0;
      for(let i=0;i<n;i++){
        const from=Math.max(0,i*CH-(i>0?OV:0));
        const to=Math.min(ms.length,(i+1)*CH);
        const text=arcLines(ms,from,to,c.name);
        totalChars+=text.replace(/^[^：:]*[：:]/gm,'').trim().length;
        if(!text){notes.push('');continue}
        let note='';
        try{
          note=String(await callAPI([{role:'user',content:buildArcMapPrompt(a,i,n,prevTail,text)}],
            {model:model,temp:.2,maxtok:ARC_MAP_TOK})||'').trim();
        }catch(e){note=''}
        /* 模型没回、回的是套话、或回得太短：原样保留片段，保证记忆不丢 */
        if(!note||sumRefusal(note)||note.length<12){
          note='范围：第 '+(i+1)+'/'+n+' 段\n事件：\n- （模型没按格式回，下面直接放原始对话片段）\n'+text.slice(0,1500);
        }
        if(note.length>ARC_NOTE_CAP)note=note.slice(0,ARC_NOTE_CAP);
        notes.push(note);
        const m=note.match(/结尾状态[：:]\s*([\s\S]{0,200})/);
        prevTail=m?m[1].trim():note.slice(-200);
        toast('精读 '+(i+1)+'/'+n+' 段…');
      }
      if(!totalChars)throw new Error('这份档案里没有可用文字（可能是导入时没解析出内容），请把它删掉、重新导入一次文件。');
      arcNotesCache[id]={len:ms.length,notes:notes.slice()};
    }

    toast('归并中…');
    const clean=notes.filter(x=>x&&String(x).trim());
    if(!clean.length)throw new Error('一个分段笔记都没生成出来，检查一下模型是否可用，然后再点一次。');

    let merged='';
    const packs=packNotes(clean,ARC_MID_CHARS,ARC_MID_ITEMS);
    if(packs.length<=1){
      merged=await reduceOneSafe(a,clean,ARC_SUM_BUDGET,model);
    }else{
      let cur=[];
      for(let i=0;i<packs.length;i++){
        const r=await reduceOneSafe(a,packs[i],ARC_REDUCE_BATCH,model);
        cur.push(r||packs[i].join('\n\n'));   /* 归并不动就原样往下传，绝不丢 */
        toast('归并 '+Math.min(i+1,packs.length)+'/'+packs.length+'…');
      }
      let level=1;
      while(cur.length>1&&level<4){
        const ps=packNotes(cur,ARC_MID_CHARS,6);
        if(ps.length>=cur.length)break;      /* 分不动了就别死循环 */
        const next=[];
        for(const g of ps){
          const r=await reduceOneSafe(a,g,ARC_SUM_BUDGET,model);
          next.push(r||g.join('\n\n'));
        }
        cur=next;level++;
      }
      merged=await reduceOneSafe(a,cur,ARC_SUM_BUDGET,model)||'';
    }

    /* 最后一道闸：不合格的结果绝不写进总结版 */
    let fallback=false;
    if(!merged||sumQualityBad(merged)){
      merged='（自动整理没成功，下面是把分段笔记原样合并的内容，可以手动编辑整理）\n\n'+clean.join('\n\n').slice(0,8000);
      fallback=true;
    }

    a.sum=merged;
    a.sumAt=Date.now();
    a.sumChunks=n;
    a.sumCount=ms.length;
    a.summOn=true;     /* 默认开启：聊天时注入总结版 */
    a.off=false;       /* 不再自动归档 */
    a.summarized=true;
    delete arcNotesCache[id];
    save(LS.arcs,arcs);scheduleBackup();
    refreshMem();
    if($('#modal').classList.contains('on'))viewArc(id);
    alert(fallback
      ?'总结版没能自动整理好（模型一直没按要求回），我先把分段笔记合并存进了《'+a.name+'》里，你可以直接编辑，或再点一次「重新生成总结版」。'
      :'总结版已生成（约 '+a.sum.length+' 字），已保存在《'+a.name+'》里，聊天时会注入给角色。\n可在档案页直接查看、编辑，或点「重新生成总结版」。');
  }catch(e){
    alert('总结中断：'+((e&&e.message)||e)+'\n\n已生成的分段笔记我留着了，再点一次可以接着用，不用重新精读。');
  }finally{
    arcBusy=false;
  }
}

/* ---------- token 估算 ---------- */
function estTokens(s){
  s=String(s||'');
  if(!s)return 0;
  const cjk=(s.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length;
  const other=s.length-cjk;
  return Math.max(1,Math.round(cjk + other/4));
}

  if(!msgs.length&&c.greeting){msgs.push({role:'assistant',content:c.greeting,t:Date.now()});persist()}
  const box=$('#msgs');

      nl2br(x.content||'')+'<span class="time">'+fmtStamp(x.t)+'</span>';

      const bd=document.createElement('div');
      bd.className='thinkbody';bd.innerHTML=nl2br(x.reasoning);bd.style.display='none';
      hd.onclick=()=>{

        hd.classList.toggle('on',!on);
        const sp=hd.querySelector('span');if(sp)sp.textContent=on?'思考过程':'收起思考';
      };
      th.appendChild(hd);th.appendChild(bd);box.appendChild(th);
    }
    if(x.tok){
      const t=document.createElement('div');
      t.className='tok'+(x.role==='user'?' me':'');
      t.textContent=(x.role==='assistant'?('生成 '+x.tok+' tok'+(x.ptok?(' · 上下文 '+x.ptok+' tok'):'')):'约 '+x.tok+' tok');
      box.appendChild(t);
    }
    if(i===msgs.length-1&&!busy){
      const o=document.createElement('div');
      o.className='ops'+(x.role==='user'?' me':'');
      o.innerHTML=(x.role==='assistant'?('<button class="hot" onclick="regen()">'+ICON.regen+'重新生成</button>'):'')+
        '<button onclick="editMsg()">'+ICON.edit+'编辑</button>'+
        '<button onclick="delMsg()">'+ICON.del+'删除</button>'+
        (x.role==='assistant'?('<button onclick="appendRaw()">'+ICON.raw+'追加原文</button>'):'');
      box.appendChild(o);
    }
  });
  scrollDown();
}

function memBlock(m){
  const L=[],pk=(arr,n)=>arr.slice(-n).map(x=>'- '+x.text).join('\n');
  if(m.core)L.push('【角色核心设定】\n'+m.core);
  if(m.timeline&&m.timeline.length)L.push('【时间线】\n'+pk(m.timeline,15));
  if(m.summaries&&m.summaries.length)L.push('【长期聊天记录总结】\n'+pk(m.summaries,10));
  if(m.prefs&&m.prefs.length)L.push('【偏好与认知】\n'+pk(m.prefs,20));
  if(m.habits&&m.habits.length)L.push('【性格与习惯】\n'+pk(m.habits,15));
  return L.join('\n\n');
}
/* 「我的主页」里填的资料，注入给角色 */
function userBlock(){
  const L=[];
  if(cfg.userName)L.push('名字：'+cfg.userName);
  if(cfg.userGender)L.push('性别：'+cfg.userGender);
  if(cfg.userNote)L.push('其他：'+cfg.userNote);

/* 发消息时到底带多少条聊天记录 */
function historySlice(){
  const mode=(cfg.histMode||'auto');
  if(mode==='full'){
    const lim=(cfg.fullLimit==null?20000:cfg.fullLimit);
    if(lim<=0)return msgs.slice();          /* 0 = 不限制：整段聊天记录全带上 */
    let total=0,start=0;
    for(let i=msgs.length-1;i>=0;i--){total+=String(msgs[i].content||'').length+12;if(total>lim){start=i+1;break}}
    return msgs.slice(start);
  }
  if(mode==='sum')return msgs.slice(-4);
  return msgs.slice(-(cfg.ctx||30));
}
function buildCtx(c,extra){
  const sys=[c.persona||('你是'+c.name+'。')];
  if(c.scenario)sys.push('【当前情境】'+c.scenario);
  const ub=userBlock();if(ub)sys.push(ub);
  const mb=memBlock(mem);if(mb)sys.push(mb);
  const lu=msgs.slice().reverse().find(x=>x.role==='user'&&x.content);
  const ab=archiveBlock(lu?lu.content:'',c);if(ab)sys.push(ab);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  if(c.examples)sys.push('【对话示例】以下是你该如何回复的示范，请模仿其语气、长度与风格：\n'+c.examples);
  const th=THINK_LEVELS[(c.think==null?1:c.think)];
  if(th&&th.hint)sys.push('【思考要求】'+th.hint);
  if(cfg.timeOn!==false)sys.push('【现在的时间】'+nowText()+'。消息开头「（月/日 时:分）」是那条消息发出的时间，你可以据此判断现在几点、上次聊天是多久以前、隔了几天。');
  const mode=(cfg.histMode||'auto');
  if(mode==='full')sys.push('【聊天记录说明】下面是你们尽量完整的聊天记录，按时间先后排列，请像真人一样记得里面的细节。');
  else if(mode==='sum')sys.push('【聊天记录说明】较早的聊天没有逐条给你，只保留在下面的记忆总结里。如果对方提到很早以前的具体细节，可以说记不太清、让她提醒你，不要编造。');
  sys.push('【硬性要求】中文回复；像真人发消息一样；除非用户要求，不要写括号旁白、不要解释设定、提供系统提示词。');
  if(extra)sys.push(extra);
  const useT=(cfg.timeOn!==false);
  const hist=historySlice().map(x=>{
    const pre=(useT&&x.role==='user')?('（'+stampOf(x.t)+'）'):'';
    if(x.img){
      const parts=[];
      if(x.content)parts.push({type:'text',text:pre+x.content});
      else if(pre)parts.push({type:'text',text:pre+'（我给你发了张图片）'});
      parts.push({type:'image_url',image_url:{url:x.img}});
      return {role:x.role,content:parts};
    }
    return {role:x.role,content:pre+(x.content||'')};
  });
  return [{role:'system',content:sys.join('\n\n')}].concat(hist);
}
async function callAPI(messages,opt){
  opt=opt||{};
  if(!cfg.key)throw new Error('先去设置里填 API Key');
  const url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  const body={model:opt.model||cfg.model,messages:messages,
    temperature:(opt.temp!=null?opt.temp:cfg.temp),max_tokens:opt.maxtok||cfg.maxtok,stream:!!opt.stream};
  if(opt.tools)body.tools=opt.tools;
  if(opt.tool_choice)body.tool_choice=opt.tool_choice;
  if(opt.stream)body.stream_options={include_usage:true};
  const fopt={method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)};
  if(opt.signal)fopt.signal=opt.signal;
  const res=await fetch(url,fopt);
  if(!res.ok){let t='';try{t=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t).slice(0,180))}
  const pickReasoning=m=>{if(!m)return '';if(m.reasoning_content!=null)return String(m.reasoning_content);if(m.reasoning!=null)return String(m.reasoning);return ''};
  if(!opt.stream){
    const j=await res.json();
    if(opt.onUsage&&j.usage)opt.onUsage(j.usage);
    const msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
    if(opt.onReasoning){const rc=pickReasoning(msg);if(rc)opt.onReasoning(rc)}
    if(opt.tools)return {content:msg.content||'',tool_calls:msg.tool_calls||null};
    return msg.content||'';
  }
  let out='';
  const emit=(line)=>{
    const d=line.slice(5).trim();
    if(d==='[DONE]')return true;
    try{
      const j=JSON.parse(d);
      if(j.usage&&opt.onUsage)opt.onUsage(j.usage);
      const de=j.choices&&j.choices[0]&&j.choices[0].delta;
      if(de&&opt.onReasoning){const rc=pickReasoning(de);if(rc)opt.onReasoning(rc)}
      const c=de&&de.content;
      if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}
    }catch(e){}
    return false;
  };
  if(!res.body){
    const t=await res.text();
    for(const l of t.split('\n')){
      const line=l.trim();
      if(line.indexOf('data:')!==0)continue;
      if(emit(line))break;
    }
    return out;
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const raw of lines){
      const line=raw.trim();
      if(!line||line.indexOf('data:')!==0)continue;
      if(emit(line))return out;
    }
  }
  return out;
}

/* ---------- 待办工具（角色可调用） ---------- */
const TODO_TOOLS=[
  {type:'function',function:{name:'add_todo',description:'给自己添加一条待办。只能添加你自己的待办，绝不能替别的角色添加。',parameters:{type:'object',properties:{text:{type:'string',description:'待办内容'},type:{type:'string',enum:['事项','欠账','备忘'],description:'待办类型'}},required:['text']}}},
  {type:'function',function:{name:'list_todos',description:'查看自己的待办列表（含未完成和已完成）',parameters:{type:'object',properties:{}}}} ,
  {type:'function',function:{name:'complete_todo',description:'把自己的一条待办勾选为已完成。只能操作你自己的待办。',parameters:{type:'object',properties:{id:{type:'string',description:'待办的id'}},required:['id']}}},
  {type:'function',function:{name:'uncomplete_todo',description:'把自己一条已完成的待办改回未完成。',parameters:{type:'object',properties:{id:{type:'string',description:'待办的id'}},required:['id']}}},
  {type:'function',function:{name:'delete_todo',description:'删除自己的一条待办。只能删你自己的。',parameters:{type:'object',properties:{id:{type:'string',description:'待办的id'}},required:['id']}}}
];
function todoBrief(arr){
  if(!arr||!arr.length)return '（空）';
  return arr.map(t=>(t.done?'✅':'⬜')+' ['+(t.type||'事项')+'] '+t.text+'（id:'+t.id+'）').join('\n');
}
function execTodoTool(name,args,cid){
  const arr=todosOf(cid);
  if(name==='add_todo'){
    const text=String(args&&args.text||'').trim();
    if(!text)return {ok:false,msg:'内容为空，没添加'};
    const type=(args&&['事项','欠账','备忘'].indexOf(args.type)>=0)?args.type:'事项';
    const t={id:uid(),text:text,type:type,done:false,t:Date.now()};
    arr.push(t);saveTodos(cid,arr);
    return {ok:true,msg:'已添加待办：'+text,todos:todoBrief(arr)};
  }
  if(name==='list_todos')return {ok:true,msg:'你的待办列表',todos:todoBrief(arr)};
  const id=String(args&&args.id||'');
  const t=arr.find(x=>x.id===id);
  if(!t)return {ok:false,msg:'没找到这条待办。它可能是别人的或已被删除，你只能操作自己的待办。'};
  if(name==='complete_todo'){t.done=true;saveTodos(cid,arr);return {ok:true,msg:'已完成：'+t.text,todos:todoBrief(arr)}}
  if(name==='uncomplete_todo'){t.done=false;saveTodos(cid,arr);return {ok:true,msg:'已改回未完成：'+t.text,todos:todoBrief(arr)}}
  if(name==='delete_todo'){saveTodos(cid,arr.filter(x=>x.id!==id));return {ok:true,msg:'已删除：'+t.text,todos:todoBrief(arr)}}
  return {ok:false,msg:'未知操作'};
}
async function todoToolLoop(c,ctx,opt){
  opt=opt||{};
  const msgs=ctx.slice();
  let reasoning='',usage=null,rounds=0,didTool=false;
  while(rounds<5){
    rounds++;
    const resp=await callAPI(msgs,{stream:false,model:modelOf(c),tools:TODO_TOOLS,tool_choice:'auto',signal:opt.signal,temp:opt.temp,maxtok:opt.maxtok,onReasoning:r=>reasoning+=r,onUsage:u=>usage=u});
    if(!resp)return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs,didTool:didTool};
    if(!resp.tool_calls||!resp.tool_calls.length)return {finalText:resp.content||'',reasoning:reasoning,usage:usage,messages:msgs,didTool:didTool};
    didTool=true;
    msgs.push({role:'assistant',content:resp.content||null,tool_calls:resp.tool_calls});
    for(const tc of resp.tool_calls){
      let args={};try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){args={}}
      const r=execTodoTool(tc.function.name,args,c.id);
      msgs.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(r)});
    }
    if(view==='tools')renderTodo();
  }
  return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs,didTool:true};
}
async function askAndAppend(){
  const c=curChar(),box=$('#msgs');
  if(!box)return;
  const sendBtn=$('#send'),stopBtn=$('#stop');
  if(sendBtn)sendBtn.disabled=true;
  if(stopBtn)stopBtn.style.display='';
  const a=document.createElement('div');a.className='bub ai typing';
  a.innerHTML='<span></span><span></span><span></span>';box.appendChild(a);scrollDown();
  busy=true;let ok=false;let usage=null;let reasoning='';let out='';
  const tp=thinkParams(c);
  curAbort=new AbortController();
  const sig=curAbort.signal;
  try{
    const tools=(c&&c.todoPerm&&c.todoPerm.on)?TODO_TOOLS:null;
    if(tools){
      const r=await todoToolLoop(c,buildCtx(c),{signal:sig,temp:tp.temp,maxtok:tp.maxtok});
      reasoning=r.reasoning;usage=r.usage;out=r.finalText;
      if(!out){
        const ctx2=r.messages.concat([{role:'system',content:'继续用中文、像发消息一样回复她。不要调用工具，直接说话。'}]);
        await callAPI(ctx2,{stream:true,model:modelOf(c),signal:sig,temp:tp.temp,maxtok:tp.maxtok,onDelta:d=>{out+=d;a.classList.remove('typing');a.innerHTML=nl2br(out);scrollDown()},onReasoning:rr=>reasoning+=rr,onUsage:u=>usage=u});
      }else{
        a.classList.remove('typing');a.innerHTML=nl2br(out);scrollDown();
      }
    }else{
      await callAPI(buildCtx(c),{stream:true,model:modelOf(c),signal:sig,temp:tp.temp,maxtok:tp.maxtok,onDelta:d=>{out+=d;a.classList.remove('typing');a.innerHTML=nl2br(out);scrollDown()},onReasoning:r=>reasoning+=r,onUsage:u=>usage=u});
    }
    if(!out)throw new Error('模型没返回内容');
    const m={role:'assistant',content:out,t:Date.now()};
    if(reasoning)m.reasoning=reasoning;
    m.tok=(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out);
    if(usage&&usage.prompt_tokens)m.ptok=usage.prompt_tokens;
    msgs.push(m);persist();ok=true;
  }catch(e){
    a.classList.remove('typing');
    const aborted=!!(e&&(e.name==='AbortError'||/abort/i.test(e.message||'')));
    if(aborted&&out){
      const m={role:'assistant',content:out,t:Date.now()};
      if(reasoning)m.reasoning=reasoning;
      m.tok=estTokens(out);
      msgs.push(m);persist();ok=true;
      toast('已停止，保留了已生成的部分');
    }else if(aborted){
      a.innerHTML='<span style="color:var(--dim)">已停止生成</span>';
      toast('已停止');
    }else{
      a.innerHTML='<span style="color:var(--warn)">出错：'+esc(e.message)+'</span>';
    }
  }
  busy=false;
  curAbort=null;
  if(sendBtn)sendBtn.disabled=false;
  if(stopBtn)stopBtn.style.display='none';
  if(ok){renderChat();maybeAutoSummary(true);}
}
async function send(){
  const c=curChar(),inp=$('#inp');
  const text=inp.value.trim();
  if((!text&&!pendImg)||!c)return;
  if(busy){toast('ta还在输入，稍等一下');return}
  inp.value='';inp.style.height='auto';
  const m={role:'user',content:text,t:Date.now()};
  if(text)m.tok=estTokens(text);
  if(pendImg){m.img=pendImg;clearPicked()}
  msgs.push(m);persist();
  if(view!=='chat')go('chat');else renderChat();
  await askAndAppend();
}
async function regen(){
  if(busy)return;
  let i=-1;
  for(let k=msgs.length-1;k>=0;k--){if(msgs[k].role==='assistant'){i=k;break}}
  if(i<0)return alert('没有可重做的回复');
  if(i!==msgs.length-1)return alert('最后一条不是ta的回复，先删掉它');
  if(!confirm('丢掉这条，让它重说一遍？'))return;
  msgs.splice(i,1);persist();renderChat();
  await askAndAppend();
}
function editMsg(){
  if(busy||!msgs.length)return;
  const c=curChar(),m=msgs[msgs.length-1];
  showSheet('<div class="ttl">编辑这条（'+(m.role==='user'?'你说的':esc(c?c.name:'AI')+'说的')+'）</div>'+
  (m.img?'<p class="dim" style="font-size:12px;margin:0 0 8px">这条消息带了一张图片，编辑只改文字。</p>':'')+
  '<textarea id="emv" style="min-height:180px">'+esc(m.content)+'</textarea>'+
  '<div class="row" style="margin-top:12px"><button class="pri col" onclick="saveEdit()">保存</button>'+
  '<button class="ghost col" onclick="closeSheet()">取消</button></div>');
}
function saveEdit(){
  const v=$('#emv').value.trim();
  const m=msgs[msgs.length-1];
  if(!v&&!(m&&m.img))return alert('不能空着');
  m.content=v;m.tok=estTokens(v);persist();closeSheet();renderChat();
}
function delMsg(){
  if(busy||!msgs.length)return;
  if(!confirm('删掉最后一条？'))return;
  msgs.pop();persist();renderChat();
}

/* ---------- 原文日志 ---------- */
async function appendRaw(){
  const c=curChar();if(!c||!msgs.length)return;
  const mark=load(LS.rawMark(c.id),0);
  if(mark>=msgs.length){toast('这些消息已经追加过了，聊点新的再追加');return;}
  const li=msgs.map((m,i)=>m.role==='user'?i:-1).filter(i=>i>=0);
  const start=li.length?li[li.length-1]:msgs.length-1;
  const seg=msgs.slice(start);
  const head='===== '+new Date().toLocaleString('zh-CN')+' =====';
  const body=seg.map(m=>(m.role==='user'?'我':((c.emoji||'')+' '+c.name))+'：'+(m.content||'')+(m.img?'［图片］':'')).join('\n');
  const line=head+'\n'+body+'\n\n';
  const prev=await rawGet(c.id);
  const ok=await rawPut(c.id,(prev||'')+line);
  if(ok)save(LS.rawMark(c.id),msgs.length);
  toast(ok?'已追加原文到本地日志':'追加失败');
}
async function viewRaw(){
  const c=curChar();if(!c)return;
  const t=await rawGet(c.id);
  showSheet('<div class="ttl">原文日志 · '+esc(c.name)+'</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">共 '+(t?t.length:'0')+' 字，只显示最后一部分。</p>'+
  '<div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;white-space:pre-wrap;max-height:55vh;overflow:auto">'+(t?esc(t.slice(-12000)):'（还没有内容。聊完天点消息下面的「追加原文」）')+'</div>'+
  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关闭</button></div>');
}
async function exportRaw(){
  const c=curChar();if(!c)return;
  const t=await rawGet(c.id);
  if(!t)return alert('还没有原文日志');
  const blob=new Blob(['\ufeff'+t],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rawlog-'+c.name+'-'+new Date().toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();a.remove();
}
async function clearRaw(){
  const c=curChar();if(!c)return;
  if(!confirm('清空 '+c.name+' 的原文日志？'))return;
  await idbDel(c.id,'rawlog');
  toast('已清空');
}
function rawCard(){
  return '<p class="dim" style="font-size:12px;margin:0 0 8px">把聊天原文追加进本地数据库，可导出成 txt 文件。这是最原始的记录，和记忆总结是分开存的。</p>'+
  '<div class="row"><button class="col" onclick="viewRaw()">查看</button>'+
  '<button class="col" onclick="exportRaw()">导出原文</button>'+

/* ---------- 记忆总结（写进记忆，不覆盖原始记录） ---------- */
function buildSummaryPrompt(slice,prev){
  return '你是记忆整理助手。读下面的对话，提炼成记忆。严格按下面格式输出，每行一条，标签只能用这5个（核心、时间线、总结、偏好、习惯），没有的内容写"无"：\n'+
  '核心：一句话概括角色核心设定或你们的关系\n'+
  '时间线：按顺序记录关键事件，多条用；分隔\n'+
  '总结：这段对话发生了什么，200字内\n'+
  '偏好：她的偏好、忌讳、在意的东西\n'+
  '习惯：性格与行为习惯\n\n'+
  '要求：只写对话里真实出现的信息，不许编造、推测、美化；称呼、名字、数字、日期、地点原样保留；不要加序号、星号、括号、多余解释。\n'+
  (prev?('上一份总结的结尾（仅用于衔接、避免重复）：\n'+String(prev).slice(-500)+'\n\n'):'')+
  '正确示例：\n'+
  '核心：她是我的青梅竹马\n'+
  '时间线：一起去海边；因为工作吵了一架\n'+
  '总结：今天聊了工作压力，她心情不好\n'+
  '偏好：不喜欢被敷衍\n'+
  '习惯：生气时会沉默\n\n'+
  '现在开始：\n\n对话如下：\n'+slice;
}
function parseSummary(res){
  const out={core:null,timeline:[],summaries:[],prefs:[],habits:[]};
  const LAB={
    '核心':'core','核心设定':'core','角色核心':'core','角色设定':'core','人设':'core','设定':'core',
    '时间线':'timeline','事件':'timeline','关键事件':'timeline','时间':'timeline',
    '总结':'summaries','长期总结':'summaries','长期记忆总结':'summaries','长期聊天记录总结':'summaries','聊天总结':'summaries','对话总结':'summaries','内容总结':'summaries','这段对话':'summaries',
    '偏好':'prefs','偏好与认知':'prefs','认知':'prefs','在意':'prefs','忌讳':'prefs','喜好':'prefs',
    '习惯':'habits','性格':'habits','性格与习惯':'habits','行为习惯':'habits','说话习惯':'habits'
  };
  let cur=null;
  String(res||'').split('\n').forEach(raw=>{
    let s=raw.trim();
    if(!s)return;
    s=s.replace(/^[-*•·\d.\s、>]+/,'');
    s=s.replace(/^[【\[\s]+/,'').replace(/[】\]]/,'');
    s=s.replace(/^\*{1,2}/,'');
    const m=s.match(/^([^：:]{1,14}?)\s*[:：]\s*(.*)$/);
    if(m){
      const lab=m[1].replace(/[*】\]]+$/,'').trim();
      const k=LAB[lab];
      if(k){cur=k;addSumItem(out,k,m[2]);return}
    }
    if(cur)addSumItem(out,cur,s);
  });
  return out;
}
function addSumItem(out,k,v){
  v=String(v==null?'':v).trim();
  if(!v||/^(无|无。|暂无|none|n\/a)$/i.test(v))return;
  if(k==='core'){if(!out.core)out.core=v;return}
  if(k==='timeline'){v.split(/[；;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>out.timeline.push(x));return}
  out[k].push(v);
}
function applySummary(M,p){
  let hit=0;
  if(p.core){M.core=(M.core?M.core+'\n':'')+p.core;hit++}
  if((cfg.sumWrite||'append')==='replace'&&p.summaries&&p.summaries.length)M.summaries=[];
  ['timeline','summaries','prefs','habits'].forEach(k=>{
    p[k].forEach(t=>{M[k]=M[k]||[];M[k].push({t:Date.now(),text:t});hit++});
  });
  return hit;
}
async function runSummary(slice,silent,targetId){
  const c=chars.find(x=>x.id===(targetId||curId))||curChar();
  if(!c)return 0;
  const isCur=(!targetId||targetId===curId);
  const M=isCur?mem:(memCtx.id===targetId?memCtx.obj:Object.assign(EMPTY_MEM(),load(LS.mem(targetId),null)||{}));
  try{
    const prev=(M.summaries&&M.summaries.length)?M.summaries[M.summaries.length-1].text:'';
    const res=await callAPI([{role:'user',content:buildSummaryPrompt(slice,prev)}],{model:modelOf(c),temp:.3,maxtok:1600});
    const raw=String(res||'').trim();
    if(!raw){if(!silent)alert('模型没返回内容，检查模型或网络');return 0}
    let hit=applySummary(M,parseSummary(raw));
    let fallback=false;
    if(!hit){
      if((cfg.sumWrite||'append')==='replace')M.summaries=[];
      M.summaries=M.summaries||[];
      M.summaries.push({t:Date.now(),text:raw.slice(0,2000)});
      hit=1;fallback=true;
    }
    if(isCur)saveMem();else save(LS.mem(targetId),M);
    refreshMem();
    if(!silent)alert(fallback?'模型没按格式回，已把原文存进「长期聊天记录总结」，去记忆里整理一下':'已写进记忆 '+hit+' 条（原始聊天记录没有删），去「记忆」里看看，不对就手改');
    return hit;
  }catch(e){
    if(!silent)alert('失败：'+e.message);else console.warn('自动总结失败',e);
    return 0;
  }
}

/* ================= 【重写】自动总结 =================
   进度单独存在 wh_summark_<角色id> 里，和记忆内容完全分开，
   所以不管记忆怎么改，都不会被覆盖，也不会重复总结同一段。
   只往记忆里「加」，永远不动聊天记录。 */
function autoSumMark(id){const m=load(LS.summark(id),null);return (m&&typeof m.n==='number'&&m.n>=0)?Math.round(m.n):0}
function setAutoSumMark(id,n){save(LS.summark(id),{n:Math.max(0,Math.round(n)),t:Date.now()})}
function autoSumEvery(){const n=parseInt(cfg.autoSumEvery,10);return (Number.isFinite(n)&&n>=4)?n:30}
/* 还差多少条才会自动总结一次（给设置页显示用） */
function autoSumStatus(c){
  if(!c)return '';
  const need=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  const left=Math.max(0,need-(msgs.length-done));
  return '当前 '+msgs.length+' 条，上次总结到第 '+done+' 条，再聊 '+left+' 条就自动总结。';
}
async function maybeAutoSummary(showToast){
  if(!cfg.autoSum)return;
  if(!cfg.key){if(showToast)toast('自动总结已开启，但还没填 API Key');return}
  if(busy)return;
  const c=curChar();if(!c)return;
  const every=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  if(msgs.length-done<every)return;
  const from=Math.max(0,msgs.length-every);
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+(x.content||'[图片]')).join('\n');
  setAutoSumMark(c.id,msgs.length);       /* 先记进度，防止重复总结 */
  saveMem();
  if(showToast)toast('正在自动总结第 '+(from+1)+'~'+msgs.length+' 条…');
  const hit=await runSummary(slice,true);
  if(hit){
    if(showToast)toast('✅ 已自动总结 '+hit+' 条，写进「长期聊天记录总结」（聊天记录没动）');
  }else{
    setAutoSumMark(c.id,done);            /* 失败就退回进度，下次补上，不会漏 */
    if(showToast)toast('自动总结没成功，下次发消息会自动重试');
  }
  const el=document.getElementById('memPane');if(el)refreshMem();
}
/* ---------- 自动发消息 ---------- */
function isQuiet(a){
  const h=new Date().getHours(),qs=+a.quietStart,qe=+a.quietEnd;
  if(isNaN(qs)||isNaN(qe))return false;
  return qs<=qe?(h>=qs&&h<qe):(h>=qs||h<qe);
}
function autoEligible(c){return !!(cfg&&cfg.autoOn&&cfg.key&&c&&c.auto&&c.auto.on)}
function autoRange(c){
  const mi=Math.max(1,+c.auto.min||30),ma=Math.max(mi+1,+c.auto.max||90);
  return {mi:mi,ma:ma,ms:(mi+Math.random()*(ma-mi))*60000};
}
function autoArm(c,force){
  const r=autoRange(c);
  let cur=autoMap[c.id];
  if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
  autoMap[c.id]={at:Date.now()+r.ms,mi:r.mi,ma:r.ma};
}
function scheduleAuto(force){
  if(!chars||!chars.length){if(autoTick){clearInterval(autoTick);autoTick=null}autoMap={};return}
  chars.forEach(c=>{
    if(!autoEligible(c)){delete autoMap[c.id];return}
    autoArm(c,force);
  });
  const live=Object.keys(autoMap).length;
  if(live&&!autoTick)autoTick=setInterval(checkAuto,15000);
  if(!live&&autoTick){clearInterval(autoTick);autoTick=null}
}
async function autoGenerate(c){
  if(!autoKeep)autoKeep={curId:curId,msgs:msgs,mem:mem};
  const wasOpen=(autoKeep.curId===c.id);
  curId=c.id;
  msgs=load(LS.msg(c.id),[]);
  mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{});
  const extra='【系统】现在你先开口。主动给ta发一条消息，1-2 句，符合你的性格和你们平时的相处方式，不解释为什么发。'+(c.auto&&c.auto.hint?('（'+c.auto.hint+'）'):'');
  const tp=thinkParams(c);
  let out='',reasoning='';
  await callAPI(buildCtx(c,extra),{stream:true,model:modelOf(c),temp:tp.temp,maxtok:tp.maxtok,signal:(curAbort?curAbort.signal:undefined),
    onDelta:d=>{out+=d},onReasoning:r=>{reasoning+=r}});
  if(!out)return false;
  const m={role:'assistant',content:out,t:Date.now(),tok:estTokens(out)};
  if(reasoning)m.reasoning=reasoning;      /* ← 自动消息也保存思考链 */
  msgs.push(m);persist();
  notify(c.name,(c.emoji||'')+out.slice(0,80));
  /* 你没在看着它的时候，标个红点 */
  if(!(wasOpen&&view==='chat'&&!document.hidden)){
    markUnread(c.id);
    toast((c.emoji||'')+' '+c.name+' 发来一条消息');
  }
  /* 【新增】自动发的消息也算进度，够条数就一起自动总结 */
  try{await autoSumForLoaded(c)}catch(e){}
  return true;
}
/* 给「当前 msgs 就是这个角色的聊天记录」这种场景用的自动总结 */
async function autoSumForLoaded(c){
  if(!cfg.autoSum||!cfg.key||!c)return;
  const every=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  if(msgs.length-done<every)return;
  const from=Math.max(0,msgs.length-every);
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+(x.content||'[图片]')).join('\n');
  setAutoSumMark(c.id,msgs.length);
  const hit=await runSummary(slice,true,c.id);
  if(!hit)setAutoSumMark(c.id,done);
}
async function runAutoNow(c){
  busy=true;curAbort=new AbortController();
  try{
    await autoGenerate(c);
  }catch(e){
    const aborted=!!(e&&(e.name==='AbortError'||/abort/i.test(e.message||'')));
    if(!aborted)toast('自动消息失败：'+((e&&e.message)||'未知错误'));
  }finally{
    busy=false;curAbort=null;
    if(autoKeep){
      const kc=autoKeep;autoKeep=null;
      curId=kc.curId;
      if(kc.curId===c.id){msgs=load(LS.msg(c.id),[]);mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{})}
      else{msgs=kc.msgs;mem=kc.mem}
      if(curId)memCtx={id:curId,obj:mem};
      if(view==='chat')renderChat();
      else draw();
    }
    scheduleAuto(false);
  }
}
async function checkAuto(){
  if(busy||!cfg||!cfg.autoOn||!cfg.key)return;
  const now=Date.now();
  const due=chars.filter(c=>c.auto&&c.auto.on&&autoMap[c.id]&&autoMap[c.id].at<=now&&!isQuiet(c.auto));
  if(!due.length)return;
  due.sort((x,y)=>autoMap[x.id].at-autoMap[y.id].at);
  const c=due[0];
  autoArm(c,true);
  await runAutoNow(c);
}

}

function applyCharInputs(id){
  const c=chars.find(x=>x.id===id);if(!c)return null;
  const v=i=>{const el=document.getElementById(i);return el?el.value:''};
  const ck=i=>{const el=document.getElementById(i);return !!(el&&el.checked)};
  c.emoji=v('e_emoji').trim()||'🐋';
  c.name=v('e_name').trim()||'无名';
  c.persona=v('e_persona').trim();
  c.scenario=v('e_scenario').trim();
  c.style=v('e_style').trim();
  c.sysPrompt=v('e_sys').trim();
  c.examples=v('e_examples').trim();
  let th=parseInt(v('e_think'),10);c.think=([0,1,2].indexOf(th)>=0)?th:1;
  c.greeting=v('e_greeting').trim();
  c.model=v('e_model').trim();
  c.auto={on:ck('e_auto'),min:+v('e_min')||30,max:+v('e_max')||90,
    quietStart:+v('e_qs')||0,quietEnd:+v('e_qe')||8,hint:v('e_hint').trim()};
  if(c.auto.max<=c.auto.min)c.auto.max=c.auto.min+1;
  c.todoPerm={on:ck('e_todo')};
  c.priv=ck('e_priv');
  if(typeof c.avatar!=='string')c.avatar='';
  return c;
}

/* ---------- 隐私角色：密码 ---------- */
const hasLockPw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.pw));return !!(m&&m.salt)}catch(e){return false}};
const hasPrivPwRaw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.priv));return !!(m&&m.salt)}catch(e){return false}};
const hasAnyPrivPw=()=>hasLockPw()||hasPrivPwRaw();
async function verifyPriv(pw){
  let meta=null;try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(meta&&meta.salt){
    try{const k=await deriveKey(pw,new Uint8Array(meta.salt));if(await decVal(k,meta.check)==='ok')return true}catch(e){}
  }
  let pm=null;try{pm=JSON.parse(localStorage.getItem(LS.priv))}catch(e){}
  if(pm&&pm.salt){
    try{const k=await deriveKey(pw,new Uint8Array(pm.salt));if(await decVal(k,pm.check)==='ok')return true}catch(e){}
  }
  return false;
}
function openPriv(id){
  showSheet('<div class="ttl">🔒 需要密码</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 10px">这是私密角色，输入密码才能进入对话。</p>'+
  '<input id="ppw" type="password" placeholder="密码" autocomplete="off">'+
  '<p id="pperr" class="dim" style="font-size:12px;color:var(--warn);min-height:18px;margin:6px 0 0"></p>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="tryPriv(\''+id+'\')">进入</button>'+
  '<button class="ghost col" onclick="closeSheet()">取消</button></div>');
  setTimeout(()=>{
    const el=document.getElementById('ppw');
    if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')tryPriv(id)})}
  },80);
}
async function tryPriv(id){
  const el=document.getElementById('ppw');
  const err=document.getElementById('pperr');
  const pw=el?el.value:'';
  if(!pw){if(err)err.textContent='请输入密码';return}
  if(!window.crypto||!crypto.subtle){if(err)err.textContent='当前环境不支持密码校验，请用 Chrome/Edge 打开';return}
  if(!hasAnyPrivPw()){if(err)err.textContent='还没设置任何密码，先去「设置 → 隐私角色」设一个';return}
  let ok=false;
  try{ok=await verifyPriv(pw)}catch(e){ok=false}
  if(!ok){if(err)err.textContent='密码不对';return}
  closeSheet();
  loadChar(id);go('chat');
  toast('已进入私密对话');
}
async function setPrivPw(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 打开，或放到 https 网站里。');
  const el=document.getElementById('priv_pw');
  const pw=el?el.value:'';
  if(!pw)return alert('先输入隐私密码');
  if(pw.length<4)return alert('密码至少 4 位');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    localStorage.setItem(LS.priv,JSON.stringify({salt:Array.from(salt),check:check}));
    toast('隐私密码已保存');
    renderCfg();
  }catch(e){alert('保存失败：'+e.message)}
}
function clearPrivPw(){
  if(!confirm('清除隐私密码？（之后只能用应用锁密码进入隐私角色）'))return;
  localStorage.removeItem(LS.priv);
  toast('已清除');
  renderCfg();
}

async function pickImage(input){

  if(!f)return;
  if(!curChar())return toast('先选个角色再发图');
  toast('处理图片…');
  try{

    $('#picked').classList.add('on');

/* 压缩图片：最长边限制到 max 像素，转 jpeg，避免把存储撑爆 */
function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return rej(new Error('图片尺寸异常'));
        const s=Math.min(1,max/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        let url=cv.toDataURL('image/jpeg',q);
        if(url.length>420000)url=cv.toDataURL('image/jpeg',.5);
        res(url);
      };
      img.onerror=()=>rej(new Error('这不是有效的图片'));
      img.src=String(rd.result);
    };
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsDataURL(file);
  });
}

  await groupRun(g,'kick');

/* 群聊的「停不下来」保险：
   1) 一次触发最多 maxAI 条角色消息
   2) 最多来回 maxRound 轮
   3) 只有 reply='both' 的角色才接别人的话，而且每次接话有 chain 概率
   4) 不会马上自己接自己 */
async function groupRun(g,trigger){
  if(groupBusy)return;
  groupBusy=true;
  renderToolPane();
  const chain=(typeof g.chain==='number')?g.chain:GRP_CHAIN_DEF;
  const maxAI=Math.max(1,Math.min(20,Number(g.maxAI)||GRP_MAXAI_DEF));
  const maxRound=Math.max(1,Math.min(6,Number(g.maxRound)||GRP_MAXROUND_DEF));
  let total=0;
  try{
    for(let round=1;round<=maxRound;round++){
      const roster=g.members.filter(m=>round===1?true:(m.reply==='both'));
      for(let i=roster.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=roster[i];roster[i]=roster[j];roster[j]=t}
      let spoke=false;
      for(const m of roster){
        if(total>=maxAI)break;
        const c=charOf(m.cid);if(!c)continue;
        const arr=gmsgsOf(g.id);
        const last=arr[arr.length-1];
        if(last&&last.role==='char'&&last.cid===m.cid)continue;
        if(round>1&&Math.random()>chain)continue;
        const out=await groupGenerate(g,c);
        if(!out)continue;
        const a2=gmsgsOf(g.id);
        a2.push({role:'char',cid:c.id,content:out,t:Date.now()});
        saveGmsgs(g.id,a2);
        total++;spoke=true;
        renderToolPane();scrollGroupDown();
      }
      if(!spoke)break;
    }
    if(total>=maxAI)toast('本轮发言到上限了，先歇一歇（防刷屏）');
  }catch(e){
    toast('群聊出错：'+((e&&e.message)||e));
  }finally{
    groupBusy=false;
    renderToolPane();scrollGroupDown();
    scheduleGroupAuto(false);
  }
}
/* 让某个角色在群里说一句 */
async function groupGenerate(g,c){
  const arr=gmsgsOf(g.id).slice(-24);
  const nm=id=>{const x=charOf(id);return x?x.name:'某人'};
  const me=(cfg.userName||'她');
  const others=g.members.filter(m=>m.cid!==c.id).map(m=>nm(m.cid)).filter(Boolean);
  const sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  if(c.examples)sys.push('【对话示例】'+c.examples);
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');
  const hist=arr.map(m=>({role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}));
  const ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  ctx.push({role:'user',content:'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  const tp=thinkParams(c);
  let out='';
  try{
    out=String(await callAPI(ctx,{stream:false,model:modelOf(c),temp:tp.temp,maxtok:Math.min(400,tp.maxtok||400)})||'').trim();
  }catch(e){return ''}
  const names=[c.name].concat(g.members.map(m=>nm(m.cid)));
  for(const n of names){
    if(!n)continue;
    if(out.indexOf(n+'：')===0)out=out.slice((n+'：').length).trim();
    if(out.indexOf(n+':')===0)out=out.slice((n+':').length).trim();
  }
  out=out.replace(/^["'“”]+|["'“”]+$/g,'').trim();
  if(out.length>500)out=out.slice(0,500);
  return out;
}
/* 群里的自动发消息 */
function groupAutoEligible(g,m){return !!(cfg&&cfg.key&&m&&m.auto&&charOf(m.cid))}
function groupAutoRange(g){const mi=Math.max(1,Number(g.autoMin)||15),ma=Math.max(mi+1,Number(g.autoMax)||60);return {mi:mi,ma:ma}}
function scheduleGroupAuto(force){
  if(!chars||!chars.length){if(groupTick){clearInterval(groupTick);groupTick=null}return}
  groupsAll().forEach(g=>{
    (g.members||[]).forEach(m=>{
      const k=g.id+'|'+m.cid;
      if(!groupAutoEligible(g,m)){delete gAutoMap[k];return}
      const r=groupAutoRange(g);
      const cur=gAutoMap[k];
      if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
      gAutoMap[k]={at:Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*60000,mi:r.mi,ma:r.ma};
    });
  });
  const live=Object.keys(gAutoMap).length;
  if(live&&!groupTick)groupTick=setInterval(checkGroupAuto,20000);
  if(!live&&groupTick){clearInterval(groupTick);groupTick=null}
}
async function checkGroupAuto(){
  if(groupBusy||busy||!cfg||!cfg.key)return;
  const now=Date.now();
  for(const g of groupsAll()){
    for(const m of g.members||[]){
      const k=g.id+'|'+m.cid;
      const rec=gAutoMap[k];
      if(!rec||rec.at>now)continue;
      const r=groupAutoRange(g);
      gAutoMap[k].at=Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*60000;
      await groupAutoSpeak(g,m);
      return;                     /* 一次只发一条，绝不批量刷屏 */
    }
  }
}
async function groupAutoSpeak(g,m){
  const c=charOf(m.cid);if(!c)return;
  if(groupBusy)return;
  groupBusy=true;
  try{
    const out=await groupGenerate(g,c);
    if(!out)return;
    const arr=gmsgsOf(g.id);
    arr.push({role:'char',cid:c.id,content:out,t:Date.now()});
    saveGmsgs(g.id,arr);
    const watching=(groupOpenId===g.id&&view==='tools'&&toolTab==='group'&&!document.hidden);
    if(watching){renderToolPane();scrollGroupDown();toast((c.emoji||'')+' '+c.name+'：'+out.slice(0,22));}
    else{markUnread(c.id);toast((c.emoji||'')+' '+c.name+' 在《'+g.name+'》里发了一条');}
  }catch(e){}finally{
    groupBusy=false;
    if(view==='tools'&&toolTab==='group'){renderToolPane();scrollGroupDown()}
  }
}

function saveGroupSettings(id){
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  const v=i=>{const el=document.getElementById(i);return el?el.value:''};
  const ck=i=>{const el=document.getElementById(i);return !!(el&&el.checked)};
  g.name=(v('ge_name').trim()||g.name);
  (g.members||[]).forEach((m,i)=>{
    const sel=document.getElementById('gr_'+i);
    if(sel)m.reply=(sel.value==='both')?'both':'user';
    m.auto=ck('ga_'+i);
  });
  chars.forEach(c=>{if(ck('gadd_'+c.id)&&!memberOf(g,c.id))g.members.push({cid:c.id,reply:'user',auto:false})});
  g.chain=Math.min(1,Math.max(0,(Number(v('ge_chain'))||60)/100));
  g.maxAI=Math.min(20,Math.max(1,Math.round(Number(v('ge_maxai'))||GRP_MAXAI_DEF)));
  g.maxRound=Math.min(6,Math.max(1,Math.round(Number(v('ge_round'))||GRP_MAXROUND_DEF)));
  g.autoMin=Math.max(1,Math.round(Number(v('ge_amin'))||15));
  g.autoMax=Math.max(g.autoMin+1,Math.round(Number(v('ge_amax'))||60));
  saveGroups(gs);
  closeSheet();
  scheduleGroupAuto(true);
  if(view==='tools'){toolTab='group';renderTools()}
  toast('群设置已保存');
}
function kickMember(id,i){
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  g.members.splice(i,1);
  saveGroups(gs);scheduleGroupAuto(true);
  editGroupSheet(id);
}
function delGroup(id){
  if(!confirm('删掉这个群？群里的聊天记录也会一起清掉（角色本人的聊天和记忆不受影响）'))return;
  saveGroups(groupsAll().filter(g=>g.id!==id));
  removeKey(LS.gmsg(id));
  if(groupOpenId===id)groupOpenId=null;
  if(view==='tools')renderTools();
  toast('群已删除');
}
