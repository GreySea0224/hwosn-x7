/* ---------- 隐私：应用锁密码 ---------- */
/* 加密前先把本地明文数据收进 store。 */
function collectPlainStore(){
  if(store)return store;
  store={};
  for(const k of allDataKeys()){
    const raw=localStorage.getItem(k);
    if(raw==null)continue;
    try{store[k]=JSON.parse(raw)}catch(e){}
  }
  return store;
}
/* 把本地存储里的数据加密后写回。 */
async function encryptStoreToLocal(key){
  const entries={};
  for(const k of Object.keys(store)){entries[k]=await encVal(key,JSON.stringify(store[k]))}
  for(const k of Object.keys(entries)){localStorage.setItem(k,entries[k])}
}
/* 把 IndexedDB 里的数据加密后写回。 */
async function reencryptIndexedDb(key,oldKey){
  for(const st of ['arc','rawlog']){
    let ks=[];try{ks=await idbKeys(st)}catch(e){}
    for(const k of ks){
      let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
      let val;
      if(oldKey){try{val=JSON.parse(await decVal(oldKey,raw))}catch(e){continue}}
      else val=raw;
      try{await idbPutRaw(k,await encVal(key,JSON.stringify(val)),st)}catch(e){}
    }
  }
}
async function setPassword(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 直接打开这个文件，或放到 https 网站里。');
  const pw=$('#s_pw').value;
  if(!pw)return alert('先输入密码');
  if(pw.length<6)return alert('密码至少 6 位');

  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    const oldKey=cryptKey;
    collectPlainStore();
    await encryptStoreToLocal(key);
    await reencryptIndexedDb(key,oldKey);
    cryptKey=key;
    localStorage.setItem(LS.pw,JSON.stringify({salt:Array.from(salt),check:check}));
    toast(oldKey?'密码已修改':'密码已设置，数据已加密');
    renderCfg();
  }catch(e){alert('设置失败：'+e.message)}
}
async function removePassword(){
  if(!cryptKey)return;
  if(!confirm('移除密码？聊天和记忆会变回明文存储（任何拿到设备的人都能看到）'))return;
  try{
    for(const k of Object.keys(store)){localStorage.setItem(k,JSON.stringify(store[k]))}
    for(const st of ['arc','rawlog']){
      let ks=[];try{ks=await idbKeys(st)}catch(e){}
      for(const k of ks){
        let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
        try{await idbPutRaw(k,JSON.parse(await decVal(cryptKey,raw)),st)}catch(e){}
      }
    }
    localStorage.removeItem(LS.pw);
    cryptKey=null;store=null;
    toast('密码已移除');
    renderCfg();
  }catch(e){alert('移除失败：'+e.message)}
}

/* ---------- 备份 ---------- */
const BK='wh_backup_handle';
const bkEveryMin=()=>{const n=+(cfg&&cfg.bkEvery);return (isFinite(n)&&n>0)?n:0;};   /* 0=实时 */
const bkWatchMs=()=>{const m=bkEveryMin();return m?m*MS_PER_MIN:600000;};
async function bkPermState(){
  if(!backupHandle)return 'none';
  try{return await backupHandle.queryPermission({mode:'readwrite'})}catch(e){return 'prompt'}
}
async function ensureBkPerm(){
  try{
    if(await bkPermState()==='granted')return true;
    const p=await backupHandle.requestPermission({mode:'readwrite'});
    if(p==='granted'){bkNeed=false;return true}
  }catch(e){}
  bkNeed=true;return false;
}
/* 浏览器规定「重新授权」必须由用户点击触发：挂一个只生效一次的监听，你下次点屏幕就自动补授权 */
function armBkReauth(){
  if(bkArmed)return;bkArmed=true;
  const h=async()=>{
    document.removeEventListener('pointerdown',h,true);bkArmed=false;
    if(bkNeed&&backupHandle&&await ensureBkPerm()){await autoBackup(true);if(view==='cfg')renderCfg()}
  };
  document.addEventListener('pointerdown',h,true);
}
function startBkTick(){

  },30000);
}
function stopBkTick(){if(bkTick){clearInterval(bkTick);bkTick=null}}

  return '🟢 自动备份已开启 · '+mode+' · 上次：'+ago(lastBackup)+(bkErr?(' · 上次出错：'+bkErr):'');
}

async function backupPayload(){
  const d={v:8,at:Date.now(),cfg:cfgSafe(),chars:chars,messages:{},memories:{},todos:{},gmems:{},arcs:load(LS.arcs,[]),arcData:{},
    groups:groupsAll(),gmsgs:{},stickers:load('wh_stickers',[]),stickerCats:load('wh_sticker_cats',[]),
    notes:{},diary:{},favs:{},arts:{},summarks:{},rawMarks:{},rawLogs:{},world:load('wh_world',[])};
  chars.forEach(c=>{d.messages[c.id]=load(LS.msg(c.id),[]);d.memories[c.id]=load(LS.mem(c.id),null);d.todos[c.id]=todosOf(c.id);d.gmems[c.id]=gmemOf(c.id);

    d.favs[c.id]=load('wh_p5_fav_'+c.id,[]);
    d.arts[c.id]=load('wh_p5_art_'+c.id,[]);
    d.summarks[c.id]=load(LS.summark(c.id),null);
    d.rawMarks[c.id]=load(LS.rawMark(c.id),0);
  });
  /* 原文日志存在 IndexedDB 里（不在 localStorage），单独读一遍；读不到就当空 */
  for(const c of chars){try{d.rawLogs[c.id]=await rawGet(c.id)||''}catch(e){d.rawLogs[c.id]=''}}
  d.arcs.forEach(a=>{d.arcData[a.id]=getArc(a.id)});
  d.groups.forEach(g=>{d.gmsgs[g.id]=gmsgsOf(g.id)});
  /* ↓ 补丁5-C：备份里真的带上「演绎」的记录（必须在打包字符串之前收集，否则不会进文件） */

    (d.acts||[]).forEach(function(a){d.actMsgs[a.id]=window.actMsgs(a.id)});

function scheduleBackup(){
  if(!backupHandle)return;
  if(bkEveryMin()>0){startBkTick();return;}   /* 定时模式：不每次改动都写 */
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{bkTimer=null;autoBackup()},2500);
}
async function autoBackup(force){
  if(!backupHandle)return false;
  clearTimeout(bkTimer);bkTimer=null;
  try{
    let p='prompt';
    try{p=await backupHandle.queryPermission({mode:'readwrite'})}catch(e){p='prompt'}
    if(p!=='granted'){
      if(!force){bkNeed=true;armBkReauth();return false}   /* 先记下，等你点屏幕时补授权 */
      if(!(await ensureBkPerm())){bkErr='没有写文件权限';return false}
    }
    const payload=await backupPayload();
    const w=await backupHandle.createWritable();
    await w.write(payload.str);
    await w.close();
    lastBackup=Date.now();bkErr='';bkNeed=false;
    save('wh_lastBackup',lastBackup);
    return true;
  }catch(e){
    bkErr=(e&&e.message)||'写入失败';
    console.warn('自动备份失败',e);
    return false;
  }
}

async function unlock(){
  let meta=null;
  try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(!meta||!meta.salt){if(window._unlockGo)window._unlockGo();return}
  const pw=$('#pw').value;
  const errEl=$('#pwerr');  /* 同一个错误提示只查一次 */
  if(!pw){errEl.textContent='输入密码';return}
  try{
    const salt=new Uint8Array(meta.salt);
    const key=await deriveKey(pw,salt);
    const ok=await decVal(key,meta.check);
    if(ok!=='ok')throw new Error('wrong');
    cryptKey=key;
    await decryptAll();
    $('#lock').style.display='none';
    errEl.textContent='';
    if(window._unlockGo)window._unlockGo();
  }catch(e){errEl.textContent='密码不对';}
}

/* ================= 补丁：自动总结报错可见 + 设置保存加固 ================= */
/* 1) 底层请求：把接口的真实报错原样抛出来（原来被吞掉了，所以只看到“模型不对”） */
async function rawChat(messages,opt){
  opt=opt||{};
  const url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  const body={model:(opt.model||cfg.model),messages:messages,stream:!!opt.stream};
  if(opt.temp!=null)body.temperature=opt.temp;
  if(opt.maxtok)body[opt.tokName||'max_tokens']=opt.maxtok;
  if(opt.stream)body.stream_options={include_usage:true};
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  if(!res.ok){let t='';try{t=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t).replace(/\s+/g,' ').slice(0,200))}
  if(!opt.stream){
    const j=await res.json();
    const m=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
    return String(m.content||'');
  }
  let out='';
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const ls=buf.split('\n');buf=ls.pop();
    for(const raw of ls){
      const line=raw.trim();if(!line||line.indexOf('data:')!==0)continue;
      const d=line.slice(5).trim();if(d==='[DONE]')return out;
      try{const j=JSON.parse(d);const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)out+=c}catch(e){}
    }
  }
  return out;
}
/* 2) 给「非流式」调用加一层自动重试：换模型 → 去掉参数 → 换 max_completion_tokens → 改流式 */
/*    （聊天用的流式请求完全不动；带 tools 的请求原样走，避免破坏工具调用） */
/* 3) 重写总结：失败时把真实原因显示出来，不再只说“检查模型” */
/* 自动总结：模型没按格式回时，把原文存进长期总结。 */
function storeSummaryFallback(M,raw){
  if((cfg.sumWrite||'append')==='replace')M.summaries=[];
  M.summaries=M.summaries||[];
  M.summaries.push({t:Date.now(),text:raw.slice(0,2000)});
  return 1;
}
runSummary=async function(slice,silent,targetId){
  const c=chars.find(x=>x.id===(targetId||curId))||curChar();
  if(!c)return 0;
  const isCur=(!targetId||targetId===curId);
  const M=isCur?mem:(memCtx.id===targetId?memCtx.obj:Object.assign(EMPTY_MEM(),load(LS.mem(targetId),null)||{}));
  try{
    const prev=(M.summaries&&M.summaries.length)?M.summaries[M.summaries.length-1].text:'';
    const res=await callAPI([{role:'user',content:buildSummaryPrompt(slice,prev)}],{model:modelOf(c),temp:.3,maxtok:1600});
    const raw=String(res||'').trim();
    if(!raw){if(!silent)alert('模型没返回内容（可能被限流，或这个模型不支持长输出）');return 0}
    let hit=applySummary(M,parseSummary(raw));
    let fallback=false;
    if(!hit){
      hit=storeSummaryFallback(M,raw);fallback=true;
    }
    if(isCur)saveMem();else save(LS.mem(targetId),M);
    refreshMem();
    if(!silent)alert(fallback?'模型没按格式回，已把原文存进「长期聊天记录总结」，去记忆里整理一下':'已写进记忆 '+hit+' 条（原始聊天记录没有删）');
    return hit;
  }catch(e){
    const m=String((e&&e.message)||e).slice(0,200);
    if(!silent)alert('总结失败，接口原话：\n'+m+'\n\n怎么排查：\n· 提到 model / 不存在 → 模型名写错了，看「设置 → 默认模型」，也检查角色里单独指定的模型\n· 401 / 403 → Key 不对\n· 429 → 额度或频率用完\n· 400 参数 → 已经把 temperature / max_tokens 去掉重试过了，还是不行就换个模型');
    else toast('自动总结失败：'+m.slice(0,90));
    console.warn('总结失败',e);
    return 0;
  }
};

/* 2) 换一套「提炼型」的总结提示词，不再流水账 */
buildSummaryPrompt=function(slice,prev){

  '核心：一句话说明角色是谁、和用户什么关系（40字内）\n'+
  '时间线：只记关键事件的先后顺序，用；分隔，每条25字内，写成「谁做了什么→结果」。挑最重要的，最多 8 条。绝对不要抄对话原话，不要写心情、表情、对话细节。\n'+
  '总结：一段连贯的话，100~180 字，让不认识你们的人也能看懂：这段时间用户和角色主要在做什么、关系有没有变化。要像在讲故事，不要逐条罗列，不要出现「她说」「他说」这种对话原文。\n'+

  '习惯：角色和用户表现出的性格、行为习惯，每条20字内，最多5条\n\n'+
  '【最重要的一条】你是「提炼」不是「誊写」：\n'+

  '· 不要加序号、星号、括号、多余解释。\n\n'+

  '现在开始，对话如下：\n'+slice;
};

/* 群聊：按轮次和优先级挑出本轮可能发言的人。 */
function groupPrioValue(m){
  if(!m||m.prio==null||m.prio==='')return 50;
  var p=Number(m.prio);
  return isFinite(p)?p:50;
}
function groupRoundRoster(g,round,prioFn){
  var pf=typeof prioFn==='function'?prioFn:groupPrioValue;
  var roster=(g.members||[]).filter(function(m){return round===1?true:(m.reply==='both')}).slice();
  roster.sort(function(a,b){return pf(a)-pf(b)});
  return roster;
}
/* 群聊：保存一条角色生成的群消息和群记忆。 */
function saveGroupGeneratedMsg(g,c,out){
  var mid=out.id||uid();
  var a2=gmsgsOf(g.id);
  a2.push({id:mid,role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok,ptok:out.ptok,search:out.search});
  saveGmsgs(g.id,a2);
  gmemAdd(c.id,g.id,g.name,out.text,true,mid);
}
/* 群聊：跑一轮发言。返回这一轮是否有人发言、发言了几条。 */
async function runGroupRound(g,round,chain,maxAI,total,prioFn){
  var roster=groupRoundRoster(g,round,prioFn);
  var spoke=false,speaks=0;
  for(var ri=0;ri<roster.length;ri++){
    var m=roster[ri];
    if(total+speaks>=maxAI)break;
    var c=charOf(m.cid);if(!c)continue;
    var arr=gmsgsOf(g.id),last=arr[arr.length-1];
    if(last&&last.role==='char'&&last.cid===m.cid)continue;
    if(round>1&&Math.random()>chain)continue;
    var out=await groupGenerate(g,c);
    if(!out||!out.text)continue;
    saveGroupGeneratedMsg(g,c,out);
    speaks++;spoke=true;
    renderToolPane();scrollGroupDown();
  }
  return {spoke:spoke,speaks:speaks};
}
groupAutoSpeak=async function(g,m){
  const c=charOf(m.cid);if(!c)return;
  if(groupBusy)return;
  groupBusy=true;
  try{
    const out=await groupGenerate(g,c,true);
    if(!out||!out.text)return;
    const arr=gmsgsOf(g.id);
    arr.push({role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok,ptok:out.ptok,search:out.search});
    saveGmsgs(g.id,arr);
    gmemAdd(c.id,g.id,g.name,out.text,true);
    const watching=(groupOpenId===g.id&&view==='tools'&&toolTab==='group'&&!document.hidden);
    if(watching){renderToolPane();scrollGroupDown();toast((c.emoji||'')+' '+c.name+'：'+out.text.slice(0,22));}
    else{markUnread(c.id);toast((c.emoji||'')+' '+c.name+' 在《'+g.name+'》里发了一条');}
  }catch(e){}finally{
    groupBusy=false;
    if(view==='tools'&&toolTab==='group'){renderToolPane();scrollGroupDown()}
  }
};

/* 联网搜索：Tavily。 */
async function searchTavily(q,n,w){
  const r=await fetch(String(w.base||'https://api.tavily.com').replace(/\/+$/,'')+'/search',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:w.key,query:q,max_results:n,search_depth:'basic'})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status+' '+String(j.detail||j.message||'').slice(0,120));
  return (j.results||[]).map(x=>({title:String(x.title||''),url:String(x.url||''),snippet:String(x.content||'')}));
}
/* 联网搜索：Serper。 */
async function searchSerper(q,n,w){
  const r=await fetch(String(w.base||'https://google.serper.dev').replace(/\/+$/,'')+'/search',
    {method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':w.key||''},body:JSON.stringify({q:q,gl:'cn',hl:'zh-cn',num:n})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status+' '+String(j.message||'').slice(0,120));
  return (j.organic||[]).map(x=>({title:String(x.title||''),url:String(x.link||''),snippet:String(x.snippet||'')}));
}
/* 联网搜索：Bing。 */
async function searchBing(q,n,w){
  const r=await fetch('https://api.bing.microsoft.com/v7.0/search?count='+n+'&mkt=zh-CN&q='+encodeURIComponent(q),
    {headers:{'Ocp-Apim-Subscription-Key':w.key||''}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status);
  return (((j.webPages||{}).value)||[]).map(x=>({title:String(x.name||''),url:String(x.url||''),snippet:String(x.snippet||'')}));
}
/* 联网搜索：自定义接口。 */
async function searchCustom(q,w){
  let u=String(w.base||'');
  if(!u)throw new Error('还没填自定义接口地址');
  if(u.indexOf('{q}')<0)u+=(u.indexOf('?')<0?'?':'&')+'q={q}';
  u=u.replace('{q}',encodeURIComponent(q));
  const r=await fetch(u,{headers:w.key?{'Authorization':'Bearer '+w.key}:{}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const pick=arr=>arr.map(x=>({title:String(x.title||x.name||x.headline||''),url:String(x.url||x.link||x.href||''),snippet:String(x.snippet||x.content||x.description||x.text||'')}));
  if(Array.isArray(j))return pick(j);
  for(const k of ['results','organic','items','data','list','webPages','hits'])if(Array.isArray(j[k]))return pick(j[k]);
  return [];
}
/* 联网搜索：维基百科（免 Key，浏览器直接可用）。 */
async function searchWikipedia(q,n,w){
  const lang=String(w.lang||'zh').replace(/[^a-z-]/gi,'')||'zh';
  const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit='+n+'&srsearch='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (((j.query||{}).search)||[]).map(x=>({title:String(x.title||''),url:'https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(x.title||''),snippet:String(x.snippet||'').replace(/<[^>]+>/g,'')}));
}
async function webSearch(q){
  const w=webCfg();
  const n=Math.max(1,Math.min(10,Number(w.count)||5));
  const eng=w.engine||'wiki';
  if(eng==='tavily')return searchTavily(q,n,w);
  if(eng==='serper')return searchSerper(q,n,w);
  if(eng==='bing')return searchBing(q,n,w);
  if(eng==='custom')return searchCustom(q,w);
  return searchWikipedia(q,n,w);
}
function fmtSearchBlock(q,list){
  var body='【联网搜索结果】下面是刚刚从网上查到的真实资料，请优先依据它们回答；资料里没提到的就直说不知道，不要编造：\n搜索词：'+q+'\n'+
  list.map((x,i)=>(i+1)+'. '+x.title+'\n'+String(x.snippet||'').replace(/\s+/g,' ').slice(0,400)+'\n（来源：'+x.url+'）').join('\n');
  /* ↓ 补丁4-A：把「现在的时间」钉成真实时间，写在最前面 */
  return '【现在的时间】现在是 '+window.P4.now()+'。检索到的资料请相对这个时间判断新旧，不要因为聊天记录或记忆档案里出现的旧日期，就把现在当成那个时间。\n'+body;
}
async function searchForChar(c,conv,onStatus){
  const st=onStatus||function(){};
  if(!cfg.key||!conv||!conv.trim())return null;
  st('🔎 正在想：要不要上网查一下…');
  let q='';
  try{
    /* ↓ 补丁4-A：把「现在」的真实时间告诉它，免得它拿聊天记录里的旧日期去搜 */
    const nowStr=(window.P4&&typeof P4.now==='function')?P4.now():nowText();
    const r=await callAPI([
      {role:'system',content:'你是联网检索助手。现在的真实时间是 '+nowStr+'。看下面这段对话，判断是否需要联网查资料（新闻、天气、赛事、价格、时事、人物近况、不确定的事实等才需要）。需要就只输出一行：SEARCH: 关键词（中文，尽量精确；只有确实涉及时间时才写年月，而且必须用「现在」的年份月份，绝不能用对话或记忆里出现的旧日期）；不需要就只输出：NO'},
      {role:'user',content:String(conv).slice(-1200)}
    ],{stream:false,temp:0,maxtok:40,model:modelOf(c)});
    const m=String(r||'').match(/SEARCH\s*[:：]\s*([^\n\r]+)/i);
    if(m)q=m[1].trim().replace(/^["'“”]+|["'“”]+$/g,'').slice(0,80);
  }catch(e){st('');return null}
  if(!q){st('');return null}
  st('🔎 正在联网搜索：<b>'+esc(q)+'</b> …');
  let list=[];
  try{list=await webSearch(q)}
  catch(e){st('⚠️ 搜索失败：'+esc(String((e&&e.message)||e).slice(0,90)));return null}
  if(!list.length){st('🌐 搜了「'+esc(q)+'」，没有找到有用结果');return null}
  st('🌐 已联网搜索：<b>'+esc(q)+'</b> · 找到 '+list.length+' 条资料');
  return {q:q,list:list,block:fmtSearchBlock(q,list)};
}
function showSearchRes(s){
  if(!s||!s.list)return;
  showSheet('<div class="ttl">🌐 联网搜索</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">搜索词：'+esc(s.q)+' · 共 '+s.list.length+' 条</p>'+
  s.list.map((x,i)=>'<div class="arcitem"><div class="arcname"><b>'+(i+1)+'. '+esc(x.title)+'</b></div>'+
  '<div class="arcmeta">'+esc(String(x.snippet||'').slice(0,300))+'</div>'+
  '<div class="row arcfoot"><a class="ghost iconbtn" style="text-decoration:none" href="'+safeUrl(x.url)+'" target="_blank" rel="noopener">打开来源</a></div></div>').join('')+
  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关闭</button></div>');
}
let pendingSearch='',pendingSM=null;
async function doSearchStep(c){
  pendingSearch='';pendingSM=null;
  const box=$('#msgs');if(!box||!cfg.key)return;
  const st=document.createElement('div');
  st.className='tchip';
  st.innerHTML=tchipOuterHTML('🔎','正在想：要不要上网查一下…');
  /* 搜索过程中它一直改这行字：开头那个表情搬到左边小圆里，剩下的照原样显示 */
  const setTxt=function(t){
    try{
      const s=String(t||'').trim();
      if(!s){if(st.parentNode)st.remove();return}
      if(!st.parentNode)box.appendChild(st);
      const p=tchipParts(s);
      st.innerHTML=tchipOuterHTML(p.ic||'🔎',p.tx);
    }catch(e){}
    try{scrollDown()}catch(e){}
  };
  box.appendChild(st);scrollDown();
  const conv=(msgs||[]).slice(-6).map(m=>(m.role==='user'?'她':c.name)+'：'+(m.content||'')).join('\n');
  let r=null;
  try{r=await searchForChar(c,conv,setTxt)}catch(e){}
  if(!r){if(st.parentNode)st.remove();return}
  pendingSearch=r.block;
  pendingSM={q:r.q,list:r.list};
  st.className='tchip tap';
  st.innerHTML=tchipOuterHTML('🌐','联网搜索：<b>'+esc(r.q)+'</b> · '+r.list.length+' 条资料（点这里看来源）');
  st.onclick=()=>showSearchRes(pendingSM);
  scrollDown();
}

}
function refreshWebCard(){

function setWebEngine(v){webCfg().engine=v;save(LS.cfg,cfg);refreshWebCard()}
function saveWebCfg(){

async function testWeb(){

  }catch(e){

<script>
/* ================================================================
   深蓝海域 · 补丁4-A（2026-09）  只做三件事：
   ① 群聊「上下文 Y tok」不再是空白
   ② 删除群消息时，角色们对这条消息的记忆一起清掉
   ③ 把「现在」钉死成真实时间：搜索 / 记忆档案里的旧日期（5月）不再被当成现在
   粘法：整段粘到文件最末尾（最后一行 </html> 的下面）。
   本段独立成 <script>，出问题也只影响这一段，原 app 不受影响。
   ================================================================ */
(function(){
var W=window, P4=(W.P4=W.P4||{});
P4.ver='4A';

/* ---------- 0. 时间小工具 ---------- */
function fmtT(t){
  var d=new Date(t),p=function(n){return (n<10?'0':'')+n};
  return p(d.getHours())+':'+p(d.getMinutes());
}
P4.today=function(){
  var d=new Date(),w='日一二三四五六'[d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w;
};
P4.now=function(){
  var t=(typeof fmtTime==='function')?fmtTime(Date.now()):fmtT(Date.now());
  return P4.today()+' '+t;
};

/* ---------- 1. 修 bug③：非流式请求也要把 usage 传出来 ---------- */
/* 补丁4-A 的请求参数拼装。 */
function buildP4Request(messages,opt){
  var url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  var body={model:(opt.model||cfg.model),messages:messages,stream:!!opt.stream};
  if(opt.temp!=null)body.temperature=opt.temp;
  if(opt.maxtok)body[opt.tokName||'max_tokens']=opt.maxtok;
  if(opt.stream)body.stream_options={include_usage:true};
  return {url:url,fopt:{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)}};
}
/* 处理补丁4-A 的非流式返回。 */
function handleP4JsonResponse(j,opt,raw){
  j=apiJsonGuard(j,raw);
  if(opt.onUsage&&j.usage)opt.onUsage(j.usage);
  var msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
  var rc=pickReasoning(msg);
  if(rc&&opt.onReasoning)opt.onReasoning(rc);
  return String(msg.content||'');
}
/* 创建补丁4-A 的流式返回解析器。 */
function createP4StreamParser(opt){
  var text='';
  var emit=function(line){
    var d=line.slice(5).trim();
    if(d==='[DONE]')return true;
    try{
      var o=JSON.parse(d);
      if(o.usage&&opt.onUsage)opt.onUsage(o.usage);
      var c=o.choices&&o.choices[0]&&o.choices[0].delta&&o.choices[0].delta.content;
      if(c)text+=c;
    }catch(e){}
    return false;
  };
  return {emit:emit,getOut:function(){return text}};
}
/* 读取补丁4-A 的流式返回，直到结束。 */
async function readP4StreamText(res,parser){
  if(!res.body){
    var all=await res.text();
    var as=all.split('\n');
    for(var x=0;x<as.length;x++){
      var lx=as[x].trim();
      if(lx.indexOf('data:')!==0)continue;
      if(parser.emit(lx))break;
    }
    return parser.getOut();
  }
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  for(;;){
    var r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop();
    for(var i=0;i<lines.length;i++){
      var line=lines[i].trim();
      if(!line||line.indexOf('data:')!==0)continue;
      if(parser.emit(line))return parser.getOut();
    }
  }
  return parser.getOut();
}
async function p4raw(messages,opt){
  opt=opt||{};
  var req=buildP4Request(messages,opt);
  var res=await fetch(req.url,req.fopt);
  if(!res.ok){var er='';try{er=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(er).replace(/\s+/g,' ').slice(0,200))}

  if(!opt.stream){
    var raw4='',j=null;              /* 先把原文读下来：服务器到底回了什么，一眼能看见 */
    try{raw4=await res.text()}catch(e){}
    try{j=raw4?JSON.parse(raw4):null}catch(e){}
    return handleP4JsonResponse(j,opt,raw4);
  }
  var parser=createP4StreamParser(opt);
  return readP4StreamText(res,parser);
}

/* 外面那层「自动重试」照旧，但改成用 p4raw（会回报 usage） */
window.p4raw=p4raw;   /* 挂到全局：合并后的 callAPI（在补丁6-A 那块）要用 */

/* ---------- 2. 修 bug①：删群消息 → 连角色的群聊记忆一起清 ---------- */
function p4same(x,m,gid){
  if(!x||x.gid!==gid)return false;
  if(m&&m.id&&x.mid&&x.mid===m.id)return true;                 /* 新消息：靠 id 精确配对 */
  var tx=String(x.tx||'').trim(), mc=String((m&&m.content)||'').trim();
  if(!tx||!mc||tx!==mc)return false;                            /* 旧消息：同群 + 内容相同 */
  if(!m.t||!x.t)return true;
  return Math.abs(Number(x.t)-Number(m.t))<300000;              /* 且时间接近（5 分钟内） */
}
P4.purgeGmem=function(gid,m){
  var ids={};
  chars.forEach(function(c){ids[c.id]=1});
  var g=findGroup(gid);
  if(g)(g.members||[]).forEach(function(x){ids[x.cid]=1});
  if(m&&m.role==='char'&&m.cid)ids[m.cid]=1;
  var cnt=0;
  Object.keys(ids).forEach(function(cid){
    var cur=gmemOf(cid);
    var left=cur.filter(function(x){return !p4same(x,m,gid)});
    if(left.length!==cur.length){cnt+=(cur.length-left.length);save(LS.gmem(cid),left)}
  });
  if(cnt)scheduleBackup();
  return cnt;
};

/* 以后每条群消息都带一个 id，记忆里也记下这个 id，删除时就能精准对应 */
gmemAdd=function(cid,gid,gname,text,self,mid){
  var arr=gmemOf(cid);
  arr.push({t:Date.now(),gid:gid,gn:gname,tx:String(text||'').slice(0,300),me:!!self,mid:mid||''});
  while(arr.length>120)arr.shift();
  save(LS.gmem(cid),arr);scheduleBackup();
};
delGmsg=function(i){
  var g=findGroup(groupOpenId);if(!g)return;
  var arr=gmsgsOf(g.id),n=Number(i);
  if(!(n>=0&&n<arr.length))return;
  var m=arr[n];
  if(!confirm('删除这条群消息？\n（会同时清掉所有角色对这条消息的记忆，它们以后就完全看不到它了）'))return;
  arr.splice(n,1);
  saveGmsgs(g.id,arr);
  var c=P4.purgeGmem(g.id,m);
  renderToolPane();scrollGroupDown();
  toast(c?('已删除这条消息，并清掉了 '+c+' 条相关记忆'):'已删除这条群消息');
};
clearGmsgs=function(){
  var g=findGroup(groupOpenId);if(!g)return;
  if(!confirm('清空《'+g.name+'》的全部聊天记录？\n（角色们对这个群的记忆也会一起清掉，只影响这个群，不动私聊）'))return;
  saveGmsgs(g.id,[]);
  var ids={};
  (g.members||[]).forEach(function(x){ids[x.cid]=1});
  chars.forEach(function(c){ids[c.id]=1});
  Object.keys(ids).forEach(function(cid){
    var cur=gmemOf(cid),left=cur.filter(function(x){return x.gid!==g.id});
    if(left.length!==cur.length)save(LS.gmem(cid),left);
  });
  scheduleBackup();
  renderToolPane();
  toast('已清空群消息 + 群聊记忆');
};



console.log('[深蓝海域] 补丁4-A 已加载');
})();
</script>
<script>
/* ================================================================
   深蓝海域 · 补丁4-B（2026-09）  群聊增强
   新增：①关系简介 ②发言顺序优先级 ③角色能看到多少条群聊记录
         ④角色能不能读「记忆」和「历史对话档案」 ⑤群里可用玩具的开关
   粘法：粘到文件最末尾（补丁4-A 那段后面），顺序无所谓。

(function(){
var W=window,P4=(W.P4=W.P4||{});
if(!P4.now)P4.now=function(){var d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]};

function prioOf(m){if(!m||m.prio==null||m.prio==='')return 50;var p=Number(m.prio);return isFinite(p)?p:50}
function histOf(g,m){
  var n=Number(m&&m.histN);if(isFinite(n)&&n>0)return Math.max(2,Math.min(200,Math.round(n)));
  var d=Number(g&&g.histN);if(isFinite(d)&&d>0)return Math.max(2,Math.min(200,Math.round(d)));

}

/* ---------- 1. 往「群设置」面板里塞新选项（不动原来的代码，只往后加） ---------- */
/* 群设置补丁：给每个成员补关系简介、优先级、记录条数和记忆开关。 */
function injectGroupMemberExtraFields(g){
  (g.members||[]).forEach(function(m,i){
    var box=document.getElementById('gs_'+i)||document.getElementById('ga_'+i);
    if(!box)return;
    var host=box.parentNode,ref=host.nextSibling,par=host.parentNode;

    wrap.innerHTML=
    '<label class="f">关系简介 / 定位（别的角色会看到，用来自我介绍）</label>'+
    '<textarea id="gel_'+i+'" style="min-height:56px" placeholder="比如：用户的毒舌损友，说话直接，喜欢抬杠">'+esc(m.rel||'')+'</textarea>'+
    '<div class="setrow" style="margin-top:8px"><span class="lbl">发言优先级（数字越小越先开口）</span><input id="gep_'+i+'" type="number" value="'+prioOf(m)+'"></div>'+
    '<div class="setrow" style="margin-top:8px"><span class="lbl">它在群里能看到的群聊记录条数（0 = 用群默认）</span><input id="geh_'+i+'" type="number" value="'+((Number(m.histN)>0)?Math.round(Number(m.histN)):0)+'"><span class="unit">条</span></div>'+
    '<label class="li" style="border:0;padding:2px 0"><input type="checkbox" id="gem_'+i+'" '+(m.mem?'checked':'')+' style="flex:0 0 auto;margin-top:3px"><span>允许它在群里读「记忆」和「历史对话档案」（不开就只用群里聊天 + 它自己的群记忆）</span></label>';
    while(wrap.firstChild)par.insertBefore(wrap.firstChild,ref);
  });
}
/* 群设置补丁：补“群聊记录条数 / 发言顺序 / 群里玩具”卡片。 */
function injectGroupExtraCard(g,sheet){
  var ch=document.getElementById('ge_chain');

  '<p class="dim" style="font-size:12px;margin:8px 0 0">发言顺序＝每个人自己的「发言优先级」，数字越小越先开口（默认 50）。想让谁第一个说话，把它的优先级改成 1。</p>'+
  '<label class="li" style="border:0;padding:8px 0"><input type="checkbox" id="ge_toys" '+(g.toys?'checked':'')+' style="flex:0 0 auto;margin-top:3px"><span>允许角色在群里用互动玩具（掷骰子 / 抽签 / 报时 / 记心情 / 留便条 / 写日记 / 好感度）</span></label>'+
  '<p class="dim" style="font-size:12px;margin:0">开了之后每条群消息会多花一点点 token；默认关。</p>';

groupSetSheet=function(id){

    window.auth('进入这个隐私群聊的设置前要输一次密码。',function(){

/* ---------- 2. 保存：先读下新字段，再走原来的保存流程，最后写回去 ---------- */
saveGroupSet=function(id){
  /* ↓ 补丁12-A：取消隐私群聊前要输一次密码 */
  var privEl=document.getElementById('ge_priv');
  var want=privEl?!!privEl.checked:null;
  var gp=window.findGroupP(id);
  /* 注意：这里不能再看 gOpen[id]——因为「打开设置」本身就已经把它标成已解锁了，
     那样会导致「取消隐私」永远不弹密码。只要原本是隐私群、现在要取消，就必须验密码。 */
  var cancelPriv=!!(want===false&&gp&&gp.priv);
  if(cancelPriv&&privEl)privEl.checked=true;   /* 先按「保持隐私」把其它设置存下来 */

  /* ---- 补丁4-B：先把新增的字段读下来 ---- */
  var pick=function(i){var el=document.getElementById(i);return el?el.value:''};
  var chk=function(i){var el=document.getElementById(i);return !!(el&&el.checked)};
  var g0=findGroup(id);
  var newMem=(g0&&g0.members||[]).map(function(m,i){
    return {rel:(document.getElementById('gel_'+i)?pick('gel_'+i).trim():null),
            prio:(document.getElementById('gep_'+i)?pick('gep_'+i):null),
            hist:(document.getElementById('geh_'+i)?pick('geh_'+i):null),
            mem:(document.getElementById('gem_'+i)?chk('gem_'+i):null)};
  });
  var histn=document.getElementById('ge_histn')?pick('ge_histn'):null;
  var toys=document.getElementById('ge_toys')?chk('ge_toys'):null;

  /* ---- 原来的保存逻辑 ---- */
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  const v=i=>{const el=document.getElementById(i);return el?el.value:''};
  const ck=i=>{const el=document.getElementById(i);return !!(el&&el.checked)};
  const wasPriv=!!g.priv;
  g.name=(v('ge_name').trim()||g.name);
  g.priv=ck('ge_priv');
  g.syncN=Math.max(1,Math.min(60,Math.round(Number(v('ge_syncn'))||20)));
  (g.members||[]).forEach((m,i)=>{
    const sel=document.getElementById('gr_'+i);
    if(sel)m.reply=(sel.value==='both')?'both':'user';
    m.auto=ck('ga_'+i);
    m.sync=ck('gs_'+i);
  });
  chars.forEach(c=>{if(ck('gadd_'+c.id)&&!memberOf(g,c.id))g.members.push({cid:c.id,reply:'user',auto:false,sync:false})});
  g.chain=Math.min(1,Math.max(0,(Number(v('ge_chain'))||60)/100));
  g.maxAI=Math.min(20,Math.max(1,Math.round(Number(v('ge_maxai'))||GRP_MAXAI_DEF)));
  g.maxRound=Math.min(6,Math.max(1,Math.round(Number(v('ge_round'))||GRP_MAXROUND_DEF)));
  g.autoMin=Math.max(1,Math.round(Number(v('ge_amin'))||15));
  g.autoMax=Math.max(g.autoMin+1,Math.round(Number(v('ge_amax'))||60));
  saveGroups(gs);
  closeSheet();
  scheduleGroupAuto(true);
  if(view==='tools')renderTools();
  toast(g.priv&&!wasPriv?'已设为隐私群聊（下次进入要输密码）':'群设置已保存');

  /* ---- 补丁4-B：把新增字段写回去 ---- */
  var gs2=groupsAll(),g2=gs2.find(function(x){return x.id===id});if(!g2)return;
  (g2.members||[]).forEach(function(m,i){
    var n=newMem[i];if(!n)return;
    if(n.rel!=null)m.rel=n.rel.slice(0,300);
    if(n.prio!=null){var p=Math.round(Number(n.prio));m.prio=isFinite(p)?Math.max(-999,Math.min(999,p)):50}
    if(n.hist!=null){var hn=Math.round(Number(n.hist));m.histN=(isFinite(hn)&&hn>0)?Math.max(2,Math.min(200,hn)):0}
    if(n.mem!=null)m.mem=n.mem;
  });
  if(histn!=null){var d=Math.round(Number(histn));g2.histN=(isFinite(d)&&d>0)?Math.max(2,Math.min(200,d)):24}
  if(toys!=null)g2.toys=toys;
  saveGroups(gs2);
  if(view==='tools')renderTools();

  /* ---- 补丁12-A：密码对了才真正取消隐私 ---- */
  if(cancelPriv){
    window.auth('取消隐私群聊前要输一次密码，避免别人直接把锁关掉。',function(){
      var gs3=window.groupsAllP();
      for(var i=0;i<gs3.length;i++){if(gs3[i].id===id){gs3[i].priv=false;break}}
      saveGroups(gs3);
      gOpen[id]=true;
      if(view==='tools')renderTools();
      say('已取消隐私群聊');
    });
  }
};

/* ---------- 3. 群聊发言：条数 / 关系简介 / 记忆档案 / 时间 / 玩具 ---------- */
/* 往群聊系统提示里加入：成员定位、私聊同步、记忆和档案。 */
function addGroupMemoryContext(sys,g,c,mm,me,arr){
  /* ① 关系简介：让每个角色知道别人是谁、什么定位 */
  var rel=[],myPrio=prioOf(mm);
  (g.members||[]).forEach(function(m){
    var x=charOf(m.cid);if(!x)return;
    rel.push('· '+x.name+'：'+((m.rel||'').trim()||'（还没写定位，按普通群友相处）')+'　[发言优先级 '+prioOf(m)+']');
  });
  if(rel.length)sys.push('【群成员是谁 / 各自定位】\n'+rel.join('\n')+'\n（发言优先级：数字越小越先开口；你自己是 '+myPrio+'。说话要符合各自定位。）');

  /* ② 同步私聊 */
  if(mm&&mm.sync){
    var pv=load(LS.msg(c.id),[]).slice(-Math.max(1,Math.min(60,Number(g.syncN)||20)));
    if(pv.length)sys.push('【你和'+me+'私聊的最近记录】下面是你和'+me+'私下聊天的最近 '+pv.length+' 条。你在群里同样记得这些事，可以自然提起，但不要逐条复述：\n'+pv.map(function(x){return (x.role==='user'?me:c.name)+'：'+msgBrief(x)}).join('\n'));
  }

  /* ③ 能不能读「记忆 + 历史对话档案」 */
  if(mm&&mm.mem){
    try{
      var M=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{});
      var mb=memBlock(M);
      if(mb)sys.push('【你的记忆】下面是你自己的记忆，你在群里也记得：\n'+mb);
    }catch(e){}
    try{
      var lu0=arr.slice().reverse().find(function(x){return x.role==='user'&&x.content});
      var ab=archiveBlock(lu0?lu0.content:'',c);
      if(ab)sys.push(ab);
    }catch(e){}
  }
}
/* 往群聊系统提示里加入：群内记忆、风格、补充设定、示例和当前时间。 */
function addGroupCharacterContext(sys,g,c){
  var gm=gmemBlock(c.id,g.id,10);
  if(gm)sys.push('【你在这个群里的记忆】你之前在这个群里说过下面这些，你要记得，别和它们矛盾：\n'+gm);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  var wbC=wbForChar(c);if(wbC)sys.push(wbC);   /* 世界书：挂在这个角色身上的共同设定 */
  if(c.examples)sys.push('【对话示例】'+c.examples);
  if(cfg.timeOn!==false)sys.push('【现在的时间】现在是 '+P4.now()+'。群里聊天记录里提到的时间（比如 5 月）都是过去，不要当成现在。');
}
/* 组装群聊发言的基础上下文。 */
function buildGroupBaseContext(g,c){
  var mm=memberOf(g,c.id);
  var lim=histOf(g,mm);
  var arr=gmsgsOf(g.id).slice(-lim);
  var nm=function(id){var x=charOf(id);return x?x.name:'某人'};
  var me=(cfg.userName||'她');
  var others=g.members.filter(function(m){return m.cid!==c.id}).map(function(m){return nm(m.cid)}).filter(Boolean);
  var sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  addGroupMemoryContext(sys,g,c,mm,me,arr);
  addGroupCharacterContext(sys,g,c);
  return {mm:mm,arr:arr,nm:nm,me:me,sys:sys};
}
/* 群聊：需要时先联网搜索，并把结果塞进系统提示。 */
async function addGroupSearchContext(sys,c,g,arr,nm,me){
  if(!(c.search&&c.search.on&&cfg.key))return null;
  try{
    var conv=arr.slice(-6).map(function(m){return (m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}).join('\n');
    var r=await searchForChar(c,conv,function(t){groupStatusLine(g.id,t)});
    if(r){sys.push(r.block);groupStatusLine(g.id,'');return {q:r.q,list:r.list};}
    groupStatusLine(g.id,'');
  }catch(e){groupStatusLine(g.id,'')}
  return null;
}
/* 群聊：问角色要不要先用一次玩具，并把结果塞进系统提示。 */
async function runGroupToyProbe(sys,c,g,hist,tp){
  if(!(g.toys&&W.P4TOYS&&W.P4TOYS.forChar&&cfg.key))return;
  var toyList=W.P4TOYS.forChar(c);
  if(!toyList.length)return;
  try{
    var probe=[{role:'system',content:sys.join('\n\n')}].concat(hist);
    probe.push({role:'user',content:'（先决定要不要用玩具：想掷骰子、抽签、看时间、记心情、留便条、写日记、调好感度就调用一次工具；不想用就直接回复 NO_TOY）'});
    var tr=await callAPI(probe,{stream:false,model:modelOf(c),tools:toyList,tool_choice:'auto',temp:tp.temp,maxtok:200});
    if(tr&&tr.tool_calls&&tr.tool_calls.length){
      var outs=[];
      for(var ti=0;ti<tr.tool_calls.length;ti++){
        var tc=tr.tool_calls[ti],args={};
        try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){}
        var rr={ok:false,msg:''};
        try{rr=W.P4TOYS.exec(tc.function.name,args,c.id)}catch(e){}
        if(rr&&rr.msg)outs.push(rr.msg);
      }
      if(outs.length)sys.push('【你刚刚用了玩具，结果如下，可以在这次发言里自然地说出来】\n'+outs.join('\n'));
    }
  }catch(e){}
}
groupGenerate=async function(g,c,autoSay){
  var base=buildGroupBaseContext(g,c);
  var arr=base.arr,nm=base.nm,me=base.me,sys=base.sys;

  /* ④ 联网搜索（开关在角色设置里） */
  var sMeta=await addGroupSearchContext(sys,c,g,arr,nm,me);
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');

  var hist=arr.map(function(m){return {role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}});
  var tp=thinkParams(c);

  /* ⑤ 群里开了玩具的话，先问它要不要用一次（不想用就不花这次的钱？不，它会回 NO_TOY，成本很低） */
  await runGroupToyProbe(sys,c,g,hist,tp);

  var ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  /* ↓ 主动冒泡：说清楚是系统戳了它一下，不然它会去回答已经聊过的内容、或重复上一条 */
  ctx.push({role:'user',content:autoSay
    ?'（系统提示：群里这会儿没有人说话，也不是她刚发了新消息。是她给你开了「自动发消息」，现在时间到了，系统戳了你一下，让你主动在群里冒个泡。你可以开个新话头（想起一件事、看到点什么、想聊什么），也可以顺着群里刚才的气氛自然接一句。注意：不要去回答上面最后一条消息、不要重复你上一条说过的话、不要解释你为什么突然冒泡，也不要提到这条提示本身。用你的身份发一条，只说你要发的消息。）'
    :'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  var out='',usage=null;
  try{
    out=String(await callAPI(ctx,{stream:false,model:modelOf(c),temp:tp.temp,maxtok:Math.min(400,tp.maxtok||400),onUsage:function(u){usage=u}})||'').trim();
  }catch(e){return null}
  var names=[c.name].concat(g.members.map(function(m){return nm(m.cid)}));
  out=cleanGroupOutput(out,names);
  if(!out)return null;
  return {text:out,tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out),ptok:(usage&&usage.prompt_tokens)?usage.prompt_tokens:0,search:sMeta,id:uid()};
};

/* ---------- 4. 发言顺序：按「发言优先级」从小到大 ---------- */
groupRun=async function(g,trigger){
  if(groupBusy)return;
  groupBusy=true;
  renderToolPane();
  var chain=(typeof g.chain==='number')?g.chain:GRP_CHAIN_DEF;
  var maxAI=Math.max(1,Math.min(20,Number(g.maxAI)||GRP_MAXAI_DEF));
  var maxRound=Math.max(1,Math.min(6,Number(g.maxRound)||GRP_MAXROUND_DEF));
  var total=0;
  try{
    for(var round=1;round<=maxRound;round++){
      var rr=await runGroupRound(g,round,chain,maxAI,total,prioOf);
      total+=rr.speaks;
      if(!rr.spoke)break;
    }
    if(total>=maxAI)toast('本轮发言到上限了，先歇一歇（防刷屏）');
  }catch(e){
    toast('群聊出错：'+((e&&e.message)||e));
  }finally{
    groupBusy=false;
    renderToolPane();scrollGroupDown();
    scheduleGroupAuto(false);
  }
};

/* ---------- 5. 我发的群消息也带 id（这样删它时能精准清记忆） ---------- */
groupSend=async function(){
  var g=findGroup(groupOpenId);if(!g)return;
  if(groupBusy)return toast('群里还在说话，等一下');
  var el=document.getElementById('ginp');
  var t=el?el.value.trim():'';
  if(!t)return;
  el.value='';
  groupFollow=true;
  var arr=gmsgsOf(g.id);
  arr.push({id:uid(),role:'user',content:t,t:Date.now(),tok:estTokens(t)});
  saveGmsgs(g.id,arr);
  renderToolPane();scrollGroupDown();
  await groupRun(g,'user');
};

/* ---------- 6. 角色在私聊里用工具发的群消息，也带 id ---------- */
execGroupTool=function(name,args,cid){
  var nmOf=function(id){var x=charOf(id);return x?x.name:'某人'};
  if(name==='list_my_groups'){
    var gs=groupsOfChar(cid);
    if(!gs.length)return {ok:true,msg:'你还没有加入任何群聊。'};
    return {ok:true,msg:'你所在的群：\n'+gs.map(function(g){return '· 群名：'+g.name+'（id:'+g.id+'，'+g.members.length+'人，成员：'+g.members.map(function(m){return nmOf(m.cid)}).join('、')+'）'}).join('\n')};
  }
  var g=findGroupFlex(args&&args.group,cid);
  if(!g)return {ok:false,msg:'没找到这个群。先调用 list_my_groups 看看你在哪些群里。'};
  if(name==='read_group'){
    var lim=Math.max(1,Math.min(60,Math.round(Number(args&&args.limit)||10)));
    var arr=gmsgsOf(g.id).slice(-lim);
    if(!arr.length)return {ok:true,msg:'《'+g.name+'》里还没有人说话。'};
    return {ok:true,msg:'《'+g.name+'》最近的聊天：\n'+arr.map(function(m){return (m.role==='user'?(cfg.userName||'她'):nmOf(m.cid))+'：'+(m.content||'')}).join('\n')};
  }
  if(name==='send_group_message'){
    var text=String((args&&args.text)||'').trim().slice(0,500);
    if(!text)return {ok:false,msg:'内容为空，没发出去。'};
    var arr2=gmsgsOf(g.id),mid=uid();
    arr2.push({id:mid,role:'char',cid:cid,content:text,t:Date.now(),tok:estTokens(text)});
    saveGmsgs(g.id,arr2);
    gmemAdd(cid,g.id,g.name,text,true,mid);
    if(view==='tools'&&toolTab==='group'){renderToolPane();if(groupOpenId===g.id)scrollGroupDown()}
    return {ok:true,msg:'已在《'+g.name+'》里以你的身份发出：'+text};
  }
  return {ok:false,msg:'未知操作'};
};

})();

function toyRollDice(args){
  var f=Math.round(Number(args.faces)||6);f=Math.max(2,Math.min(1000,f));
  var n=Math.round(Number(args.count)||1);n=Math.max(1,Math.min(6,n));
  var r=[],tot=0;
  for(var i=0;i<n;i++){var v=1+Math.floor(Math.random()*f);r.push(v);tot+=v}
  return {ok:true,msg:'🎲 掷骰子（'+(n>1?(n+' 个 '):'')+f+' 面）：'+r.join(' + ')+(n>1?(' = '+tot):'')+'　结果 '+tot};
}
function toyFlipCoin(){return {ok:true,msg:'🪙 抛硬币：'+(Math.random()<.5?'正面':'反面')}}
function toyPickOne(args){
  var raw=String(args.options||'');
  var arr=raw.split(/[,，\n;；]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!arr.length)return {ok:false,msg:'没有可选的东西'};
  return {ok:true,msg:'👉 '+(args.title?('（'+args.title+'）'):'')+'抽到：'+arr[Math.floor(Math.random()*arr.length)]+'（共 '+arr.length+' 个选项）'};
}
function toyGetNow(){return {ok:true,msg:'🕒 现在是 '+P4.now()}}
function toySetMood(args,c,blink){
  var mood=String(args.mood||'').trim().slice(0,120);
  if(!mood)return {ok:false,msg:'心情是空的'};
  c.mood={text:mood,at:Date.now()};
  save(LS.chars,chars);scheduleBackup();blink();
  return {ok:true,msg:'🫧 你的心情已记下：'+mood};
}
function toyLeaveNote(args,cid,blink){
  var tx=String(args.text||'').trim().slice(0,300);
  if(!tx)return {ok:false,msg:'纸条是空的'};
  var ns=load(Knote(cid),[]);ns.push({t:Date.now(),text:tx});
  while(ns.length>50)ns.shift();
  save(Knote(cid),ns);scheduleBackup();blink();
  return {ok:true,msg:'📝 你在她桌上留了一张小纸条：'+tx};
}
function toyWriteDiary(args,cid,blink){
  var dx=String(args.text||'').trim().slice(0,1200);
  if(!dx)return {ok:false,msg:'日记是空的'};
  var ds=load(Kdiary(cid),[]);ds.push({t:Date.now(),text:dx});
  while(ds.length>60)ds.shift();
  save(Kdiary(cid),ds);scheduleBackup();blink();
  return {ok:true,msg:'📖 日记已写进你的本子（'+dx.length+' 字，只有你和她能看到）'};
}
function toyFavorChange(args,c,blink){
  var d=Math.round(Number(args.delta)||0);
  if(!d)return {ok:false,msg:'变化量是 0'};
  d=Math.max(-10,Math.min(10,d));
  var old=(c.favor&&Number(c.favor.n))||0;
  var nw=Math.max(-999,Math.min(999,old+d));
  c.favor={n:nw,at:Date.now(),why:String(args.reason||'').slice(0,80)};
  save(LS.chars,chars);scheduleBackup();blink();
  return {ok:true,msg:'💠 好感度：'+old+' → '+nw+'（'+(nw>old?'更近':(nw<old?'更远':'没变'))+'）'+(args.reason?('　原因：'+args.reason):'')};
}
function execToy(name,args,cid){

  if(name==='flip_coin')return toyFlipCoin();

  if(name==='leave_note')return toyLeaveNote(args,cid,blink);
  if(name==='write_diary')return toyWriteDiary(args,cid,blink);
  if(name==='favor_change')return toyFavorChange(args,c,blink);
  return {ok:false,msg:'未知玩具'};
}

var toyFoldOpen={};                   /* 标题 → 是否展开；默认全部收起 */
function toyTtlOf(c){
  for(var i=0;i<c.children.length;i++){
    var el=c.children[i];
    if(el.classList&&el.classList.contains('ttl'))return el;
  }
  return null;
}
function toyFoldKey(t){
  return String((t&&t.textContent)||'').replace(/[▸▾]/g,'').replace(/[（(]\d+[）)]$/,'').trim();
}
function toyApplyFold(card,ttl,open){
  var after=false;
  Array.prototype.forEach.call(card.children,function(el){
    if(el===ttl){after=true;return}
    if(after)el.style.display=open?'':'none';
  });
}
function foldToyCard(card){
  var ttl=toyTtlOf(card);if(!ttl)return;
  var key=toyFoldKey(ttl);if(!key)return;
  var open=!!toyFoldOpen[key];
  var ch=ttl.querySelector('.toychev');
  if(!ch){
    ch=document.createElement('span');ch.className='toychev';
    ttl.insertBefore(ch,ttl.firstChild);
    ttl.classList.add('foldttl');
  }
  ch.textContent=open?'▾':'▸';
  toyApplyFold(card,ttl,open);
  if(ttl._toyfold)return;
  ttl._toyfold=1;
  ttl.addEventListener('click',function(e){
    if(e.target&&e.target.closest&&e.target.closest('button,input,select,textarea,a,label'))return;
    var now=!toyFoldOpen[key];
    toyFoldOpen[key]=now;
    ch.textContent=now?'▾':'▸';
    toyApplyFold(card,ttl,now);
  });
}

/* ↓ 这个函数是五层补丁合并后的样子：表情包 → 画图 → 好感度/提示 → 玩具 → 原来的工具分发 */
execCharTool=function(name,args,cid){
  /* ↓ 补丁13-A：发表情包 */
  if(name==='send_sticker'){
    try{return window.execSticker(args)}
    catch(e){return {ok:false,msg:'发不了表情：'+((e&&e.message)||e)}}
  }
  /* ↓ 新增：发朋友圈 */
  if(name==='post_moment'){
    try{return window.execMoment(args,cid)}
    catch(e){return {ok:false,msg:'发不了朋友圈：'+((e&&e.message)||e)}}
  }
  /* ↓ 新增：控制音乐（播放 / 暂停 / 下一首），做完了在聊天里留一行小提示 */
  if(name==='music_control'){
    var rm=null;
    try{rm=window.execMusicTool(name,args)}
    catch(e){rm={ok:false,msg:'音乐操作没成功：'+((e&&e.message)||e)}}
    try{
      if(rm&&rm.ok){
        /* 记下来：等这条回复发出去，挂到它下面（重画、刷新后都还在） */
        window.P5MUSIC=window.P5MUSIC||[];
        window.P5MUSIC.push({act:rm.act||'play',name:rm.name||'',t:Date.now()});
        /* 先马上显示一条，不用等它把话说完整 */
        if(view==='chat')musicChipBind(chatLine(musicChipHTML(rm),'tchip tap'),rm);
      }
    }catch(e){}
    return {ok:!!(rm&&rm.ok),msg:(rm&&rm.msg)||'音乐操作没成功'};
  }
  /* ↓ 补丁5-B：画一张图 */
  if(name==='draw_image')return P5.drawStep(args,cid);
  var c=p5Char(cid);
  var before=c?favSnap(c):null;
  var prev=ctx;ctx='chat';
  var r;
  try{
    /* ↓ 补丁4-C：互动玩具（掷骰子 / 抽签 / 报时…） */
    if(Object.prototype.hasOwnProperty.call(window.FLAG,name)){
      r=window.execToy(name,args,cid);
      try{if(window.P4LASTTOY&&r&&r.msg)window.P4LASTTOY.push(r.msg)}catch(e){}
    }
    /* ↓ 原来的工具分发：待办 / 群聊 / 未知 */
    else if(TODO_TOOLS.some(function(t){return t.function.name===name}))r=execTodoTool(name,args,cid);
    else if(GROUP_TOOLS.some(function(t){return t.function.name===name}))r=execGroupTool(name,args,cid);
    /* ↓ 记忆宫殿：角色自己去翻旧记忆 */
    else if(name==='search_memory')r=execMemTool(args,cid);
    else r={ok:false,msg:'未知工具'};
  }finally{ctx=prev}
  if(name==='favor_change'&&c&&before){
    var after=favSnap(c);
    if(after.n!==before.n||after.why!==before.why)pushFav(c,before,after,args&&args.reason);
  }
  if(TOYNAME[name]&&r&&r.msg)emitToy(name,args,cid,r.msg);
  /* 它在私聊里替你在群里说了话：顺手告诉用户一声 */
  if(name==='send_group_message'&&r&&r.ok){
    var g2=null;try{g2=findGroupFlex(args&&args.group,cid)}catch(e){}
    if(g2&&view==='chat')
      chatLine(tchipOuterHTML('💬','<b>'+esc(p5CharName(cid))+'</b> 在《'+esc(g2.name)+'》里说了一句：'+esc(String((args&&args.text)||'').slice(0,60))),'tchip');

      P5.notify({kind:'group',gid:g2.id,name:p5CharName(cid),emoji:(c&&c.emoji)||'',
        avatar:(c&&c.avatar)||'',text:String((args&&args.text)||''),where:g2.name});
  }
  return r;
};

   ④  打字动画：文字一个一个涌现出来
   ================================================================ */
var tw=null;
P5.live=false;
function htmlToText(h){
  return String(h)
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}
function twTarget(){
  var box=document.getElementById('msgs');if(!box)return null;

  for(var i=kids.length-1;i>=0;i--){
    var el=kids[i];
    if(el.classList&&el.classList.contains('bub')&&!el.classList.contains('me'))return el;
  }
  return null;
}
function twAppend(st){
  var el=st.el;
  for(var i=st.rendered;i<st.shown;i++){
    var ch=st.src.charAt(i);
    if(ch==='\n'){el.insertBefore(document.createElement('br'),st.mark);continue}
    var sp=document.createElement('span');
    sp.className='tw';sp.textContent=ch;
    sp.style.animationDelay=Math.min((i-st.rendered)*18,120)+'ms';
    el.insertBefore(sp,st.mark);
    st.pend.push({el:sp,ch:ch,t:Date.now()});
  }
  st.rendered=st.shown;
}
function twPromote(st){
  var now=Date.now();
  while(st.pend.length&&now-st.pend[0].t>260){
    var p=st.pend.shift(),el=p.el,par=el.parentNode;
    if(!par)continue;
    var prev=el.previousSibling;
    if(prev&&prev.nodeType===3){prev.data+=p.ch;par.removeChild(el)}
    else par.replaceChild(document.createTextNode(p.ch),el);
  }
}
/* 群聊打字动画：按积压量算速度。 */
function twSpeedFor(behind,flush){
  var speed=flush?75:55;
  if(behind>1200)speed=Math.max(speed,420);
  else if(behind>400)speed=Math.max(speed,220);
  else if(behind>150)speed=Math.max(speed,110);
  return speed;
}
function twFrame(){
  var st=tw;
  if(!st||st.dead)return;
  st.raf=0;
  if(!st.el.isConnected){st.dead=true;tw=null;return}
  twPromote(st);
  var behind=st.src.length-st.shown;
  if(behind>0){
    /* 按「时间」算速度，而不是按帧算：手机快慢都差不多。
       平时约 55 字/秒（看得清是一个个冒出来的），积压太多才加速追上。 */
    var now=Date.now();
    if(!st.lastT)st.lastT=now;
    var dt=Math.min(120,now-st.lastT);st.lastT=now;
    var speed=twSpeedFor(behind,st.flush);
    st.acc=(st.acc||0)+dt*speed/1000;
    var step=Math.floor(st.acc);
    if(step>0){
      st.acc-=step;
      st.shown=Math.min(st.src.length,st.shown+step);
      twAppend(st);
      try{scrollDown()}catch(e){}
    }
  }
  if(st.shown<st.src.length){if(!st.raf)st.raf=requestAnimationFrame(twFrame)}
  else if(st.flush){
    st.dead=true;tw=null;
    try{st.el.classList.remove('gen')}catch(e){}
    if(st.pending){st.pending=false;try{renderChat()}catch(e){}}
  }
}
function twFeed(st,v){
  if(!st)return;
  if(st.dead||tw!==st){st.realSet(v);return}
  var s=String(v);
  if(/<(?!br\s*\/?>)/i.test(s)){      /* 出错提示之类：原样放进去，动画收工 */
    st.dead=true;if(tw===st)tw=null;try{st.el.classList.remove('gen')}catch(e){};st.realSet(s);return;
  }
  st.src=htmlToText(s);
  if(st.shown>st.src.length)st.shown=st.src.length;
  if(!st.raf&&st.shown<st.src.length)st.raf=requestAnimationFrame(twFrame);
}
function twStart(el){
  if(!el||!P5.live)return null;
  if(tw&&tw.el===el&&!tw.dead)return tw;
  if(tw&&!tw.dead){tw.dead=true;tw=null}
  var d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  if(!d||!d.set)return null;
  var st={el:el,src:'',shown:0,rendered:0,pend:[],mark:document.createElement('i'),
          raf:0,flush:false,dead:false,pending:false,
          realSet:function(v){try{d.set.call(el,v)}catch(e){}}};
  st.mark.style.display='none';
  try{
    Object.defineProperty(el,'innerHTML',{configurable:true,
      get:function(){return d.get.call(el)},
      set:function(v){twFeed(st,v)}});
  }catch(e){return null}
  el.classList.add('gen');                          /* 打字光标 */
  el.setAttribute('data-live','1');
  while(el.firstChild)el.removeChild(el.firstChild);
  el.appendChild(st.mark);
  tw=st;
  return st;
}
/* 给「非流式」一次拿到的整段文字，也套上同一个打字动画 */
P5.say=function(el,text){
  if(!el)return null;
  var st=twStart(el);
  if(!st)return null;                  /* 拿不到打字机：返回 null，让调用方原样显示 */
  twFeed(st,text);
  st.flush=true;                       /* 文字已经完整，放完就收工 */
  if(!st.raf)st.raf=requestAnimationFrame(twFrame);
  return st;
};

        const r=(await toolLoop(c,buildCtx(c),{signal:sig,temp:tp.temp,maxtok:tp.maxtok,tools:tools}))||{};

    }catch(e){

      var liteOK=false;

            onDelta:d=>{out+=d;a.classList.remove('typing');a.innerHTML=liveBubbleText(out);scrollDown()},
            onReasoning:rr=>{reasoning+=rr;thinkOn()},

      }catch(e2){}
      if(!liteOK)ok=handleAskError(e,a,out,reasoning,usage);
    }
    finishAskUI(sendBtn,stopBtn,liveThink,ok);
    /* ================= 原来的生成逻辑结束 ================= */

    /* ---- 补丁4-A：把搜索结果挂到这条回复上 ---- */
    if(pendingSM&&msgs.length>before2){

    var arrT=W.P4LASTTOY||[];

    try{ if(view==='chat'&&(msgs||[]).length>before6)renderChat(); }catch(e){}
  }finally{

    W.P13.armed=false;

/* 把图片压小并转成本地数据（压不住就保留原链接） */
function p5ShrinkSrc(src,max,q){
  return new Promise(function(res){
    var img=new Image();
    if(/^https?:/i.test(src))img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return res(src);
        var s=Math.min(1,(max||1024)/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL('image/jpeg',q||.82);
        if(out.length>420000)out=cv.toDataURL('image/jpeg',.5);
        res(out);
      }catch(e){res(src)}
    };
    img.onerror=function(){res(src)};
    img.src=src;
  });
}
async function toLocal(url){
  var im=imCfg();
  if(im.local===false)return url;
  if(/^data:/i.test(url))return await p5ShrinkSrc(url,1024,.82);
  try{
    var res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    var blob=await res.blob();
    var durl=await new Promise(function(rj,rk){
      var rd=new FileReader();
      rd.onload=function(){rj(String(rd.result))};
      rd.onerror=function(){rk(new Error('读图失败'))};
      rd.readAsDataURL(blob);
    });
    return await p5ShrinkSrc(durl,1024,.82);
  }catch(e){return url}
}

    {role:'user',content:prompt}
  ],{stream:false,model:im.model||cfg.model,temp:.8,maxtok:800});
  var s=String(r||'');
  var m=s.match(/!\[[^\]]*\]\((https?:[^)\s]+)\)/)||s.match(/\((https?:[^)\s]+)\)/)||s.match(/(https?:\/\/[^\s)"'<>]+)/);
  if(!m)throw new Error('这个模型没返回图片地址：'+s.slice(0,80));
  return await toLocal(m[1]);
}
/* 画图：走 images/generations 接口。 */
async function callImageGenerate(prompt,base,key,im){
  var body={model:im.model||'gpt-image-1',prompt:String(prompt),n:1};
  if(im.size&&im.size!=='auto')body.size=im.size;
  var res=await fetch(base+'/images/generations',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body)});
  if(!res.ok){
    var t='';try{t=await res.text()}catch(e){}
    throw new Error('HTTP '+res.status+' '+String(t).replace(/\s+/g,' ').slice(0,180));
  }
  var j=await res.json();
  var d=(j&&j.data&&j.data[0])||{};
  if(d.b64_json)return await p5ShrinkSrc('data:image/png;base64,'+d.b64_json,1024,.82);
  if(d.url)return await toLocal(d.url);
  if(j.image||j.url)return await toLocal(j.image||j.url);
  throw new Error('接口没返回图片');
}
async function callImage(prompt,c){

/* 【修好一个隐藏 bug】原来的 toolLoop 不等工具执行完，
   所以「异步工具」（画图这种）的结果传不回给模型。这里换成会 await 的版本。 */
/* 执行一轮工具调用，并把调用和结果写回消息列表。 */
async function pushToolResults(msgs2,resp,c){
  msgs2.push({role:'assistant',content:resp.content||null,tool_calls:resp.tool_calls});
  for(var i=0;i<resp.tool_calls.length;i++){
    var tc=resp.tool_calls[i];
    var args={};
    try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){args={}}
    var r;
    try{r=await Promise.resolve(execCharTool(tc.function.name,args,c.id))}
    catch(e){r={ok:false,msg:'工具执行出错：'+((e&&e.message)||e)}}
    if(r==null)r={ok:false,msg:'没有返回'};
    msgs2.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(r)});
  }
}
toolLoop=async function(c,ctx,opt){
  try{
    opt=opt||{};
    var tools=opt.tools||toolsFor(c);
    var msgs2=ctx.slice();
    if(!tools.length)return {finalText:'',reasoning:'',usage:null,messages:msgs2,didTool:false};
    var reasoning='',usage=null,rounds=0,didTool=false;
    while(rounds<6){
      rounds++;
      var resp=await callAPI(msgs2,{stream:false,model:modelOf(c),tools:tools,tool_choice:'auto',
        signal:opt.signal,temp:opt.temp,maxtok:opt.maxtok,
        onReasoning:function(r){reasoning+=r},onUsage:function(u){usage=u}});
      if(!resp)return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:didTool};
      if(!resp.tool_calls||!resp.tool_calls.length)
        return {finalText:resp.content||'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:didTool};
      didTool=true;
      await pushToolResults(msgs2,resp,c);
      if(view==='tools'&&toolTab==='todo')safeL(function(){renderTodo()});
    }
    return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:true};
  }catch(e){
    /* ↓ 补丁13-A：模型不支持「发表情」工具时，退回到不用表情的正常聊天 */
    var t=(opt&&opt.tools)||null;
    if(!t&&typeof toolsFor==='function')t=toolsFor(c);
    var has=false;
    if(t&&t.some){has=t.some(function(x){return x&&x.function&&x.function.name==='send_sticker'})}
    if(!has)throw e;
    var filt=t.filter(function(x){return !(x&&x.function&&x.function.name==='send_sticker')});
    var o2={};
    for(var k in opt){if(Object.prototype.hasOwnProperty.call(opt,k))o2[k]=opt[k]}
    o2.tools=filt;
    return await toolLoop.call(this,c,ctx,o2);
  }
};

  if(withRaw){try{d.raw=await rawGet(id)}catch(e){}}
  var str;
  if(enc&&cryptKey){
    try{str=await encVal(cryptKey,JSON.stringify(d))}

  }else str=JSON.stringify(d);

/* 导入角色：补齐新角色的默认字段。 */
function normalizeImportedChar(c,nid){
  c.id=nid;c.priv=false;
  if(c.auto)c.auto.on=false;
  if(typeof c.avatar!=='string')c.avatar='';
  if(!c.todoPerm)c.todoPerm={on:false};
  if(!c.groupPerm)c.groupPerm={on:false};
  if(!c.search)c.search={on:false};
  if(!c.momentPerm)c.momentPerm={on:true};
  if(!c.toyPerm)c.toyPerm={on:true};
  if(!c.imgPerm)c.imgPerm={on:true};
  return c;
}
/* 读取导入的角色文件文字。 */
function readImportedFileText(f){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){res(String(rd.result))};
    rd.onerror=function(){rej(new Error('读文件失败'))};
    rd.readAsText(f);
  });
}
/* 解析导入的角色文件，必要时先解密。 */
async function parseImportedCharFile(text){
  if(text.indexOf('enc:')===0){
    if(!cryptKey)return {error:'这个角色文件是加密的。请先解锁应用（输入密码）再导入。'};
    try{return {data:JSON.parse(await decVal(cryptKey,text))}}
    catch(e){return {error:'解密失败：密码不对，或文件损坏'}}
  }
  try{return {data:JSON.parse(text)}}
  catch(e){return {error:'这不是有效的角色文件（要用这里导出的 .json）'}}
}
P5.impCharFile=async function(input){
  var f=input&&input.files&&input.files[0];
  if(input)input.value='';
  if(!f)return;
  var text='';
  try{text=await readImportedFileText(f)}catch(e){return alert(e.message)}
  var parsed=await parseImportedCharFile(text);
  if(parsed.error)return alert(parsed.error);
  var d=parsed.data;
  if(!d||!d.char)return alert('文件里没有角色数据');
  var c=d.char;
  var nm=c.name||'角色';
  var msgLine=(d.msgs&&d.msgs.length)?('聊天记录：'+d.msgs.length+' 条'):'（不含聊天记录）';
  if(!confirm('把「'+nm+'」导入进来？\n\n'+msgLine+'\n\n会作为一个新角色加入，不动你现在任何数据。'+
    (d.msgs&&d.msgs.length&&d.msgs.length>200?'\n（记录比较长，可能有点慢）':'')))return;
  var nid=uid();
  c=normalizeImportedChar(c,nid);
  chars.push(c);
  try{save(LS.chars,chars)}catch(e){return alert('写入失败，本地存储可能满了')}
  try{if(d.mem)save(LS.mem(nid),d.mem)}catch(e){}
  try{if(d.msgs&&d.msgs.length)save(LS.msg(nid),d.msgs)}catch(e){}
  try{if(d.todos&&d.todos.length)save(LS.todo(nid),d.todos)}catch(e){}
  try{if(d.gmem&&d.gmem.length)save(LS.gmem(nid),d.gmem)}catch(e){}
  try{if(d.raw)await idbPut(nid,d.raw,'rawlog')}catch(e){}
  scheduleBackup();
  try{closeSheet()}catch(e){}
  go('roles');
  say('导入完成：'+nm);
};

    });

    '你可以用它们了解各人的性格、你和'+meName+'的关系、彼此的称呼与说话习惯，让演出来的角色更像；'+

/* ============ 解析模型输出 ============ */
function parseActOut(text,act){
  var names={};
  names[act.narrOn!==false?(act.narrName||'旁白'):'旁白']={role:'narr'};
  names['旁白']={role:'narr'};
  names['Narrator']={role:'narr'};
  (act.members||[]).forEach(function(mm){
    var c=p5Char(mm.cid);if(!c)return;
    names[c.name]={role:'char',cid:mm.cid};
  });
  var out=[],cur=null;
  String(text).split('\n').forEach(function(raw){
    var line=raw.replace(/\s+$/,'');
    var m=line.match(/^\s*[【\[（(]?\s*([^：:\n]{1,14}?)\s*[】\]）)]?\s*[：:]\s*(.*)$/);
    var who=m?m[1].trim():'';
    var hit=(who&&names[who])?names[who]:null;
    if(hit){
      cur={role:hit.role,cid:hit.cid,content:(m[2]||'')};
      out.push(cur);
      return;
    }
    if(!cur){cur={role:'narr',content:''};out.push(cur)}
    cur.content+=(cur.content?'\n':'')+line;
  });
  return out.map(function(b){
    b.content=String(b.content||'').trim();
    return b;
  }).filter(function(b){return b.content});
}
function splitOpts(txt){
  var opts=[],keep=[];
  String(txt||'').split('\n').forEach(function(l){
    var s=l.trim();
    var m=s.match(/^[（(【\[]?\s*([A-Da-d])\s*[)）.、．:：]\s*(.+)$/);
    if(m&&m[2].trim().length>1){opts.push({k:m[1].toUpperCase(),t:m[2].trim()});return}
    keep.push(l);
  });
  var last=keep.length-1;
  if(last>=0&&/^(选项|可选|可选行动|行动选项)\s*[：:]?$/.test(String(keep[last]).trim()))keep.pop();
  return {text:keep.join('\n').trim(),opts:opts};
}

/* ============ 生成一轮 ============ */
/* 组装演绎这一轮要发给模型的上下文。 */
function buildActTurnContext(act,drive){
  var meName=cfg.userName||'她';
  var ms=actMsgs(act.id);
  var hist=ms.slice(-40).map(function(m){
    if(m.role==='sys')return '【场上事件】'+m.content;
    var who=(m.role==='user')?meName:(m.role==='narr'?((act.narrOn!==false&&act.narrName)?act.narrName:'旁白'):p5CharName(m.cid));
    return who+'：'+String(m.content||'');
  }).join('\n');
  var who2=(drive&&drive!=='narr')?p5CharName(drive):'';
  var hint='【现在继续演绎】'+(who2
    ?('这一轮主要写「'+who2+'」的行动和对白，旁白用一两句交代画面与结果。')
    :('以旁白为主推进：交代新出现的画面、NPC 的反应、局面的变化，然后把剧情往前推。'))+
    '结尾给出 1~3 个可行选项（每行一个，格式：A. ……）。不要替'+meName+'做决定，也不要写'+meName+'说的话。';
  /* 【新增】拿你最近说的一句话当关键词，去「记忆文件」里找相关片段 */
  var lastQ='';
  for(var qi=ms.length-1;qi>=0;qi--){
    if(ms[qi].role==='user'&&ms[qi].content){lastQ=String(ms[qi].content);break}
  }
  return [{role:'system',content:actSys(act)+actMemFileBlock(act,lastQ)},
    {role:'user',content:'【演绎记录】\n'+(hist||'（刚刚开始，还没有任何记录）')+'\n\n'+hint}];
}
/* 解析并保存模型返回的演绎内容；成功返回 true。 */
function saveActTurnText(text,act){
  if(!text){say('模型没返回内容，检查一下模型或网络');return false}
  var blocks=parseActOut(text,act);
  if(!blocks.length)blocks=[{role:'narr',content:text}];
  var allOpts=[];
  blocks.forEach(function(b){
    var r=splitOpts(b.content);
    b.content=r.text;
    if(r.opts.length)allOpts=allOpts.concat(r.opts);
  });
  allOpts=allOpts.slice(0,6);
  if(allOpts.length){
    var host=null;
    for(var i=blocks.length-1;i>=0;i--){if(blocks[i].role==='narr'){host=blocks[i];break}}
    if(!host)host=blocks[blocks.length-1];
    host.opts=allOpts;
  }
  blocks=blocks.filter(function(b){return String(b.content||'').trim()||b.opts});
  var ms2=actMsgs(act.id);
  blocks.forEach(function(b){
    ms2.push({role:b.role,cid:b.cid,content:String(b.content||'').trim(),t:Date.now(),opts:b.opts||null});
  });
  saveActMsgs(act.id,ms2);
  return true;
}

function actLiveBubble(act){
  var box=document.getElementById('amsgs');
  if(!box)return null;
  var who=(act.narrOn!==false?(act.narrName||'旁白'):'旁白');
  var d=document.createElement('div');
  d.className='abub narr actlive';
  d.innerHTML='<div class="aav narr">🎭</div><div class="acol">'+
    '<div class="awname">'+esc(who)+'</div>'+
    '<div class="atext gen"></div></div>';
  box.appendChild(d);
  return {el:d,text:d.querySelector('.atext')};
}
/* 演绎的「打字机」：接口是否支持流式都能逐字显示，积压多时自动加速追上 */
function actTypewrite(live,getText,isDone){
  return new Promise(function(resolve){
    if(!live||!live.text){resolve();return}
    var shown=0,last=Date.now(),acc=0;
    function frame(){
      if(!live.el||!document.body.contains(live.el)){resolve();return}
      var src=String(getText()||'');
      var behind=src.length-shown;
      if(behind>0){
        var now=Date.now();
        var dt=Math.min(120,now-last);last=now;
        var speed=isDone()?200:70;
        if(behind>1600)speed=1200;
        else if(behind>600)speed=500;
        else if(behind>200)speed=200;
        acc+=dt*speed/1000;
        var n=Math.floor(acc);
        if(n>0){
          acc-=n;
          shown=Math.min(src.length,shown+n);
          live.text.textContent=src.slice(0,shown);
          scrollActDown();
        }
      }
      if(isDone()&&shown>=String(getText()||'').length){resolve();return}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function actTurn(act,drive){
  if(actBusy)return;
  if(!cfg.key)return alert('先去设置里填 API Key');
  if(!(act.members||[]).length&&act.narrOn===false)return alert('这场演绎还没有角色也没有旁白');
  actBusy=true;
  actFollow=true;                 /* 新一轮开始：默认跟随到最新 */
  renderToolPane();
  var ok=false,live=null,out='',done=false,typing=null;
  try{
    var ctx=buildActTurnContext(act,drive);
    live=actLiveBubble(act);
    typing=actTypewrite(live,function(){return out},function(){return done});
    var text='',streamErr=null;
    try{
      text=String(await callAPI(ctx,{stream:true,model:cfg.model,
        temp:Math.max(.7,Number(cfg.temp)||.85),maxtok:1400,
        onDelta:function(d){
          out+=d;
        }})||'');
    }catch(e1){streamErr=e1}
    if(!String(text||'').trim()){
      /* 个别接口不支持流式、或直接拒绝流式：退回整段生成 */
      try{
        var whole=String(await callAPI(buildActTurnContext(act,drive),{stream:false,model:cfg.model,
          temp:Math.max(.7,Number(cfg.temp)||.85),maxtok:1400})||'');
        if(String(whole||'').trim())text=whole;
      }catch(e2){
        if(!out)throw (streamErr||e2);
      }
    }
    if(!text&&!out&&streamErr)throw streamErr;
    if(text&&text!==out)out=text;
    if(!text)text=out;
    done=true;
    try{await typing}catch(e){}
    text=String(text||'').trim();
    if(live&&live.el&&live.el.parentNode)live.el.parentNode.removeChild(live.el);
    if(saveActTurnText(text,act))ok=true;
  }catch(e){
    done=true;
    try{if(typing)await typing}catch(_e){}
    if(out&&String(out).trim()&&saveActTurnText(String(out),act))ok=true;
    if(live&&live.el&&live.el.parentNode)live.el.parentNode.removeChild(live.el);
    say('演绎出错：'+String((e&&e.message)||e).slice(0,90));
  }finally{
    actBusy=false;
    if(ok)touchAct(act);
    renderToolPane();
  }
}

importAll=function(input){
  var f=input.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=async function(){
    try{
      var s=String(rd.result),d;
      if(s.indexOf('enc:')===0){
        if(!cryptKey)return alert('这个备份是加密的。请先设置/输入密码解锁后再导入。');
        try{s=await decVal(cryptKey,s)}catch(e){return alert('解密失败：密码不对或文件损坏')}
      }
      d=JSON.parse(s);
      if(!confirm('导入会覆盖现在所有数据，确定？'))return;
      importBackupCfg(d);            /* 用带保护的写法：保留你现在的密钥，接口地址变了会先问你 */
      if(d.chars)save(LS.chars,d.chars);
      if(d.messages)Object.keys(d.messages).forEach(k=>save(LS.msg(k),d.messages[k]));
      if(d.memories)Object.keys(d.memories).forEach(k=>{if(d.memories[k])save(LS.mem(k),d.memories[k])});
      if(d.todos)Object.keys(d.todos).forEach(k=>{if(d.todos[k]&&d.todos[k].length)save(LS.todo(k),d.todos[k])});
      if(d.gmems)Object.keys(d.gmems).forEach(k=>{if(d.gmems[k]&&d.gmems[k].length)save(LS.gmem(k),d.gmems[k])});
      if(d.arcs)save(LS.arcs,d.arcs);
      if(d.arcData)for(const k of Object.keys(d.arcData)){
        try{
          const v=Array.isArray(d.arcData[k])?sanitizeArcMs(d.arcData[k]):d.arcData[k];
          await idbPut(k,v);arcMem[k]=v;
        }catch(e){}
      }
      if(d.groups)save(LS.groups,d.groups);
      if(d.gmsgs)Object.keys(d.gmsgs).forEach(k=>{if(d.gmsgs[k])save(LS.gmsg(k),d.gmsgs[k])});
      /* 演绎 / 表情库 / 便条 / 日记 / 好感度记录 / 画册 / 自动总结进度 */
      try{importBackupExtraData(d)}catch(e){}
      await importBackupRawLogs(d);      /* 原文日志（IndexedDB） */
      alert('导入完成，刷新一下');
      location.reload();
    }catch(e){alert('文件读不了：'+e.message)}
  };
  rd.readAsText(f);
};

   ---------------------------------------------------------------
   原理：演绎每一轮都会带着「你正在主持一场「演绎」」这句系统提示，
   我们在这个调用上挂钩子，把 usage（真实 token）拿下来，
   等它把记录存盘时写进消息里，刷新也不会丢。
   ================================================================ */
function actsArr(){return safeV(function(){return load('wh_acts',[])},[])||[]}
function actById(id){
  var a=actsArr();
  for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i]}
  return null;
}
function isActCall(msgs){
  try{
    return !!(msgs&&msgs[0]&&msgs[0].role==='system'&&
      String(msgs[0].content||'').indexOf('你正在主持一场「演绎」')>=0);
  }catch(e){return false}
}
/* 最近一次被改动的演绎 = 当前正在玩的那一场 */
function guessActId(){
  var a=actsArr(),best=null;
  for(var i=0;i<a.length;i++){
    var t=(a[i].lastAt||a[i].t||0);
    if(!best||t>best.t)best={id:a[i].id,t:t};
  }
  return best?best.id:null;
}
P6.narrText=function(actId){
  var a=actId?actById(actId):null;
  var s=(a&&a.narrNote)?a.narrNote:'';
  if(!s)s=(cfg&&cfg.narrNote)||'';
  return String(s||'').trim();
};

/* ↓ 这个函数是五层补丁合并后的样子：演绎记录 → 打字动画 → 多模型重试 → 原始请求 */
callAPI=async function(msgs,opt){
  var act=false;
  try{act=isActCall(msgs)}catch(e){}
  if(act){
    /* 把用户自定的「旁白设定 / 风格要求」追加进系统提示 */
    try{
      var note=P6.narrText(guessActId());
      if(note&&msgs[0]&&typeof msgs[0].content==='string'){
        msgs[0].content+='\n\n【旁白的设定 / 风格要求（用户指定，优先遵守，但不要违反上面的输出格式）】\n'+note;
      }
    }catch(e){}
  }
  var o={};for(var k in (opt||{}))o[k]=opt[k];
  var u=null;
  if(act){
    var pu=o.onUsage;
    o.onUsage=function(x){u=x;if(pu){try{pu(x)}catch(e){}}};
  }

  /* ---- 真正请求的部分 ---- */
  var core=async function(oo){
    /* 流式 / 带工具：走最初那份实现（补丁1） */
    if(oo.stream||oo.tools){
      if(!cfg.key)throw new Error('先去设置里填 API Key');
      var req=buildApiRequest(msgs,oo);
      var res=await fetch(req.url,req.fopt);
      if(!res.ok){var t0='';try{t0=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t0).slice(0,180))}
      if(!oo.stream){
        var raw1='',jj=null;           /* 同样先把原文读下来再解析 */
        try{raw1=await res.text()}catch(e){}
        try{jj=raw1?JSON.parse(raw1):null}catch(e){}
        return handleApiJsonResponse(jj,oo,raw1);
      }
      var parser=createApiStreamParser(oo);
      return readApiStreamText(res,parser);
    }
    /* 非流式 / 不带工具：补丁4-A 的五次重试（换模型、去掉温度等） */
    var model=oo.model||cfg.model;
    var model2=(cfg.model&&cfg.model!==model)?cfg.model:null;
    var base={temp:(oo.temp!=null?oo.temp:cfg.temp),maxtok:(oo.maxtok||cfg.maxtok)};
    var tries=[
      {model:model,temp:base.temp,maxtok:base.maxtok},
      model2?{model:model2,temp:base.temp,maxtok:base.maxtok}:null,
      {model:model,temp:null,maxtok:null},
      {model:model2||model,temp:null,maxtok:null,tokName:'max_completion_tokens'},
      {model:model,temp:null,maxtok:null,stream:true}
    ].filter(Boolean);
    var lastErr=null;
    for(var i=0;i<tries.length;i++){
      var oo2={};for(var k3 in tries[i])oo2[k3]=tries[i][k3];
      if(oo.onUsage)oo2.onUsage=oo.onUsage;
      try{
        var rr=await window.p4raw(msgs,oo2);
        if(String(rr==null?'':rr).trim())return rr;
        lastErr=new Error('模型返回空内容');
      }catch(e){lastErr=e}
    }
    throw (lastErr||new Error('调用失败'));
  };

  var r;
  /* ↓ 补丁5-A：流式回复一个字一个字冒出来 */
  if(o.stream&&typeof o.onDelta==='function'){
    var orig=o.onDelta,inited=false,st=null;
    var o2={};for(var k in o)o2[k]=o[k];
    o2.onDelta=function(d){
      try{orig(d)}catch(e){}
      if(!inited){
        inited=true;
        var el=window.twTarget();
        if(el){
          var seeded=el.innerHTML;
          st=window.twStart(el);
          if(st)window.twFeed(st,seeded);
        }
      }
    };
    try{r=await core(o2)}
    finally{
      try{
        if(st&&!st.dead){
          st.flush=true;
          if(!st.raf)st.raf=requestAnimationFrame(window.twFrame);
        }
      }catch(e){}
    }
  }else{
    r=await core(o);
  }
  if(act){
    var txt=String(r==null?'':r);
    P6.actLast={text:txt,
      tok:(u&&u.completion_tokens)?u.completion_tokens:estTokens(txt),
      ptok:(u&&u.prompt_tokens)?u.prompt_tokens:0};
  }
  return r;
};

function blockNextClick(){
  var h=function(e){e.stopPropagation();e.preventDefault();document.removeEventListener('click',h,true)};

P6.copy=function(){
  var t=msgTextOf(curI);
  var fin=function(ok){closeSheet();say(ok?'已复制':'复制失败，长按文字自己选一下')};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){fin(1)}).catch(function(){fin(0)});
    }else{
      var ta=document.createElement('textarea');
      ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      document.execCommand('copy');ta.remove();fin(1);
    }
  }catch(e){fin(0)}
};
P6.quote=function(){

  say('已引用到输入框');
};

    '<textarea id="p6ed" style="min-height:180px">'+esc(m.content||'')+'</textarea>'+

P6.del=function(){

  var b=document.getElementById('p6bar');
  if(!b){b=document.createElement('div');b.id='p6bar';document.body.appendChild(b)}
  if(!on){b.classList.remove('on');b.innerHTML='';return}
  b.classList.add('on');barUpdate();

P6.selDel=function(){
  var idx=Object.keys(sel.set).map(Number).filter(function(i){return msgs[i]}).sort(function(a,b){return b-a});
  if(!idx.length)return say('先点几条消息选中');
  if(!confirm('删除选中的 '+idx.length+' 条消息？删了就找不回来了'))return;
  idx.forEach(function(i){msgs.splice(i,1)});
  persist();var n=idx.length;selStop();renderChat();say('已删除 '+n+' 条');
};
/* 【新】把选中的这几条，按原来的先后顺序追加到「原文日志」里（不用管它们是不是连着的） */
P6.selRaw=async function(){
  var idx=Object.keys(sel.set).map(Number).filter(function(i){return msgs[i]}).sort(function(a,b){return a-b});
  if(!idx.length)return say('先点几条消息选中');
  var c=safeV(function(){return curChar()},null);
  if(!c)return say('先去「角色」里选一个角色');
  var who=function(m){return m.role==='user'?'我':((c.emoji||'')+' '+c.name)};
  var head='===== '+new Date().toLocaleString('zh-CN')+'（手动挑选 '+idx.length+' 条） =====';
  var body=idx.map(function(i){return who(msgs[i])+'：'+msgBrief(msgs[i])}).join('\n');
  var n=idx.length;
  selStop();
  var ok=false;
  try{
    var prev=await rawGet(c.id);
    ok=await rawPut(c.id,(prev||'')+head+'\n'+body+'\n\n');
  }catch(e){ok=false}
  say(ok?('已把 '+n+' 条追加到「'+c.name+'」的原文日志'):'追加失败');
};

var lpTimer=null,lpStart=null,lpMoved=false;
/* 消息区长按：弹出单条操作。 */
function bindMsgLongPress(box){
  box.addEventListener('pointerdown',function(e){
    if(busy||sel.on)return;
    var el=e.target&&e.target.closest?e.target.closest('.bub'):null;
    if(!el)return;
    lpMoved=false;lpStart={x:e.clientX,y:e.clientY};
    clearTimeout(lpTimer);
    lpTimer=setTimeout(function(){
      if(lpMoved||sel.on)return;
      var i=bIdx(el);
      if(i>=0)try{openMsgSheet(i)}catch(err){}
    },460);
  },{passive:true});
  box.addEventListener('pointermove',function(e){
    if(!lpStart)return;
    if(Math.abs(e.clientX-lpStart.x)>12||Math.abs(e.clientY-lpStart.y)>12){
      lpMoved=true;clearTimeout(lpTimer);
    }
  },{passive:true});
  ['pointerup','pointercancel'].forEach(function(k){
    box.addEventListener(k,function(){clearTimeout(lpTimer);lpStart=null},{passive:true});
  });
}
/* 消息区右键 / 桌面端长按菜单。 */
function bindMsgContextMenu(box){
  box.addEventListener('contextmenu',function(e){
    var el=e.target&&e.target.closest?e.target.closest('.bub'):null;
    if(!el)return;
    e.preventDefault();
    var i=bIdx(el);
    if(i>=0)openMsgSheet(i);
  });
}
/* 消息区多选点击。 */
function bindMsgMultiSelect(box){
  box.addEventListener('click',function(e){
    if(!sel.on)return;
    var el=e.target&&e.target.closest?e.target.closest('.bub'):null;
    if(!el)return;
    e.preventDefault();e.stopPropagation();
    var i=bIdx(el);
    if(i<0)return;
    if(sel.set[i])delete sel.set[i];else sel.set[i]=1;
    renderChat();barUpdate();
  },true);
}
function attachPress(){
  var box=document.getElementById('msgs');
  if(!box||box._p6b)return;
  box._p6b=1;
  bindMsgLongPress(box);
  bindMsgContextMenu(box);
  bindMsgMultiSelect(box);
}
window.p6SelectPaint=function(){   /* 挂到全局：多选状态绘制（要读本块的 sel 状态） */
  try{
    var box=document.getElementById('msgs');

      if(sel.on)dqa('.bub',box).forEach(function(el,i){if(sel.set[i])el.classList.add('p6on')});
    }
    if(!sel.on)bar(false);
  }catch(e){}
};
/* 换页时自动退出多选，免得那个条一直挂着 */
try{
  dqa('nav button').forEach(function(b){
    b.addEventListener('click',function(){if(sel.on)selStop()});

P6.foldOpen={};                       /* 设置页默认全部收起，点标题才展开 */
var GROUPS=[

  ['连接',['接口']],
  ['记忆',['记忆注入','记忆与自动总结']],
  ['能力',['联网搜索','画图','演绎']],

  var k=card.children;

  }

}
function foldCard(card){
  var ttl=ttlOf(card);if(!ttl)return;
  var key=String(ttl.textContent||'').trim();
  if(!key)return;
  var open=!!P6.foldOpen[key];

  Array.prototype.forEach.call(card.children,function(el){

  });

function sortCfgCards(m,cards){
  var order=[];
  GROUPS.forEach(function(g){
    g[1].forEach(function(key){
      cards.forEach(function(c){
        if(order.indexOf(c)<0&&ttlTextOf(c).indexOf(key)>=0)order.push(c);
      });
    });
  });
  cards.forEach(function(c){if(order.indexOf(c)<0&&ttlTextOf(c))order.push(c)});
  order.forEach(function(c){m.appendChild(c)});

}

document.addEventListener('scroll',function(e){
  var t=e.target;
  if(!t||!t.id)return;

}

  if(!c||!c.el)return;
  clearTimeout(c.el._p11Rel);
  c.el._p11Rel=setTimeout(function(){
    c.el._p11Hold=false;
    if(p11AtBottom(c.el))c.on(true);
  },260);
}

  var c=p11FollowCtl(e.target);

/* ---------- 图片处理：缩小后存本地；gif 不大就保留动效 ---------- */
function shrinkOne(file,max,q){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          if(!w||!h){rej(new Error('图片尺寸不对'));return}
          var s=Math.min(1,max/Math.max(w,h));
          w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
          var alpha=/png|webp|svg/i.test(String((file&&file.type)||''));
          var out='';
          if(alpha){
            var cv=document.createElement('canvas');cv.width=w;cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h);
            out=cv.toDataURL('image/png');
          }
          if(!alpha||out.length>MAX_ONE){
            var c2=document.createElement('canvas');c2.width=w;c2.height=h;
            var x2=c2.getContext('2d');
            x2.fillStyle='#ffffff';x2.fillRect(0,0,w,h);
            x2.drawImage(img,0,0,w,h);
            out=c2.toDataURL('image/jpeg',q||.85);
          }
          res(out);
        }catch(e){rej(e)}
      };
      img.onerror=function(){rej(new Error('这个图片读不了'))};
      img.src=String(rd.result||'');
    };
    rd.onerror=function(){rej(new Error('文件读不了'))};
    rd.readAsDataURL(file);
  });
}
function readSticker(file){
  var t=String((file&&file.type)||'');
  if(/gif/i.test(t)&&file.size&&file.size<=330*1024){
    return new Promise(function(res,rej){
      var rd=new FileReader();
      rd.onload=function(){res(String(rd.result||''))};
      rd.onerror=function(){rej(new Error('文件读不了'))};
      rd.readAsDataURL(file);
    });
  }
  return shrinkOne(file,360,.85);
}

  if(k==='roles'){go('roles');return}

/* ---------- ⑩ 状态栏电量：读手机真实电量（浏览器允许的话） ---------- */
function batPaint(b){
  var lv=Math.max(0,Math.min(1,(b&&typeof b.level==='number')?b.level:0));
  var ch=!!(b&&b.charging);
  /* 【新增】把这会儿读到的电量记在全局里，聊天时角色才能知道（角色设置里可以关掉） */
  try{window.BATSTATE={level:lv,charging:ch,at:Date.now()}}catch(e){}
  var low=(lv<=.2&&!ch);
  var fill=D.getElementById('batFill');
  if(fill)fill.setAttribute('width',(0.9+11.5*lv).toFixed(2));
  if(fill&&fill.ownerSVGElement)fill.ownerSVGElement.style.color=low?'#e06a60':'';
  var pct=D.getElementById('sbPct');
  if(pct){
    pct.textContent=Math.round(lv*100)+'%';
    pct.style.color=low?'#e06a60':'';
    pct.title=ch?'正在充电':'手机电量';
  }
  var bolt=D.getElementById('sbBolt');
  if(bolt)bolt.style.display=ch?'':'none';     /* 充电时才亮出小闪电 */
}
(function(){
  try{
    if(!navigator.getBattery)return;          /* 有的浏览器不给读，那就保持原来的装饰图标 */
    navigator.getBattery().then(function(b){
      batPaint(b);
      try{
        b.addEventListener('levelchange',function(){batPaint(b)});
        b.addEventListener('chargingchange',function(){batPaint(b)});
      }catch(e){}
    }).catch(function(){});
  }catch(e){}
})();

syncGlass();
try{if(cfg&&typeof applyTheme==='function')applyTheme()}catch(e){}
setInterval(tick,15000);
D.addEventListener('visibilitychange',function(){if(!D.hidden)tick()});
setTimeout(function(){if(!isLocked()){bootHome=true;goHome()}},0);
})();
</script>

function styleCfgList(){
  var m=D.getElementById('main');if(!m)return;
  var cards=Array.prototype.filter.call(m.children,function(el){
    return el.classList&&el.classList.contains('card');
  });
  cards.forEach(function(c){
    var ttl=null;
    for(var i=0;i<c.children.length;i++){
      var el=c.children[i];
      if(el.classList&&el.classList.contains('ttl')){ttl=el;break}
    }
    if(!ttl)return;
    c.classList.add('s14card');ttl.classList.add('s14ttl');
    if(ttl.querySelector('.s14ic'))return;
    var txt=String(ttl.textContent||'').replace(/[▸▾]/g,'').trim();
    var ic=D.createElement('span');ic.className='s14ic';
    ic.innerHTML='<svg viewBox="0 0 24 24">'+iconFor(txt)+'</svg>';
    ttl.insertBefore(ic,ttl.firstChild);
  });
}
window.styleCfgList=styleCfgList;   /* 挂到全局：主程序里的 renderCfg 要用 */
})();
</script>
