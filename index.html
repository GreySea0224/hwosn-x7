/* ================= 【重写】自动总结 =================
   进度单独存在 wh_summark_<角色id> 里，和记忆内容完全分开，
   所以不管记忆怎么改，都不会被覆盖，也不会重复总结同一段。
   只往记忆里「加」，永远不动聊天记录。 */
function autoSumMark(id){const m=load(LS.summark(id),null);return (m&&typeof m.n==='number'&&m.n>=0)?Math.round(m.n):0}
function setAutoSumMark(id,n){save(LS.summark(id),{n:Math.max(0,Math.round(n)),t:Date.now()})}
function autoSumEvery(){const n=parseInt(cfg.autoSumEvery,10);return (Number.isFinite(n)&&n>=4)?n:30}
/* 还差多少条才会自动总结一次（给设置页显示用） */
function autoSumStatus(c){
  if(!c)return '';
  const need=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  const left=Math.max(0,need-(msgs.length-done));
  return '当前 '+msgs.length+' 条，上次总结到第 '+done+' 条，再聊 '+left+' 条就自动总结。';
}
async function maybeAutoSummary(showToast){
  if(!cfg.autoSum)return;
  if(!cfg.key){if(showToast)toast('自动总结已开启，但还没填 API Key');return}
  if(busy)return;
  const c=curChar();if(!c)return;
  const every=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  if(msgs.length-done<every)return;
  const from=Math.max(0,msgs.length-every);
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+msgBrief(x)).join('\n');
  setAutoSumMark(c.id,msgs.length);       /* 先记进度，防止重复总结 */
  saveMem();
  if(showToast)toast('正在自动总结第 '+(from+1)+'~'+msgs.length+' 条…');
  const hit=await runSummary(slice,true);
  if(hit){
    if(showToast)toast('✅ 已自动总结 '+hit+' 条，写进「长期聊天记录总结」（聊天记录没动）');
  }else{
    setAutoSumMark(c.id,done);            /* 失败就退回进度，下次补上，不会漏 */
    if(showToast)toast('自动总结没成功，下次发消息会自动重试');
  }
  const el=document.getElementById('memPane');if(el)refreshMem();
}
/* ---------- 自动发消息 ---------- */
/* 【新增】免打扰可以不设置：把「免打扰时段」的开关关掉，就任何时间都可能主动发消息 */
function isQuiet(a){
  if(!a||a.quietOn===false)return false;
  const h=new Date().getHours(),qs=+a.quietStart,qe=+a.quietEnd;
  if(isNaN(qs)||isNaN(qe))return false;
  return qs<=qe?(h>=qs&&h<qe):(h>=qs||h<qe);
}
function autoEligible(c){return !!(cfg&&cfg.autoOn&&cfg.key&&c&&c.auto&&c.auto.on)}
function autoRange(c){
  const mi=Math.max(1,+c.auto.min||30),ma=Math.max(mi+1,+c.auto.max||90);
  return {mi:mi,ma:ma,ms:(mi+Math.random()*(ma-mi))*MS_PER_MIN};
}
function autoArm(c,force){
  const r=autoRange(c);
  let cur=autoMap[c.id];
  if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
  autoMap[c.id]={at:Date.now()+r.ms,mi:r.mi,ma:r.ma};
}
function scheduleAuto(force){
  if(!chars||!chars.length){if(autoTick){clearInterval(autoTick);autoTick=null}autoMap={};return}
  chars.forEach(c=>{
    if(!autoEligible(c)){delete autoMap[c.id];return}
    autoArm(c,force);
  });
  const live=Object.keys(autoMap).length;
  if(live&&!autoTick)autoTick=setInterval(checkAuto,15000);
  if(!live&&autoTick){clearInterval(autoTick);autoTick=null}
}
async function autoGenerate(c){
  if(!autoKeep)autoKeep={curId:curId,msgs:msgs,mem:mem};
  const wasOpen=(autoKeep.curId===c.id);
  curId=c.id;
  msgs=load(LS.msg(c.id),[]);
  mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{});
  const extra='【系统】现在你先开口。主动给ta发一条消息，1-2 句，符合你的性格和你们平时的相处方式，不解释为什么发。'+(c.auto&&c.auto.hint?('（'+c.auto.hint+'）'):'');
  const tp=thinkParams(c);
  let out='',reasoning='',usage=null;
  await callAPI(buildCtx(c,extra),{stream:true,model:modelOf(c),temp:tp.temp,maxtok:tp.maxtok,signal:(curAbort?curAbort.signal:undefined),
    onDelta:d=>{out+=d},onReasoning:r=>{reasoning+=r},onUsage:u=>{usage=u}});
  if(!out)return false;
  const m={role:'assistant',content:out,t:Date.now(),
    tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out)};
  if(usage&&usage.prompt_tokens)m.ptok=usage.prompt_tokens;
  if(reasoning)m.reasoning=reasoning;      /* ← 自动消息也保存思考链 */
  msgs.push(m);persist();
  pendingAutoText=out;                     /* 如果你正好看着这个聊天，这条会逐字显示 */
  notify(c.name,(c.emoji||'')+out.slice(0,80));
  /* 你没在看着它的时候，标个红点 */
  if(!(wasOpen&&view==='chat'&&!document.hidden)){
    markUnread(c.id);
    toast((c.emoji||'')+' '+c.name+' 发来一条消息');
  }
  /* 【新增】自动发的消息也算进度，够条数就一起自动总结 */
  try{await autoSumForLoaded(c)}catch(e){}
  return true;
}
/* 给「当前 msgs 就是这个角色的聊天记录」这种场景用的自动总结 */
async function autoSumForLoaded(c){
  if(!cfg.autoSum||!cfg.key||!c)return;
  const every=autoSumEvery();
  const done=Math.min(autoSumMark(c.id),msgs.length);
  if(msgs.length-done<every)return;
  const from=Math.max(0,msgs.length-every);
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+msgBrief(x)).join('\n');
  setAutoSumMark(c.id,msgs.length);
  const hit=await runSummary(slice,true,c.id);
  if(!hit)setAutoSumMark(c.id,done);
}
async function runAutoNow(c){
  busy=true;curAbort=new AbortController();
  try{
    await autoGenerate(c);
  }catch(e){
    const aborted=!!(e&&(e.name==='AbortError'||/abort/i.test(e.message||'')));
    if(!aborted)toast('自动消息失败：'+((e&&e.message)||'未知错误'));
  }finally{
    busy=false;curAbort=null;
    if(autoKeep){
      const kc=autoKeep;autoKeep=null;
      curId=kc.curId;
      if(kc.curId===c.id){msgs=load(LS.msg(c.id),[]);mem=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{})}
      else{msgs=kc.msgs;mem=kc.mem}
      if(curId)memCtx={id:curId,obj:mem};
      if(view==='chat')renderChat();
      else draw();
      if(pendingAutoText&&view==='chat'&&curId===c.id)typeLastChatMsg(pendingAutoText);
      pendingAutoText='';
    }
    scheduleAuto(false);
  }
}
async function checkAuto(){
  if(busy||!cfg||!cfg.autoOn||!cfg.key)return;
  const now=Date.now();
  const due=chars.filter(c=>c.auto&&c.auto.on&&autoMap[c.id]&&autoMap[c.id].at<=now&&!isQuiet(c.auto));
  if(!due.length)return;
  due.sort((x,y)=>autoMap[x.id].at-autoMap[y.id].at);
  const c=due[0];
  autoArm(c,true);
  await runAutoNow(c);
}
function notify(title,body){
  if(!cfg.notify)return;
  if(document.visibilityState==='visible')return;
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}
}

/* ---------- 隐私角色：密码 ---------- */
const hasLockPw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.pw));return !!(m&&m.salt)}catch(e){return false}};
const hasPrivPwRaw=()=>{try{const m=JSON.parse(localStorage.getItem(LS.priv));return !!(m&&m.salt)}catch(e){return false}};
const hasAnyPrivPw=()=>hasLockPw()||hasPrivPwRaw();
async function verifyPriv(pw){
  let meta=null;try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(meta&&meta.salt){
    try{const k=await deriveKey(pw,new Uint8Array(meta.salt));if(await decVal(k,meta.check)==='ok')return true}catch(e){}
  }
  let pm=null;try{pm=JSON.parse(localStorage.getItem(LS.priv))}catch(e){}
  if(pm&&pm.salt){
    try{const k=await deriveKey(pw,new Uint8Array(pm.salt));if(await decVal(k,pm.check)==='ok')return true}catch(e){}
  }
  return false;
}
function openPriv(id){
  showSheet('<div class="ttl">🔒 需要密码</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 10px">这是私密角色，输入密码才能进入对话。</p>'+
  '<input id="ppw" type="password" placeholder="密码" autocomplete="off">'+
  '<p id="pperr" class="dim" style="font-size:12px;color:var(--warn);min-height:18px;margin:6px 0 0"></p>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="tryPriv(\''+id+'\')">进入</button>'+
  '<button class="ghost col" onclick="closeSheet()">取消</button></div>');
  setTimeout(()=>{
    const el=document.getElementById('ppw');
    if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')tryPriv(id)})}
  },80);
}
async function tryPriv(id){
  const el=document.getElementById('ppw');
  const err=document.getElementById('pperr');
  const pw=el?el.value:'';
  if(!pw){if(err)err.textContent='请输入密码';return}
  if(!window.crypto||!crypto.subtle){if(err)err.textContent='当前环境不支持密码校验，请用 Chrome/Edge 打开';return}
  if(!hasAnyPrivPw()){if(err)err.textContent='还没设置任何密码，先去「设置 → 隐私角色」设一个';return}
  let ok=false;
  try{ok=await verifyPriv(pw)}catch(e){ok=false}
  if(!ok){if(err)err.textContent='密码不对';return}
  closeSheet();
  loadChar(id);go('chat');
  toast('已进入私密对话');
}
async function setPrivPw(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 打开，或放到 https 网站里。');
  const el=document.getElementById('priv_pw');
  const pw=el?el.value:'';
  if(!pw)return alert('先输入隐私密码');
  if(pw.length<6)return alert('密码至少 6 位');

  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    localStorage.setItem(LS.priv,JSON.stringify({salt:Array.from(salt),check:check}));
    toast('隐私密码已保存');
    renderCfg();
  }catch(e){alert('保存失败：'+e.message)}
}
function clearPrivPw(){
  if(!confirm('清除隐私密码？（之后只能用应用锁密码进入隐私角色）'))return;
  localStorage.removeItem(LS.priv);

}

async function pickImage(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  if(!curChar())return toast('先选个角色再发图');
  toast('处理图片…');
  try{
    pendFile=null;clearPicked();
    pendImg=await shrinkImage(f,760,.72);
    const t=$('#thumb');if(t){t.style.display='';t.src=pendImg}
    $('#picked').classList.add('on');
    updSendBtn();
    toast('图片已就绪，点发送');
  }catch(e){toast('图片读不了：'+((e&&e.message)||e))}
}
async function pickFile(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  if(!curChar())return toast('先选个角色再发');
  /* 选到的是图片，就按图片走 */
  if(String(f.type||'').indexOf('image/')===0){pickImage({files:[f],value:''});return}
  const rec={name:f.name||'文件',size:f.size||0,type:f.type||'',kind:'other'};
  if(isTextFile(f)){
    try{
      const t=await f.text();
      rec.kind='text';rec.text=String(t||'').slice(0,FILE_TXT_MAX);rec.trunc=String(t||'').length>FILE_TXT_MAX;
    }catch(e){rec.kind='other'}
  }
  clearPicked();
  pendFile=rec;
  showFchip(rec);
  updSendBtn();
  toast(rec.kind==='text'?'文件已就绪（内容会读给ta看）':'文件已就绪（这种格式只看得到名字）');
}
/* 压缩图片：最长边限制到 max 像素，转 jpeg，避免把存储撑爆 */
function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return rej(new Error('图片尺寸异常'));
        const s=Math.min(1,max/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        let url=cv.toDataURL('image/jpeg',q);
        if(url.length>420000)url=cv.toDataURL('image/jpeg',.5);
        res(url);
      };
      img.onerror=()=>rej(new Error('这不是有效的图片'));
      img.src=String(rd.result);
    };
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsDataURL(file);
  });
}

/* ---------- 小工具（纯本地互动）
   【改动】加了「随机中 → 随机完成」的过渡动画：滚动预览 + 进度条 + 结果弹出。
   动画只刷新结果区（#funBoxOut），所以不会清空你填的输入框。 */
function funBoxHTML(){

    '<div class="funroll"><div class="funroll-in">'+esc(funTxt||'· · ·')+'</div>'+

  }

    '<div class="funres">'+esc(funResult)+'</div>'+

function funRefresh(){const el=document.getElementById('funBoxOut');if(el)el.innerHTML=funBoxHTML()}
function funHTML(){
  return '<div class="card"><div class="ttl">小工具（互动）</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 10px">不用联网的小玩法，纯本地随机。</p>'+
  '<div class="row"><button class="col" onclick="funDice()">🎲 掷骰子</button>'+
  '<button class="col" onclick="funCoin()">🪙 抛硬币</button></div>'+
  '<div class="row" style="margin-top:8px"><input id="funMax" class="col" type="number" value="100" placeholder="最大数"><button onclick="funRand()">抽数字</button></div>'+
  '<div class="row" style="margin-top:8px"><input id="funList" class="col" placeholder="逗号分隔，比如：吃火锅,吃面,点外卖"><button onclick="funPick()">抽一个</button></div>'+
  '<div id="funBoxOut">'+funBoxHTML()+'</div></div>';
}
/* preview()：滚动时随机显示的假结果；result()：真正的结果 */
function funRun(preview,result){
  if(funRolling)return;
  funRolling=true;funResult='';funTxt='· · ·';
  funEnd=Date.now()+820;
  clearInterval(funSpin);
  funRefresh();
  funSpin=setInterval(()=>{
    funTxt=preview();
    funRefresh();
    if(Date.now()>=funEnd){
      clearInterval(funSpin);funSpin=null;
      funRolling=false;funTxt='';
      funResult=result();
      funRefresh();
      toast('✅ 随机完成');
    }
  },80);
}
function funDice(){funRun(()=>'🎲 '+(1+Math.floor(Math.random()*6)),()=>'🎲 '+(1+Math.floor(Math.random()*6)))}
function funCoin(){funRun(()=>Math.random()<.5?'🪙 正面':'🪙 反面',()=>Math.random()<.5?'🪙 正面':'🪙 反面')}
function funRand(){const el=$('#funMax');const n=Math.max(1,Math.round(Number(el?el.value:100)||100));funRun(()=>'🔢 '+(1+Math.floor(Math.random()*n)),()=>'🔢 '+(1+Math.floor(Math.random()*n)))}
function funPick(){
  const el=$('#funList');
  const arr=String(el?el.value:'').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean);
  if(!arr.length)return toast('先填几个选项，用逗号隔开');
  funRun(()=>'👉 '+arr[Math.floor(Math.random()*arr.length)],()=>'👉 '+arr[Math.floor(Math.random()*arr.length)]);

function gmemOf(cid){return load(LS.gmem(cid),[])}
function gmemAdd(cid,gid,gname,text,self){
  const arr=gmemOf(cid);
  arr.push({t:Date.now(),gid:gid,gn:gname,tx:String(text||'').slice(0,300),me:!!self});
  while(arr.length>120)arr.shift();

function gmemBlock(cid,gid,limit){
  const arr=gmemOf(cid).filter(x=>!gid||x.gid===gid).slice(-(limit||10));
  if(!arr.length)return '';
  return arr.map(x=>'- 在《'+(x.gn||'群')+'》里你说：'+x.tx).join('\n');
}
/* 私聊时注入「你在群里的事」（只有开了群聊权限的角色才有） */

  if(!c||!c.groupPerm||!c.groupPerm.on)return '';

  arr.slice(-10).map(x=>'- 在《'+(x.gn||'群')+'》里你说：'+x.tx).join('\n');

/* ================= 演绎记忆（【新增】角色可选择性看见） =================
   演绎是独立的一条世界线：默认只有「演绎」能看见私聊记忆，反过来不行。
   角色在「角色 → 编辑」里勾上「能看见演绎记忆」，私聊时才会带上它在演绎里的经历。 */
const ACTMEM_MAX=2600;                 /* 整体注入字数上限 */
function actMemBlock(c){
  if(!c||!c.actMem||!c.actMem.on)return '';
  let acts=[];
  try{acts=load('wh_acts',[])||[]}catch(e){return ''}
  const mine=acts.filter(a=>a&&Array.isArray(a.members)&&a.members.some(m=>m&&m.cid===c.id));
  if(!mine.length)return '';
  mine.sort((a,b)=>(b.lastAt||b.t||0)-(a.lastAt||a.t||0));
  const per=Math.max(2,Math.min(60,Number(c.actMem.n)||12));
  const out=[];let used=0;
  for(const a of mine){
    if(out.length>=4)break;                       /* 最多带 4 场 */
    let ms=[];try{ms=load('wh_actmsg_'+a.id,[])||[]}catch(e){}
    const lines=ms.slice(-per).map(m=>{
      const who=(m.role==='user')?(cfg.userName||'她'):(m.role==='narr'?'旁白':((charOf(m.cid)||{}).name||'角色'));
      const t=String(m.content||'').trim().replace(/\n+/g,' ');
      return t?(who+'：'+t.slice(0,240)):'';
    }).filter(Boolean);
    if(!lines.length)continue;
    const block='【'+String(a.name||'演绎')+'】\n'+lines.join('\n');
    if(used+block.length>ACTMEM_MAX)break;
    used+=block.length;out.push(block);
  }
  if(!out.length)return '';
  return '【你在「演绎」里的经历】下面是你在另一条世界线（「演绎」：另一种设定和剧情）里亲历过的最近片段。'+
    '演绎和现在的日常是分开的两条线：如果你们没在日常里提过，就不要假设对方知道这些事，也不要主动把演绎里的设定当成现在的现实；'+
    '但她提到相关的人和事时，你记得，可以自然接话。\n\n'+out.join('\n\n');
}
/* ================= 群聊工具（【新增】角色可调用） =================
   角色开了「群聊权限」后，在私聊里也能自己看群、自己在群里发言。 */
const GROUP_TOOLS=[
  {type:'function',function:{name:'list_my_groups',description:'查看自己所在的群聊列表（群名、成员、群id）。想参与群聊前先看这个。',parameters:{type:'object',properties:{}}}},
  {type:'function',function:{name:'read_group',description:'读取某个群聊最近的聊天消息，看看大家在聊什么。',parameters:{type:'object',properties:{group:{type:'string',description:'群名或群id'},limit:{type:'integer',description:'读几条，默认10，最多30'}},required:['group']}}},
  {type:'function',function:{name:'send_group_message',description:'以你自己的身份，在某个群里发一条消息。只能用自己的身份发，不能替别人说话。',parameters:{type:'object',properties:{group:{type:'string',description:'群名或群id'},text:{type:'string',description:'要发的内容'}},required:['group','text']}}}
];
function groupsOfChar(cid){return groupsAll().filter(g=>(g.members||[]).some(m=>m.cid===cid))}
function findGroupFlex(q,cid){
  q=String(q||'').trim();if(!q)return null;
  const gs=groupsOfChar(cid);
  return gs.find(g=>g.id===q)||gs.find(g=>g.name===q)||gs.find(g=>String(g.name).indexOf(q)>=0)||null;
}
function execGroupTool(name,args,cid){
  const nmOf=id=>{const x=charOf(id);return x?x.name:'某人'};
  if(name==='list_my_groups'){
    const gs=groupsOfChar(cid);
    if(!gs.length)return {ok:true,msg:'你还没有加入任何群聊。'};
    return {ok:true,msg:'你所在的群：\n'+gs.map(g=>'· 群名：'+g.name+'（id:'+g.id+'，'+g.members.length+'人，成员：'+g.members.map(m=>nmOf(m.cid)).join('、')+'）').join('\n')};
  }
  const g=findGroupFlex(args&&args.group,cid);
  if(!g)return {ok:false,msg:'没找到这个群。先调用 list_my_groups 看看你在哪些群里。'};
  if(name==='read_group'){
    const lim=Math.max(1,Math.min(30,Math.round(Number(args&&args.limit)||10)));
    const arr=gmsgsOf(g.id).slice(-lim);
    if(!arr.length)return {ok:true,msg:'《'+g.name+'》里还没有人说话。'};
    return {ok:true,msg:'《'+g.name+'》最近的聊天：\n'+arr.map(m=>(m.role==='user'?(cfg.userName||'她'):nmOf(m.cid))+'：'+(m.content||'')).join('\n')};
  }
  if(name==='send_group_message'){
    const text=String((args&&args.text)||'').trim().slice(0,500);
    if(!text)return {ok:false,msg:'内容为空，没发出去。'};
    const arr=gmsgsOf(g.id);
    arr.push({role:'char',cid:cid,content:text,t:Date.now(),tok:estTokens(text)});
    saveGmsgs(g.id,arr);
    gmemAdd(cid,g.id,g.name,text,true);
    if(view==='tools'&&toolTab==='group'){renderToolPane();if(groupOpenId===g.id)scrollGroupDown()}
    return {ok:true,msg:'已在《'+g.name+'》里以你的身份发出：'+text};
  }
  return {ok:false,msg:'未知操作'};
}

/* ================= 群聊 =================
   数据结构：
   LS.groups  = [{id,name,members:[{cid,reply:'user'|'both',auto:bool}],
                  chain:0.6,maxAI:6,maxRound:3,autoMin:15,autoMax:60,created:t}]
   LS.gmsg(id)= [{role:'user'|'char',cid,content,t,tok}]
   LS.gmem(cid)=[{t,gid,gn,tx,me}]  角色在群里的记忆（它自己说过的话）

async function groupSend(){

async function groupKick(){

  groupFollow=true;

/* 群聊的「停不下来」保险：
   1) 一次触发最多 maxAI 条角色消息
   2) 最多来回 maxRound 轮
   3) 只有 reply='both' 的角色才接别人的话，而且每次接话有 chain 概率
   4) 不会马上自己接自己 */
async function groupRun(g,trigger){
  if(groupBusy)return;
  groupBusy=true;
  renderToolPane();
  const chain=(typeof g.chain==='number')?g.chain:GRP_CHAIN_DEF;
  const maxAI=Math.max(1,Math.min(20,Number(g.maxAI)||GRP_MAXAI_DEF));
  const maxRound=Math.max(1,Math.min(6,Number(g.maxRound)||GRP_MAXROUND_DEF));
  let total=0;
  try{
    for(let round=1;round<=maxRound;round++){
      const roster=g.members.filter(m=>round===1?true:(m.reply==='both'));
      for(let i=roster.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=roster[i];roster[i]=roster[j];roster[j]=t}
      let spoke=false;
      for(const m of roster){
        if(total>=maxAI)break;
        const c=charOf(m.cid);if(!c)continue;
        const arr=gmsgsOf(g.id);
        const last=arr[arr.length-1];
        if(last&&last.role==='char'&&last.cid===m.cid)continue;
        if(round>1&&Math.random()>chain)continue;
        const out=await groupGenerate(g,c);
        if(!out||!out.text)continue;
        const a2=gmsgsOf(g.id);
        a2.push({role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok});
        saveGmsgs(g.id,a2);
        gmemAdd(c.id,g.id,g.name,out.text,true);   /* 【新增】记进它自己的群聊记忆 */
        total++;spoke=true;
        renderToolPane();scrollGroupDown();
      }
      if(!spoke)break;
    }
    if(total>=maxAI)toast('本轮发言到上限了，先歇一歇（防刷屏）');
  }catch(e){
    toast('群聊出错：'+((e&&e.message)||e));
  }finally{
    groupBusy=false;
    renderToolPane();scrollGroupDown();
    scheduleGroupAuto(false);
  }
}
/* 让某个角色在群里说一句（返回 {text,tok}，失败返回 null） */
/* 组装群聊发言的上下文；同时把“取角色名”的小函数交给调用处。 */
function buildGroupContext(g,c){
  const arr=gmsgsOf(g.id).slice(-24);
  const nm=id=>{const x=charOf(id);return x?x.name:'某人'};
  const me=(cfg.userName||'她');
  const others=g.members.filter(m=>m.cid!==c.id).map(m=>nm(m.cid)).filter(Boolean);
  const sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  const gm=gmemBlock(c.id,g.id,10);           /* 【新增】带上它自己的群聊记忆 */
  if(gm)sys.push('【你在这个群里的记忆】你之前在这个群里说过下面这些，你要记得，别和它们矛盾：\n'+gm);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  if(c.examples)sys.push('【对话示例】'+c.examples);
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');
  const hist=arr.map(m=>({role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}));
  const ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  ctx.push({role:'user',content:'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  return {ctx:ctx,nm:nm};
}
/* 清掉模型可能带上的角色名前缀和引号。 */
function cleanGroupOutput(out,names){
  for(const n of names){
    if(!n)continue;
    if(out.indexOf(n+'：')===0)out=out.slice((n+'：').length).trim();
    if(out.indexOf(n+':')===0)out=out.slice((n+':').length).trim();
  }
  out=out.replace(/^["'“”]+|["'“”]+$/g,'').trim();
  if(out.length>500)out=out.slice(0,500);
  return out;
}
async function groupGenerate(g,c){
  const built=buildGroupContext(g,c);
  const ctx=built.ctx,nm=built.nm;
  const tp=thinkParams(c);
  let out='',usage=null;
  try{
    out=String(await callAPI(ctx,{stream:false,model:modelOf(c),temp:tp.temp,maxtok:Math.min(400,tp.maxtok||400),onUsage:u=>usage=u})||'').trim();
  }catch(e){return null}
  const names=[c.name].concat(g.members.map(m=>nm(m.cid)));
  out=cleanGroupOutput(out,names);
  if(!out)return null;
  return {text:out,tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out)};
}
/* 群里的自动发消息 */
function groupAutoEligible(g,m){return !!(cfg&&cfg.key&&m&&m.auto&&charOf(m.cid))}
function groupAutoRange(g){const mi=Math.max(1,Number(g.autoMin)||15),ma=Math.max(mi+1,Number(g.autoMax)||60);return {mi:mi,ma:ma}}
function scheduleGroupAuto(force){
  if(!chars||!chars.length){if(groupTick){clearInterval(groupTick);groupTick=null}return}
  groupsAll().forEach(g=>{
    (g.members||[]).forEach(m=>{
      const k=g.id+'|'+m.cid;
      if(!groupAutoEligible(g,m)){delete gAutoMap[k];return}
      const r=groupAutoRange(g);
      const cur=gAutoMap[k];
      if(!force&&cur&&cur.mi===r.mi&&cur.ma===r.ma)return;
      gAutoMap[k]={at:Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*MS_PER_MIN,mi:r.mi,ma:r.ma};
    });
  });
  const live=Object.keys(gAutoMap).length;
  if(live&&!groupTick)groupTick=setInterval(checkGroupAuto,20000);
  if(!live&&groupTick){clearInterval(groupTick);groupTick=null}
}
async function checkGroupAuto(){
  if(groupBusy||busy||!cfg||!cfg.key)return;
  const now=Date.now();
  for(const g of groupsAll()){
    for(const m of g.members||[]){
      const k=g.id+'|'+m.cid;
      const rec=gAutoMap[k];
      if(!rec||rec.at>now)continue;
      /* 【新增】角色自己设了免打扰时段（且开着）时，群里也不打扰 */
      const mc=charOf(m.cid);
      if(mc&&isQuiet(mc.auto||{}))continue;
      const r=groupAutoRange(g);
      gAutoMap[k].at=Date.now()+(r.mi+Math.random()*(r.ma-r.mi))*MS_PER_MIN;
      await groupAutoSpeak(g,m);
      return;                     /* 一次只发一条，绝不批量刷屏 */
    }
  }
}
async function groupAutoSpeak(g,m){
  const c=charOf(m.cid);if(!c)return;
  if(groupBusy)return;
  groupBusy=true;
  try{
    const out=await groupGenerate(g,c);
    if(!out||!out.text)return;
    const arr=gmsgsOf(g.id);
    arr.push({role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok});
    saveGmsgs(g.id,arr);
    gmemAdd(c.id,g.id,g.name,out.text,true);
    const watching=(groupOpenId===g.id&&view==='tools'&&toolTab==='group'&&!document.hidden);
    if(watching){renderToolPane();scrollGroupDown();toast((c.emoji||'')+' '+c.name+'：'+out.text.slice(0,22));}
    else{markUnread(c.id);toast((c.emoji||'')+' '+c.name+' 在《'+g.name+'》里发了一条');}
  }catch(e){}finally{
    groupBusy=false;
    if(view==='tools'&&toolTab==='group'){renderToolPane();scrollGroupDown()}
  }
}

function saveGroupSettings(id){
  const gs=groupsAll();const g=gs.find(x=>x.id===id);if(!g)return;
  const v=i=>{const el=document.getElementById(i);return el?el.value:''};
  const ck=i=>{const el=document.getElementById(i);return !!(el&&el.checked)};
  g.name=(v('ge_name').trim()||g.name);
  (g.members||[]).forEach((m,i)=>{
    const sel=document.getElementById('gr_'+i);
    if(sel)m.reply=(sel.value==='both')?'both':'user';
    m.auto=ck('ga_'+i);
  });
  chars.forEach(c=>{if(ck('gadd_'+c.id)&&!memberOf(g,c.id))g.members.push({cid:c.id,reply:'user',auto:false})});
  g.chain=Math.min(1,Math.max(0,(Number(v('ge_chain'))||60)/100));
  g.maxAI=Math.min(20,Math.max(1,Math.round(Number(v('ge_maxai'))||GRP_MAXAI_DEF)));
  g.maxRound=Math.min(6,Math.max(1,Math.round(Number(v('ge_round'))||GRP_MAXROUND_DEF)));

  g.autoMax=Math.max(g.autoMin+1,Math.round(Number(v('ge_amax'))||60));
  saveGroups(gs);
  closeSheet();
  scheduleGroupAuto(true);
  if(view==='tools'){toolTab='group';renderTools()}
  toast('群设置已保存');
}
function kickMember(id,i){

  const g=findGroup(id);
  if(g)(g.members||[]).forEach(m=>{const cur=gmemOf(m.cid);const left=cur.filter(x=>x.gid!==id);if(left.length!==cur.length)save(LS.gmem(m.cid),left)});
  saveGroups(groupsAll().filter(g2=>g2.id!==id));

/* ---------- 隐私：应用锁密码 ---------- */
/* 加密前先把本地明文数据收进 store。 */
function collectPlainStore(){
  if(store)return store;
  store={};
  for(const k of allDataKeys()){
    const raw=localStorage.getItem(k);
    if(raw==null)continue;
    try{store[k]=JSON.parse(raw)}catch(e){}
  }
  return store;
}
/* 把本地存储里的数据加密后写回。 */
async function encryptStoreToLocal(key){
  const entries={};
  for(const k of Object.keys(store)){entries[k]=await encVal(key,JSON.stringify(store[k]))}
  for(const k of Object.keys(entries)){localStorage.setItem(k,entries[k])}
}
/* 把 IndexedDB 里的数据加密后写回。 */
async function reencryptIndexedDb(key,oldKey){
  for(const st of ['arc','rawlog']){
    let ks=[];try{ks=await idbKeys(st)}catch(e){}
    for(const k of ks){
      let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
      let val;
      if(oldKey){try{val=JSON.parse(await decVal(oldKey,raw))}catch(e){continue}}
      else val=raw;
      try{await idbPutRaw(k,await encVal(key,JSON.stringify(val)),st)}catch(e){}
    }
  }
}
async function setPassword(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 直接打开这个文件，或放到 https 网站里。');
  const pw=$('#s_pw').value;
  if(!pw)return alert('先输入密码');
  if(pw.length<6)return alert('密码至少 6 位');

  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    const oldKey=cryptKey;
    collectPlainStore();

/* 1) 底层请求：把接口的真实报错原样抛出来（原来被吞掉了，所以只看到“模型不对”） */
async function rawChat(messages,opt){
  opt=opt||{};
  const url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  const body={model:(opt.model||cfg.model),messages:messages,stream:!!opt.stream};
  if(opt.temp!=null)body.temperature=opt.temp;
  if(opt.maxtok)body[opt.tokName||'max_tokens']=opt.maxtok;
  if(opt.stream)body.stream_options={include_usage:true};
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  if(!res.ok){let t='';try{t=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t).replace(/\s+/g,' ').slice(0,200))}
  if(!opt.stream){
    const j=await res.json();
    const m=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
    return String(m.content||'');
  }
  let out='';
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const ls=buf.split('\n');buf=ls.pop();
    for(const raw of ls){
      const line=raw.trim();if(!line||line.indexOf('data:')!==0)continue;
      const d=line.slice(5).trim();if(d==='[DONE]')return out;
      try{const j=JSON.parse(d);const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)out+=c}catch(e){}
    }
  }
  return out;
}
/* 2) 给「非流式」调用加一层自动重试：换模型 → 去掉参数 → 换 max_completion_tokens → 改流式 */
/*    （聊天用的流式请求完全不动；带 tools 的请求原样走，避免破坏工具调用） */
const _origCallAPI=callAPI;
callAPI=async function(messages,opt){
  opt=opt||{};
  if(opt.stream||opt.tools)return _origCallAPI(messages,opt);
  const model=opt.model||cfg.model;
  const model2=(cfg.model&&cfg.model!==model)?cfg.model:null;
  const base={temp:(opt.temp!=null?opt.temp:cfg.temp),maxtok:(opt.maxtok||cfg.maxtok)};
  const tries=[
    {model:model,temp:base.temp,maxtok:base.maxtok},
    model2?{model:model2,temp:base.temp,maxtok:base.maxtok}:null,
    {model:model,temp:null,maxtok:null},
    {model:model2||model,temp:null,maxtok:null,tokName:'max_completion_tokens'},
    {model:model,temp:null,maxtok:null,stream:true}
  ].filter(Boolean);
  let lastErr=null;
  for(const t of tries){
    try{
      const r=await rawChat(messages,t);
      if(String(r==null?'':r).trim())return r;
      lastErr=new Error('模型返回空内容');
    }catch(e){lastErr=e}
  }
  throw (lastErr||new Error('调用失败'));
};
/* 3) 重写总结：失败时把真实原因显示出来，不再只说“检查模型” */
/* 自动总结：模型没按格式回时，把原文存进长期总结。 */
function storeSummaryFallback(M,raw){
  if((cfg.sumWrite||'append')==='replace')M.summaries=[];
  M.summaries=M.summaries||[];
  M.summaries.push({t:Date.now(),text:raw.slice(0,2000)});
  return 1;
}
runSummary=async function(slice,silent,targetId){
  const c=chars.find(x=>x.id===(targetId||curId))||curChar();
  if(!c)return 0;
  const isCur=(!targetId||targetId===curId);
  const M=isCur?mem:(memCtx.id===targetId?memCtx.obj:Object.assign(EMPTY_MEM(),load(LS.mem(targetId),null)||{}));
  try{
    const prev=(M.summaries&&M.summaries.length)?M.summaries[M.summaries.length-1].text:'';
    const res=await callAPI([{role:'user',content:buildSummaryPrompt(slice,prev)}],{model:modelOf(c),temp:.3,maxtok:1600});
    const raw=String(res||'').trim();
    if(!raw){if(!silent)alert('模型没返回内容（可能被限流，或这个模型不支持长输出）');return 0}
    let hit=applySummary(M,parseSummary(raw));
    let fallback=false;
    if(!hit){
      hit=storeSummaryFallback(M,raw);fallback=true;
    }
    if(isCur)saveMem();else save(LS.mem(targetId),M);
    refreshMem();
    if(!silent)alert(fallback?'模型没按格式回，已把原文存进「长期聊天记录总结」，去记忆里整理一下':'已写进记忆 '+hit+' 条（原始聊天记录没有删）');
    return hit;
  }catch(e){
    const m=String((e&&e.message)||e).slice(0,200);
    if(!silent)alert('总结失败，接口原话：\n'+m+'\n\n怎么排查：\n· 提到 model / 不存在 → 模型名写错了，看「设置 → 默认模型」，也检查角色里单独指定的模型\n· 401 / 403 → Key 不对\n· 429 → 额度或频率用完\n· 400 参数 → 已经把 temperature / max_tokens 去掉重试过了，还是不行就换个模型');
    else toast('自动总结失败：'+m.slice(0,90));
    console.warn('总结失败',e);

  }

/* 4) 设置保存加固：不再把过小的值悄悄改成 30，并回报真正保存了什么 */
readCfgInputs=function(){
  const v=i=>{const el=document.getElementById(i);return el?el.value.trim():''};
  if(!document.getElementById('c_base'))return;
  cfg.base=v('c_base')||cfg.base;
  cfg.key=v('c_key');
  cfg.model=v('c_model')||cfg.model;
  const t=Number(v('c_temp'));cfg.temp=Number.isFinite(t)?t:.85;
  const mt=parseInt(v('c_maxtok'),10);cfg.maxtok=(Number.isFinite(mt)&&mt>0)?mt:900;
  const cx=parseInt(v('c_ctx'),10);cfg.ctx=Number.isFinite(cx)?cx:30;
  const se=parseInt(v('c_autoSumEvery'),10);
  if(Number.isFinite(se))cfg.autoSumEvery=Math.max(2,Math.min(2000,Math.round(se)));
  const ck=document.getElementById('c_autoSum');
  if(ck)cfg.autoSum=!!ck.checked;
};
saveAutoSum=function(){
  const ck=document.getElementById('c_autoSum');
  const el=document.getElementById('c_autoSumEvery');
  const raw=el?String(el.value).trim():'';
  let n=parseInt(raw,10);
  const bad=!Number.isFinite(n);
  if(bad)n=30;
  const clamped=Math.max(2,Math.min(2000,Math.round(n)));
  cfg.autoSum=!!(ck&&ck.checked);
  cfg.autoSumEvery=clamped;
  save(LS.cfg,cfg);
  if(el)el.value=clamped;
  alert('✅ 设置已保存\n自动总结：'+(cfg.autoSum?'开':'关')+'\n每聊满 '+clamped+' 条，总结一次'+
    (bad?('\n\n（“'+raw+'”不是数字，已按 30 处理）'):(String(clamped)!==raw?('\n\n（最小 2、最大 2000，你填的“'+raw+'”已按 '+clamped+' 处理）'):''))+
    (cfg.autoSum?('\n\n'+autoSumStatus(curChar())):''));
  renderCfg();
};
saveMemInj=function(){
  const a=document.getElementById('c_arcTop');
  const w=document.getElementById('c_wholeLimit');
  const f=document.getElementById('c_fullLimit');
  const se=document.getElementById('c_autoSumEvery');
  const sa=document.getElementById('c_autoSum');
  const na=a?Number(a.value):NaN;
  const nw=w?Number(w.value):NaN;
  const nf=f?Number(f.value):NaN;
  cfg.arcTop=Number.isFinite(na)?Math.max(0,Math.round(na)):5;
  cfg.wholeLimit=Number.isFinite(nw)?Math.max(0,Math.round(nw)):20000;
  cfg.fullLimit=Number.isFinite(nf)?Math.max(0,Math.round(nf)):20000;
  if(se){const n=parseInt(se.value,10);if(Number.isFinite(n))cfg.autoSumEvery=Math.max(2,Math.min(2000,Math.round(n)));}
  if(sa)cfg.autoSum=!!sa.checked;
  save(LS.cfg,cfg);
  alert('✅ 已保存\n· 自动摘录 '+(cfg.arcTop||'关')+' 条\n· 整份注入上限 '+(cfg.wholeLimit||'不限')+' 字\n· 完整记录上限 '+(cfg.fullLimit||'不限')+' 字\n· 自动总结：'+(cfg.autoSum?('开，每 '+cfg.autoSumEvery+' 条'):'关'));
  renderCfg();
};

/* ---------- ②③ 群聊发言：同步私聊记录 + 记上下文 token ---------- */
groupGenerate=async function(g,c){
  const arr=gmsgsOf(g.id).slice(-24);
  const nm=id=>{const x=charOf(id);return x?x.name:'某人'};
  const me=(cfg.userName||'她');
  const others=g.members.filter(m=>m.cid!==c.id).map(m=>nm(m.cid)).filter(Boolean);
  const sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  /* ② 同步私聊的聊天记录 */
  const mm=memberOf(g,c.id);
  if(mm&&mm.sync){
    const pv=load(LS.msg(c.id),[]).slice(-Math.max(1,Math.min(60,Number(g.syncN)||20)));
    if(pv.length){
      const t=pv.map(x=>(x.role==='user'?me:c.name)+'：'+msgBrief(x)).join('\n');
      sys.push('【你和'+me+'私聊的最近记录】下面是你和'+me+'私下聊天的最近 '+pv.length+' 条。你在群里同样记得这些事，可以自然提起，但不要逐条复述：\n'+t);
    }
  }
  const gm=gmemBlock(c.id,g.id,10);
  if(gm)sys.push('【你在这个群里的记忆】你之前在这个群里说过下面这些，你要记得，别和它们矛盾：\n'+gm);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  if(c.examples)sys.push('【对话示例】'+c.examples);
  /* ⑦ 联网搜索（角色开了才用，搜索过程实时显示在群聊上方） */
  let sMeta=null;
  if(c.search&&c.search.on&&cfg.key){
    try{
      const conv=arr.slice(-6).map(m=>(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')).join('\n');
      const r=await searchForChar(c,conv,function(t){groupStatusLine(g.id,t)});
      if(r){sys.push(r.block);sMeta={q:r.q,list:r.list}}
      groupStatusLine(g.id,'');
    }catch(e){groupStatusLine(g.id,'')}
  }
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');
  const hist=arr.map(m=>({role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}));
  const ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  ctx.push({role:'user',content:'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  const tp=thinkParams(c);
  let out='',usage=null;
  try{
    out=String(await callAPI(ctx,{stream:false,model:modelOf(c),temp:tp.temp,maxtok:Math.min(400,tp.maxtok||400),onUsage:u=>usage=u})||'').trim();
  }catch(e){return null}
  const names=[c.name].concat(g.members.map(m=>nm(m.cid)));
  for(const n of names){
    if(!n)continue;
    if(out.indexOf(n+'：')===0)out=out.slice((n+'：').length).trim();
    if(out.indexOf(n+':')===0)out=out.slice((n+':').length).trim();
  }
  out=out.replace(/^["'“”]+|["'“”]+$/g,'').trim();
  if(out.length>500)out=out.slice(0,500);
  if(!out)return null;
  return {text:out,tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out),ptok:(usage&&usage.prompt_tokens)?usage.prompt_tokens:0,search:sMeta};
};
/* 群聊：按轮次和优先级挑出本轮可能发言的人。 */
function groupPrioValue(m){
  if(!m||m.prio==null||m.prio==='')return 50;
  var p=Number(m.prio);
  return isFinite(p)?p:50;
}
function groupRoundRoster(g,round,prioFn){
  var pf=typeof prioFn==='function'?prioFn:groupPrioValue;
  var roster=(g.members||[]).filter(function(m){return round===1?true:(m.reply==='both')}).slice();
  roster.sort(function(a,b){return pf(a)-pf(b)});
  return roster;
}
/* 群聊：保存一条角色生成的群消息和群记忆。 */
function saveGroupGeneratedMsg(g,c,out){
  var mid=out.id||uid();
  var a2=gmsgsOf(g.id);
  a2.push({id:mid,role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok,ptok:out.ptok,search:out.search});
  saveGmsgs(g.id,a2);
  gmemAdd(c.id,g.id,g.name,out.text,true,mid);
}
/* 群聊：跑一轮发言。返回这一轮是否有人发言、发言了几条。 */
async function runGroupRound(g,round,chain,maxAI,total,prioFn){
  var roster=groupRoundRoster(g,round,prioFn);
  var spoke=false,speaks=0;
  for(var ri=0;ri<roster.length;ri++){
    var m=roster[ri];
    if(total+speaks>=maxAI)break;
    var c=charOf(m.cid);if(!c)continue;
    var arr=gmsgsOf(g.id),last=arr[arr.length-1];
    if(last&&last.role==='char'&&last.cid===m.cid)continue;
    if(round>1&&Math.random()>chain)continue;
    var out=await groupGenerate(g,c);
    if(!out||!out.text)continue;
    saveGroupGeneratedMsg(g,c,out);
    speaks++;spoke=true;
    renderToolPane();scrollGroupDown();
  }
  return {spoke:spoke,speaks:speaks};
}
groupRun=async function(g,trigger){
  if(groupBusy)return;
  groupBusy=true;
  renderToolPane();
  const chain=(typeof g.chain==='number')?g.chain:GRP_CHAIN_DEF;
  const maxAI=Math.max(1,Math.min(20,Number(g.maxAI)||GRP_MAXAI_DEF));
  const maxRound=Math.max(1,Math.min(6,Number(g.maxRound)||GRP_MAXROUND_DEF));
  let total=0;
  try{
    for(let round=1;round<=maxRound;round++){
      const roster=g.members.filter(m=>round===1?true:(m.reply==='both'));
      for(let i=roster.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=roster[i];roster[i]=roster[j];roster[j]=t}
      let spoke=false;
      for(const m of roster){
        if(total>=maxAI)break;
        const c=charOf(m.cid);if(!c)continue;
        const arr=gmsgsOf(g.id);
        const last=arr[arr.length-1];
        if(last&&last.role==='char'&&last.cid===m.cid)continue;
        if(round>1&&Math.random()>chain)continue;
        const out=await groupGenerate(g,c);
        if(!out||!out.text)continue;
        const a2=gmsgsOf(g.id);
        a2.push({role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok,ptok:out.ptok,search:out.search});
        saveGmsgs(g.id,a2);
        gmemAdd(c.id,g.id,g.name,out.text,true);
        total++;spoke=true;
        renderToolPane();scrollGroupDown();
      }
      if(!spoke)break;
    }
    if(total>=maxAI)toast('本轮发言到上限了，先歇一歇（防刷屏）');
  }catch(e){
    toast('群聊出错：'+((e&&e.message)||e));
  }finally{
    groupBusy=false;
    renderToolPane();scrollGroupDown();
    scheduleGroupAuto(false);
  }
};
groupAutoSpeak=async function(g,m){
  const c=charOf(m.cid);if(!c)return;
  if(groupBusy)return;
  groupBusy=true;
  try{
    const out=await groupGenerate(g,c);
    if(!out||!out.text)return;
    const arr=gmsgsOf(g.id);
    arr.push({role:'char',cid:c.id,content:out.text,t:Date.now(),tok:out.tok,ptok:out.ptok,search:out.search});
    saveGmsgs(g.id,arr);
    gmemAdd(c.id,g.id,g.name,out.text,true);

    if(watching){renderToolPane();scrollGroupDown();toast((c.emoji||'')+' '+c.name+'：'+out.text.slice(0,22));}
    else{markUnread(c.id);toast((c.emoji||'')+' '+c.name+' 在《'+g.name+'》里发了一条');}
  }catch(e){}finally{
    groupBusy=false;
    if(view==='tools'&&toolTab==='group'){renderToolPane();scrollGroupDown()}
  }
};

/* ---------- ⑦ 联网搜索 ---------- */
function webCfg(){
  if(!cfg.web)cfg.web={engine:'wiki',key:'',base:'',lang:'zh',count:5};
  return cfg.web;
}
/* 联网搜索：Tavily。 */
async function searchTavily(q,n,w){
  const r=await fetch(String(w.base||'https://api.tavily.com').replace(/\/+$/,'')+'/search',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:w.key,query:q,max_results:n,search_depth:'basic'})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status+' '+String(j.detail||j.message||'').slice(0,120));
  return (j.results||[]).map(x=>({title:String(x.title||''),url:String(x.url||''),snippet:String(x.content||'')}));
}
/* 联网搜索：Serper。 */
async function searchSerper(q,n,w){
  const r=await fetch(String(w.base||'https://google.serper.dev').replace(/\/+$/,'')+'/search',
    {method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':w.key||''},body:JSON.stringify({q:q,gl:'cn',hl:'zh-cn',num:n})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status+' '+String(j.message||'').slice(0,120));
  return (j.organic||[]).map(x=>({title:String(x.title||''),url:String(x.link||''),snippet:String(x.snippet||'')}));
}
/* 联网搜索：Bing。 */
async function searchBing(q,n,w){
  const r=await fetch('https://api.bing.microsoft.com/v7.0/search?count='+n+'&mkt=zh-CN&q='+encodeURIComponent(q),
    {headers:{'Ocp-Apim-Subscription-Key':w.key||''}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('HTTP '+r.status);
  return (((j.webPages||{}).value)||[]).map(x=>({title:String(x.name||''),url:String(x.url||''),snippet:String(x.snippet||'')}));
}
/* 联网搜索：自定义接口。 */
async function searchCustom(q,w){
  let u=String(w.base||'');
  if(!u)throw new Error('还没填自定义接口地址');
  if(u.indexOf('{q}')<0)u+=(u.indexOf('?')<0?'?':'&')+'q={q}';
  u=u.replace('{q}',encodeURIComponent(q));
  const r=await fetch(u,{headers:w.key?{'Authorization':'Bearer '+w.key}:{}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const pick=arr=>arr.map(x=>({title:String(x.title||x.name||x.headline||''),url:String(x.url||x.link||x.href||''),snippet:String(x.snippet||x.content||x.description||x.text||'')}));
  if(Array.isArray(j))return pick(j);
  for(const k of ['results','organic','items','data','list','webPages','hits'])if(Array.isArray(j[k]))return pick(j[k]);
  return [];
}
/* 联网搜索：维基百科（免 Key，浏览器直接可用）。 */
async function searchWikipedia(q,n,w){
  const lang=String(w.lang||'zh').replace(/[^a-z-]/gi,'')||'zh';
  const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit='+n+'&srsearch='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (((j.query||{}).search)||[]).map(x=>({title:String(x.title||''),url:'https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(x.title||''),snippet:String(x.snippet||'').replace(/<[^>]+>/g,'')}));
}
async function webSearch(q){
  const w=webCfg();
  const n=Math.max(1,Math.min(10,Number(w.count)||5));
  const eng=w.engine||'wiki';
  if(eng==='tavily')return searchTavily(q,n,w);
  if(eng==='serper')return searchSerper(q,n,w);
  if(eng==='bing')return searchBing(q,n,w);
  if(eng==='custom')return searchCustom(q,w);
  return searchWikipedia(q,n,w);
}
function fmtSearchBlock(q,list){
  return '【联网搜索结果】下面是刚刚从网上查到的真实资料，请优先依据它们回答；资料里没提到的就直说不知道，不要编造：\n搜索词：'+q+'\n'+
  list.map((x,i)=>(i+1)+'. '+x.title+'\n'+String(x.snippet||'').replace(/\s+/g,' ').slice(0,400)+'\n（来源：'+x.url+'）').join('\n');
}
async function searchForChar(c,conv,onStatus){
  const st=onStatus||function(){};
  if(!cfg.key||!conv||!conv.trim())return null;
  st('🔎 正在想：要不要上网查一下…');
  let q='';
  try{
    const r=await callAPI([{role:'system',content:'你是联网检索助手。看下面这段对话，判断是否需要联网查资料（新闻、天气、赛事、价格、时事、人物近况、不确定的事实等才需要）。需要就只输出一行：SEARCH: 关键词（中文，尽量精确，可带年份）；不需要就只输出：NO'},
      {role:'user',content:conv.slice(-1200)}],{stream:false,temp:0,maxtok:40,model:modelOf(c)});
    const m=String(r||'').match(/SEARCH\s*[:：]\s*([^\n\r]+)/i);
    if(m)q=m[1].trim().replace(/^["'“”]+|["'“”]+$/g,'').slice(0,80);
  }catch(e){st('');return null}
  if(!q){st('');return null}
  st('🔎 正在联网搜索：<b>'+esc(q)+'</b> …');
  let list=[];
  try{list=await webSearch(q)}
  catch(e){st('⚠️ 搜索失败：'+esc(String((e&&e.message)||e).slice(0,90)));return null}
  if(!list.length){st('🌐 搜了「'+esc(q)+'」，没有找到有用结果');return null}
  st('🌐 已联网搜索：<b>'+esc(q)+'</b> · 找到 '+list.length+' 条资料');
  return {q:q,list:list,block:fmtSearchBlock(q,list)};
}
function showSearchRes(s){
  if(!s||!s.list)return;

  '<p class="dim" style="font-size:12px;margin:0 0 8px">搜索词：'+esc(s.q)+' · 共 '+s.list.length+' 条</p>'+

  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关闭</button></div>');

let pendingSearch='',pendingSM=null;
async function doSearchStep(c){
  pendingSearch='';pendingSM=null;
  const box=$('#msgs');if(!box||!cfg.key)return;
  const st=document.createElement('div');
  st.className='searchline';
  st.innerHTML='🔎 正在想：要不要上网查一下…';

  const conv=(msgs||[]).slice(-6).map(m=>(m.role==='user'?'她':c.name)+'：'+(m.content||'')).join('\n');

  st.onclick=()=>showSearchRes(pendingSM);

}

/* 发消息前先「判断→搜索→实时显示」，然后照常生成 */

/* 设置页里的「联网搜索」卡片 */
function webCardHTML(){
  const w=webCfg();
  const eng=w.engine||'wiki';
  const opt=(v,t)=>'<option value="'+v+'"'+(eng===v?' selected':'')+'>'+t+'</option>';
  return '<div class="ttl">联网搜索</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">给角色打开「联网搜索」后，它回答前会自己上网查资料，聊天里会实时显示它在搜什么。<br>默认「维基百科」：免费、不用 Key、点开就能用；想搜新闻、搜全网，就选 Tavily / Serper / Bing（要自己申请 Key）。</p>'+
  '<label class="f">服务商</label><select id="w_engine" onchange="setWebEngine(this.value)">'+
  opt('wiki','维基百科（免 Key · 可直接用）')+opt('tavily','Tavily（需 Key）')+opt('serper','Serper 谷歌搜索（需 Key）')+opt('bing','Bing 搜索（需 Key）')+opt('custom','自定义接口')+'</select>'+
  (eng==='wiki'
    ?('<label class="f">语言版本</label><input id="w_lang" value="'+esc(w.lang||'zh')+'" placeholder="zh / en">')
    :('<label class="f">API Key</label><input id="w_key" type="password" value="'+esc(w.key||'')+'" placeholder="搜索服务的 Key">'))+
  ((eng==='custom'||eng==='tavily'||eng==='serper')
    ?('<label class="f">接口地址（留空用默认）</label><input id="w_base" value="'+esc(w.base||'')+'" placeholder="'+(eng==='custom'?'https://你的转发服务/search?q={q}':'https://…')+'">')
    :'')+
  '<div class="setrow" style="margin-top:8px"><span class="lbl">每次取几条资料</span><input id="w_count" type="number" value="'+(w.count||5)+'"><span class="unit">条</span></div>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="saveWebCfg()">保存搜索设置</button>'+
  '<button class="col" onclick="testWeb()">测试搜索</button></div>'+
  '<p class="dim" style="font-size:12px;margin:8px 0 0">如果提示「搜索失败」并提到跨域 / CORS：Bing、Serper 这类接口一般不允许网页直接调用，换「维基百科」，或用「自定义接口」填一个自己能跨域的转发地址。记得再去「角色 → 编辑」打开「联网搜索」开关才会用。</p>';
}
function refreshWebCard(){const el=document.getElementById('webCard');if(el)el.innerHTML=webCardHTML()}
function setWebEngine(v){webCfg().engine=v;save(LS.cfg,cfg);refreshWebCard()}
function saveWebCfg(){
  const w=webCfg();
  const v=i=>{const el=document.getElementById(i);return el?el.value.trim():''};
  if(document.getElementById('w_engine'))w.engine=v('w_engine')||w.engine;
  if(document.getElementById('w_key'))w.key=v('w_key');
  if(document.getElementById('w_base'))w.base=v('w_base');
  if(document.getElementById('w_lang'))w.lang=v('w_lang')||'zh';
  const n=parseInt(v('w_count'),10);w.count=(Number.isFinite(n)&&n>0)?Math.min(10,n):5;
  save(LS.cfg,cfg);
  toast('已保存搜索设置');
}
async function testWeb(){
  saveWebCfg();
  const w=webCfg();
  if(w.engine!=='wiki'&&!w.key)return alert('这个服务商需要 Key，请先填好再测。');
  toast('搜索中…');
  try{
    const l=await webSearch('深海');
    alert(l.length?('搜索通了 ✅ 拿到 '+l.length+' 条，例如：\n'+l.slice(0,3).map(x=>'· '+x.title).join('\n')):'通了，但这个词没结果，换个词试试');
  }catch(e){
    alert('搜索失败：'+((e&&e.message)||e)+'\n\n如果提到 Failed to fetch / CORS，就是浏览器跨域限制：\n· 换「维基百科」\n· 或自建一个转发接口，用「自定义接口」填上。');
  }
}
/* 把「联网搜索」设置卡插到设置页第一张卡后面 */
const _renderCfg=renderCfg;
renderCfg=function(){
  _renderCfg();
  const m=$('#main');if(!m)return;
  if(document.getElementById('webCard'))return;
  const card=document.createElement('div');
  card.className='card';card.id='webCard';card.innerHTML=webCardHTML();
  const first=m.querySelector('.card');
  if(first&&first.nextSibling)m.insertBefore(card,first.nextSibling);else m.appendChild(card);
};
/* 角色设定里插入「联网搜索」开关 */
const _editChar=editChar;
editChar=function(id,tema){
  _editChar(id,tema);
  const sheet=$('#sheet');
  if(!sheet||!document.getElementById('e_persona'))return;      /* 只在「角色设定」标签页插 */
  if(document.getElementById('e_search'))return;
  const c=chars.find(x=>x.id===id);if(!c)return;
  const w=webCfg();
  const card=document.createElement('div');
  card.className='card';card.style.marginTop='12px';
  card.innerHTML='<div class="row" style="align-items:center">'+
  '<div class="col"><b>联网搜索</b><div class="dim" style="font-size:12px">打开后，它回答前会自己上网查资料，搜索过程会实时显示在聊天里（服务商在「设置 → 联网搜索」里选，默认维基百科，免 Key）</div></div>'+
  '<input type="checkbox" id="e_search" '+((c.search&&c.search.on)?'checked':'')+'></div>'+
  ((w.engine!=='wiki'&&!w.key)
    ?'<p class="dim" style="font-size:12px;margin:8px 0 0;color:var(--warn)">⚠️ 当前搜索服务商（'+esc(w.engine)+'）还没填 Key，先去「设置 → 联网搜索」填好，否则搜不了。</p>'
    :'<p class="dim" style="font-size:12px;margin:8px 0 0">当前服务商：'+esc(w.engine||'wiki')+'（可在「设置 → 联网搜索」里改）</p>')+
  '</div>';
  const rows=sheet.querySelectorAll('.row');
  let anchor=null;
  for(const r of rows){if((r.innerHTML||'').indexOf('saveChar(')>=0){anchor=r;break}}
  if(anchor)anchor.parentNode.insertBefore(card,anchor);else sheet.appendChild(card);
};
const _applyCharInputs=applyCharInputs;
applyCharInputs=function(id){
  const c=_applyCharInputs(id);if(!c)return c;
  const el=document.getElementById('e_search');
  if(el)c.search={on:!!el.checked};
  return c;
};

boot();
</script>

<script>
/* ================================================================
   深蓝海域 · 补丁4-A（2026-09）  只做三件事：
   ① 群聊「上下文 Y tok」不再是空白
   ② 删除群消息时，角色们对这条消息的记忆一起清掉
   ③ 把「现在」钉死成真实时间：搜索 / 记忆档案里的旧日期（5月）不再被当成现在
   粘法：整段粘到文件最末尾（最后一行 </html> 的下面）。
   本段独立成 <script>，出问题也只影响这一段，原 app 不受影响。
   ================================================================ */
(function(){
var W=window, P4=(W.P4=W.P4||{});
P4.ver='4A';

/* ---------- 0. 时间小工具 ---------- */
function fmtT(t){
  var d=new Date(t),p=function(n){return (n<10?'0':'')+n};
  return p(d.getHours())+':'+p(d.getMinutes());
}
P4.today=function(){
  var d=new Date(),w='日一二三四五六'[d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w;
};
P4.now=function(){
  var t=(typeof fmtTime==='function')?fmtTime(Date.now()):fmtT(Date.now());
  return P4.today()+' '+t;
};

/* ---------- 1. 修 bug③：非流式请求也要把 usage 传出来 ---------- */
/* 补丁4-A 的请求参数拼装。 */
function buildP4Request(messages,opt){
  var url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  var body={model:(opt.model||cfg.model),messages:messages,stream:!!opt.stream};
  if(opt.temp!=null)body.temperature=opt.temp;
  if(opt.maxtok)body[opt.tokName||'max_tokens']=opt.maxtok;
  if(opt.stream)body.stream_options={include_usage:true};
  return {url:url,fopt:{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)}};
}
/* 处理补丁4-A 的非流式返回。 */
function handleP4JsonResponse(j,opt){
  if(opt.onUsage&&j.usage)opt.onUsage(j.usage);
  var msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
  var rc=pickReasoning(msg);
  if(rc&&opt.onReasoning)opt.onReasoning(rc);
  return String(msg.content||'');
}
/* 创建补丁4-A 的流式返回解析器。 */
function createP4StreamParser(opt){
  var text='';
  var emit=function(line){
    var d=line.slice(5).trim();
    if(d==='[DONE]')return true;
    try{
      var o=JSON.parse(d);
      if(o.usage&&opt.onUsage)opt.onUsage(o.usage);
      var c=o.choices&&o.choices[0]&&o.choices[0].delta&&o.choices[0].delta.content;
      if(c)text+=c;
    }catch(e){}
    return false;
  };
  return {emit:emit,getOut:function(){return text}};
}
/* 读取补丁4-A 的流式返回，直到结束。 */
async function readP4StreamText(res,parser){
  if(!res.body){
    var all=await res.text();
    var as=all.split('\n');
    for(var x=0;x<as.length;x++){
      var lx=as[x].trim();
      if(lx.indexOf('data:')!==0)continue;
      if(parser.emit(lx))break;
    }
    return parser.getOut();
  }
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  for(;;){
    var r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop();
    for(var i=0;i<lines.length;i++){
      var line=lines[i].trim();
      if(!line||line.indexOf('data:')!==0)continue;
      if(parser.emit(line))return parser.getOut();
    }
  }
  return parser.getOut();
}
async function p4raw(messages,opt){
  opt=opt||{};
  var req=buildP4Request(messages,opt);
  var res=await fetch(req.url,req.fopt);
  if(!res.ok){var er='';try{er=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(er).replace(/\s+/g,' ').slice(0,200))}

  if(!opt.stream){
    var j=await res.json();
    return handleP4JsonResponse(j,opt);
  }
  var parser=createP4StreamParser(opt);
  return readP4StreamText(res,parser);
}

/* 外面那层「自动重试」照旧，但改成用 p4raw（会回报 usage） */
var P4_callAPI=callAPI;
callAPI=async function(messages,opt){
  opt=opt||{};
  if(opt.stream||opt.tools)return P4_callAPI(messages,opt);   /* 流式 / 带工具的照旧 */
  var model=opt.model||cfg.model;
  var model2=(cfg.model&&cfg.model!==model)?cfg.model:null;
  var base={temp:(opt.temp!=null?opt.temp:cfg.temp),maxtok:(opt.maxtok||cfg.maxtok)};
  var tries=[
    {model:model,temp:base.temp,maxtok:base.maxtok},
    model2?{model:model2,temp:base.temp,maxtok:base.maxtok}:null,
    {model:model,temp:null,maxtok:null},
    {model:model2||model,temp:null,maxtok:null,tokName:'max_completion_tokens'},
    {model:model,temp:null,maxtok:null,stream:true}
  ].filter(Boolean);
  var lastErr=null;
  for(var i=0;i<tries.length;i++){
    var o=Object.assign({},tries[i]);
    if(opt.onUsage)o.onUsage=opt.onUsage;
    try{
      var r=await p4raw(messages,o);
      if(String(r==null?'':r).trim())return r;
      lastErr=new Error('模型返回空内容');
    }catch(e){lastErr=e}
  }
  throw (lastErr||new Error('调用失败'));
};

/* ---------- 2. 修 bug①：删群消息 → 连角色的群聊记忆一起清 ---------- */
function p4same(x,m,gid){
  if(!x||x.gid!==gid)return false;
  if(m&&m.id&&x.mid&&x.mid===m.id)return true;                 /* 新消息：靠 id 精确配对 */
  var tx=String(x.tx||'').trim(), mc=String((m&&m.content)||'').trim();
  if(!tx||!mc||tx!==mc)return false;                            /* 旧消息：同群 + 内容相同 */
  if(!m.t||!x.t)return true;
  return Math.abs(Number(x.t)-Number(m.t))<300000;              /* 且时间接近（5 分钟内） */
}
P4.purgeGmem=function(gid,m){
  var ids={};
  chars.forEach(function(c){ids[c.id]=1});
  var g=findGroup(gid);
  if(g)(g.members||[]).forEach(function(x){ids[x.cid]=1});
  if(m&&m.role==='char'&&m.cid)ids[m.cid]=1;
  var cnt=0;
  Object.keys(ids).forEach(function(cid){
    var cur=gmemOf(cid);
    var left=cur.filter(function(x){return !p4same(x,m,gid)});
    if(left.length!==cur.length){cnt+=(cur.length-left.length);save(LS.gmem(cid),left)}
  });
  if(cnt)scheduleBackup();
  return cnt;
};

/* 以后每条群消息都带一个 id，记忆里也记下这个 id，删除时就能精准对应 */
gmemAdd=function(cid,gid,gname,text,self,mid){
  var arr=gmemOf(cid);
  arr.push({t:Date.now(),gid:gid,gn:gname,tx:String(text||'').slice(0,300),me:!!self,mid:mid||''});
  while(arr.length>120)arr.shift();
  save(LS.gmem(cid),arr);scheduleBackup();
};
delGmsg=function(i){
  var g=findGroup(groupOpenId);if(!g)return;
  var arr=gmsgsOf(g.id),n=Number(i);
  if(!(n>=0&&n<arr.length))return;
  var m=arr[n];
  if(!confirm('删除这条群消息？\n（会同时清掉所有角色对这条消息的记忆，它们以后就完全看不到它了）'))return;
  arr.splice(n,1);
  saveGmsgs(g.id,arr);
  var c=P4.purgeGmem(g.id,m);
  renderToolPane();scrollGroupDown();
  toast(c?('已删除这条消息，并清掉了 '+c+' 条相关记忆'):'已删除这条群消息');
};
clearGmsgs=function(){
  var g=findGroup(groupOpenId);if(!g)return;
  if(!confirm('清空《'+g.name+'》的全部聊天记录？\n（角色们对这个群的记忆也会一起清掉，只影响这个群，不动私聊）'))return;
  saveGmsgs(g.id,[]);
  var ids={};
  (g.members||[]).forEach(function(x){ids[x.cid]=1});
  chars.forEach(function(c){ids[c.id]=1});
  Object.keys(ids).forEach(function(cid){
    var cur=gmemOf(cid),left=cur.filter(function(x){return x.gid!==g.id});
    if(left.length!==cur.length)save(LS.gmem(cid),left);
  });
  scheduleBackup();
  renderToolPane();
  toast('已清空群消息 + 群聊记忆');
};

/* ---------- 3. 修 bug②：把「现在」钉死成真实时间 ---------- */
var P4_archiveBlock=archiveBlock;
archiveBlock=function(query,c){
  var r=P4_archiveBlock(query,c);
  if(!r)return r;
  return '【现在的时间】现在是 '+P4.now()+'。下面是你和她过去真实发生过的记录，里面的日期（比如 5 月）都是过去的事，不是现在，绝对不要把当前时间当成那几天。\n'+r;
};

var P4_fmtSearchBlock=fmtSearchBlock;
fmtSearchBlock=function(q,list){
  var body=P4_fmtSearchBlock(q,list);
  return '【现在的时间】现在是 '+P4.now()+'。检索到的资料请相对这个时间判断新旧，不要因为聊天记录或记忆档案里出现的旧日期，就把现在当成那个时间。\n'+body;
};

searchForChar=async function(c,conv,onStatus){
  var st=onStatus||function(){};
  if(!cfg.key||!conv||!conv.trim())return null;
  st('🔎 正在想：要不要上网查一下…');
  var q='';
  try{
    var r=await callAPI([
      {role:'system',content:'你是联网检索助手。现在的真实时间是 '+P4.now()+'。看下面这段对话，判断是否需要联网查资料（新闻、天气、赛事、价格、时事、人物近况、不确定的事实等才需要）。需要就只输出一行：SEARCH: 关键词（中文，尽量精确；只有确实涉及时间时才写年月，而且必须用「现在」的年份月份，绝不能用对话或记忆里出现的旧日期）；不需要就只输出：NO'},
      {role:'user',content:String(conv).slice(-1200)}
    ],{stream:false,temp:0,maxtok:40,model:modelOf(c)});
    var m=String(r||'').match(/SEARCH\s*[:：]\s*([^\n\r]+)/i);
    if(m)q=m[1].trim().replace(/^["'“”]+|["'“”]+$/g,'').slice(0,80);
  }catch(e){st('');return null}
  if(!q){st('');return null}
  st('🔎 正在联网搜索：<b>'+esc(q)+'</b> …');
  var list=[];
  try{list=await webSearch(q)}
  catch(e){st('⚠️ 搜索失败：'+esc(String((e&&e.message)||e).slice(0,90)));return null}
  if(!list.length){st('🌐 搜了「'+esc(q)+'」，没有找到有用结果');return null}
  st('🌐 已联网搜索：<b>'+esc(q)+'</b> · 找到 '+list.length+' 条资料');
  return {q:q,list:list,block:fmtSearchBlock(q,list)};
};

console.log('[深蓝海域] 补丁4-A 已加载');
})();
</script>
<script>
/* ================================================================
   深蓝海域 · 补丁4-B（2026-09）  群聊增强
   新增：①关系简介 ②发言顺序优先级 ③角色能看到多少条群聊记录
         ④角色能不能读「记忆」和「历史对话档案」 ⑤群里可用玩具的开关
   粘法：粘到文件最末尾（补丁4-A 那段后面），顺序无所谓。
   ================================================================ */
(function(){
var W=window,P4=(W.P4=W.P4||{});
if(!P4.now)P4.now=function(){var d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]};

function prioOf(m){if(!m||m.prio==null||m.prio==='')return 50;var p=Number(m.prio);return isFinite(p)?p:50}
function histOf(g,m){
  var n=Number(m&&m.histN);if(isFinite(n)&&n>0)return Math.max(2,Math.min(200,Math.round(n)));
  var d=Number(g&&g.histN);if(isFinite(d)&&d>0)return Math.max(2,Math.min(200,Math.round(d)));
  return 24;
}

/* ---------- 1. 往「群设置」面板里塞新选项（不动原来的代码，只往后加） ---------- */
var P4_groupSetSheet=groupSetSheet;
/* 群设置补丁：给每个成员补关系简介、优先级、记录条数和记忆开关。 */
function injectGroupMemberExtraFields(g){
  (g.members||[]).forEach(function(m,i){
    var box=document.getElementById('gs_'+i)||document.getElementById('ga_'+i);
    if(!box)return;
    var host=box.parentNode,ref=host.nextSibling,par=host.parentNode;
    var wrap=document.createElement('div');
    wrap.innerHTML=
    '<label class="f">关系简介 / 定位（别的角色会看到，用来自我介绍）</label>'+
    '<textarea id="gel_'+i+'" style="min-height:56px" placeholder="比如：用户的毒舌损友，说话直接，喜欢抬杠">'+esc(m.rel||'')+'</textarea>'+
    '<div class="setrow" style="margin-top:8px"><span class="lbl">发言优先级（数字越小越先开口）</span><input id="gep_'+i+'" type="number" value="'+prioOf(m)+'"></div>'+
    '<div class="setrow" style="margin-top:8px"><span class="lbl">它在群里能看到的群聊记录条数（0 = 用群默认）</span><input id="geh_'+i+'" type="number" value="'+((Number(m.histN)>0)?Math.round(Number(m.histN)):0)+'"><span class="unit">条</span></div>'+
    '<label class="li" style="border:0;padding:2px 0"><input type="checkbox" id="gem_'+i+'" '+(m.mem?'checked':'')+' style="flex:0 0 auto;margin-top:3px"><span>允许它在群里读「记忆」和「历史对话档案」（不开就只用群里聊天 + 它自己的群记忆）</span></label>';
    while(wrap.firstChild)par.insertBefore(wrap.firstChild,ref);
  });
}
/* 群设置补丁：补“群聊记录条数 / 发言顺序 / 群里玩具”卡片。 */
function injectGroupExtraCard(g,sheet){
  var ch=document.getElementById('ge_chain');
  var card=document.createElement('div');
  card.className='card';card.style.marginTop='12px';
  card.innerHTML='<div class="ttl">群聊记录条数 / 发言顺序 / 群里玩具</div>'+
  '<div class="setrow"><span class="lbl">角色默认能看到最近多少条群聊记录</span><input id="ge_histn" type="number" value="'+histOf(g,null)+'"><span class="unit">条</span></div>'+

/* ---------- 2. 保存：先读下新字段，再走原来的保存流程，最后写回去 ---------- */
var P4_saveGroupSet=saveGroupSet;
saveGroupSet=function(id){
  var pick=function(i){var el=document.getElementById(i);return el?el.value:''};
  var chk=function(i){var el=document.getElementById(i);return !!(el&&el.checked)};
  var g0=findGroup(id);
  var newMem=(g0&&g0.members||[]).map(function(m,i){
    return {rel:(document.getElementById('gel_'+i)?pick('gel_'+i).trim():null),
            prio:(document.getElementById('gep_'+i)?pick('gep_'+i):null),
            hist:(document.getElementById('geh_'+i)?pick('geh_'+i):null),
            mem:(document.getElementById('gem_'+i)?chk('gem_'+i):null)};
  });
  var histn=document.getElementById('ge_histn')?pick('ge_histn'):null;
  var toys=document.getElementById('ge_toys')?chk('ge_toys'):null;

  P4_saveGroupSet(id);                   /* 原来的保存逻辑 */

  var gs=groupsAll(),g=gs.find(function(x){return x.id===id});if(!g)return;
  (g.members||[]).forEach(function(m,i){
    var n=newMem[i];if(!n)return;
    if(n.rel!=null)m.rel=n.rel.slice(0,300);
    if(n.prio!=null){var p=Math.round(Number(n.prio));m.prio=isFinite(p)?Math.max(-999,Math.min(999,p)):50}
    if(n.hist!=null){var hn=Math.round(Number(n.hist));m.histN=(isFinite(hn)&&hn>0)?Math.max(2,Math.min(200,hn)):0}
    if(n.mem!=null)m.mem=n.mem;
  });
  if(histn!=null){var d=Math.round(Number(histn));g.histN=(isFinite(d)&&d>0)?Math.max(2,Math.min(200,d)):24}
  if(toys!=null)g.toys=toys;
  saveGroups(gs);
  if(view==='tools')renderTools();
};

/* ---------- 3. 群聊发言：条数 / 关系简介 / 记忆档案 / 时间 / 玩具 ---------- */
/* 往群聊系统提示里加入：成员定位、私聊同步、记忆和档案。 */
function addGroupMemoryContext(sys,g,c,mm,me,arr){
  /* ① 关系简介：让每个角色知道别人是谁、什么定位 */
  var rel=[],myPrio=prioOf(mm);
  (g.members||[]).forEach(function(m){
    var x=charOf(m.cid);if(!x)return;
    rel.push('· '+x.name+'：'+((m.rel||'').trim()||'（还没写定位，按普通群友相处）')+'　[发言优先级 '+prioOf(m)+']');
  });
  if(rel.length)sys.push('【群成员是谁 / 各自定位】\n'+rel.join('\n')+'\n（发言优先级：数字越小越先开口；你自己是 '+myPrio+'。说话要符合各自定位。）');

  /* ② 同步私聊 */
  if(mm&&mm.sync){
    var pv=load(LS.msg(c.id),[]).slice(-Math.max(1,Math.min(60,Number(g.syncN)||20)));
    if(pv.length)sys.push('【你和'+me+'私聊的最近记录】下面是你和'+me+'私下聊天的最近 '+pv.length+' 条。你在群里同样记得这些事，可以自然提起，但不要逐条复述：\n'+pv.map(function(x){return (x.role==='user'?me:c.name)+'：'+msgBrief(x)}).join('\n'));
  }

  /* ③ 能不能读「记忆 + 历史对话档案」 */
  if(mm&&mm.mem){
    try{
      var M=Object.assign(EMPTY_MEM(),load(LS.mem(c.id),null)||{});
      var mb=memBlock(M);
      if(mb)sys.push('【你的记忆】下面是你自己的记忆，你在群里也记得：\n'+mb);
    }catch(e){}
    try{
      var lu0=arr.slice().reverse().find(function(x){return x.role==='user'&&x.content});
      var ab=archiveBlock(lu0?lu0.content:'',c);
      if(ab)sys.push(ab);
    }catch(e){}
  }
}
/* 往群聊系统提示里加入：群内记忆、风格、补充设定、示例和当前时间。 */
function addGroupCharacterContext(sys,g,c){
  var gm=gmemBlock(c.id,g.id,10);
  if(gm)sys.push('【你在这个群里的记忆】你之前在这个群里说过下面这些，你要记得，别和它们矛盾：\n'+gm);
  if(c.style)sys.push('【说话风格】'+c.style);
  if(c.sysPrompt)sys.push(c.sysPrompt);
  if(c.examples)sys.push('【对话示例】'+c.examples);
  if(cfg.timeOn!==false)sys.push('【现在的时间】现在是 '+P4.now()+'。群里聊天记录里提到的时间（比如 5 月）都是过去，不要当成现在。');
}
/* 组装群聊发言的基础上下文。 */
function buildGroupBaseContext(g,c){
  var mm=memberOf(g,c.id);
  var lim=histOf(g,mm);
  var arr=gmsgsOf(g.id).slice(-lim);
  var nm=function(id){var x=charOf(id);return x?x.name:'某人'};
  var me=(cfg.userName||'她');
  var others=g.members.filter(function(m){return m.cid!==c.id}).map(function(m){return nm(m.cid)}).filter(Boolean);
  var sys=[];
  sys.push(c.persona||('你是'+c.name+'。'));
  sys.push('【群聊】你正在一个叫《'+g.name+'》的群里聊天。群里还有：'+(others.join('、')||'没有别人')+'。'+(cfg.userName?('用户（'+cfg.userName+'）也在群里。'):'用户也在群里。'));
  sys.push('【群聊规则】像真人在群里发消息：1-2 句，短、口语、自然；可以顺着别人刚说的话接，也可以自己开个话头，或者点名问某个群友；不要替别人说话；不要写旁白、动作、括号；不要复述别人说过的话；不要重复自己刚说过的话。');
  addGroupMemoryContext(sys,g,c,mm,me,arr);
  addGroupCharacterContext(sys,g,c);
  return {mm:mm,arr:arr,nm:nm,me:me,sys:sys};
}
/* 群聊：需要时先联网搜索，并把结果塞进系统提示。 */
async function addGroupSearchContext(sys,c,g,arr,nm,me){
  if(!(c.search&&c.search.on&&cfg.key))return null;
  try{
    var conv=arr.slice(-6).map(function(m){return (m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}).join('\n');
    var r=await searchForChar(c,conv,function(t){groupStatusLine(g.id,t)});
    if(r){sys.push(r.block);groupStatusLine(g.id,'');return {q:r.q,list:r.list};}
    groupStatusLine(g.id,'');
  }catch(e){groupStatusLine(g.id,'')}
  return null;
}
/* 群聊：问角色要不要先用一次玩具，并把结果塞进系统提示。 */
async function runGroupToyProbe(sys,c,g,hist,tp){
  if(!(g.toys&&W.P4TOYS&&W.P4TOYS.forChar&&cfg.key))return;
  var toyList=W.P4TOYS.forChar(c);
  if(!toyList.length)return;
  try{
    var probe=[{role:'system',content:sys.join('\n\n')}].concat(hist);
    probe.push({role:'user',content:'（先决定要不要用玩具：想掷骰子、抽签、看时间、记心情、留便条、写日记、调好感度就调用一次工具；不想用就直接回复 NO_TOY）'});
    var tr=await callAPI(probe,{stream:false,model:modelOf(c),tools:toyList,tool_choice:'auto',temp:tp.temp,maxtok:200});
    if(tr&&tr.tool_calls&&tr.tool_calls.length){
      var outs=[];
      for(var ti=0;ti<tr.tool_calls.length;ti++){
        var tc=tr.tool_calls[ti],args={};
        try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){}
        var rr={ok:false,msg:''};
        try{rr=W.P4TOYS.exec(tc.function.name,args,c.id)}catch(e){}
        if(rr&&rr.msg)outs.push(rr.msg);
      }
      if(outs.length)sys.push('【你刚刚用了玩具，结果如下，可以在这次发言里自然地说出来】\n'+outs.join('\n'));
    }
  }catch(e){}
}
groupGenerate=async function(g,c){
  var base=buildGroupBaseContext(g,c);
  var arr=base.arr,nm=base.nm,me=base.me,sys=base.sys;

  /* ④ 联网搜索（开关在角色设置里） */
  var sMeta=await addGroupSearchContext(sys,c,g,arr,nm,me);
  sys.push('【硬性要求】中文回复；只输出你要发的那条群消息本身，不要加任何名字前缀。');

  var hist=arr.map(function(m){return {role:(m.role==='user'?'user':'assistant'),content:(m.role==='user'?me:nm(m.cid))+'：'+(m.content||'')}});
  var tp=thinkParams(c);

  /* ⑤ 群里开了玩具的话，先问它要不要用一次（不想用就不花这次的钱？不，它会回 NO_TOY，成本很低） */
  await runGroupToyProbe(sys,c,g,hist,tp);

  var ctx=[{role:'system',content:sys.join('\n\n')}].concat(hist);
  ctx.push({role:'user',content:'（继续群聊，现在轮到你发言，用你的身份发一条）'});
  var out='',usage=null;
  try{
    out=String(await callAPI(ctx,{stream:false,model:modelOf(c),temp:tp.temp,maxtok:Math.min(400,tp.maxtok||400),onUsage:function(u){usage=u}})||'').trim();
  }catch(e){return null}
  var names=[c.name].concat(g.members.map(function(m){return nm(m.cid)}));
  out=cleanGroupOutput(out,names);
  if(!out)return null;
  return {text:out,tok:(usage&&usage.completion_tokens)?usage.completion_tokens:estTokens(out),ptok:(usage&&usage.prompt_tokens)?usage.prompt_tokens:0,search:sMeta,id:uid()};
};

/* ---------- 4. 发言顺序：按「发言优先级」从小到大 ---------- */
groupRun=async function(g,trigger){
  if(groupBusy)return;
  groupBusy=true;
  renderToolPane();
  var chain=(typeof g.chain==='number')?g.chain:GRP_CHAIN_DEF;
  var maxAI=Math.max(1,Math.min(20,Number(g.maxAI)||GRP_MAXAI_DEF));
  var maxRound=Math.max(1,Math.min(6,Number(g.maxRound)||GRP_MAXROUND_DEF));
  var total=0;
  try{
    for(var round=1;round<=maxRound;round++){
      var rr=await runGroupRound(g,round,chain,maxAI,total,prioOf);
      total+=rr.speaks;
      if(!rr.spoke)break;
    }
    if(total>=maxAI)toast('本轮发言到上限了，先歇一歇（防刷屏）');
  }catch(e){
    toast('群聊出错：'+((e&&e.message)||e));
  }finally{
    groupBusy=false;
    renderToolPane();scrollGroupDown();
    scheduleGroupAuto(false);
  }
};

/* ---------- 5. 我发的群消息也带 id（这样删它时能精准清记忆） ---------- */
groupSend=async function(){
  var g=findGroup(groupOpenId);if(!g)return;

  saveGmsgs(g.id,arr);
  renderToolPane();scrollGroupDown();
  await groupRun(g,'user');
};

/* ---------- 6. 角色在私聊里用工具发的群消息，也带 id ---------- */
execGroupTool=function(name,args,cid){
  var nmOf=function(id){var x=charOf(id);return x?x.name:'某人'};
  if(name==='list_my_groups'){
    var gs=groupsOfChar(cid);
    if(!gs.length)return {ok:true,msg:'你还没有加入任何群聊。'};
    return {ok:true,msg:'你所在的群：\n'+gs.map(function(g){return '· 群名：'+g.name+'（id:'+g.id+'，'+g.members.length+'人，成员：'+g.members.map(function(m){return nmOf(m.cid)}).join('、')+'）'}).join('\n')};
  }
  var g=findGroupFlex(args&&args.group,cid);
  if(!g)return {ok:false,msg:'没找到这个群。先调用 list_my_groups 看看你在哪些群里。'};
  if(name==='read_group'){
    var lim=Math.max(1,Math.min(60,Math.round(Number(args&&args.limit)||10)));
    var arr=gmsgsOf(g.id).slice(-lim);
    if(!arr.length)return {ok:true,msg:'《'+g.name+'》里还没有人说话。'};
    return {ok:true,msg:'《'+g.name+'》最近的聊天：\n'+arr.map(function(m){return (m.role==='user'?(cfg.userName||'她'):nmOf(m.cid))+'：'+(m.content||'')}).join('\n')};
  }
  if(name==='send_group_message'){
    var text=String((args&&args.text)||'').trim().slice(0,500);
    if(!text)return {ok:false,msg:'内容为空，没发出去。'};
    var arr2=gmsgsOf(g.id),mid=uid();
    arr2.push({id:mid,role:'char',cid:cid,content:text,t:Date.now(),tok:estTokens(text)});
    saveGmsgs(g.id,arr2);
    gmemAdd(cid,g.id,g.name,text,true,mid);
    if(view==='tools'&&toolTab==='group'){renderToolPane();if(groupOpenId===g.id)scrollGroupDown()}
    return {ok:true,msg:'已在《'+g.name+'》里以你的身份发出：'+text};
  }
  return {ok:false,msg:'未知操作'};
};

  if(name==='roll_dice')return toyRollDice(args);
  if(name==='flip_coin')return toyFlipCoin();
  if(name==='pick_one')return toyPickOne(args);
  if(name==='get_now_time')return toyGetNow();
  if(name==='set_mood')return toySetMood(args,c,blink);
  if(name==='leave_note')return toyLeaveNote(args,cid,blink);
  if(name==='write_diary')return toyWriteDiary(args,cid,blink);
  if(name==='favor_change')return toyFavorChange(args,c,blink);
  return {ok:false,msg:'未知玩具'};
}
function toysFor(c){
  if(!charOK(c))return [];
  return TOYS.filter(function(t){return toyOn(t.function.name)});
}

<script>
/* ================================================================
   深蓝海域 · 补丁5-A（第 1/3 批）

   · ③ 角色 / 群聊有新消息时，顶部弹一个悬浮通知（点一下直接跳过去）
   · ④ 回复改成「一个字一个字涌现」的打字动画
   粘法：整段粘到文件最末尾（补丁4-A / 4-B / 4-C 那三段的后面）。
   ================================================================ */
(function(){
var W=window,P5=(W.P5=W.P5||{});
if(P5.A)return;P5.A=1;

/* ============ 样式 ============ */
var CSS=[
'#p5notif{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 6px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;pointer-events:none}',
'.p5n{pointer-events:auto;width:100%;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:16px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:p5nin .3s cubic-bezier(.2,.9,.3,1.06);cursor:pointer}',
'.p5n.group{border-left-color:var(--acc2)}',

'.p5nmain{flex:1;min-width:0}',

'.p5nt i{font-style:normal;font-size:10.5px;font-weight:400;color:var(--acc);background:var(--accdim);border:1px solid var(--accdim);border-radius:6px;padding:0 5px}',

'.toychip.tap{cursor:pointer;border-style:solid}',
'.gtoy{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 0 46px}',

'.gtoy .toychip{margin:0}',
'.fvrow{padding:9px 0;border-bottom:1px dashed var(--line)}',
'.fvrow:last-child{border-bottom:0}',
'.fvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}',
'.fvnum{font-size:12px;font-weight:700;color:var(--acc)}',
'.fve{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap;margin-top:6px}',
'.fve .up{color:var(--acc2)}',
'.fve .dn{color:var(--warn)}',
'.fvbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}',
'.fvbtns input{flex:1 1 110px;padding:6px 10px;font-size:12px}'
].join('\n');
var p5s=document.createElement('style');p5s.id='p5cssA';p5s.textContent=CSS;
(document.head||document.documentElement).appendChild(p5s);

/* ============ 共用小工具 ============ */
function dq(s,r){return (r||document).querySelector(s)}
function dqa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function say(m){try{toast(m)}catch(e){}}
function safe(fn,d){try{return fn()}catch(e){return d}}
function p5Char(cid){
  var c=safe(function(){return charOf(cid)},null);
  if(!c)c=safe(function(){return chars.filter(function(x){return x.id===cid})[0]},null);
  return c||null;
}
function p5CharName(cid){var c=p5Char(cid);return c?c.name:'角色'}

/* ================================================================
   ①  即时同步：角色用小工具 / 玩具，聊天里立刻显示一行
   ================================================================ */
var TOYNAME={};
try{(W.P4TOYS&&W.P4TOYS.list||[]).forEach(function(t){TOYNAME[t.function.name]=1})}catch(e){}

var ctx='chat';        /* 当前工具是「私聊里用的」还是「群里用的」 */
var gTurn=false;       /* 是否正在跑一轮群聊 */
var gToys=[];          /* 本轮群聊里玩过的玩具（稍后挂到对应群消息上） */

function liveBubble(){
  var box=document.getElementById('msgs');if(!box)return null;
  return box.querySelector('.bub[data-live="1"]')||box.querySelector('.bub.typing');
}
function chatLine(html,cls){
  var box=document.getElementById('msgs');if(!box)return null;
  var el=document.createElement('div');
  el.className=cls||'toychip';el.innerHTML=html;
  var tp=liveBubble();
  if(tp&&tp.parentNode===box)box.insertBefore(el,tp);else box.appendChild(el);
  try{scrollDown()}catch(e){}
  return el;
}
function groupLine(name,msg){
  var box=document.getElementById('gmsgs');if(!box)return null;
  var el=document.createElement('div');
  el.className='gbub sys';
  el.innerHTML='<div class="gtext">'+esc(name)+' '+esc(msg)+'</div>';
  box.appendChild(el);
  try{scrollGroupDown()}catch(e){}
  return el;
}
function emitToy(name,args,cid,msg){
  var nm=p5CharName(cid);
  if(ctx==='group'){
    gToys.push({cid:cid,msg:msg,t:Date.now(),used:0});
    if(gTurn&&view==='tools'&&toolTab==='group')groupLine(nm,msg);
  }else{
    if(view==='chat')chatLine('<b>'+esc(nm)+'</b><span>'+esc(msg)+'</span>');
  }
}

/* W.P4TOYS.exec 是「群里用玩具」的入口（补丁4-B 走的是它） */
var P5_toysExec=(W.P4TOYS&&W.P4TOYS.exec)||null;
if(P5_toysExec){
  W.P4TOYS.exec=function(name,args,cid){
    var prev=ctx;ctx='group';
    var r;
    try{r=P5_toysExec(name,args,cid)}finally{ctx=prev}
    if(r&&r.msg)emitToy(name,args,cid,r.msg);
    return r;
  };
}
/* execCharTool 是「私聊里用工具」的入口 */
var P5A_execCharTool=execCharTool;
execCharTool=function(name,args,cid){
  var c=p5Char(cid);
  var before=c?favSnap(c):null;
  var prev=ctx;ctx='chat';
  var r;
  try{r=P5A_execCharTool(name,args,cid)}finally{ctx=prev}
  if(name==='favor_change'&&c&&before){
    var after=favSnap(c);
    if(after.n!==before.n||after.why!==before.why)pushFav(c,before,after,args&&args.reason);
  }
  if(TOYNAME[name]&&r&&r.msg)emitToy(name,args,cid,r.msg);
  /* 它在私聊里替你在群里说了话：顺手告诉用户一声 */
  if(name==='send_group_message'&&r&&r.ok){
    var g2=null;try{g2=findGroupFlex(args&&args.group,cid)}catch(e){}
    if(g2&&view==='chat')
      chatLine('<b>'+esc(p5CharName(cid))+'</b><span>在《'+esc(g2.name)+'》里说了一句：'+esc(String((args&&args.text)||'').slice(0,60))+'</span>');
    if(g2&&!(view==='tools'&&toolTab==='group'&&groupOpenId===g2.id))
      P5.notify({kind:'group',gid:g2.id,name:p5CharName(cid),emoji:(c&&c.emoji)||'',
        avatar:(c&&c.avatar)||'',text:String((args&&args.text)||''),where:g2.name});
  }
  return r;
};

/* 群聊消息渲染完以后，把玩具小条挂到对应那条消息下面 */
function decorateGroupToys(){
  if(!(view==='tools'&&toolTab==='group'&&groupOpenId))return;
  var g=safe(function(){return findGroup(groupOpenId)},null);if(!g)return;
  var ms=safe(function(){return gmsgsOf(g.id)},[]);
  var box=document.getElementById('gmsgs');if(!box)return;
  var rows=dqa('.gbub',box);
  if(rows.length!==ms.length)return;          /* 数量对不上就先不装饰，避免错位 */
  for(var i=0;i<ms.length;i++){
    var m=ms[i];
    if(!m||!m.toys||!m.toys.length)continue;
    var el=rows[i];if(!el)continue;
    var d=document.createElement('div');
    d.className='gtoy'+(m.role==='user'?' me':'');
    d.innerHTML=m.toys.map(function(t){return '<span class="toychip">'+esc(t)+'</span>'}).join('');
    if(el.nextSibling)el.parentNode.insertBefore(d,el.nextSibling);else el.parentNode.appendChild(d);
  }
}

/* ================================================================
   ②  好感度：记录每一次变动，可以连备注一起撤销
   ================================================================ */
function KFav(cid){return 'wh_p5_fav_'+cid}
function favSnap(c){
  return {n:(c&&c.favor&&Number(c.favor.n))||0,
          why:String((c&&c.favor&&c.favor.why)||''),
          at:(c&&c.favor&&c.favor.at)||0};
}
function favLog(cid){return safe(function(){return load(KFav(cid),[])},[])}
function pushFav(c,before,after,note){
  var arr=favLog(c.id);
  arr.push({t:Date.now(),from:before,to:after,note:String(note||'').slice(0,120)});
  while(arr.length>80)arr.shift();
  safe(function(){save(KFav(c.id),arr);scheduleBackup()});
}
P5.favUndo=function(cid,idx){
  var c=p5Char(cid);if(!c)return;
  var arr=favLog(cid);
  idx=Number(idx);
  if(!(idx>=0&&idx<arr.length))return;

function htmlToText(h){

    .replace(/<br\s*\/?>/gi,'\n')

    .replace(/&quot;/g,'"').replace(/&amp;/g,'&');

function twTarget(){

    var el=kids[i];

  }

function twAppend(st){
  var el=st.el;
  for(var i=st.rendered;i<st.shown;i++){
    var ch=st.src.charAt(i);
    if(ch==='\n'){el.insertBefore(document.createElement('br'),st.mark);continue}
    var sp=document.createElement('span');
    sp.className='tw';sp.textContent=ch;
    sp.style.animationDelay=Math.min((i-st.rendered)*18,120)+'ms';
    el.insertBefore(sp,st.mark);
    st.pend.push({el:sp,ch:ch,t:Date.now()});
  }
  st.rendered=st.shown;
}
function twPromote(st){
  var now=Date.now();
  while(st.pend.length&&now-st.pend[0].t>260){
    var p=st.pend.shift(),el=p.el,par=el.parentNode;
    if(!par)continue;
    var prev=el.previousSibling;
    if(prev&&prev.nodeType===3){prev.data+=p.ch;par.removeChild(el)}
    else par.replaceChild(document.createTextNode(p.ch),el);
  }
