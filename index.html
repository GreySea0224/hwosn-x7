/* 群聊打字动画：按积压量算速度。 */
function twSpeedFor(behind,flush){
  var speed=flush?75:55;
  if(behind>1200)speed=Math.max(speed,420);
  else if(behind>400)speed=Math.max(speed,220);
  else if(behind>150)speed=Math.max(speed,110);
  return speed;
}
function twFrame(){
  var st=tw;
  if(!st||st.dead)return;
  st.raf=0;
  if(!st.el.isConnected){st.dead=true;tw=null;return}
  twPromote(st);
  var behind=st.src.length-st.shown;
  if(behind>0){
    /* 按「时间」算速度，而不是按帧算：手机快慢都差不多。
       平时约 55 字/秒（看得清是一个个冒出来的），积压太多才加速追上。 */
    var now=Date.now();
    if(!st.lastT)st.lastT=now;
    var dt=Math.min(120,now-st.lastT);st.lastT=now;
    var speed=twSpeedFor(behind,st.flush);
    st.acc=(st.acc||0)+dt*speed/1000;
    var step=Math.floor(st.acc);
    if(step>0){
      st.acc-=step;
      st.shown=Math.min(st.src.length,st.shown+step);
      twAppend(st);
      try{scrollDown()}catch(e){}
    }
  }
  if(st.shown<st.src.length){if(!st.raf)st.raf=requestAnimationFrame(twFrame)}
  else if(st.flush){
    st.dead=true;tw=null;
    try{st.el.classList.remove('gen')}catch(e){}
    if(st.pending){st.pending=false;try{renderChat()}catch(e){}}
  }
}
function twFeed(st,v){
  if(!st)return;
  if(st.dead||tw!==st){st.realSet(v);return}
  var s=String(v);
  if(/<(?!br\s*\/?>)/i.test(s)){      /* 出错提示之类：原样放进去，动画收工 */
    st.dead=true;if(tw===st)tw=null;try{st.el.classList.remove('gen')}catch(e){};st.realSet(s);return;
  }
  st.src=htmlToText(s);
  if(st.shown>st.src.length)st.shown=st.src.length;
  if(!st.raf&&st.shown<st.src.length)st.raf=requestAnimationFrame(twFrame);
}
function twStart(el){
  if(!el||!P5.live)return null;
  if(tw&&tw.el===el&&!tw.dead)return tw;
  if(tw&&!tw.dead){tw.dead=true;tw=null}
  var d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  if(!d||!d.set)return null;
  var st={el:el,src:'',shown:0,rendered:0,pend:[],mark:document.createElement('i'),
          raf:0,flush:false,dead:false,pending:false,
          realSet:function(v){try{d.set.call(el,v)}catch(e){}}};
  st.mark.style.display='none';
  try{
    Object.defineProperty(el,'innerHTML',{configurable:true,
      get:function(){return d.get.call(el)},
      set:function(v){twFeed(st,v)}});
  }catch(e){return null}
  el.classList.add('gen');                          /* 打字光标 */
  el.setAttribute('data-live','1');
  while(el.firstChild)el.removeChild(el.firstChild);
  el.appendChild(st.mark);
  tw=st;
  return st;
}
/* 给「非流式」一次拿到的整段文字，也套上同一个打字动画 */
P5.say=function(el,text){

  twFeed(st,text);

  if(!st.raf)st.raf=requestAnimationFrame(twFrame);
  return st;
};

var P5A_callAPI=callAPI;

  var o2={};for(var k in opt)o2[k]=opt[k];

        var seeded=el.innerHTML;      /* 第一段是真落进 DOM 的，先取出来 */
        st=twStart(el);
        if(st)twFeed(st,seeded);

  };
  try{return await P5A_callAPI(messages,o2)}

    try{

function p5ShrinkSrc(src,max,q){
  return new Promise(function(res){
    var img=new Image();
    if(/^https?:/i.test(src))img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return res(src);
        var s=Math.min(1,(max||1024)/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL('image/jpeg',q||.82);
        if(out.length>420000)out=cv.toDataURL('image/jpeg',.5);
        res(out);
      }catch(e){res(src)}
    };
    img.onerror=function(){res(src)};
    img.src=src;
  });

    var res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    var blob=await res.blob();
    var durl=await new Promise(function(rj,rk){
      var rd=new FileReader();
      rd.onload=function(){rj(String(rd.result))};
      rd.onerror=function(){rk(new Error('读图失败'))};
      rd.readAsDataURL(blob);

    {role:'system',content:'你是画图助手。严格按用户的画面描述生成一张图片，只输出一行 markdown 图片：![](图片地址)，不要任何其它文字。'},
    {role:'user',content:prompt}
  ],{stream:false,model:im.model||cfg.model,temp:.8,maxtok:800});
  var s=String(r||'');
  var m=s.match(/!\[[^\]]*\]\((https?:[^)\s]+)\)/)||s.match(/\((https?:[^)\s]+)\)/)||s.match(/(https?:\/\/[^\s)"'<>]+)/);
  if(!m)throw new Error('这个模型没返回图片地址：'+s.slice(0,80));
  return await toLocal(m[1]);
}
/* 画图：走 images/generations 接口。 */
async function callImageGenerate(prompt,base,key,im){
  var body={model:im.model||'gpt-image-1',prompt:String(prompt),n:1};
  if(im.size&&im.size!=='auto')body.size=im.size;
  var res=await fetch(base+'/images/generations',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body)});
  if(!res.ok){
    var t='';try{t=await res.text()}catch(e){}
    throw new Error('HTTP '+res.status+' '+String(t).replace(/\s+/g,' ').slice(0,180));
  }
  var j=await res.json();
  var d=(j&&j.data&&j.data[0])||{};
  if(d.b64_json)return await p5ShrinkSrc('data:image/png;base64,'+d.b64_json,1024,.82);
  if(d.url)return await toLocal(d.url);
  if(j.image||j.url)return await toLocal(j.image||j.url);
  throw new Error('接口没返回图片');
}
async function callImage(prompt,c){
  var im=imCfg();
  var base=String(im.base||cfg.base||'').replace(/\/+$/,'');
  var key=String(im.key||cfg.key||'');
  if(!base)throw new Error('还没填画图接口地址');
  if(!key)throw new Error('还没填画图的 API Key');
  if(String(im.mode||'images')==='chat')return callImageChat(prompt,im);
  return callImageGenerate(prompt,base,key,im);
}

/* 【修好一个隐藏 bug】原来的 toolLoop 不等工具执行完，
   所以「异步工具」（画图这种）的结果传不回给模型。这里换成会 await 的版本。 */
/* 执行一轮工具调用，并把调用和结果写回消息列表。 */
async function pushToolResults(msgs2,resp,c){
  msgs2.push({role:'assistant',content:resp.content||null,tool_calls:resp.tool_calls});
  for(var i=0;i<resp.tool_calls.length;i++){
    var tc=resp.tool_calls[i];
    var args={};
    try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){args={}}
    var r;
    try{r=await Promise.resolve(execCharTool(tc.function.name,args,c.id))}
    catch(e){r={ok:false,msg:'工具执行出错：'+((e&&e.message)||e)}}
    if(r==null)r={ok:false,msg:'没有返回'};
    msgs2.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(r)});
  }
}
toolLoop=async function(c,ctx,opt){
  opt=opt||{};
  var tools=opt.tools||toolsFor(c);
  var msgs2=ctx.slice();
  if(!tools.length)return {finalText:'',reasoning:'',usage:null,messages:msgs2,didTool:false};
  var reasoning='',usage=null,rounds=0,didTool=false;
  while(rounds<6){
    rounds++;
    var resp=await callAPI(msgs2,{stream:false,model:modelOf(c),tools:tools,tool_choice:'auto',
      signal:opt.signal,temp:opt.temp,maxtok:opt.maxtok,
      onReasoning:function(r){reasoning+=r},onUsage:function(u){usage=u}});
    if(!resp)return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:didTool};
    if(!resp.tool_calls||!resp.tool_calls.length)
      return {finalText:resp.content||'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:didTool};
    didTool=true;
    await pushToolResults(msgs2,resp,c);
    if(view==='tools'&&toolTab==='todo')safeL(function(){renderTodo()});
  }
  return {finalText:'',reasoning:reasoning,usage:usage,messages:msgs2,didTool:true};
};

askAndAppend=async function(){

function normalizeImportedChar(c,nid){
  c.id=nid;c.priv=false;
  if(c.auto)c.auto.on=false;
  if(typeof c.avatar!=='string')c.avatar='';
  if(!c.todoPerm)c.todoPerm={on:false};
  if(!c.groupPerm)c.groupPerm={on:false};
  if(!c.search)c.search={on:false};
  if(!c.toyPerm)c.toyPerm={on:true};
  if(!c.imgPerm)c.imgPerm={on:true};

/* 读取导入的角色文件文字。 */
function readImportedFileText(f){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){res(String(rd.result))};
    rd.onerror=function(){rej(new Error('读文件失败'))};
    rd.readAsText(f);
  });
}
/* 解析导入的角色文件，必要时先解密。 */
async function parseImportedCharFile(text){
  if(text.indexOf('enc:')===0){
    if(!cryptKey)return {error:'这个角色文件是加密的。请先解锁应用（输入密码）再导入。'};
    try{return {data:JSON.parse(await decVal(cryptKey,text))}}
    catch(e){return {error:'解密失败：密码不对，或文件损坏'}}
  }
  try{return {data:JSON.parse(text)}}
  catch(e){return {error:'这不是有效的角色文件（要用这里导出的 .json）'}}
}
P5.impCharFile=async function(input){

  if(!f)return;
  var text='';
  try{text=await readImportedFileText(f)}catch(e){return alert(e.message)}
  var parsed=await parseImportedCharFile(text);
  if(parsed.error)return alert(parsed.error);
  var d=parsed.data;
  if(!d||!d.char)return alert('文件里没有角色数据');
  var c=d.char;
  var nm=c.name||'角色';
  var msgLine=(d.msgs&&d.msgs.length)?('聊天记录：'+d.msgs.length+' 条'):'（不含聊天记录）';

    (d.msgs&&d.msgs.length&&d.msgs.length>200?'\n（记录比较长，可能有点慢）':'')))return;
  var nid=uid();
  c=normalizeImportedChar(c,nid);
  chars.push(c);
  try{save(LS.chars,chars)}catch(e){return alert('写入失败，本地存储可能满了')}
  try{if(d.mem)save(LS.mem(nid),d.mem)}catch(e){}

  try{if(d.gmem&&d.gmem.length)save(LS.gmem(nid),d.gmem)}catch(e){}
  try{if(d.raw)await idbPut(nid,d.raw,'rawlog')}catch(e){}
  scheduleBackup();
  try{closeSheet()}catch(e){}
  go('roles');
  say('导入完成：'+nm);

    '<div class="arcmeta">参与：'+esc(mem||'（还没选角色）')+' · '+n+' 条记录 · '+esc(safeL(function(){return stampOf(a.lastAt||a.t)},''))+'</div>'+
    '<div class="row arcfoot">'+
    '<button class="ghost iconbtn" onclick="event.stopPropagation();P5.actOpen(\''+a.id+'\')">进入</button>'+
    '<button class="ghost iconbtn" onclick="event.stopPropagation();P5.actSetSheet(\''+a.id+'\')">⚙ 设置</button>'+
    '<button class="ghost iconbtn" onclick="event.stopPropagation();P5.actTxt(\''+a.id+'\')">导出文本</button>'+
    '<button class="ghost iconbtn" style="color:var(--warn)" onclick="event.stopPropagation();P5.actDel(\''+a.id+'\')">删除</button>'+
    '</div></div>';

}

function actRowHTML(act,m,i){

    }).join('')+'</select>';

  '<div class="dim" style="font-size:11px">'+esc((act.members||[]).map(function(mm){var c=p5Char(mm.cid);return c?c.name:''}).filter(Boolean).join('、')||'（还没选角色）')+
  (act.narrOn!==false?(' · '+(act.narrName||'旁白')):' · 无旁白')+

  '<div class="actbar"><textarea id="actinp" rows="1" placeholder="你想怎么做？（也可以点上面的选项）"></textarea>'+
  '<button class="pri" onclick="P5.actSend()" '+(actBusy?'disabled':'')+'>发送</button></div>'+

/* ============ 系统提示词 ============ */
/* 【新增】演绎里的「记忆文件」：让这一场的角色 / 旁白也能读到你在私聊导入的旧聊天档案。
   默认谁都不带（和以前完全一样）；只有在这场演绎的 ⚙ 设置里勾上的角色 / 旁白才会带上。
   具体能带哪些档案，仍然听「记忆」页里每份档案自己的「哪些角色能看见这份档案」。 */
function actMemFileBlock(act,query){
  var meName=cfg.userName||'她';
  var out=[];
  (act.members||[]).forEach(function(mm){
    if(!mm||!mm.mem)return;
    var c=p5Char(mm.cid);if(!c)return;
    var t=safeL(function(){return archiveBlock(String(query||''),c)},'');
    if(!t)return;
    out.push('【'+c.name+'名下的记忆文件】\n'+t);
  });
  if(act.narrOn!==false&&act.narrMem){
    var seen={},nb=[];
    (act.members||[]).forEach(function(mm){
      var c=p5Char(mm.cid);if(!c)return;
      var t=safeL(function(){return archiveBlock(String(query||''),c)},'');
      if(!t||seen[t])return;
      seen[t]=1;
      nb.push('【'+c.name+'名下的档案】\n'+t);
    });

/* ============ 解析模型输出 ============ */
function parseActOut(text,act){
  var names={};
  names[act.narrOn!==false?(act.narrName||'旁白'):'旁白']={role:'narr'};
  names['旁白']={role:'narr'};
  names['Narrator']={role:'narr'};
  (act.members||[]).forEach(function(mm){
    var c=p5Char(mm.cid);if(!c)return;
    names[c.name]={role:'char',cid:mm.cid};
  });
  var out=[],cur=null;
  String(text).split('\n').forEach(function(raw){
    var line=raw.replace(/\s+$/,'');
    var m=line.match(/^\s*[【\[（(]?\s*([^：:\n]{1,14}?)\s*[】\]）)]?\s*[：:]\s*(.*)$/);
    var who=m?m[1].trim():'';
    var hit=(who&&names[who])?names[who]:null;
    if(hit){
      cur={role:hit.role,cid:hit.cid,content:(m[2]||'')};
      out.push(cur);
      return;
    }
    if(!cur){cur={role:'narr',content:''};out.push(cur)}
    cur.content+=(cur.content?'\n':'')+line;
  });
  return out.map(function(b){
    b.content=String(b.content||'').trim();
    return b;
  }).filter(function(b){return b.content});
}
function splitOpts(txt){
  var opts=[],keep=[];
  String(txt||'').split('\n').forEach(function(l){
    var s=l.trim();
    var m=s.match(/^[（(【\[]?\s*([A-Da-d])\s*[)）.、．:：]\s*(.+)$/);
    if(m&&m[2].trim().length>1){opts.push({k:m[1].toUpperCase(),t:m[2].trim()});return}
    keep.push(l);
  });
  var last=keep.length-1;
  if(last>=0&&/^(选项|可选|可选行动|行动选项)\s*[：:]?$/.test(String(keep[last]).trim()))keep.pop();
  return {text:keep.join('\n').trim(),opts:opts};
}

/* ============ 生成一轮 ============ */
/* 组装演绎这一轮要发给模型的上下文。 */
function buildActTurnContext(act,drive){
  var meName=cfg.userName||'她';
  var ms=actMsgs(act.id);
  var hist=ms.slice(-40).map(function(m){
    if(m.role==='sys')return '【场上事件】'+m.content;
    var who=(m.role==='user')?meName:(m.role==='narr'?((act.narrOn!==false&&act.narrName)?act.narrName:'旁白'):p5CharName(m.cid));
    return who+'：'+String(m.content||'');
  }).join('\n');
  var who2=(drive&&drive!=='narr')?p5CharName(drive):'';
  var hint='【现在继续演绎】'+(who2
    ?('这一轮主要写「'+who2+'」的行动和对白，旁白用一两句交代画面与结果。')
    :('以旁白为主推进：交代新出现的画面、NPC 的反应、局面的变化，然后把剧情往前推。'))+
    '结尾给出 1~3 个可行选项（每行一个，格式：A. ……）。不要替'+meName+'做决定，也不要写'+meName+'说的话。';
  /* 【新增】拿你最近说的一句话当关键词，去「记忆文件」里找相关片段 */
  var lastQ='';
  for(var qi=ms.length-1;qi>=0;qi--){
    if(ms[qi].role==='user'&&ms[qi].content){lastQ=String(ms[qi].content);break}
  }
  return [{role:'system',content:actSys(act)+actMemFileBlock(act,lastQ)},
    {role:'user',content:'【演绎记录】\n'+(hist||'（刚刚开始，还没有任何记录）')+'\n\n'+hint}];
}
/* 解析并保存模型返回的演绎内容；成功返回 true。 */
function saveActTurnText(text,act){
  if(!text){say('模型没返回内容，检查一下模型或网络');return false}
  var blocks=parseActOut(text,act);
  if(!blocks.length)blocks=[{role:'narr',content:text}];
  var allOpts=[];
  blocks.forEach(function(b){
    var r=splitOpts(b.content);
    b.content=r.text;
    if(r.opts.length)allOpts=allOpts.concat(r.opts);
  });
  allOpts=allOpts.slice(0,6);
  if(allOpts.length){
    var host=null;
    for(var i=blocks.length-1;i>=0;i--){if(blocks[i].role==='narr'){host=blocks[i];break}}
    if(!host)host=blocks[blocks.length-1];
    host.opts=allOpts;
  }
  blocks=blocks.filter(function(b){return String(b.content||'').trim()||b.opts});
  var ms2=actMsgs(act.id);
  blocks.forEach(function(b){
    ms2.push({role:b.role,cid:b.cid,content:String(b.content||'').trim(),t:Date.now(),opts:b.opts||null});
  });
  saveActMsgs(act.id,ms2);
  return true;
}

function actLiveBubble(act){

  if(!box)return null;

/* 演绎的「打字机」：接口是否支持流式都能逐字显示，积压多时自动加速追上 */
function actTypewrite(live,getText,isDone){
  return new Promise(function(resolve){
    if(!live||!live.text){resolve();return}
    var shown=0,last=Date.now(),acc=0;
    function frame(){
      if(!live.el||!document.body.contains(live.el)){resolve();return}
      var src=String(getText()||'');
      var behind=src.length-shown;
      if(behind>0){
        var now=Date.now();
        var dt=Math.min(120,now-last);last=now;
        var speed=isDone()?200:70;
        if(behind>1600)speed=1200;
        else if(behind>600)speed=500;
        else if(behind>200)speed=200;
        acc+=dt*speed/1000;
        var n=Math.floor(acc);
        if(n>0){
          acc-=n;
          shown=Math.min(src.length,shown+n);
          live.text.textContent=src.slice(0,shown);
          scrollActDown();
        }
      }
      if(isDone()&&shown>=String(getText()||'').length){resolve();return}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function actTurn(act,drive){
  if(actBusy)return;
  if(!cfg.key)return alert('先去设置里填 API Key');
  if(!(act.members||[]).length&&act.narrOn===false)return alert('这场演绎还没有角色也没有旁白');
  actBusy=true;
  actFollow=true;                 /* 新一轮开始：默认跟随到最新 */
  renderToolPane();
  var ok=false,live=null,out='',done=false,typing=null;
  try{
    var ctx=buildActTurnContext(act,drive);
    live=actLiveBubble(act);
    typing=actTypewrite(live,function(){return out},function(){return done});
    var text='',streamErr=null;
    try{
      text=String(await callAPI(ctx,{stream:true,model:cfg.model,
        temp:Math.max(.7,Number(cfg.temp)||.85),maxtok:1400,
        onDelta:function(d){
          out+=d;
        }})||'');
    }catch(e1){streamErr=e1}
    if(!String(text||'').trim()){
      /* 个别接口不支持流式、或直接拒绝流式：退回整段生成 */
      try{
        var whole=String(await callAPI(buildActTurnContext(act,drive),{stream:false,model:cfg.model,
          temp:Math.max(.7,Number(cfg.temp)||.85),maxtok:1400})||'');
        if(String(whole||'').trim())text=whole;
      }catch(e2){
        if(!out)throw (streamErr||e2);
      }
    }
    if(!text&&!out&&streamErr)throw streamErr;
    if(text&&text!==out)out=text;
    if(!text)text=out;
    done=true;
    try{await typing}catch(e){}
    text=String(text||'').trim();
    if(live&&live.el&&live.el.parentNode)live.el.parentNode.removeChild(live.el);
    if(saveActTurnText(text,act))ok=true;
  }catch(e){
    done=true;
    try{if(typing)await typing}catch(_e){}
    if(out&&String(out).trim()&&saveActTurnText(String(out),act))ok=true;
    if(live&&live.el&&live.el.parentNode)live.el.parentNode.removeChild(live.el);
    say('演绎出错：'+String((e&&e.message)||e).slice(0,90));
  }finally{
    actBusy=false;
    if(ok)touchAct(act);
    renderToolPane();
  }
}

  rd.onload=async function(){
    try{
      var s=String(rd.result),d;
      if(s.indexOf('enc:')===0){
        if(!cryptKey)return alert('这个备份是加密的。请先设置/输入密码解锁后再导入。');
        try{s=await decVal(cryptKey,s)}catch(e){return alert('解密失败：密码不对或文件损坏')}
      }
      d=JSON.parse(s);
      if(!confirm('导入会覆盖现在所有数据，确定？'))return;
      if(d.cfg)save(LS.cfg,d.cfg);
      if(d.chars)save(LS.chars,d.chars);
      if(d.messages)Object.keys(d.messages).forEach(k=>save(LS.msg(k),d.messages[k]));
      if(d.memories)Object.keys(d.memories).forEach(k=>{if(d.memories[k])save(LS.mem(k),d.memories[k])});
      if(d.todos)Object.keys(d.todos).forEach(k=>{if(d.todos[k]&&d.todos[k].length)save(LS.todo(k),d.todos[k])});
      if(d.gmems)Object.keys(d.gmems).forEach(k=>{if(d.gmems[k]&&d.gmems[k].length)save(LS.gmem(k),d.gmems[k])});
      if(d.arcs)save(LS.arcs,d.arcs);
      if(d.arcData)for(const k of Object.keys(d.arcData)){
        try{
          const v=Array.isArray(d.arcData[k])?sanitizeArcMs(d.arcData[k]):d.arcData[k];
          await idbPut(k,v);arcMem[k]=v;
        }catch(e){}
      }
      if(d.groups)save(LS.groups,d.groups);
      if(d.gmsgs)Object.keys(d.gmsgs).forEach(k=>{if(d.gmsgs[k])save(LS.gmsg(k),d.gmsgs[k])});
      try{
        if(d.acts)save(KAct,d.acts);
        if(d.actMsgs)Object.keys(d.actMsgs).forEach(function(k){
          if(d.actMsgs[k])save(KActMsg(k),d.actMsgs[k]);
        });
      }catch(e){}
      alert('导入完成，刷新一下');
      location.reload();
    }catch(e){alert('文件读不了：'+e.message)}
  };
  rd.readAsText(f);
};

  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){fin(1)}).catch(function(){fin(0)});
    }else{
      var ta=document.createElement('textarea');
      ta.value=t;ta.style.position='fixed';ta.style.opacity='0';

    if(!el)return;

      if(lpMoved||sel.on)return;

    if(!lpStart)return;

      lpMoved=true;clearTimeout(lpTimer);

try{

    b.addEventListener('click',function(){if(sel.on)selStop()});
  });
}catch(e){}

console.log('[深蓝海域] 补丁6-B 已加载');
})();

var GROUPS=[
  ['外观',['外观与交互']],
  ['连接',['接口']],
  ['记忆',['记忆注入','记忆与自动总结']],
  ['能力',['联网搜索','画图','演绎']],

function ttlOf(card){
  var k=card.children;
  for(var i=0;i<k.length;i++){
    if(k[i].classList&&k[i].classList.contains('ttl'))return k[i];
  }
  return null;

/* ============ 颜色小工具 ============ */
function hx(v){
  var h=String(v||'').trim().replace('#','');
  if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');
  if(h.length!==6||!/^[0-9a-f]{6}$/i.test(h))return null;
  var n=parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgba(a,t){return a?('rgba('+a[0]+','+a[1]+','+a[2]+','+t+')'):''}
function mixTo(a,b,t){          /* 把 a 往 b 里调，t＝a 占多少 */
  if(!a)return '';
  if(!b)b=a;
  var r=Math.round(a[0]+(b[0]-a[0])*(1-t)),
      g=Math.round(a[1]+(b[1]-a[1])*(1-t)),
      bl=Math.round(a[2]+(b[2]-a[2])*(1-t));

}

/* 只留一层弹层：点「关闭」一次就能关掉，不会越点越往回退 */
function sheetOnly(html){
  var reset=false;
  try{sheetStack.length=0;reset=true}catch(e){}
  if(!reset){
    for(var i=0;i<30;i++){
      var md=document.getElementById('modal');
      if(!md||!md.classList.contains('on'))break;
      closeSheet();
    }
  }
  var sh=document.getElementById('sheet');
  if(sh)sh.innerHTML='';
  showSheet(html);
}
function all(){
  try{var a=load(KEY,[]);return Object.prototype.toString.call(a)==='[object Array]'?a:[]}
  catch(e){return []}
}
function saveAll(a){
  try{save(KEY,a)}catch(e){return false}
  try{scheduleBackup()}catch(e){}
  return true;
}
function usedBytes(){var a=all(),n=0;for(var i=0;i<a.length;i++)n+=String(a[i].img||'').length;return n}
function findSt(id){
  var a=all();
  for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i]}
  return null;
}

/* ---------- 图片处理：缩小后存本地；gif 不大就保留动效 ---------- */
function shrinkOne(file,max,q){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          if(!w||!h){rej(new Error('图片尺寸不对'));return}
          var s=Math.min(1,max/Math.max(w,h));
          w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
          var alpha=/png|webp|svg/i.test(String((file&&file.type)||''));
          var out='';
          if(alpha){
            var cv=document.createElement('canvas');cv.width=w;cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h);
            out=cv.toDataURL('image/png');
          }
          if(!alpha||out.length>MAX_ONE){
            var c2=document.createElement('canvas');c2.width=w;c2.height=h;
            var x2=c2.getContext('2d');
            x2.fillStyle='#ffffff';x2.fillRect(0,0,w,h);
            x2.drawImage(img,0,0,w,h);
            out=c2.toDataURL('image/jpeg',q||.85);
          }
          res(out);
        }catch(e){rej(e)}
      };
      img.onerror=function(){rej(new Error('这个图片读不了'))};
      img.src=String(rd.result||'');
    };
    rd.onerror=function(){rej(new Error('文件读不了'))};
    rd.readAsDataURL(file);
  });
}
function readSticker(file){
  var t=String((file&&file.type)||'');
  if(/gif/i.test(t)&&file.size&&file.size<=330*1024){
    return new Promise(function(res,rej){
      var rd=new FileReader();
      rd.onload=function(){res(String(rd.result||''))};
      rd.onerror=function(){rej(new Error('文件读不了'))};
      rd.readAsDataURL(file);
    });
  }
  return shrinkOne(file,360,.85);
}

var FOLDKEY='表情包';
var foldFallback=false;
function p13Open(){
  try{
    var v=(W.P6&&W.P6.foldOpen)?W.P6.foldOpen[FOLDKEY]:undefined;
    return v===undefined?foldFallback:!!v;
  }catch(e){return foldFallback}
}
/* 和别的设置卡片一样：点标题收起 / 展开 */
function foldCardP(){
  var card=document.getElementById('p13card');
  if(!card)return;
  var ttl=null;
  for(var i=0;i<card.children.length;i++){
    var el=card.children[i];
    if(el.classList&&el.classList.contains('ttl')){ttl=el;break}
  }
  if(!ttl)return;
  var ch=ttl.querySelector('.p6chev');
  var open=p13Open(),after=false;
  Array.prototype.forEach.call(card.children,function(el){
    if(el===ttl){after=true;return}
    if(after)el.style.display=open?'':'none';
  });
  if(ch)ch.textContent=open?'▾':'▸';
  ttl.style.cursor='pointer';
  ttl.style.display='flex';            /* 和别的卡片一样：箭头和字之间留出间距 */
  ttl.style.alignItems='center';
  ttl.style.gap='6px';
  if(ttl._p13fold)return;
  ttl._p13fold=1;
  ttl.addEventListener('click',function(e){
    if(e.target&&e.target.closest&&e.target.closest('button,input,select,textarea,a'))return;
    var now=!p13Open();
    foldFallback=now;
    try{W.P6.foldOpen[FOLDKEY]=now}catch(err){}
    var a2=false;
    Array.prototype.forEach.call(card.children,function(el){
      if(el===ttl){a2=true;return}
      if(a2)el.style.display=now?'':'none';
    });
    if(ch)ch.textContent=now?'▾':'▸';
  });
}

W.P13.saveEdit=function(){
  var d=W.P13._draft;
  if(!d)return;
  var nm=(document.getElementById('p13_name').value||'').trim();
  var ds=(document.getElementById('p13_desc').value||'').trim();
  if(!nm){alert('给它起个名字吧，角色靠名字认得它。');return}
  if(!ds){alert('写一下这个表情是什么意思，角色才看得懂。');return}
  var list=all(),hit=false;
  if(d.id){
    for(var i=0;i<list.length;i++){
      if(list[i].id===d.id){list[i].name=nm;list[i].desc=ds;list[i].img=d.img;hit=true;break}
    }
  }
  if(!hit)list.push({id:uid(),name:nm,desc:ds,img:d.img,t:Date.now()});
  if(!saveAll(list)){alert('存不下了。先删掉几个表情，或者清一点聊天记录再试。');return}
  W.P13._draft=null;
  say('已保存');
  W.P13.manage();
  try{if(view==='cfg')renderCfg()}catch(e){}
};
W.P13.del=function(id){
  var s=findSt(id);
  if(!s)return;
  if(!confirm('删掉表情「'+(s.name||'')+'」？'))return;
  saveAll(all().filter(function(x){return x.id!==id}));
  say('已删除');
  W.P13.manage();
  try{if(view==='cfg')renderCfg()}catch(e){}
};
function gotFile(f){
  if(!f)return;
  say('处理图片…');
  readSticker(f).then(function(url){
    url=String(url||'');
    if(!url)return;
    if(url.length>MAX_ONE){alert('这张图太大了，装不下。换一张小一点的，或者先把它裁小再添加。');return}
    var swap=W.P13._swapId||null;W.P13._swapId=null;
    var base=swap?findSt(swap):null;
    var bonus=(base&&base.img===url)?0:url.length;
    if(usedBytes()+bonus>MAX_ALL){alert('表情库已经很大了（手机上存的图太多会撑爆浏览器存储）。先去「管理表情包」删掉几个再添加。');return}
    W.P13._draft={id:base?base.id:null,img:url,name:base?(base.name||''):'',desc:base?(base.desc||''):''};
    editSheet();
  }).catch(function(e){alert('这个图片读不了：'+((e&&e.message)||e))});
}

/* 用户那条气泡：她自己打的字 + 表情图（时间小字留着） */
function paintUserSticker(b,x){
  if(!b||!x||!x.sticker)return;
  var time=null;
  Array.prototype.slice.call(b.childNodes).forEach(function(n){
    if(n.nodeType===1&&n.classList&&n.classList.contains('p6time')){time=n;return}
    b.removeChild(n);
  });
  if(x.text){
    b.classList.remove('p13only');
    var t=document.createElement('div');
    t.className='p13utext';t.innerHTML=mdLite(String(x.text));
    b.insertBefore(t,b.firstChild);
  }else{
    b.classList.add('p13only');
  }
  b.insertBefore(mkImg(x.sticker,'p13sk'),time&&time.parentNode===b?time:null);
  if(time&&time.parentNode===b)b.appendChild(time);
}
/* 不等整页重画，先把刚发出去那条画对（不然会先看到一行说明文字） */
function paintLastUserBubble(){
  var box=document.getElementById('msgs');
  if(!box)return;
  var bubs=Array.prototype.slice.call(box.querySelectorAll('.bub'));
  var b=null;
  for(var i=bubs.length-1;i>=0;i--){
    if(bubs[i].classList&&bubs[i].classList.contains('me')){b=bubs[i];break}
  }
  if(!b)return;
  var x=msgs[msgs.length-1];
  if(!x||x.role!=='user'||!x.sticker)return;
  if(b.querySelector('.p13sk'))return;
  paintUserSticker(b,x);
}

/* 把表情放进「待发」区（就是输入框上面那条预览），不立刻发出去 */
function stageSticker(st){
  if(!st)return;
  try{clearPicked()}catch(e){}          /* 清掉待发的图片/文件，和上一个表情 */
  W.P13.pendSticker=st;
  var p=document.getElementById('picked');
  var t=document.getElementById('thumb');
  var f=document.getElementById('fchip');
  if(f){f.style.display='none';f.innerHTML=''}
  if(t){t.style.display='';t.src=st.img;t.alt=st.name||'表情'}
  if(p)p.classList.add('on');
  try{updSendBtn()}catch(e){}
}
W.P13.choose=function(id){
  var s=findSt(id);
  if(!s){say('这个表情已经不在了');return}
  if(!curChar())return say('先选个角色再发');
  closeSheet();
  stageSticker(s);
  say('表情放好了，可以再打几个字，然后点发送');
};
/* 点发送：把「自己打的字 + 表情」当成一条消息发出去 */
var P13_send=send;
send=async function(){
  var st=W.P13.pendSticker;
  if(!st)return P13_send.apply(this,arguments);
  var c=curChar();
  if(!c)return say('先选个角色再发');
  if(busy){say('ta还在输入，稍等一下');return}
  var inp=document.getElementById('inp');
  var txt=inp?String(inp.value||'').trim():'';
  if(inp){inp.value=(txt?(txt+'\n'):'')+msgText(st);inp.style.height='auto'}
  W.P13.pendSticker=null;
  var before=msgs.length;
  var p=P13_send.apply(this,arguments);   /* 里面先同步把消息发出去，再等它回复 */
  try{clearPicked()}catch(e){}            /* 发出去以后，输入框上面那条预览要收掉 */
  try{
    if(msgs.length>before){
      var m=msgs[msgs.length-1];
      if(m&&m.role==='user'&&!m.sticker){
        m.sticker=brief(st);
        if(txt)m.text=txt;                /* 气泡里只画她自己打的字 + 表情图 */
        try{persist()}catch(e){}
        try{paintLastUserBubble()}catch(e){}
      }
    }
  }catch(e){}
  return await p;
};

/* ---------- 渲染：把表情画进气泡 / 挂在回复下面 ---------- */
var P13_renderChat=renderChat;
renderChat=function(){
  P13_renderChat.apply(this,arguments);
  try{
    var box=document.getElementById('msgs');if(!box)return;
    var bubs=Array.prototype.slice.call(box.querySelectorAll('.bub'));
    if(bubs.length!==msgs.length)return;
    msgs.forEach(function(x,i){
      var s=x&&x.sticker;
      if(!s||!s.img)return;
      var b=bubs[i];if(!b)return;
      if(x.role==='user'){
        if(b.querySelector('.p13sk'))return;
        paintUserSticker(b,x);
      }else{
        var nx=b.nextElementSibling;
        if(nx&&nx.classList&&nx.classList.contains('p13line'))return;
        if(box.querySelector('.p13line[data-i="'+i+'"]'))return;
        var line=document.createElement('div');
        line.className='p13line';line.dataset.i=String(i);
        line.appendChild(mkImg(s,'p13skimg'));
        var tag=document.createElement('span');
        tag.className='p13tag';tag.textContent='「'+(s.name||'表情')+'」';
        line.appendChild(tag);
        if(b.nextSibling)b.parentNode.insertBefore(line,b.nextSibling);
        else b.parentNode.appendChild(line);
      }
    });
    try{if(chatFollow)scrollDown()}catch(e){}
  }catch(e){}
};

/* ---------- 让角色知道表情库（系统提示） ---------- */
var P13_buildCtxSystem=buildCtxSystem;
buildCtxSystem=function(){
  var sys=P13_buildCtxSystem.apply(this,arguments);
  try{
    var list=all();
    if(list.length&&sys&&sys.push){
      var lines=list.map(function(s,i){
        return (i+1)+'. '+(s.name||'表情')+(s.desc?('　意思是：'+s.desc):'');
      });
      var blk='【表情包（你和用户共用一套）】\n下面是你和她共用的表情库，你完全懂每个表情的意思：\n'+lines.join('\n')+
        '\n她发表情给你时，消息里会写清楚是哪个表情、什么意思（比如「［表情包］摸头（含义：…）」），你按那个意思回应就行，不要问「这是什么图」，也不用描述这张图。';
      if(W.P13.armed&&sendOn()){
        blk+='\n你也可以在合适的时候自己发一个：调用 send_sticker 工具，id 填上面那个编号。适合发的时机：情绪正好对得上（开心、想逗她、安慰她、撒娇、被说得无语、她要出门/睡觉）；不适合的时机：她在说正经事或难过的事、你上一条刚发过表情。不要每句都发，一轮最多发一个，发完接着正常说话，不要再用文字解释那个表情。';
      }
      sys.push(blk);
    }
  }catch(e){}
  return sys;
};

/* ---------- 角色的表情工具 ---------- */
var SEND_STICKER_TOOL={type:'function',function:{
  name:'send_sticker',
  description:'从你和用户共用的表情库里挑一个表情发出去。只在这个表情的语境确实合适时用，一轮最多发一个；参数 id 是表情库里的编号。',
  parameters:{type:'object',properties:{
    id:{type:'string',description:'表情编号，例如 2，见系统提示里的表情库列表'}
  },required:['id']}
}};
var P13_toolsFor=toolsFor;
toolsFor=function(){
  var t=P13_toolsFor.apply(this,arguments);
  try{
    if(W.P13.armed&&sendOn()&&all().length&&t&&t.push)t.push(SEND_STICKER_TOOL);
  }catch(e){}
  return t;
};
function execSticker(args){
  var list=all();
  if(!list.length)return {ok:false,msg:'表情库是空的，发不了表情，用文字说就行。'};
  var want=String((args&&args.id)||'').trim();
  var st=null;
  for(var i=0;i<list.length;i++){
    if(list[i].id===want||String(i+1)===want||list[i].name===want){st=list[i];break}
  }
  if(!st){
    return {ok:false,msg:'没有找到这个表情。可用编号：'+list.map(function(s,i){return (i+1)+'='+(s.name||'')}).join('、')+'。要么换一个，要么这次就别发。'};
  }
  if((W.P13.sent||[]).length)return {ok:false,msg:'这一轮已经发过表情了，不要再发第二个。'};
  W.P13.sent.push(brief(st));
  return {ok:true,msg:'已经把表情「'+(st.name||'')+'」（含义：'+(st.desc||'无')+'）发给她了。不要再发第二个，也不要描述这张图，接着用一两句话正常说话就行。'};
}
var P13_execCharTool=execCharTool;
execCharTool=function(){
  var name=arguments[0];
  if(name==='send_sticker'){
    try{return execSticker(arguments[1])}
    catch(e){return {ok:false,msg:'发不了表情：'+((e&&e.message)||e)}}
  }
  return P13_execCharTool.apply(this,arguments);
};
/* 模型不支持工具调用时，退回到「不用表情」的正常聊天 */
var P13_toolLoop=toolLoop;
toolLoop=async function(c,ctx,opt){
  try{
    return await P13_toolLoop.apply(this,arguments);
  }catch(e){
    var t=(opt&&opt.tools)||null;
    if(!t&&typeof toolsFor==='function')t=toolsFor(c);
    var has=false;
    if(t&&t.some){has=t.some(function(x){return x&&x.function&&x.function.name==='send_sticker'})}
    if(!has)throw e;
    var filt=t.filter(function(x){return !(x&&x.function&&x.function.name==='send_sticker')});
    var o2={};
    for(var k in opt){if(Object.prototype.hasOwnProperty.call(opt,k))o2[k]=opt[k]}
    o2.tools=filt;
    return await P13_toolLoop.call(this,c,ctx,o2);
  }
};
/* 角色这一轮挑的表情，等它说完话挂到那条回复下面 */
var P13_askAndAppend=askAndAppend;
askAndAppend=async function(){
  W.P13.armed=true;
  W.P13.sent=[];
  var before=msgs.length;
  try{
    return await P13_askAndAppend.apply(this,arguments);
  }finally{
    W.P13.armed=false;
    try{
      var arr=W.P13.sent;W.P13.sent=[];
      if(arr.length&&msgs.length>before){
        var m=msgs[msgs.length-1];
        if(m&&m.role==='assistant'&&!m.sticker){
          m.sticker=arr[arr.length-1];
          try{persist()}catch(e){}
          try{renderChat()}catch(e){}
        }
      }
    }catch(e){}
  }
};

/* ---------- 设置页插入「表情包」卡片 ---------- */
var P13_renderCfg=renderCfg;
renderCfg=function(){
  P13_renderCfg.apply(this,arguments);
  try{
    var m=document.getElementById('main');if(!m)return;
    if(document.getElementById('p13card'))return;
    var card=document.createElement('div');
    card.className='card';card.id='p13card';card.innerHTML=cardHTML();
    var anchor=document.getElementById('imgCard')||document.getElementById('webCard')||m.querySelector('.card');
    if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(card,anchor.nextSibling);
    else m.appendChild(card);
    foldCardP();                       /* 和别的卡片一样：点标题收起／展开 */
    var ck=document.getElementById('p13_send');
    if(ck)ck.onchange=function(){
      cfg.stickerSend=!!this.checked;
      try{save(LS.cfg,cfg)}catch(e){}
      say(cfg.stickerSend?'角色可以按语境自己发表情了':'已关掉：角色不会自己发表情');
    };
  }catch(e){}
};

    }catch(e){}
  }
  repaint();
  setTimeout(repaint,80);
})();
