<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>深蓝海域</title>
<style>
:root{
  --fs:15px;
  --bg:#050e16;--bg2:#081a29;--panel:#0d1c28;--line:#1a3342;
  --txt:#d9e9f2;--dim:#7d99aa;
  --acc:#3fa9d8;--acc2:#5cc4f0;--accdim:#1b4a63;
  --warn:#e06a60;
  --bub:18px;
  --shadow:0 2px 10px rgba(0,0,0,.18);
  --grad:linear-gradient(160deg,#0e2c3f 0%,#081a29 60%);
  --bubme:linear-gradient(135deg,#1b4a63,#17445c);
  --scbg:rgba(10,22,32,.82);--scfg:#eaf3f8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:var(--fs)/1.65 -apple-system,"PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--grad);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px;color:var(--acc);flex:0 0 auto}
header .who{flex:1;color:var(--dim);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;width:100%;max-width:760px;margin:0 auto}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.row{display:flex;gap:8px}
.col{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 4px 16px var(--p8accSh,rgba(63,169,216,.18))}
.ttl{font-weight:700;font-size:14px;color:var(--acc);margin-bottom:8px;letter-spacing:.3px}
.dim{color:var(--dim)}
label.f{display:block;margin:10px 0 4px;font-size:12px;color:var(--dim)}
input,textarea,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--p8accSh,rgba(63,169,216,.12))}
input[type=checkbox]{width:auto;transform:scale(1.2);accent-color:var(--acc)}
button{font:inherit;background:var(--accdim);color:var(--txt);border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;transition:transform .06s ease,filter .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.15)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#02131c);font-weight:700;box-shadow:0 4px 14px var(--p8accSh,rgba(63,169,216,.28))}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:6px 10px;border-radius:10px;box-shadow:none}
button.warn{background:transparent;border:1px solid var(--line);color:var(--warn);box-shadow:none}
button:disabled{opacity:.45;pointer-events:none}
.bub{max-width:84%;padding:9px 13px;border-radius:var(--bub);margin:7px 0 0;word-break:break-word;font-size:var(--fs);box-shadow:var(--shadow);animation:pop .16s ease}
.bub.me{margin-left:auto;background:var(--bubme);border-bottom-right-radius:6px}
.bub.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub .time{display:block;margin-top:5px;font-size:10px;opacity:.5;text-align:right;line-height:1;user-select:none}
.bub .msgimg{display:block;max-width:100%;border-radius:10px;margin-bottom:5px;border:1px solid rgba(0,0,0,.15)}
.bub.typing{padding:13px 15px}
.bub.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--dim);animation:tp 1.2s infinite}
.bub.typing span:nth-child(2){animation-delay:.15s}
.bub.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{transform:translateY(4px);opacity:0}}
.think{margin:6px 0 0;max-width:84%}
.thinkhead{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:color .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
.thinkhead::after{content:'▸';font-size:10px;line-height:1;transform:translateY(-1px);transition:transform .18s ease}
.thinkhead.on{color:var(--acc);border-color:var(--acc);background:var(--accdim);box-shadow:0 2px 10px var(--p8accSh,rgba(63,169,216,.18))}
.thinkhead.on::after{content:'▾';transform:translateY(-1px)}
.thinkbody{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;display:none;animation:pop .16s ease}
.ops{display:flex;gap:7px;margin:7px 0 10px;flex-wrap:wrap}
.ops.me{justify-content:flex-end}
.ops button{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:5px 13px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:color .15s ease,border-color .15s ease,background .15s ease,transform .1s ease}
.ops button.hot{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
.ops svg,.thinkhead svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.thinkhead svg{width:13px;height:13px}

.tok{font-size:11px;color:var(--dim);margin:2px 0 6px}
.tok.me{text-align:right}
.li{display:flex;gap:6px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.li>span{flex:1 1 auto;min-width:0;word-break:break-word}
.li .x{background:none;border:0;color:var(--dim);padding:0 4px;font-size:17px;line-height:1;box-shadow:none}
.hint{color:var(--dim);text-align:center;padding:34px 0}
/* 自适应设置行：窄屏也能正常换行 */
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.setrow .lbl{flex:1 1 auto;min-width:132px;font-size:12px;color:var(--dim);line-height:1.45}
.setrow input[type=number]{width:78px;flex:0 0 78px;text-align:center;padding:7px 6px;font-size:13px}
.setrow .unit{font-size:12px;color:var(--dim)}
/* 档案条目 */
.arcitem{padding:10px 0;border-bottom:1px dashed var(--line)}
.arcitem:last-child{border-bottom:0}
.arcname b{font-size:14px;word-break:break-word}
.arcmeta{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.55;word-break:break-word}
.arcmeta.warn{color:var(--warn)}
.arcfoot{flex-wrap:wrap;gap:6px;margin-top:8px}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 11px;border-radius:9px;box-shadow:none;font-size:13px;line-height:1.2}
/* 隐私角色 */
.privbox{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px;background:var(--panel);opacity:.85;box-shadow:none}
.privav{width:48px;height:48px;padding:0;font-size:24px;line-height:1;border-radius:14px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);box-shadow:none;opacity:.8;overflow:hidden}
.privav img{width:100%;height:100%;object-fit:cover;display:block}
.privav.on{border-color:var(--acc);opacity:1}
.privunit{display:flex;flex-direction:column;align-items:center;gap:6px}
.privunit .privset{font-size:11px;padding:3px 9px;border-radius:999px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:rgba(4,20,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;display:none;max-width:82%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#picked{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:8px 12px 0;background:var(--grad)}
#picked.on{display:flex}
#picked img{height:66px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
#picked button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:13px;box-shadow:none}
/* ---------- 底部输入栏：去掉右下角小点 + 更圆润 ---------- */
#composer{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px;background:var(--grad);border-top:1px solid var(--line);align-items:flex-end}
#composer textarea{flex:1;min-height:42px;max-height:120px;border-radius:16px;padding:10px 14px;resize:none;background:var(--bg2);border-color:transparent;box-shadow:inset 0 0 0 1px var(--line);overflow-y:auto;scrollbar-width:none}
#composer textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--p8accSh,rgba(63,169,216,.12))}
#composer textarea::-webkit-scrollbar{width:0;height:0}
#composer textarea::-webkit-resizer{display:none;background:transparent}
#composer button{width:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02131c;font-weight:800;font-size:18px}
#composer #pic{background:var(--bg2);border:1px solid var(--line);color:var(--acc);font-size:17px;box-shadow:none}
#composer #stop{background:linear-gradient(135deg,#c0504a,#e06a60);color:#fff;font-size:20px}
.thinkbar{display:flex;gap:8px;margin-bottom:10px}
.thinkbar button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:13px;padding:7px 0;border-radius:10px;box-shadow:none}
.thinkbar button.active{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* ---------- 底部导航（美化版） ---------- */
nav{flex:0 0 auto;display:flex;gap:4px;background:var(--grad);border-top:1px solid var(--line);padding:5px 6px calc(env(safe-area-inset-bottom) + 5px);position:relative;box-shadow:0 -6px 20px rgba(0,0,0,.16)}
nav::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accglow,rgba(63,169,216,.5)),transparent);pointer-events:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--dim);padding:7px 2px 6px;font-size:10.5px;letter-spacing:.4px;border-radius:14px;position:relative;box-shadow:none;transition:background .18s ease,color .18s ease,transform .12s ease}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease,filter .18s ease}
nav button span{line-height:1}
nav button:active{transform:scale(.94)}
nav button.on{color:var(--acc);background:radial-gradient(70% 70% at 50% 0%,rgba(63,169,216,.18),rgba(63,169,216,0) 72%)}
nav button.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 3px 8px var(--accglow,rgba(63,169,216,.5)))}
nav button.on::after{content:'';position:absolute;top:1px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--accglow,rgba(63,169,216,.6))}
/* 未读红点 */
nav button .dot{position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--panel),0 0 8px rgba(255,77,94,.8);display:none}
nav button .dot.on{display:block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.card .udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d5e;margin-left:6px;vertical-align:middle;box-shadow:0 0 6px rgba(255,77,94,.8)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;backdrop-filter:blur(2px)}
.modal.on{display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 14px calc(env(safe-area-inset-bottom) + 18px);animation:up .18s ease;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
/* ---------- 弹层右上角常驻关闭键 ---------- */
.sheetclose{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:70;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;background:var(--scbg,rgba(10,22,32,.82));border:1px solid var(--line);color:var(--scfg,#eaf3f8);font-size:15px;font-weight:700;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .15s ease,color .15s ease,transform .12s ease}
#modal.on .sheetclose{display:flex}
/* 全屏弹层：记忆宫殿从桌面图标直接打开时铺满整屏，像个小应用 */
.modal.full{align-items:stretch}
.sheet.full{max-height:100vh;height:100vh;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 16px)}
/* ---------- 全屏按钮：只在「退出了全屏」时出现 ---------- */
#fsBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:50;width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--scbg,rgba(10,22,32,.82));border:1px solid var(--line);color:var(--scfg,#eaf3f8);box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0;transition:transform .12s ease,opacity .15s ease}
#fsBtn.on{display:flex}
#fsBtn:active{transform:scale(.92)}
#fsBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheetclose:active{transform:scale(.92)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:320px}
/* 弹层顶部标签（角色设定 / 记忆） */
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:14px;padding:9px 0;border-radius:12px;font-weight:700;box-shadow:none}
.tabs button.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* 分段选择器 */
.seg{display:flex;gap:6px;margin:6px 0 0}
.seg button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:8px 4px;border-radius:10px;box-shadow:none}
.seg button.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
/* 用户主页头像 */
.meavatar{width:64px;height:64px;font-size:32px;line-height:1;padding:0;border-radius:18px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.meavatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
/* ---------- 头像框：emoji 或图片都能装 ---------- */
.avbox{display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:16px;flex:0 0 auto;line-height:1;box-shadow:none}
.avbox img{width:100%;height:100%;object-fit:cover;display:block}
.meavatar{cursor:pointer}
/* ---------- 底部工具栏按钮（发图 / 发送 / 停止） ---------- */
#composer button{display:flex;align-items:center;justify-content:center}
#composer #pic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#composer #send svg{width:23px;height:23px;fill:currentColor;stroke:none}
#composer #stop svg{width:19px;height:19px;fill:currentColor;stroke:none}
#composer #pic{transition:color .15s ease,border-color .15s ease,background .15s ease}
#composer #pic:active{background:var(--accdim);border-color:var(--acc)}
/* ---------- 应用宫格（仿手机桌面） ---------- */
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;margin-top:4px}
.apptile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 15px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s ease,border-color .18s ease}
.apptile:active{transform:scale(.95)}
.apptile .ai{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p8accSh,rgba(63,169,216,.18)),transparent);border:1px solid var(--line)}
.apptile .ai svg{width:26px;height:26px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.apptile .an{font-size:13px;font-weight:600}
.apptile .ad{font-size:10.5px;color:var(--dim);text-align:center;line-height:1.3}
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.appbar .at{flex:1;font-size:15px;font-weight:700;letter-spacing:.3px}
.appback{width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;padding:0;box-shadow:none}
/* ---------- 群聊（仿微信 · 现代扁平） ---------- */
.gwrap{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:16px;background:var(--grad);border:1px solid var(--line);box-shadow:var(--shadow)}
.ghead .gname2{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gicon{width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:16px;padding:0;box-shadow:none}
.gicon:active{transform:scale(.92)}
.gstatus{display:none;font-size:12px;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.5;word-break:break-word}
.gstatus b{color:var(--acc)}
.gmsgs{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px 10px;height:58vh;min-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:13px}
.gmsgs::-webkit-scrollbar{width:5px}
.gmsgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.gbub{display:flex;gap:9px;align-items:flex-start;animation:pop .16s ease}
.gbub .gav{width:38px;height:38px;border-radius:13px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);font-size:19px;line-height:1}
.gbub .gav img{width:100%;height:100%;object-fit:cover}
.gbub .gmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.gbub .gname{font-size:11px;color:var(--dim);margin:0 0 4px 5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gbub .gtext{max-width:86%;background:var(--panel);border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:9px 13px;font-size:14px;line-height:1.6;word-break:break-word;box-shadow:var(--shadow);white-space:pre-wrap}
.gbub.me{flex-direction:row-reverse}
.gbub.me .gmain{align-items:flex-end}
.gbub.me .gname{margin:0 5px 4px 0;justify-content:flex-end}
.gbub.me .gtext{background:var(--bubme);border-color:transparent;border-radius:16px 6px 16px 16px}
.gbub.sys{justify-content:center}
.gbub.sys .gtext{background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:12px;box-shadow:none;border-radius:12px;max-width:100%}
.gdel{background:none;border:0;color:var(--dim);font-size:11px;line-height:1;padding:2px 5px;border-radius:6px;box-shadow:none;opacity:.5}
.gdel:active{transform:scale(.92)}
.gtok{font-size:10.5px;color:var(--dim);opacity:.72;margin-top:4px;padding:0 5px;user-select:none}
.gbub.me .gtok{text-align:right}
.ginbar{display:flex;gap:8px;align-items:flex-end}
.ginbar textarea{flex:1;min-height:44px;max-height:110px;resize:none;border-radius:16px;padding:11px 14px;background:var(--bg2);border:1px solid transparent;box-shadow:inset 0 0 0 1px var(--line);overflow-y:auto;scrollbar-width:none;font:inherit;font-size:14px;color:var(--txt)}
.ginbar textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--p8accSh,rgba(63,169,216,.12))}
.ginbar textarea::-webkit-scrollbar{width:0;height:0}
.ginbar textarea::-webkit-resizer{display:none;background:transparent}
.gsend{width:62px;flex:0 0 62px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#02131c);font-weight:800;font-size:15px}
.gmem{display:flex;flex-wrap:wrap;gap:6px}
.gm{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 9px 4px 4px}
.gm .nm{font-size:12.5px;line-height:1.2}
.gm .tg{font-size:10.5px;color:var(--dim);line-height:1.2}
/* ---------- 联网搜索提示 ---------- */
.searchline{display:block;width:fit-content;max-width:88%;font-size:12px;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin:7px 0 0}
.searchline b{color:var(--acc)}
.searchline.on{border-color:var(--acc);color:var(--acc)}
.srcline{display:block;width:fit-content;font-size:11.5px;color:var(--dim);padding:4px 11px;border:1px dashed var(--line);border-radius:999px;margin:5px 0 0;cursor:pointer}
.srcline.me{margin-left:auto}
.srcline u{text-decoration:none;color:var(--acc)}
/* ---------- 小工具：随机中 → 随机完成 动画 ---------- */
.funroll{text-align:center;padding:10px 0 4px}
.funroll-in{font-size:22px;font-weight:700;color:var(--acc);letter-spacing:1px;animation:funshuffle .3s linear infinite}
@keyframes funshuffle{0%{transform:translateY(-3px) scale(1);opacity:.6}50%{transform:translateY(3px) scale(1.06);opacity:1}100%{transform:translateY(-3px) scale(1);opacity:.6}}
.funbar{height:6px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:12px auto 8px;max-width:230px}
.funbar i{display:block;height:100%;width:36%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:funslide .95s ease-in-out infinite}
@keyframes funslide{0%{transform:translateX(-115%)}100%{transform:translateX(300%)}}
.funrolltip{font-size:12px;color:var(--dim);letter-spacing:1px}
.funres{font-size:22px;font-weight:700;text-align:center;padding:12px 0;color:var(--acc);white-space:pre-wrap;animation:funpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes funpop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.13)}100%{transform:scale(1);opacity:1}}
.funok{text-align:center;font-size:12px;color:var(--acc);opacity:.9;margin-bottom:4px;animation:pop .3s ease}
/* ========== 深蓝海域 · 视觉速改 ========== */

/* 1) 卡片标题不再满屏蓝，改用左侧小色条 */
.ttl{color:var(--txt);border-left:3px solid var(--acc);padding-left:9px;letter-spacing:.2px}

/* 2) 气泡和背景拉开层次，不再糊成一团 */
.bub.ai{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 12px rgba(0,0,0,.28)}
.bub.me{background:var(--accdim);background-image:none}

/* 3) 小字不再看不清（改成跟着主题走，浅色/黑白主题也自动合适） */
.bub .time{opacity:1;font-size:12px;color:var(--meta)}
.tok,.arcmeta,.gtok,.apptile .ad,.srcline,.searchline,.setrow .lbl{font-size:12px;color:var(--meta)}

/* 4) 圆角统一 */
.card,.sheet,.gmsgs{border-radius:18px}
.bub{border-radius:16px}
.bub.me{border-bottom-right-radius:6px}
.bub.ai{border-bottom-left-radius:6px}

/* 5) 主按钮去掉渐变，只留「发送」一个用渐变，更显贵 */
button.pri{background:var(--acc);background-image:none;color:var(--onacc,#02131c);box-shadow:none}
#composer #send{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 14px rgba(63,169,216,.3)}

/* 6) 底部导航只留两种信号，去掉放大和光晕，不再乱抖 */
nav button.on{background:none}
nav button.on svg{transform:none;filter:none}
nav button.on::after{width:18px;height:2px;border-radius:2px;box-shadow:none}

/* 7) 列表分隔线：虚线改实线，不再像草稿 */
.li,.arcitem{border-bottom-style:solid;border-bottom-color:rgba(255,255,255,.07)}

/* 8) 按钮更好点 + 数字宽度不跳动 */
.iconbtn,.gdel,.thinkhead,.sheetclose{min-height:34px}
.tok,.bub .time,.gtok{font-variant-numeric:tabular-nums}
.gbub.me .gtext{background:var(--accdim);background-image:none}

/* 9) 手机开了「减弱动态效果」时，不再乱动 */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   A 档美化：更干净、更像聊天软件的界面（只动样式）
   ============================================================ */
/* 顶栏：角色头像 + 名字 + 一行小状态 */
header{gap:9px;box-shadow:0 1px 14px rgba(0,0,0,.16)}
header .topav{width:32px;height:32px;flex:0 0 auto;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);font-size:17px}
header .topav img{width:100%;height:100%;object-fit:cover;display:block}
header .who{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0}
header .who .nm{font-size:13px;font-weight:600;color:var(--txt);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who .st{font-size:10.5px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 消息气泡：拉开间距、加左侧小色条、阴影变轻 */
.bub{margin:11px 0 0;border-radius:18px}
.bub.ai{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-bottom-left-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.bub.me{background:var(--bubme);border:1px solid transparent;border-bottom-right-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.bub .time{display:none}                 /* 时间挪到气泡下面那一行 */
.think{margin:11px 0 0}

/* 气泡下面那行小字：时间 · token 消耗 */
.tok.meta{display:block;margin:4px 0 2px;letter-spacing:.2px}
.tok.meta.me{text-align:right}

/* 输入区：圆形发送键、留白舒服一点 */
#composer{padding:9px 12px calc(env(safe-area-inset-bottom) + 10px);gap:9px}
#composer button{width:40px;height:40px;border-radius:50%;flex:0 0 auto;padding:0}
#composer #pic{background:transparent;border:1px solid var(--line)}
#composer #send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02131c;box-shadow:0 4px 14px rgba(63,169,216,.32)}
#composer #stop{background:linear-gradient(135deg,#c0504a,#e06a60);color:#fff}
#composer textarea{background:var(--bg2);border-radius:20px;min-height:40px;padding:9px 14px}

/* 空状态：给一张卡片，而不是一片空白 */
.hint{background:var(--panel);border:1px dashed var(--line);border-radius:18px;padding:30px 18px;margin:8px 0 6px;font-size:13.5px}

/* ---- 加号按钮 / 附件小卡片 ---- */
#composer #plus{background:var(--bg2);border:1px solid var(--line);color:var(--acc)}
#composer #plus svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.filechip{display:inline-flex;align-items:center;gap:6px;max-width:100%;margin:4px 0 2px;padding:6px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--txt);word-break:break-all;cursor:pointer}
.filechip svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filechip i{font-style:normal;color:var(--dim);flex:0 0 auto}
#picked .filechip{max-width:58vw;margin:0}

/* ---- 私聊头像（用伪元素做，不动原来的消息结构） ---- */
#msgs .bub{position:relative;margin-left:38px;max-width:calc(84% - 38px)}
#msgs .bub.me{margin-left:auto;margin-right:38px}
#msgs .bub.withav::before{content:'';position:absolute;bottom:2px;width:28px;height:28px;border-radius:10px;border:1px solid var(--line);background:var(--bg2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:var(--txt)}
#msgs .bub.ai.withav::before{left:-38px}
#msgs .bub.me.withav::before{right:-38px}
#msgs .bub.withav.avaem::before{content:attr(data-ava)}
#msgs .bub.withav:not(.avaem)::before{background-image:var(--avurl)}
#msgs .think,#msgs .ops,#msgs .tok.meta,#msgs .thinklive{margin-left:38px}
#msgs .ops.me,#msgs .tok.meta.me{margin-right:38px}

/* ---- 打字光标 ---- */
.gen::after{content:'▍';margin-left:1px;color:var(--acc);animation:caret 1s steps(1,end) infinite}
@keyframes caret{0%,45%{opacity:1}45.01%,100%{opacity:0}}

/* ---- 生成中的「思考中」胶囊 ---- */
.thinklive{display:flex;align-items:center;gap:6px;width:fit-content;margin:11px 0 0;padding:5px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12px;animation:pop .18s ease}
.thinklive{color:var(--acc);border-color:var(--accdim);background:var(--accdim)}
.thinklive.on{color:var(--acc);border-color:var(--accdim);background:var(--accdim)}
.thinklive svg{width:13px;height:13px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.thinklive span{animation:pulse 1.5s ease-in-out infinite}

/* ---- 角色页：网格 ---- */
.sheet .row button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sheet button svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.p6grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.p6grid .card{margin:0;padding:15px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative;overflow:hidden}
.p6grid .card b{font-size:13.5px;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p6grid .card .p6persona{font-size:11.5px;color:var(--dim);line-height:1.45;min-height:33px;max-height:33px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.p6grid .card .p6meta{font-size:10.5px;color:var(--dim);opacity:.92;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p6grid .card .p6edit{position:absolute;top:5px;right:5px}
.p6grid .p6arrows{display:flex;gap:6px}

/* ============================================================
   2026-09-18 视觉改版：浅灰底 + 白气泡 + 单一主色（8 套主题通用）
   ============================================================ */
/* 页头：标题 + 一行说明 + ⋯ */
header{align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:none}
header .hcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
header h1{font-size:19px;font-weight:700;color:var(--txt);letter-spacing:.2px;margin:0;line-height:1.25}
header .who{font-size:11.5px;color:var(--meta);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .hact{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:transparent;border:0;color:var(--meta);font-size:20px;line-height:1;padding:0;box-shadow:none}
header .hact:active{background:var(--bg2)}

/* 气泡：白底 + 1px 描边 + 极淡阴影 */
#msgs .bub{border-radius:18px}
.bub.ai{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accline);border-bottom-left-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.bub.me{background:var(--accdim);border:1px solid var(--line);border-bottom-right-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
#msgs .bub.ai{max-width:calc(92% - 38px)}
#msgs .bub.me{max-width:calc(86% - 38px)}

/* 元信息：时间紧贴气泡；token 默认隐藏，开发者模式才显示 */
#msgs .tok.meta{margin:6px 0 0 38px;color:var(--meta);font-size:11.5px;display:block}
#msgs .tok.meta.me{margin:6px 38px 0 auto;text-align:right}
.tok,.gtok,.arcmeta,.srcline,.searchline{color:var(--meta)}
.tok{font-variant-numeric:tabular-nums}
.tk{display:none}
body.dev .tk{display:inline}
body:not(.dev) .gtok,body:not(.dev) .atok,body:not(.dev) .p6toksum{display:none!important}

/* ---------- markdown：加粗 / 斜体 / 代码 / 列表 / 引用 / 标题 / 表格 / 链接 ----------
   --em / --embg 是「强调色」，黑白主题里会换成高对比的底色，不然加粗看不出来 */
b.hl,strong.hl{color:var(--em,var(--acc));font-weight:700;background:var(--embg,transparent);border-radius:5px;padding:var(--empad,0)}
code.hl{color:var(--em,var(--acc));background:var(--accdim);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.94em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
i.md-em{font-style:italic;color:var(--txt)}
.md-s{text-decoration:line-through;color:var(--meta)}
.md-a{color:var(--em,var(--acc));text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.md-p{margin:0}
.md-p+.md-p,.md-p+.md-list,.md-list+.md-p,.md-pre+.md-p,.md-quote+.md-p{margin-top:8px}
.md-h{font-weight:700;color:var(--txt);line-height:1.35;margin:9px 0 4px}
.md-h:first-child{margin-top:0}
.md-h1{font-size:1.24em}
.md-h2{font-size:1.15em}
.md-h3{font-size:1.07em}
.md-h4,.md-h5,.md-h6{font-size:1em;color:var(--meta)}
.md-list{margin:5px 0;padding-left:1.4em}
.md-list li{margin:2px 0}
.md-list .md-list{margin:2px 0}
.md-quote{margin:6px 0;padding:6px 11px;border-left:3px solid var(--accline);background:var(--bg2);border-radius:0 10px 10px 0;color:var(--dim)}
.md-hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.md-pre{margin:6px 0;padding:9px 11px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.md-pre code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;white-space:pre;color:var(--txt)}
.md-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
.md-t{border-collapse:collapse;width:100%;font-size:12.5px}
.md-t th,.md-t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md-t th{background:var(--bg2);color:var(--txt);font-weight:600;white-space:nowrap}

/* 输入区：一个胶囊，＋ 收在里面，右边是 ↑ */
#composer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);border-top:1px solid var(--line);display:flex}
#composer #cbox{flex:1;display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:5px 6px 5px 5px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
#composer #cbox button{width:34px;height:34px;border-radius:50%;flex:0 0 auto;padding:0}
#composer #plus{background:transparent;border:0;color:var(--meta)}
#composer #plus:active{background:var(--bg2)}
#composer #plus svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#composer textarea,#composer #inp{flex:1;min-height:34px;max-height:120px;background:transparent;border:0;box-shadow:none;padding:8px 4px;font-size:var(--fs)}
#composer textarea:focus{border:0;box-shadow:none}
#composer #send{background:var(--acc);color:var(--onsend,#fff);box-shadow:none}
#composer #send svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#composer #send:disabled{background:var(--line);color:var(--meta);opacity:1}
#composer #stop{background:var(--warn);color:#fff}
#composer #stop svg{width:16px;height:16px}

/* 底部导航：4 个 Tab，指示条在图标下方 */
nav{background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.04);gap:0;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav::before{display:none}
nav button{color:var(--meta);font-size:11px;gap:1px;padding:6px 2px 5px;border-radius:12px}
nav button.on{color:var(--acc);background:none}
nav button.on svg{transform:none;filter:none}
nav button.on svg{fill:var(--acc);fill-opacity:.18}
nav button.on::after{display:none}
nav button .ico{display:flex;align-items:center;justify-content:center}
nav button .ind{display:block;width:0;height:3px;border-radius:3px;background:var(--acc);transition:width .2s ease;margin:2px 0 1px}
nav button.on .ind{width:16px}

/* 头像色块 */
#msgs .bub.ai.withav.avaem::before{background:var(--acc);color:var(--onsend,#fff)}
#msgs .bub.me.withav.avaem::before{background:var(--bg2);color:var(--meta)}
.gbub .avbox{background:var(--accdim)}
.gbub:not(.me) .avbox{background:var(--acc);color:var(--onsend,#fff)}
.p6grid .card .avbox{background:var(--accdim)}

/* 思考胶囊：浅底、无边框、小字，和效果图一致 */
.thinkhead{background:var(--accdim);border:0;color:var(--acc);font-size:11.5px;padding:5px 12px;gap:5px;box-shadow:none}
.thinkhead.on{background:var(--accdim);color:var(--acc);box-shadow:none}
.thinkbody{border:0;border-left:2px solid var(--accline);background:var(--panel);color:var(--dim);font-size:12px}
#picked{background:var(--bg)}

/* ---------- 应用页（互动等）：卡片点标题收起／展开，小三角在右边 ---------- */
.ttl.foldttl{display:flex;align-items:center;gap:8px;cursor:pointer}
.ttl.foldttl:active{opacity:.75}
.toychev{order:9;margin-left:auto;flex:0 0 auto;font-size:13px;line-height:1;color:var(--dim);opacity:.6}

/* ---------- 查找聊天记录（新增） ---------- */
header .hact svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hsearch{display:flex;align-items:center;justify-content:center}
.findres{max-height:52vh;overflow-y:auto;margin-top:10px}
.sresrow{padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg2);cursor:pointer}
.sresrow:active{opacity:.8}
.sreshead{font-size:11px;color:var(--meta);margin-bottom:3px}
.srestext{font-size:13px;color:var(--txt);word-break:break-word;line-height:1.5}
.srestext mark{background:var(--accdim);color:var(--acc);border-radius:4px;padding:0 2px}
.bub.findhit{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- 音乐（新增） ---------- */
.mnow{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mttl{font-size:15px;font-weight:700;color:var(--txt);word-break:break-word}
.mrow{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow.on{color:var(--acc)}
.mrow .mi{flex:0 0 18px;text-align:center;font-size:13px}
.mrow .mt{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mt .dim{font-size:11px}
.mrow .mbtn{padding:4px 9px;font-size:13px;line-height:1;border-radius:10px;flex:0 0 auto}
.msvg{width:1.06em;height:1.06em;vertical-align:-.16em;display:inline-block;flex:0 0 auto}
svg.msvg.ln{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.msvg.fl{fill:currentColor;stroke:none}
.mrow .mi .msvg{width:1.12em;height:1.12em}
.mrow .mbtn .msvg{width:1.15em;height:1.15em;vertical-align:-.18em}
/* 歌单切换条（全部 / 默认 / 自己建的歌单） */
.mplbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.mplbar button{background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:7px 12px;border-radius:99px;box-shadow:none;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mplbar button.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
.mrow .mpl{flex:0 0 auto;font-size:11px;color:var(--meta);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
/* 拖动排序模式：每行左边一个 ☰ 抓手，拖的时候能看出来拖到了哪儿 */
.mrow .mgrab{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--meta);padding:0;border-radius:9px;box-shadow:none;touch-action:none;cursor:grab}
.mrow .mgrab .msvg{width:1.3em;height:1.3em}
.mrow.dragging{opacity:.4;background:var(--accdim);border-radius:10px}
.mrow.dragover{background:var(--accdim);box-shadow:inset 0 0 0 1px var(--acc);border-radius:10px}
.mstat{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}

/* ---------- 朋友圈 ---------- */
.momtop{display:flex;justify-content:flex-end;margin:0 0 10px}
.momnew{padding:5px 12px;font-size:12.5px;line-height:1.25;border-radius:12px;flex:0 0 auto}
.momnew .msvg{width:1.1em;height:1.1em;vertical-align:-.18em}
.momwrap{display:flex;flex-direction:column;gap:10px}
.momcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow)}
.momhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.momav{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accdim);color:var(--acc);font-size:17px;line-height:1;overflow:hidden}
.momav img{width:100%;height:100%;object-fit:cover;display:block}
.momnm{font-size:13.5px;font-weight:600;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.momt{font-size:11px;color:var(--dim);flex:0 0 auto}
.momdel{padding:2px 8px;font-size:11.5px;line-height:1.3;border-radius:8px;flex:0 0 auto}
.momtx{font-size:14px;line-height:1.6;color:var(--txt);word-break:break-word}
.momfoot{display:flex;gap:8px;margin-top:9px}
.mombtn{padding:4px 10px;font-size:12.5px;line-height:1.2;border-radius:10px;flex:0 0 auto}
.mombtn.on{color:var(--acc);border-color:var(--accline)}
.momcmts{margin-top:9px;padding:8px 10px;background:var(--bg2);border-radius:12px}
.momcmt{position:relative;font-size:12.5px;line-height:1.55;color:var(--txt);word-break:break-word;padding-right:26px}
.momcmt b{color:var(--acc);margin-right:6px;font-weight:600}
.momcmt .cmtdel{position:absolute;right:-4px;top:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;box-shadow:none;padding:0;color:var(--dim);opacity:.6}
.momcmt .cmtdel:active{opacity:1}
.momcmt .cmtdel .msvg{width:12px;height:12px;vertical-align:0}
#main input[type=range],.sheet input[type=range]{padding:0;border:0;background:transparent;box-shadow:none;height:22px;accent-color:var(--acc)}

/* 工具小条：角色做了什么（放歌 / 玩具 / 画图 / 联网…），聊天里都长这样 */
.tchip{display:inline-flex;align-items:center;gap:8px;width:fit-content;max-width:calc(92% - 38px);margin:7px 0 0 38px;padding:4px 12px 4px 4px;font-size:11.5px;line-height:1.5;letter-spacing:.2px;color:var(--meta);background:var(--bg2);border:1px solid var(--line);border-radius:999px;word-break:break-word;text-size-adjust:100%;-webkit-text-size-adjust:100%;animation:tchipIn .2s ease both}
.tchip.me{margin-left:auto;margin-right:38px}
.tchip>.ic{width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accdim);color:var(--acc);font-size:12px;line-height:1;font-style:normal}
.tchip>.ic svg{width:11px;height:11px;display:block;fill:currentColor;stroke:none}
.tchip .tx{font-size:11.5px;line-height:1.5}
.tchip b{font-size:11.5px;font-weight:600;color:var(--txt)}
.tchip .sg{font-size:11.5px;font-weight:600;color:var(--acc)}
.tchip u{text-decoration:none;color:var(--acc)}
.tchip.tap{cursor:pointer}
.tchip.tap:active{filter:brightness(1.08)}
.tchip.wait{color:var(--dim)}
.tchip[data-act="play"]>.ic{animation:tchipPulse 1.9s ease-in-out infinite}
.tchiprow{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0 38px;max-width:calc(92% - 38px)}
.tchiprow .tchip{margin:0;max-width:100%}
.gtoy .tchip{margin:0}
@keyframes tchipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes tchipPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 4px var(--accdim)}}

/* ---------- 通用小图标：小条里的表情换成本地矢量图（线条风） ---------- */
.ci{width:15px;height:15px;vertical-align:-2.6px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tchip>.ic svg.ci{width:11px;height:11px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tchip>.ic svg.ci.fl{fill:currentColor;stroke:none}

/* ---------- 音乐：播放方式（顺序 / 单曲循环 / 随机） ---------- */
.seg.mmodes{gap:4px;padding:3px;margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.seg.mmodes button{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;padding:8px 4px;border-radius:11px}
.seg.mmodes button.on{background:var(--accdim);border:0;color:var(--acc)}
.seg.mmodes .msvg{width:1.2em;height:1.2em;vertical-align:-.2em}

/* ---------- 世界书 ---------- */
.wbchk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wbchk label{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);font-size:12.5px;color:var(--dim);box-shadow:none}
.wbchk label.on{color:var(--acc);border-color:var(--acc);background:var(--accdim)}
.wbchk input[type=checkbox]{width:auto;margin:0;flex:0 0 auto}
.wbtxt{font-size:12.5px;line-height:1.65;color:var(--txt);white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.wbwho{font-size:11.5px;color:var(--dim);margin-top:7px}
.wbwho .n{color:var(--acc)}

/* ---------- 气泡：短消息变小 · 一条消息分几个气泡（新增） ---------- */
/* 1) 只有文字的消息：气泡宽度跟着文字走，不再占满一整行 */
#msgs .bub.narrow{width:fit-content}
/* 2) 一条消息拆成几个气泡：外面那层只当容器，里面每个小气泡各自独立 */
#msgs .bub.multi .bsub{position:relative;width:fit-content;max-width:100%;padding:9px 13px;border-radius:18px;animation:pop .16s ease;display:flow-root}
#msgs .bub.multi .bsub+.bsub{margin-top:5px}
/* 气泡外面那圈模糊阴影去掉，改成 Telegram 那种干净的扁平边（小尾巴才不会显得突兀） */
#msgs .bub,#msgs .bub .bsub{box-shadow:none!important}
/* 角色气泡原来左边那条主题色竖线去掉，和用户气泡一样，只有颜色不同 */
#msgs .bub.ai,#msgs .bub.multi.ai .bsub{border:1px solid var(--line)}
/* 外面那层只是排版的容器：自己不能有边框/底色/阴影，不然整组气泡外面会多出一个框 */
#msgs .bub.multi,#msgs .bub.multi.ai,#msgs .bub.multi.me{width:fit-content;padding:0;background:none;border:0!important;box-shadow:none;animation:none}
/* 靠近头像的那个下角尖一点（Telegram 那种小尖角）：角色在左、自己在右，每条气泡都带 */
#msgs .bub.ai,#msgs .bub.multi.ai .bsub{border-bottom-left-radius:3px}
#msgs .bub.me,#msgs .bub.multi.me .bsub{border-bottom-right-radius:3px}
#msgs .bub.multi.ai .bsub{background:var(--panel)}
#msgs .bub.multi.me .bsub{margin-left:auto;background:var(--accdim);border:1px solid var(--line)}
/* Telegram 那种小尾巴：靠头像那个下角凸出一小截。
   两层叠着画：外面一层用气泡描边的颜色，里面一层用气泡本身的颜色，
   这样尾巴也带描边，不会像一块突然冒出来的东西。
   描边那层在气泡里那一侧要多铺 3px：把气泡自己的圆角盖住，
   不然那个圆角会露出半截、底边的线就断了一个小口子。 */
#msgs .bub>.btail,#msgs .bub.multi .bsub>.btail{position:absolute;bottom:-1px;width:11px;height:8px;background:var(--meline,var(--line))}
#msgs .bub>.btailf,#msgs .bub.multi .bsub>.btailf{position:absolute;bottom:0;width:8.6px;height:8.6px}
#msgs .bub.ai>.btail,#msgs .bub.multi.ai .bsub>.btail{left:-9px;clip-path:polygon(8px 0,0 100%,100% 100%,100% 4px)}
#msgs .bub.ai>.btailf,#msgs .bub.multi.ai .bsub>.btailf{left:-6.6px;background:var(--panel);border-bottom-left-radius:3px;clip-path:polygon(100% 0,100% 100%,0 100%)}
#msgs .bub.me>.btail,#msgs .bub.multi.me .bsub>.btail{right:-9px;clip-path:polygon(3px 0,100% 100%,0 100%,0 4px)}
#msgs .bub.me>.btailf,#msgs .bub.multi.me .bsub>.btailf{right:-6.6px;background:var(--accdim);border-bottom-right-radius:3px;clip-path:polygon(0 0,0 100%,100% 100%)}
/* 浅色主题里用户气泡的描边其实是「半透明黑压在自己的底色上」，
   直接拿半透明色去画尾巴的话，压在不同的底上算出来会偏浅。
   这里用 color-mix 把它算成一个实色，气泡和尾巴就用同一个颜色了。 */
@supports (color:color-mix(in srgb,red 50%,blue)){
  html.p6light #msgs .bub.me{--meline:color-mix(in srgb,var(--accdim) 88%,rgb(15,23,36) 12%);border:1px solid var(--meline)}
  html.p6light #msgs .bub.multi.me .bsub{border:1px solid var(--meline)}
}
/* 老浏览器不认 clip-path 的话，宁可不显示尾巴，也别在角落露出一个方块 */
@supports not (clip-path:polygon(0 0,100% 0,0 100%)){#msgs .bub>.btail,#msgs .bub>.btailf{display:none}}
/* 3) 「思考过程」做成一行很淡的小字：去掉灰底胶囊，不抢戏、也不把气泡撑宽（单条/分条都一个样） */
#msgs .bub .think{margin:0 0 5px!important;padding:0!important;border-bottom:0!important;max-width:100%}
#msgs .bub .thinkhead{background:transparent!important;border:0!important;box-shadow:none!important;gap:4px!important;min-height:0!important;color:var(--meta)!important;font-size:11px!important;font-weight:400!important;padding:5px 0!important;margin:-5px 0!important}
#msgs .bub .thinkhead.on{color:var(--acc)!important}
#msgs .bub .thinkhead svg{width:12px;height:12px;color:var(--acc);opacity:.9}
#msgs .bub .think>.thinkbody{margin-top:5px!important;padding:8px 10px!important;font-size:11.5px!important}
/* 4) 设置 → 外观与交互 里关掉「显示思考过程」后，灯泡 + 思考过程那个小按钮整个消失 */
html.nothink #msgs .bub .think{display:none!important}

</style>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS={cfg:'wh_cfg',chars:'wh_chars',cur:'wh_cur',arcs:'wh_arcs',pw:'wh_pw',priv:'wh_priv',unread:'wh_unread',
  groups:'wh_groups',gauto:'wh_gauto',music:'wh_music',moments:'wh_moments',momSeen:'wh_momseen',
  msg:id=>'wh_msg_'+id,mem:id=>'wh_mem_'+id,arc:id=>'wh_arc_'+id,todo:id=>'wh_todo_'+id,rawMark:id=>'wh_rawmark_'+id,
  summark:id=>'wh_summark_'+id,gmsg:id=>'wh_gmsg_'+id,gmem:id=>'wh_gmem_'+id,
  mtag:'wh_mtag',mpin:'wh_mpin'};

/* ---------- 主题 ---------- */
const THEMES={
  dark:{label:'深海（深蓝·暗）',v:{'--bg':'#0a1219','--bg2':'#101922','--panel':'#141e26','--line':'#1f2c36','--txt':'#e3eef6','--dim':'#8aa0b0','--meta':'#93a7b6','--acc':'#4d9bf0','--acc2':'#6fb4ff','--accdim':'#16354f','--accline':'#2f6ea8','--warn':'#e07068','--grad':'linear-gradient(160deg,#111d27 0%,#0a1219 62%)','--shadow':'0 1px 2px rgba(0,0,0,.22)','--bubme':'linear-gradient(135deg,#1b3a52,#16324a)'}},
  light:{label:'浅色（白）',v:{'--bg':'#e7ebf1','--bg2':'#edf0f5','--panel':'#ffffff','--line':'#e1e6ef','--txt':'#0f1724','--dim':'#6b7280','--meta':'#5f6774','--acc':'#2f6fed','--acc2':'#5b8cf5','--accdim':'#e3ebfd','--accline':'#b9cdf7','--warn':'#d9534f','--grad':'linear-gradient(160deg,#f2f5f9 0%,#e7ebf1 60%)','--shadow':'0 1px 2px rgba(16,24,40,.05)','--bubme':'linear-gradient(135deg,#e8ecf4,#dfe5ef)'}},
  /* 【新】黑白（极简）：纯黑底 + 白字 + 白色按钮，没有一点彩色。
     --onsend 是「白色按钮上的字/图标」颜色（黑），不然白按钮上的白图标会看不见。 */
  mono:{label:'黑白（极简）',v:{'--bg':'#0a0a0a','--bg2':'#111111','--panel':'#161616','--line':'#2a2a2a','--txt':'#f2f2f2','--dim':'#9c9c9c','--meta':'#a8a8a8','--acc':'#e8e8e8','--acc2':'#ffffff','--accdim':'#202020','--accline':'#4a4a4a','--warn':'#8e8e8e','--grad':'linear-gradient(160deg,#181818 0%,#0a0a0a 62%)','--shadow':'0 1px 2px rgba(0,0,0,.5)','--bubme':'linear-gradient(135deg,#282828,#1e1e1e)','--onsend':'#0a0a0a','--accglow':'rgba(255,255,255,.32)','--scbg':'rgba(20,20,20,.92)','--scfg':'#f2f2f2',
    /* 【新】黑白主题没有彩色可用，加粗/强调改用纯白 + 一层淡淡白底，不然和正文几乎一样 */
    '--em':'#ffffff','--embg':'rgba(255,255,255,.14)'}},
  /* 【新】黑白（明亮）：白底黑字，按钮是黑的、字是白的。
     --onacc 是「深色按钮上的字色」（白色），--onsend 是「发送键上的图标色」（白色）。 */
  paper:{label:'黑白（明亮）',v:{'--bg':'#f2f2f2','--bg2':'#f8f8f8','--panel':'#ffffff','--line':'#e4e4e4','--txt':'#111111','--dim':'#6b6b6b','--meta':'#5f5f5f','--acc':'#1a1a1a','--acc2':'#3d3d3d','--accdim':'#ececec','--accline':'#d8d8d8','--warn':'#6f6f6f','--grad':'linear-gradient(160deg,#ffffff 0%,#f2f2f2 62%)','--shadow':'0 1px 2px rgba(0,0,0,.06)','--bubme':'linear-gradient(135deg,#efefef,#e6e6e6)','--onacc':'#ffffff','--onsend':'#ffffff','--accglow':'rgba(0,0,0,.16)','--scbg':'rgba(255,255,255,.94)','--scfg':'#111111',

function applyTheme(){
  const t=THEMES[(cfg&&cfg.theme)]||THEMES.dark;
  const r=document.documentElement.style;
  for(const k in t.v)r.setProperty(k,t.v[k]);
  /* 【新】三个跟着主题走的颜色：按钮上的字色 / 发送键图标色 / 发光色。
     每个主题都要设一次，不然换主题时会留下上一个主题的值。（没写就用原来的蓝色） */
  r.setProperty('--onacc',t.v['--onacc']||'#02131c');
  r.setProperty('--onsend',t.v['--onsend']||'#fff');
  r.setProperty('--accglow',t.v['--accglow']||'rgba(63,169,216,.55)');
  /* 【新】markdown 的强调色：主题里没写就用主题色；黑白主题写了高对比的那套 */
  r.setProperty('--em',t.v['--em']||t.v['--acc']||'#3fa9d8');
  r.setProperty('--embg',t.v['--embg']||'transparent');
  r.setProperty('--empad',t.v['--embg']?'0 2px':'0');   /* 只有带底色的主题才留一点内边距 */
  r.setProperty('--fs',(((cfg&&cfg.fs)||15))+'px');
  /* 自动判断深浅：浅色主题给关闭键用白底深字，深色主题用深底浅字 */
  const lit=(()=>{
    let h=String(t.v['--bg']||'#050e16').replace('#','');
    if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const n=parseInt(h,16)||0;
    const R=(n>>16)&255,G=(n>>8)&255,B=n&255;
    return (0.299*R+0.587*G+0.114*B)>140;
  })();
  /* 弹层右上角那个关闭按钮的底色/字色：主题里写了就用主题的（黑白主题不想带蓝色） */
  r.setProperty('--scbg',t.v['--scbg']||(lit?'rgba(255,255,255,.94)':'rgba(10,22,32,.82)'));
  r.setProperty('--scfg',t.v['--scfg']||(lit?(t.v['--txt']||'#12313f'):'#eaf3f8'));
  /* 开发者模式：打开才在界面上显示 token 统计 */
  try{document.body.classList.toggle('dev',!!(cfg&&cfg.dev))}catch(e){}
  /* 【新增】设置 → 外观与交互：「显示思考过程」关掉时，气泡上的思考小按钮整个消失 */
  try{document.documentElement.classList.toggle('nothink',!!(cfg&&cfg.showThink===false))}catch(e){}
  /* ↓ 补丁8-A：浅色主题时给 html 加 p6light */
  try{document.documentElement.classList.toggle('p6light',window.isLight())}catch(e){}
  /* ↓ 补丁8-C：主题色相关的那些小元素跟着重画（8-B 那版已被它取代） */
  try{window.paintThemeBits()}catch(e){}
  /* ↓ 补丁10-A：字体也跟着换 */
  try{if(window.P6&&P6.applyFont)P6.applyFont()}catch(e){}
  /* ↓ 补丁14：手机外壳的玻璃质感 + 桌面重画 */
  if(window.syncGlass)window.syncGlass();       /* 补丁14 装上之前没有这层，所以要先判断 */
  if(view==='home'&&window.renderHome)try{window.renderHome()}catch(e){}
}

/* ---------- 自定义背景图（桌面 / 聊天） ----------
   两张图分开设置：桌面（首页）一张、聊天页一张；透明度 5%~100%。
   图存在本机（跟着备份走），太大会自动压小。 */
function wallCfg(){
  if(!cfg)return {dOp:.45,cOp:.45};
  if(!cfg.wall||typeof cfg.wall!=='object')cfg.wall={};
  const w=cfg.wall;
  if(w.dOp==null)w.dOp=.45;
  if(w.cOp==null)w.cOp=.45;
  return w;
}
function wallLayer(){
  let el=document.getElementById('wallBg');
  if(!el){
    el=document.createElement('div');
    el.id='wallBg';
    el.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background-position:center center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .25s ease';
    document.body.insertBefore(el,document.body.firstChild);
  }
  return el;
}
function applyWall(){
  try{
    const w=wallCfg(),el=wallLayer(),home=(view==='home');
    const on=home?(w.dOn&&w.dImg):(view==='chat'&&w.cOn&&w.cImg);
    const img=home?(w.dImg||''):(w.cImg||'');
    const op=home?(w.dOp||.45):(w.cOp||.45);
    if(on&&img){
      el.style.backgroundImage='url("'+String(img).replace(/["'\n\r]/g,'')+'")';
      el.style.opacity=String(Math.max(.05,Math.min(1,op)));
    }else{el.style.backgroundImage='none';el.style.opacity='0'}
  }catch(e){}
}

/* ---------- 存储基础（带加密支持） ---------- */
let store=null, cryptKey=null;
const _writes={};
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function load(k,d){
  if(cryptKey)return (store&&hasOwn(store,k))?store[k]:d;
  try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}
}
function save(k,v){
  /* ↓ 补丁6-A：把 token 写进演绎记录（角色/旁白的每一段都带上） */
  try{
    if(typeof k==='string'&&k.indexOf('wh_actmsg_')===0&&v&&v.length&&P6.actLast){
      var L=P6.actLast;
      for(var i=0;i<v.length;i++){
        var m=v[i];
        if(!m||m.tok)continue;
        if(m.role==='user'){m.tok=estTokens(m.content||'');continue}
        if(m.role==='sys')continue;
        var c=String(m.content||'').trim();
        if(c&&L.text.indexOf(c)>=0){m.tok=L.tok;m.ptok=L.ptok}
      }
    }
  }catch(e){}
  if(cryptKey){store[k]=v;encWrite(k,v)}
  else{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('存不下：'+e.message)}}
}
function removeKey(k){localStorage.removeItem(k);if(store)delete store[k]}
function encWrite(k,v){
  const s=JSON.stringify(v);
  const prev=_writes[k]||Promise.resolve();
  _writes[k]=prev.then(()=>encVal(cryptKey,s)).then(enc=>localStorage.setItem(k,enc)).catch(()=>{});
}
function allDataKeys(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('wh_')===0&&k!==LS.pw&&k!==LS.priv)out.push(k);
  }
  return out;
}

/* ---------- 加密工具 ---------- */
const te=new TextEncoder(), td=new TextDecoder();
function bufToB64u(buf){let s='';buf.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encVal(key,v){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(v));
  return 'enc:'+bufToB64u(iv)+':'+bufToB64u(new Uint8Array(ct));
}
async function decVal(key,s){
  if(typeof s!=='string'||s.indexOf('enc:')!==0)return null;
  const p=s.split(':');
  const iv=b64uToBuf(p[1]),ct=b64uToBuf(p[2]);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return td.decode(pt);
}
async function decryptAll(){
  store={};
  for(const k of allDataKeys()){
    const raw=localStorage.getItem(k);
    if(raw==null)continue;
    try{
      if(raw.indexOf('enc:')===0){const pt=await decVal(cryptKey,raw);store[k]=JSON.parse(pt)}
      else store[k]=JSON.parse(raw);
    }catch(e){console.warn('解密失败',k,e)}
  }
}

const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u==null?'':u).trim();return /^https?:\/\//i.test(u)?esc(u):'#'};

const nl2br=s=>esc(s).replace(/\n/g,'<br>');

/* ---------- markdown 渲染（自己写的，不联网、不装库） ----------
   支持：标题 #、列表 - / 1.、引用 >、代码块 ```、行内代码 `、
        加粗 **、斜体 *、删除线 ~~、链接 [文字](网址)、表格、分隔线 ---
   做法：先把整段文字转义（esc），再按语法拼标签，所以别人的原文里
   写 <script> 也只会被当成普通文字显示，不会被执行。 */
function mdLink(url,txt){
  /* 网址在转义后已经变成 &amp; 这种写法，先还原再交给 safeUrl 检查，避免 && 变错 */
  const raw=String(url).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  return '<a class="md-a" href="'+safeUrl(raw)+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>';
}
function mdInline(s){
  const box=[];
  const keep=h=>{box.push(h);return '\u0001'+(box.length-1)+'\u0001'};
  let t=esc(s);
  t=t.replace(/`([^`\n]{1,400})`/g,(m,c)=>keep('<code class="hl">'+c+'</code>'));
  t=t.replace(/!?\[([^\]\n]{1,200})\]\(\s*(https?:\/\/[^\s)]+)\s*\)/g,(m,txt,url)=>keep(mdLink(url,txt)));
  t=t.replace(/(^|[\s(（【])(https?:\/\/[^\s<>"）)】]+)/g,(m,pre,url)=>pre+keep(mdLink(url,url)));
  t=t.replace(/\*\*([^\n]+?)\*\*/g,'<b class="hl">$1</b>');
  t=t.replace(/__([^\n]+?)__/g,'<b class="hl">$1</b>');
  t=t.replace(/~~([^\n]+?)~~/g,'<span class="md-s">$1</span>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<i class="md-em">$2</i>');
  t=t.replace(/(^|[^_\w])_([^_\n]+?)_(?!_)/g,'$1<i class="md-em">$2</i>');
  t=t.replace(/\u0002/g,'<br>');           /* 列表里的续行 */
  return t.replace(/\u0001(\d+)\u0001/g,(m,i)=>box[+i]);
}
const MD_BLOCK=/^\s{0,3}(#{1,6}\s|>\s?|([-*+]|\d{1,3}[.)])\s+|```|~~~)/;
const MD_RULE=/^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const MD_TSEP=/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;
function mdTableAt(L,i){return i+1<L.length&&String(L[i]).indexOf('|')>=0&&MD_TSEP.test(L[i+1])&&String(L[i+1]).indexOf('-')>=0}
function mdHasBlock(src){
  const L=src.split('\n');
  for(let i=0;i<L.length;i++){
    if(MD_BLOCK.test(L[i])||MD_RULE.test(L[i])||mdTableAt(L,i))return true;
  }
  return false;
}
function mdTableRow(s){return s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim())}
/* 列表：按缩进一层层套（- 和 1. 都能混着用） */
function mdBuildList(L,i){
  const stack=[];
  let html='',openLi=false;
  const closeTo=ind=>{
    while(stack.length&&stack[stack.length-1].ind>ind){
      const s=stack.pop();
      if(openLi)html+='</li>';
      html+='</'+s.tag+'>';
      openLi=stack.length>0;                  /* 里面收掉了，外面那一项还开着 */
    }
  };
  while(i<L.length){
    const m=/^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/.exec(L[i]);
    if(!m)break;
    const ind=m[1].replace(/\t/g,'  ').length;
    const ordered=/\d/.test(m[2]);
    const tag=ordered?'ol':'ul';
    let txt=m[3];
    i++;
    while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!/^\s*([-*+]|\d{1,3}[.)])\s+/.test(L[i])){
      txt+='\u0002'+L[i].trim();i++;
    }
    const item='<li>'+mdInline(txt);
    closeTo(ind);
    const top=stack.length?stack[stack.length-1]:null;
    if(top&&ind>top.ind){                     /* 更深 → 在上一项里面再开一层 */
      html+='<'+tag+' class="md-list">'+item;
      stack.push({ind:ind,tag:tag});openLi=true;
    }else if(top&&ind===top.ind&&top.tag!==tag){   /* 同一层但换了一种列表 */
      if(openLi)html+='</li>';
      html+='</'+top.tag+'>';
      stack.pop();
      html+='<'+tag+' class="md-list">'+item;
      stack.push({ind:ind,tag:tag});openLi=true;
    }else if(top&&ind===top.ind){             /* 同一层、同一种列表 */
      if(openLi)html+='</li>';
      html+=item;openLi=true;
    }else{                                    /* 新的一层 */
      html+='<'+tag+' class="md-list">'+item;
      stack.push({ind:ind,tag:tag});openLi=true;
    }
  }
  while(stack.length){
    const s=stack.pop();
    if(openLi)html+='</li>';
    html+='</'+s.tag+'>';
    openLi=stack.length>0;
  }
  return {html:html,i:i};
}
function mdBlocks(src){
  const L=src.split('\n'),out=[];
  let i=0,m;
  while(i<L.length){
    const ln=L[i];
    if(!ln.trim()){i++;continue}
    if((m=/^\s*(```+|~~~+)\s*([^\s`]*)\s*$/.exec(ln))){                    /* 代码块 */
      const buf=[];
      i++;
      while(i<L.length&&!/^\s*(```+|~~~+)\s*$/.test(L[i])){buf.push(L[i]);i++}
      if(i<L.length)i++;
      out.push('<div class="md-pre"><code>'+esc(buf.join('\n'))+'</code></div>');
      continue;
    }
    if((m=/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/.exec(ln))){                 /* 标题 */
      out.push('<div class="md-h md-h'+m[1].length+'">'+mdInline(m[2])+'</div>');
      i++;continue;
    }
    if(MD_RULE.test(ln)){out.push('<hr class="md-hr">');i++;continue}      /* 分隔线 */
    if(/^\s{0,3}>\s?/.test(ln)){                                           /* 引用 */
      const buf=[];
      while(i<L.length&&/^\s{0,3}>\s?/.test(L[i])){buf.push(L[i].replace(/^\s{0,3}>\s?/,''));i++}
      out.push('<div class="md-quote">'+mdBlocks(buf.join('\n'))+'</div>');
      continue;
    }
    if(mdTableAt(L,i)){                                                    /* 表格 */
      const head=mdTableRow(L[i]),rows=[];
      i+=2;
      while(i<L.length&&L[i].trim()&&L[i].indexOf('|')>=0){rows.push(mdTableRow(L[i]));i++}
      out.push('<div class="md-tw"><table class="md-t"><thead><tr>'+
        head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,k)=>'<td>'+mdInline(r[k]||'')+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>');
      continue;
    }
    if(/^\s*([-*+]|\d{1,3}[.)])\s+/.test(ln)){                             /* 列表 */
      const r=mdBuildList(L,i);
      out.push(r.html);i=r.i;continue;
    }
    const buf=[ln];                                                        /* 普通段落 */
    i++;
    while(i<L.length&&L[i].trim()&&!MD_BLOCK.test(L[i])&&!MD_RULE.test(L[i])&&!mdTableAt(L,i))buf.push(L[i++]);
    out.push('<p class="md-p">'+buf.map(mdInline).join('<br>')+'</p>');
  }
  return out.join('');
}

};

function fmtTime(t){
  const d=new Date(t);if(isNaN(d))return '';
  const h=d.getHours(),m=d.getMinutes();
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function fmtStamp(t){
  const d=new Date(t||Date.now());if(isNaN(d))return '';
  const now=new Date();
  const hm=fmtTime(d.getTime());
  if(d.toDateString()===now.toDateString())return hm;
  const yd=new Date(now.getTime()-MS_PER_DAY);
  if(d.toDateString()===yd.toDateString())return '昨天 '+hm;
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function nowText(){
  const d=new Date(),w='日一二三四五六'[d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w+' '+fmtTime(d.getTime());
}
function stampOf(t){const d=new Date(t||Date.now());return (d.getMonth()+1)+'/'+d.getDate()+' '+fmtTime(d.getTime())}
function ago(ts){
  if(!ts)return '从未';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return '刚刚';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}

let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db);
    if(!window.indexedDB)return rej(new Error('这个浏览器不支持 IndexedDB'));
    const r=indexedDB.open('wh_db',5);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('arc'))d.createObjectStore('arc');
      if(!d.objectStoreNames.contains('rawlog'))d.createObjectStore('rawlog');
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
      if(!d.objectStoreNames.contains('music'))d.createObjectStore('music');   /* 新增：存手机里的音乐文件 */
      if(!d.objectStoreNames.contains('memidx'))d.createObjectStore('memidx'); /* 记忆宫殿：索引（可随时重建，不是原文） */
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=()=>rej(r.error||new Error('IndexedDB 打不开'));
    r.onblocked=()=>{try{alert('本地数据库正被另一个打开的页面占用。\n请把这个应用在别的标签页里关掉，再刷新一次。')}catch(e){}};
  });
}
async function idbPut(k,v,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise(async(res,rej)=>{
    let payload=v;
    if(cryptKey){try{payload=await encVal(cryptKey,JSON.stringify(v))}catch(e){return rej(e)}}
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).put(payload,k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('写入失败'));
  });
}
async function idbGet(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(k);
    q.onsuccess=async()=>{
      let v=q.result;
      if(cryptKey&&typeof v==='string'&&v.indexOf('enc:')===0){
        try{v=JSON.parse(await decVal(cryptKey,v))}catch(e){v=undefined}
      }
      res(v);
    };
    q.onerror=()=>rej(q.error);
  });
}

/* ---------- 档案数据整理（兼容各种旧格式 / 别的导出格式） ---------- */
function arcRole(m){
  if(m==null)return 'assistant';
  if(Array.isArray(m))return /^(user|human|me|you|我|她|用户)$/i.test(String(m[0]||''))?'user':'assistant';
  const rs=String(m.role||m.sender||m.from||m.author||m.type||m.r||m.who||'').toLowerCase();
  if(/^(user|human|me|you|owner|self)/.test(rs)||/用户|我发的|本人|自己/.test(rs))return 'user';
  return 'assistant';
}
function arcMsgText(m){
  if(m==null)return '';
  if(typeof m==='string')return m.replace(/\s+/g,' ').trim();
  if(typeof m==='number')return String(m);
  if(Array.isArray(m)){
    const c=(m[1]!=null&&typeof m[0]==='string'&&/^(user|assistant|human|ai|me|我|她)$/i.test(String(m[0]).trim()))?m[1]:(m[0]!=null?m[0]:m[1]);
    return String(typeof c==='string'?c:((c&&(c.text||c.content))||'')).replace(/\s+/g,' ').trim();
  }
  let c=m.content;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  if(c==null)c=m.text;
  if(c==null)c=m.message;
  if(c==null)c=m.msg;
  if(c==null)c=m.c;
  if(c==null)c=m.v;
  if(c==null)c=m.say;
  if(c==null)c=m.value;
  if(c&&typeof c==='object')c=c.text||c.content||'';
  return String(c==null?'':c).replace(/\s+/g,' ').trim();
}
function sanitizeArcMs(ms){
  if(!Array.isArray(ms))return [];
  let need=false;
  const out=ms.map(m=>{
    if(m&&typeof m==='object'&&!Array.isArray(m)&&typeof m.content==='string'&&String(m.content).trim()&&/^(user|assistant)$/.test(String(m.role)))return m;
    const t=arcMsgText(m);
    if(!t)return m;                 /* 实在看不懂的，原样留着，不做破坏 */
    need=true;
    return {role:arcRole(m),content:t,t:(m&&m.t)||Date.now()};
  });
  return need?out:ms;
}

/* ================= 记忆宫殿（冷层记忆） =================
   过去的事不再整份塞给角色，而是存进这座「宫殿」：
   每次发消息时用两条路去找最相关的几段原文，只把这几段给角色看。
     ① 关键词：字词命中（越少见的词命中，越值钱）
     ② 本机向量：意思相近也能找到（不联网、不花钱，全在手机浏览器里算）
   档案原文 + 聊天记录原文 都进宫殿，一个字都不改、一条都不少。
   索引只覆盖「历史对话档案」（存在 IndexedDB 里）；
   聊天记录是实时算的，永远是新的，不用手动重建。 */
const PALACE_DIM=256;       /* 向量格子数：越大越准，稍微占点空间 */
const PALACE_CHUNK=320;     /* 一条记忆切成多大的片段（字） */
const PALACE_OVER=60;       /* 相邻片段重复的字数，防止一句话被切断 */
const PALACE_MIN=10;        /* 短于这么多字的消息不进宫殿 */
const PALACE_KEY='palace_arc_v1';
const PALACE_EMERG=2500;    /* 索引还没建好时，应急扫描每卷最多看多少条 */

let palaceArc=null;         /* 档案索引：{builtAt,df,chunks:[…]} */
let palaceArcLoad=null;     /* 正在读索引的 Promise */
let palaceChat={};          /* 聊天记录索引（内存）：cid → {list,items:[…]} */
let palaceBuilding=false;   /* 正在建索引 */
let PALACE_LAST=null;       /* 上一轮到底给了角色什么（面板里能看） */

function palaceOn(){return !cfg||cfg.palace!==false}
function palaceToolOn(){return palaceOn()&&(!cfg||cfg.palaceTool!==false)}
function palaceTopN(){const n=Number(cfg&&cfg.palaceTop);return (Number.isFinite(n)&&n>0)?Math.min(40,Math.round(n)):6}
function palaceBudget(){const n=Number(cfg&&cfg.palaceChars);return (Number.isFinite(n)&&n>0)?Math.min(20000,Math.round(n)):1500}
function palaceWVec(){const n=Number(cfg&&cfg.palaceWVec);return (Number.isFinite(n)&&n>=0&&n<=1)?n:.5}

/* ---------- 本机向量：把一段文字变成 256 个数字 ---------- */
function palaceHash(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return h>>>0;
}
function palaceVec(text){
  const v=new Float32Array(PALACE_DIM);
  const s=String(text||'').replace(/\s+/g,'');
  const n=s.length;
  const put=(key,w)=>{
    const h=palaceHash(key),i=h%PALACE_DIM;
    v[i]+=((h>>>31)&1)?-w:w;
  };
  for(let i=0;i<n;i++){
    put(s.charAt(i),.4);                        /* 单字 */
    if(i+1<n)put(s.substr(i,2),1.2);            /* 双字词（中文最有用的一层） */
    if(i+2<n)put(s.substr(i,3),.6);             /* 三字词 */
  }
  let sum=0;
  for(let i=0;i<PALACE_DIM;i++)sum+=v[i]*v[i];
  const L=Math.sqrt(sum)||1;
  for(let i=0;i<PALACE_DIM;i++)v[i]/=L;         /* 归一化：长度不同的文字才好比 */
  return v;
}
function palaceQuant(v){
  const b=new Int8Array(v.length);
  for(let i=0;i<v.length;i++){
    let x=Math.round(v[i]*127);
    if(x>127)x=127;else if(x<-127)x=-127;
    b[i]=x;
  }
  return b;
}
function palacePack(b){
  let s='';
  for(let i=0;i<b.length;i++)s+=String.fromCharCode((b[i]+256)&255);
  return btoa(s);
}
function palaceUnpack(txt){
  const bin=atob(String(txt||'')),b=new Int8Array(bin.length);
  for(let i=0;i<bin.length;i++){const c=bin.charCodeAt(i);b[i]=c>127?c-256:c}
  return b;
}
function palaceDot(a,b){
  let s=0;
  const n=Math.min(a.length,b.length);
  for(let i=0;i<n;i++)s+=a[i]*b[i];
  return s/16129;            /* 127×127，两个向量都归一化过，结果≈余弦相似度 */
}
/* 关键词：一条文字里所有「双字组合」，压成一串字符（两个格一个词），比对很快 */
function palaceCode(g){return String.fromCharCode(0x100+(palaceHash(g)%0x7E00))}
function palaceGrams(text){
  const s=String(text||'').replace(/\s+/g,''),seen=Object.create(null),out=[];
  for(let i=0;i+1<s.length;i++){
    const c=palaceCode(s.substr(i,2));
    if(seen[c])continue;
    seen[c]=1;out.push(c);
  }
  return out.join('');
}
/* 每个字词出现在多少条片段里（用来给少见的词加权） */
function palaceDf(chunks){
  const df=Object.create(null);
  for(const ch of chunks){
    const g=ch.g||'';
    for(let i=0;i<g.length;i++){const c=g.charAt(i);df[c]=(df[c]||0)+1}
  }
  return df;
}
/* 把一条长记忆切成片段（短的就原样一条） */
function palaceSplit(text){
  const t=String(text||'').replace(/\s+/g,' ').trim();
  if(t.length<PALACE_MIN)return [];
  if(t.length<=PALACE_CHUNK)return [t];
  const out=[];
  for(let i=0;i<t.length;i+=PALACE_CHUNK-PALACE_OVER){
    out.push(t.substr(i,PALACE_CHUNK));
    if(i+PALACE_CHUNK>=t.length)break;
  }
  return out;
}
/* 完整日期文字：2024年5月3日 14:22 */
function fullTimeText(t){
  const d=new Date(t);
  if(!t||isNaN(d))return '';
  const p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 「时间」标签用的名字：2024-05-03 */
function dayTagOf(t){

}
/* 认不出时间的条目，借前后最近那条的时间（补时间标签用） */
function fillTimes(arr){
  let last=0;
  for(let i=0;i<arr.length;i++){if(arr[i])last=arr[i];else arr[i]=last}
  let next=0;
  for(let i=arr.length-1;i>=0;i--){if(arr[i])next=arr[i];else arr[i]=next}
  return arr;
}
/* 档案一条消息的时间（各种格式都试一下，认不出来就 0） */
function palaceTime(m){
  if(!m||typeof m!=='object')return 0;
  let v=(m.t!=null?m.t:(m.time!=null?m.time:(m.timestamp!=null?m.timestamp:(m.ts!=null?m.ts:(m.date!=null?m.date:m.created_at)))));
  if(v==null)return 0;
  if(typeof v==='number'){
    if(v>1e14)v=v/1000;
    if(v>1e11)return v;
    if(v>1e9)return v*1000;
    return 0;
  }
  const n=Date.parse(String(v));
  return Number.isFinite(n)?n:0;
}
/* 聊天记录一条消息的文字（带图片/文件/表情的说明） */
function palaceMsgText(m){
  if(!m)return '';
  let t=String(m.content||'').replace(/\s+/g,' ').trim();
  if(m.img)t=t?(t+'（还发了张图片）'):'（发了张图片）';
  if(m.files&&m.files.length)t+='（还发了个文件'+(m.files[0]&&m.files[0].name?('：'+m.files[0].name):'')+'）';
  if(m.sticker&&!t)t='（发了个表情）';
  return t.slice(0,1500);
}
/* 聊天记录里一条消息的「编号」：优先用发消息的时间，没有时间就用第几条。
   标签挂在它上面，所以删掉别的消息也不会串位。 */
function chatKey(m,i){
  const t=(m&&typeof m.t==='number'&&m.t>0)?String(m.t):'';
  return t?('t'+t):('i'+i);
}
/* ---------- 聊天记录的索引：内存里，随聊随更新 ---------- */
function palaceChatItems(cid){
  let list=(cid&&cid===curId)?msgs:(load(LS.msg(cid),[])||[]);
  if(!Array.isArray(list))list=[];
  let st=palaceChat[cid];
  if(!st||st.items.length>list.length)st=palaceChat[cid]={items:[]};   /* 删过消息就重建 */
  for(let i=st.items.length;i<list.length;i++){
    const m=list[i];
    if(!m||(m.role!=='user'&&m.role!=='assistant')){st.items.push(null);continue}
    const x=palaceMsgText(m);
    if(x.length<PALACE_MIN){st.items.push(null);continue}
    st.items.push({i:i,key:chatKey(m,i),role:m.role,t:m.t||0,x:x,g:palaceGrams(x),q:palaceQuant(palaceVec(x))});
  }
  return st.items;
}
/* 热层（已经完整带上的那几轮）在聊天记录里的起点：这之前的才需要去宫殿里翻 */
function palaceHotFrom(cid){
  if(cid!==curId)return Infinity;          /* 别的角色的聊天记录不在热层里，全部可检索 */
  const mode=(cfg&&cfg.histMode)||'auto';
  if(mode==='full')return 0;
  if(mode==='sum')return Math.max(0,msgs.length-4);
  return Math.max(0,msgs.length-hotRoundCount()*2);
}
function palaceAllowedArcs(cid){

/* 档案的「指纹」：档案有增减/改名/开关变了，指纹就变，索引会自动重建 */
function palaceSig(){
  try{
    const list=load(LS.arcs,[])||[];
    return list.map(a=>(a.id||'')+':'+(a.count||0)+':'+(a.off?'1':'0')+':'+(a.name||'')).sort().join('|');
  }catch(e){return ''}
}
/* ---------- 建档案索引（存进 IndexedDB，只保存压缩后的向量+文字） ---------- */
async function palaceBuildArc(show){
  if(palaceBuilding)return false;
  palaceBuilding=true;
  try{
    if(show)toast('正在给记忆宫殿建索引…（不用管它，聊天不受影响）');
    const list=load(LS.arcs,[])||[];
    const stored=[];
    let vols=0,charsN=0;
    for(const a of list){
      if(a.off)continue;
      const am=getArc(a.id);
      if(!am||!am.length)continue;
      vols++;
      for(let i=0;i<am.length;i++){
        const raw=arcMsgText(am[i]);
        if(!raw)continue;
        const parts=palaceSplit(raw);
        for(const p of parts){
          stored.push({x:(p.length>400?p.slice(0,400):p),g:palaceGrams(p),a:a.id,n:a.name||'旧档案',i:i,t:palaceTime(am[i]),
            v:palacePack(palaceQuant(palaceVec(p)))});
          charsN+=p.length;
        }
      }
    }
    const mem=stored.map(c=>({x:c.x,g:c.g,a:c.a,n:c.n,i:c.i,t:c.t,q:palaceUnpack(c.v)}));
    palaceArc={ver:1,builtAt:Date.now(),vols:vols,chars:charsN,sig:palaceSig(),df:palaceDf(mem),chunks:mem};
    palaceArcLoad=Promise.resolve(palaceArc);
    try{await idbPut(PALACE_KEY,{ver:1,builtAt:palaceArc.builtAt,vols:vols,chars:charsN,sig:palaceArc.sig,chunks:stored},'memidx')}
    catch(e){console.warn('记忆宫殿索引没存住（下次打开会重建）',e)}
    if(show)toast('记忆宫殿：索引建好了，共 '+mem.length+' 段（'+vols+' 卷，'+charsN+' 字）');
    try{if(typeof refreshMem==='function')refreshMem()}catch(e){}
    try{if(typeof mpalRender==='function')mpalRender()}catch(e){}
    return true;
  }catch(e){
    console.warn('记忆宫殿建索引失败',e);
    if(show)toast('建索引失败：'+((e&&e.message)||e));
    return false;
  }finally{
    palaceBuilding=false;
  }
}
async function palaceLoadArc(){
  if(palaceArc)return palaceArc;
  if(palaceArcLoad)return palaceArcLoad;
  palaceArcLoad=(async()=>{
    try{
      const d=await idbGet(PALACE_KEY,'memidx');
      if(d&&d.chunks&&d.chunks.length){
        const mem=d.chunks.map(c=>({x:c.x,g:c.g,a:c.a,n:c.n,i:c.i,t:c.t,q:palaceUnpack(c.v)}));
        palaceArc={ver:d.ver||1,builtAt:d.builtAt||0,vols:d.vols||0,chars:d.chars||0,sig:d.sig||'',df:palaceDf(mem),chunks:mem};
        return palaceArc;
      }
    }catch(e){console.warn('记忆宫殿索引读不出来',e)}
    return null;
  })();
  return palaceArcLoad;
}
/* 启动时叫一下：有索引就读进来，没有就后台建一次 */
async function palacePreload(){
  try{
    if(!palaceOn())return;
    await palaceLoadArc();
    /* 没有索引，或者档案变过了（新上传/删除/改名/归档）→ 后台重建一次 */
    if(!palaceArc||palaceArc.sig!==palaceSig())await palaceBuildArc(false);
  }catch(e){console.warn('记忆宫殿预热失败',e)}
}
/* ---------- 检索：给一句话，找出最相关的几段原文 ---------- */
function palaceQueryW(qs,df){
  const cs=palaceGrams(qs),w=Object.create(null);
  const N=(palaceArc&&palaceArc.chunks&&palaceArc.chunks.length)?palaceArc.chunks.length:1;
  for(let i=0;i<cs.length;i++){
    const c=cs.charAt(i);
    if(w[c]!=null)continue;
    if(!df){w[c]=1;continue}                   /* 还没建索引：关键词一视同仁 */
    const d=df[c]||0;
    /* 越少见的词命中越值钱；档案里从没出现过、但可能只在聊天记录里出现的词，给最低权重 */

/* ---------- 检索日志：哪一轮、谁、翻了什么（面板里能看） ---------- */

async function palaceAutoTimeTags(){

      if(hasTime(cid,key)){skip++;continue}
      put(cid,key,tagJoin('时间',dayTagOf(times[i])));
      add++;
    }
  }

  try{if(typeof refreshMem==='function')refreshMem()}catch(e){}
  alert('✅ 时间标签补好了\n\n· 新加 '+add+' 条\n· 已有时间标签、跳过 '+skip+' 条\n· 认不出时间的 '+noTime+' 条（这些只能手动打）\n\n回记忆宫殿就能看到：点标签可以按时间找记忆，角色也能按时间去回忆。');
}
function palaceLog(src,q,r,note){

/* 检索：关键词 + 本机向量 + 人工标签，三条路一起打分。
   opt.tag 有值时＝只按这个标签找（角色主动按标签查记忆用的）。 */
function palaceSearch(qs,c,top,budget,opt){
  opt=opt||{};
  const q=String(qs||'').replace(/\s+/g,' ').trim();
  const wantTag=String(opt.tag||'').trim();
  if(!c||(!q&&!wantTag))return null;

  const qg=palaceGrams(q);
  const wq=palaceQueryW(q,palaceArc?palaceArc.df:null);
  let wsum=0;for(const k in wq)wsum+=wq[k];

  const tgOf=(arcId,i)=>{
    const tags=mtagChunk(TAG,arcId,i);
    if(!tags)return 0;
    let best=0;
    for(let k=0;k<tags.length;k++){
      const t=tags[k];
      if(wantTag){
        const tn=tagName(t);
        if(t===wantTag||tn===wantTag||tn.indexOf(wantTag)>=0||wantTag.indexOf(tn)>=0)return 1;

      }

    const allow=palaceAllowedArcs(c.id);

      if(!allow[ch.a])continue;

      if(wantTag&&!tg)continue;

        if(q){const g=palaceGrams(t);for(let j=0;j<g.length;j++){const ww=wq[g.charAt(j)];if(ww)kw+=ww}}
        if(!tg&&kw<=0)continue;

  {

    const items=palaceChatItems(c.id);
    const CK='chat:'+c.id;
    for(let i=0;i<items.length;i++){
      const it=items[i];
      if(!it)continue;
      const tg=tgOf(CK,it.key);
      if(wantTag&&!tg)continue;
      if(!wantTag&&i>=hotFrom)continue;      /* 已经在热层里的就不用重复给了 */
      let kw=0;
      if(q){for(let j=0;j<it.g.length;j++){const ww=wq[it.g.charAt(j)];if(ww)kw+=ww}kw/=wsum}
      const cos=q?palaceDot(it.q,qv):0;

  cands.sort((x,y)=>{

  /* 相关度门槛：随便一句家常话不该翻出一堆旧事。
     做法：看候选池中后段（第 20~120 名）的中位数，把它当作「背景噪音」，
     明显高于噪音的才算数。人工打过标签的直接放行（那是你亲手标的）。 */
  let best=0,anyTag=false;

  const weak=(best<.35)&&!wantTag&&!anyTag;

  }
  /* 兜底：严格门槛一条都没挑中时，只要记忆里「字面上真的提到了」她话里的词，
     就至少给一小段（最多 1 段 / 300 字）。什么字都对不上的（比如「早安」）仍然是 0 段。 */
  if(!picked.length&&!wantTag){
    for(const cd of cands){
      if(picked.length>=1)break;
      if(cd.kw<0.15)continue;
      const key=cd.o.src+':'+((cd.o.src==='arc')?cd.o.a:cd.o.c)+':'+cd.o.i;
      if(seen[key])continue;
      const seg=palaceSeg(cd.o,c);
      if(!seg||seg.length>300)continue;
      seen[key]=1;
      picked.push({o:cd.o,seg:seg,score:Math.round(cd.score*100)/100,tag:cd.tag});
      used+=seg.length;
    }
  }
  return {picked:picked,used:used,total:cands.length};
}
/* 给「记忆宫殿」卡片看的：上一轮到底翻了什么 */
function palaceBlock(query,c){

  palaceLog('auto',query,r);
  const hits=(r&&r.picked)||[];
  if(!hits.length&&!pin.list.length)return '';
  const out=[];
  if(pin.list.length){
    out.push('【你一直记得的事】下面这些是她亲手标成「一直记得」的，每轮都给你：\n'+pin.list.join('\n\n'));
  }

      '下面几段是你和她过去真实发生过的事（从很久以前的记录里翻出来的）。这些你都记得，可以自然地想起来、接着聊；没翻到的就是这会儿没想起来，别硬编。\n'+
      '（现在的时间是 '+window.P4.now()+'；下面记录里的日期都是过去，不是现在。）');
    hits.forEach(p=>out.push(p.seg+(p.tag?'（这条是她打过标签的记忆）':'')));
