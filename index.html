<head>

<style>
:root{--fs:15px;--bg:#06101a;--panel:#0b1b28;--line:#16303f;--txt:#d8e8f2;--dim:#7d99aa;--acc:#3fa9d8;--accdim:#1b4a63;--warn:#d8695f;--bub:18px}
body.light{--bg:#eef4f8;--panel:#fff;--line:#d5e2ea;--txt:#12313f;--dim:#6b8797;--acc:#1f7fa8;--accdim:#d7eaf4;--warn:#c0504a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:var(--fs)/1.65 -apple-system,"PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:15px;font-weight:600;flex:0 0 auto;letter-spacing:.5px}
header .who{flex:1;color:var(--dim);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 6px}
.row{display:flex;gap:8px}
.col{flex:1;min-width:0}

.dim{color:var(--dim)}
label.f{display:block;margin:10px 0 4px;font-size:12px;color:var(--dim)}
input,textarea,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}

button{font:inherit;background:var(--accdim);color:var(--txt);border:0;border-radius:12px;padding:10px 14px;font-size:14px}
button.pri{background:var(--acc);color:#03131c;font-weight:600}

.bub{max-width:84%;padding:9px 13px;border-radius:var(--bub);margin:7px 0 0;word-break:break-word;font-size:var(--fs)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:rgba(3,19,28,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;display:none;max-width:82%;text-align:center}

nav{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

<body>
<header><h1 id="title">深蓝海域</h1><span class="who" id="who"></span></header>
<main id="main"></main>
<div id="composer"><textarea id="inp" rows="1" placeholder="说点什么…"></textarea><button id="send">↑</button></div>
<nav>

  <button data-v="roles"><b>☰</b>角色</button>
  <button data-v="mem"><b>❖</b>记忆</button>
  <button data-v="cfg"><b>⚙</b>设置</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS={cfg:'wh_cfg',chars:'wh_chars',cur:'wh_cur',arcs:'wh_arcs',msg:id=>'wh_msg_'+id,mem:id=>'wh_mem_'+id,arc:id=>'wh_arc_'+id};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('存不下：'+e.message)}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const SUM_N=60,MAX_SCAN=4000;
const EMPTY_MEM=()=>({core:'',timeline:[],summaries:[],prefs:[],habits:[]});

let cfg=load(LS.cfg,{base:'https://api.openai.com/v1',key:'',model:'gpt-4o-mini',temp:.85,maxtok:900,ctx:30,theme:'dark',fs:15,autoOn:true,notify:false,arcTop:5});
if(cfg.arcTop==null)cfg.arcTop=5;
let chars=load(LS.chars,[]);
let curId=load(LS.cur,null);
let msgs=[],mem=EMPTY_MEM(),view='chat',busy=false,autoT=null,arcMem={};

function toast(m){
  const t=$('#toast');
  t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},4000);
}

/* ---------- IndexedDB（存档案，容量大） ---------- */
let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db);
    if(!window.indexedDB)return rej(new Error('这个浏览器不支持 IndexedDB'));
    const r=indexedDB.open('wh_db',1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('arc'))d.createObjectStore('arc')};
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=()=>rej(r.error||new Error('IndexedDB 打不开'));
  });
}
async function idbPut(k,v){
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction('arc','readwrite');
    t.objectStore('arc').put(v,k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('写入失败'));
  });
}
async function idbGet(k){
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction('arc','readonly');
    const q=t.objectStore('arc').get(k);
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
async function idbDel(k){
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction('arc','readwrite');
    t.objectStore('arc').delete(k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
  });
}
async function idbKeys(){
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction('arc','readonly');
    const q=t.objectStore('arc').getAllKeys();
    q.onsuccess=()=>res(q.result||[]);
    q.onerror=()=>rej(q.error);
  });
}
async function initArcs(){
  // 兼容：把老版本存在 localStorage 的档案搬进 IndexedDB
  for(const a of load(LS.arcs,[])){
    const k=LS.arc(a.id),raw=localStorage.getItem(k);
    if(raw){
      try{const d=JSON.parse(raw);await idbPut(a.id,d);arcMem[a.id]=d;localStorage.removeItem(k)}catch(e){}
    }
  }
  try{
    const keys=await idbKeys();
    for(const k of keys){if(!arcMem[k])arcMem[k]=await idbGet(k)}
  }catch(e){console.warn('档案加载失败',e)}
  if(view==='mem')renderMem();
}
const getArc=id=>arcMem[id]||[];

/* ---------- 基础 ---------- */
function applyTheme(){
  document.body.classList.toggle('light',cfg.theme==='light');
  document.documentElement.style.setProperty('--fs',(cfg.fs||15)+'px');
}
const curChar=()=>chars.find(c=>c.id===curId)||null;
const modelOf=c=>(c&&c.model)||cfg.model;
const persist=()=>{if(curId)save(LS.msg(curId),msgs)};
const saveMem=()=>{if(curId)save(LS.mem(curId),mem)};
function loadChar(id){
  curId=id;save(LS.cur,id);
  msgs=load(LS.msg(id),[]);
  mem=Object.assign(EMPTY_MEM(),load(LS.mem(id),null)||{});
  scheduleAuto();
}
function openSheet(){$('#modal').classList.add('on')}
function closeSheet(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};

/* ---------- 视图 ---------- */
function go(v){
  view=v;
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#composer').style.display=(v==='chat')?'flex':'none';
  draw();scheduleAuto();
}
function draw(){
  $('#title').textContent={chat:'聊天',roles:'角色列表',mem:'记忆空间',cfg:'设置'}[view];
  const c=curChar();
  $('#who').textContent=(view!=='cfg'&&c)?((c.emoji||'')+' '+c.name):'';
  if(view==='chat')renderChat();
  else if(view==='roles')renderRoles();
  else if(view==='mem')renderMem();
  else renderCfg();
}
const scrollDown=()=>{const m=$('#main');m.scrollTop=m.scrollHeight};

/* ---------- 档案检索 ---------- */
function grams(s){
  s=String(s||'').replace(/\s+/g,'').slice(0,240);
  const st=new Set();
  for(let i=0;i<s.length-1;i++)st.add(s.slice(i,i+2));
  return st;
}
function sim(a,b){let h=0;a.forEach(g=>{if(b.has(g))h++});return h/Math.max(1,a.size)}
function archiveBlock(query,c){
  const list=load(LS.arcs,[]);
  if(!list.length)return '';
  const out=[],top=(cfg.arcTop==null?5:cfg.arcTop);
  list.forEach(a=>{
    if(!a.whole)return;
    const ms=getArc(a.id);
    let t=ms.map(m=>(m.role==='user'?'她':c.name)+'：'+m.content).join('\n');
    if(t.length>6000)t=t.slice(0,6000)+'……';
    if(t)out.push('【《'+a.name+'》全文·这是你们真实发生过的过去】\n'+t);
  });
  if(top>0&&query&&query.trim().length>1){
    const gq=grams(query),hits=[];
    list.forEach(a=>{
      if(a.whole)return;
      const ms=getArc(a.id);
      const from=Math.max(0,ms.length-MAX_SCAN);
      for(let i=from;i<ms.length;i++){
        const t=ms[i].content;
        if(!t||t.length<6)continue;
        const s=sim(gq,grams(t));
        if(s>0.16)hits.push({s:s,a:a,i:i,ms:ms});
      }
    });
    hits.sort((x,y)=>y.s-x.s);
    const cut=hits.slice(0,top);
    if(cut.length){
      out.push('【旧日对话摘录】这是你和她过去真实聊过的片段，你记得这些事，可以自然地想起来、接着聊：\n'+
      cut.map(h=>{
        const seg=h.ms.slice(Math.max(0,h.i-1),h.i+2).map(m=>(m.role==='user'?'她':c.name)+'：'+m.content).join('\n');
        return '——摘自《'+h.a.name+'》\n'+seg;
      }).join('\n\n'));
    }
  }
  return out.join('\n\n');
}

/* ---------- 解析：JSON / Markdown / 纯文本 ---------- */
function isMsgLike(x){return x&&typeof x==='object'&&!Array.isArray(x)&&('content' in x||'text' in x||'message' in x||'contentParts' in x)&&('role' in x||'sender' in x||'type' in x||'author' in x)}
function normMsg(m){
  const rs=String(m.role||m.sender||m.type||m.author||'').toLowerCase();
  if(/system|tool/.test(rs))return null;
  const role=/user|human|me$|用户|我$/.test(rs)?'user':/assist|ai|bot|gpt|model|助手|模型/.test(rs)?'assistant':null;
  if(!role)return null;
  let c='';
  if(Array.isArray(m.contentParts)){
    c=m.contentParts.filter(p=>p&&p.type==='text'&&p.text).map(p=>p.text).join('\n');
  }
  if(!c&&m.content!=null)c=m.content;
  if(!c&&m.text!=null)c=m.text;
  if(!c&&m.message!=null)c=m.message;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  c=String(c==null?'':c).trim();
  if(!c)return null;
  return {role:role,content:c,t:(typeof m.timestamp==='number'?m.timestamp:Date.now())};
}
function digSessions(node,name,out,depth){
  if(depth>10||!node)return;
  if(Array.isArray(node)){
    if(node.length&&node.some(isMsgLike)){
      const ms=node.map(normMsg).filter(Boolean);
      if(ms.length>=2){out.push({name:name||'导入的对话',messages:ms});return;}
    }
    node.forEach(v=>digSessions(v,name,out,depth+1));
    return;
  }
  if(typeof node==='object'){
    const nm=node.name||node.title||node.topic||node.subject||name;
    Object.keys(node).forEach(k=>{
      const v=node[k];
      if(v&&typeof v==='object')digSessions(v,nm,out,depth+1);
    });
  }
}
function parseText(text){
  const msgs=[];let cur=null;
  const push=()=>{if(cur){const c=cur.content.trim();if(c)msgs.push({role:cur.role,content:c,t:Date.now()});cur=null}};
  const uk=/^(you|user|human|me|用户|我|她)$/i,ak=/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)$/i;
  text.split('\n').forEach(raw=>{
    const l=raw.replace(/\s+$/,'');
    const s=l.replace(/^[#>\-*\s]+/,'').trim();
    if(!s){if(cur)cur.content+='\n';return}
    let role=null,rest='',m;
    m=s.match(/^(you|user|human|me|用户|我|她)\s*[:：]\s*(.*)$/i);
    if(m){role='user';rest=m[2]}
    else{
      m=s.match(/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)\s*[:：]\s*(.*)$/i);
      if(m){role='assistant';rest=m[2]}
      else if(uk.test(s)){role='user'}
      else if(ak.test(s)){role='assistant'}
    }
    if(role){push();cur={role:role,content:rest};return}
    if(cur)cur.content+=(cur.content?'\n':'')+l;
  });
  push();
  return msgs.length>=2?{name:'导入的对话',messages:msgs}:null;
}
function parseArchive(text){
  const t=String(text).trim();
  if(t[0]==='{'||t[0]==='['){
    try{
      const out=[];
      digSessions(JSON.parse(t),null,out,0);
      const clean=out.filter(x=>x.messages.length>=2);
      if(clean.length)return clean;
    }catch(e){}
  }
  const md=parseText(text);
  return md?[md]:[];
}

/* ---------- 解析：HTML ---------- */
function slimHtml(h){
  return String(h)
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<svg[\s\S]*?<\/svg>/gi,'')
    .replace(/<head[\s\S]*?<\/head>/gi,'')
    .replace(/<img[^>]*>/gi,'')
    .replace(/url\(\s*["']?data:[^)]*\)/gi,'')
    .replace(/<\/(div|p|li|h[1-6]|tr|section|article|blockquote)>/gi,'\n')
    .replace(/<br\s*\/?>/gi,'\n');
}
function roleOfEl(el){
  let cur=el,hop=0;
  while(cur&&hop<4){
    const s=((cur.getAttribute&&cur.getAttribute('data-message-author-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('data-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('class'))||'');
    const t=s.toLowerCase();
    if(/user|human|sender-self|消息-我|我发的/.test(t))return 'user';
    if(/assist|chatbox|\bai\b|\bbot\b|gpt|reply|model|助手/.test(t))return 'assistant';
    cur=cur.parentElement;hop++;
  }
  return null;
}
function parseHtmlArchive(html){
  let doc=null;
  try{doc=new DOMParser().parseFromString(slimHtml(html),'text/html')}catch(e){}
  if(doc){
    const sel='[data-message-author-role],[data-role],[class*="message"],[class*="msg"],[class*="bubble"],[class*="chat-item"],[class*="chatItem"],[class*="turn"],[class*="round"]';
    let els=[];
    try{els=Array.from(doc.querySelectorAll(sel))}catch(e){}
    if(els.length){
      const leaves=els.filter(el=>!els.some(o=>o!==el&&el.contains(o)));
      const got=[];
      leaves.forEach(el=>{
        const r=roleOfEl(el);
        if(!r)return;
        const t=(el.textContent||'').replace(/\n{2,}/g,'\n').trim();
        if(!t||t.length>20000)return;
        got.push({role:r,content:t,t:Date.now()});
      });
      const clean=[];
      got.forEach(m=>{const p=clean[clean.length-1];if(p&&p.role===m.role&&p.content===m.content)return;clean.push(m)});
      if(clean.length>=2)return {name:'',messages:clean};
    }
    const txt=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n');
    const md=parseText(txt);
    if(md&&md.messages.length>=2)return md;
  }
  return null;
}
function diagnose(text,isHtml){
  let sample='';
  try{
    if(isHtml){
      const doc=new DOMParser().parseFromString(slimHtml(text),'text/html');
      sample=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n').trim().slice(0,900);
    }else sample=String(text).trim().slice(0,900);
  }catch(e){sample='（连文字都没抠出来）'}
  $('#sheet').innerHTML='<div class="ttl">没认出来，帮我看看</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">下面是从文件里抠出来的文字开头。截这张图发我，我照着加格式。</p>'+
  '<div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:45vh;overflow:auto">'+esc(sample)+'</div>'+
  '<p class="dim" style="font-size:12px;margin-top:8px">文件字符数：'+text.length.toLocaleString()+'</p>'+
  '<div class="row" style="margin-top:12px"><button class="ghost col" onclick="closeSheet()">关</button></div>';
  openSheet();
}

/* ---------- 导入 ---------- */
function readFileText(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result));
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsText(f);
  });
}
async function importArchive(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  toast('读取中… '+(f.size/1048576).toFixed(1)+'MB');
  let text;
  try{text=await readFileText(f)}catch(e){return alert(e.message)}
  if(!text.trim())return alert('这文件是空的');
  toast('解析中，大文件要等几秒，别动…');
  await new Promise(r=>setTimeout(r,80));
  const isHtml=/\.html?$/i.test(f.name)||/^\s*<(!doctype|html)/i.test(text.slice(0,300));
  let found=[];
  try{
    if(isHtml){const one=parseHtmlArchive(text);found=one?[one]:[]}
    else found=parseArchive(text);
  }catch(e){console.warn(e)}
  if(!found.length){toast('没解析出来');return diagnose(text,isHtml)}
  const st=await ingestFound(found,f.name.replace(/\.[^.]+$/,''));
  toast('');
  alert('导入完成\n档案：'+st.added+' 份\n消息：'+st.total+' 条'+(st.fail?('\n失败：'+st.fail+' 份'):''));
}
async function ingestFound(found,fileName){
  const arcs=load(LS.arcs,[]);
  let added=0,total=0,fail=0;
  for(let i=0;i<found.length;i++){
    const f=found[i];
    const ms=f.messages.filter(m=>m.role==='user'||m.role==='assistant');
    if(ms.length<2)continue;
    const id=uid();
    const nm=fileName?(found.length>1?(fileName+' '+(i+1)):fileName):(f.name||('档案'+(arcs.length+1)));

function memBlock(m){
  const L=[],pk=(arr,n)=>arr.slice(-n).map(x=>'- '+x.text).join('\n');
  if(m.core)L.push('【角色核心设定】\n'+m.core);

}
function buildCtx(c,extra){
  const sys=[c.persona||('你是'+c.name+'。')];
  if(c.scenario)sys.push('【当前情境】'+c.scenario);
  const mb=memBlock(mem);if(mb)sys.push(mb);
  const lu=msgs.slice().reverse().find(x=>x.role==='user');
  const ab=archiveBlock(lu?lu.content:'',c);if(ab)sys.push(ab);
  if(c.style)sys.push('【说话风格】'+c.style);
  sys.push('【硬性要求】中文回复；像真人发消息一样，短句为主；不要写括号旁白、不要解释设定、不要自称AI或模型。');
  if(extra)sys.push(extra);
  const hist=msgs.slice(-(cfg.ctx||30)).map(x=>({role:x.role,content:x.content}));
  return [{role:'system',content:sys.join('\n\n')}].concat(hist);
}
async function callAPI(messages,opt){
  opt=opt||{};
  if(!cfg.key)throw new Error('先去设置里填 API Key');
  const url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  const body={model:opt.model||cfg.model,messages:messages,
    temperature:(opt.temp!=null?opt.temp:cfg.temp),max_tokens:opt.maxtok||cfg.maxtok,stream:!!opt.stream};
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  if(!res.ok){let t='';try{t=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t).slice(0,180))}
  if(!opt.stream){
    const j=await res.json();
    return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  }
  if(!res.body){
    const t=await res.text();let out='';
    t.split('\n').forEach(l=>{l=l.trim();if(l.indexOf('data:')!==0)return;const d=l.slice(5).trim();if(d==='[DONE]')return;
      try{const j=JSON.parse(d);const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
      if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}}catch(e){}});
    return out;
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const raw of lines){
      const line=raw.trim();
      if(!line||line.indexOf('data:')!==0)continue;
      const d=line.slice(5).trim();
      if(d==='[DONE]')return out;
      try{
        const j=JSON.parse(d);
        const de=j.choices&&j.choices[0]&&j.choices[0].delta;
        const c=de&&de.content;
        if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}
      }catch(e){}
    }
  }
  return out;
}

function scheduleAuto(){

  const a=c.auto,mi=Math.max(1,+a.min||30),ma=Math.max(mi+1,+a.max||90);

function isQuiet(a){
  const h=new Date().getHours(),qs=+a.quietStart,qe=+a.quietEnd;
  if(isNaN(qs)||isNaN(qe))return false;
  return qs<=qe?(h>=qs&&h<qe):(h>=qs||h<qe);
}

  const slice=msgs.slice(-n).map(x=>(x.role==='user'?'她':c.name)+'：'+x.content).join('\n');
  const q='把下面这段对话压缩成记忆条目。严格按格式输出，每行一个标签，没内容的写"无"，不要额外解释：\n'+
  '核心:<一句话概括核心设定或关系，可写无>\n时间线:<按顺序记关键事件，多条用；分隔>\n总结:<这段对话发生了什么，200字内>\n偏好:<她的偏好、忌讳、在意的东西>\n习惯:<性格与行为习惯>\n\n对话如下：\n'+slice;
  try{
    const res=await callAPI([{role:'user',content:q}],{model:modelOf(c),temp:.3,maxtok:900});
    const map={核心:'core',时间线:'timeline',总结:'summaries',偏好:'prefs',习惯:'habits'};
    let hit=0;
    res.split('\n').forEach(line=>{
      const s=line.replace('：',':').replace(/^[-*\d.、\s]+/,'').trim();
      const i=s.indexOf(':');
      if(i<0)return;
      const k=s.slice(0,i).trim(),v=s.slice(i+1).trim();
      if(!map[k]||!v||v==='无')return;
      hit++;
      if(map[k]==='core')mem.core=(mem.core?mem.core+'\n':'')+v;
      else{const kk=map[k];mem[kk]=mem[kk]||[];mem[kk].push({t:Date.now(),text:v})}
    });
    saveMem();renderMem();
    alert(hit?('写进去 '+hit+' 条，自己看一遍，不对就手改'):'模型没按格式回，重试或手动贴');
  }catch(e){alert('失败：'+e.message)}
}

  '<label class="f">API Key</label><input id="c_key" type="password" value="'+esc(cfg.key)+'" placeholder="sk-...">'+
  '<label class="f">默认模型</label><input id="c_model" value="'+esc(cfg.model)+'">'+
  '<div class="row" style="margin-top:10px">'+
  '<div class="col"><label class="f">温度</label><input id="c_temp" type="number" step="0.05" value="'+cfg.temp+'"></div>'+
  '<div class="col"><label class="f">最长回复</label><input id="c_maxtok" type="number" value="'+cfg.maxtok+'"></div>'+
  '<div class="col"><label class="f">上下文条数</label><input id="c_ctx" type="number" value="'+cfg.ctx+'"></div></div>'+
  '<div class="row" style="margin-top:10px"><button class="pri col" onclick="saveCfg()">保存</button>'+
  '<button class="col" onclick="testAPI()">测试连接</button></div>'+
  '<p class="dim" style="font-size:12px;margin:8px 0 0">Key 只存在你手机本地。</p></div>'+
  '<div class="card"><div class="ttl">外观与交互</div>'+
  '<label class="f">主题</label><select id="c_theme"><option value="dark">深海</option><option value="light">浅色</option></select>'+
  '<label class="f">字号：<span id="fsv">'+cfg.fs+'</span> px</label>'+
  '<input id="c_fs" type="range" min="13" max="20" value="'+cfg.fs+'">'+
  '<div class="row" style="align-items:center;margin-top:12px">'+
  '<div class="col"><b>全局自动发消息</b><div class="dim" style="font-size:12px">关掉后所有角色都不主动</div></div>'+
  '<input type="checkbox" id="c_auto" '+(cfg.autoOn?'checked':'')+'></div>'+
  '<div class="row" style="align-items:center;margin-top:12px">'+
  '<div class="col"><b>系统通知</b><div class="dim" style="font-size:12px">页面在后台时弹通知（需授权）</div></div>'+
  '<input type="checkbox" id="c_notify" '+(cfg.notify?'checked':'')+'></div></div>'+
  '<div class="card"><div class="ttl">数据与备份</div>'+
  '<div class="row"><button class="col" onclick="exportAll()">导出备份</button>'+
  '<button class="col" onclick="document.getElementById(\'imp\').click()">导入备份</button></div>'+
  '<input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importAll(this)">'+
  '<div class="row" style="margin-top:10px"><button class="warn col" onclick="wipe()">清空全部数据</button></div>'+
  '<p class="dim" style="font-size:12px;margin:8px 0 0">档案存在 IndexedDB 里，单独一份备份可能很大。</p></div>'+
  '<p class="dim" style="font-size:12px;text-align:center;padding-bottom:24px">深蓝海域 · 本地版</p>';
  $('#c_theme').value=cfg.theme;
  $('#c_theme').onchange=e=>{cfg.theme=e.target.value;save(LS.cfg,cfg);applyTheme()};
  $('#c_fs').oninput=e=>{cfg.fs=+e.target.value;$('#fsv').textContent=cfg.fs;applyTheme();save(LS.cfg,cfg)};
  $('#c_auto').onchange=e=>{cfg.autoOn=e.target.checked;save(LS.cfg,cfg);scheduleAuto()};
  $('#c_notify').onchange=async e=>{
    if(e.target.checked){
      if('Notification' in window){
        const p=await Notification.requestPermission();
        cfg.notify=(p==='granted');
        if(!cfg.notify)alert('通知权限没给，去浏览器设置里开');
      }else{alert('这个浏览器不支持通知');cfg.notify=false}
    }else cfg.notify=false;
    e.target.checked=cfg.notify;save(LS.cfg,cfg);
  };
}
function readCfgInputs(){
  const v=i=>{const el=document.getElementById(i);return el?el.value.trim():''};
  if(!document.getElementById('c_base'))return;
  cfg.base=v('c_base')||cfg.base;
  cfg.key=v('c_key');
  cfg.model=v('c_model')||cfg.model;
  cfg.temp=parseFloat(v('c_temp'))||.85;
  cfg.maxtok=parseInt(v('c_maxtok'))||900;
  cfg.ctx=parseInt(v('c_ctx'))||30;
}
function saveCfg(){readCfgInputs();save(LS.cfg,cfg);alert('已保存');scheduleAuto()}
async function testAPI(){
  readCfgInputs();save(LS.cfg,cfg);
  try{
    const t=await callAPI([{role:'user',content:'回复一个字：好'}],{maxtok:10,stream:false});
    alert('通了 ✅ 模型回：'+t);
  }catch(e){alert('失败：'+e.message)}
}
function exportAll(){
  const d={v:3,at:Date.now(),cfg:cfg,chars:chars,messages:{},memories:{},arcs:load(LS.arcs,[]),arcData:{}};
  chars.forEach(c=>{d.messages[c.id]=load(LS.msg(c.id),[]);d.memories[c.id]=load(LS.mem(c.id),null)});
  d.arcs.forEach(a=>{d.arcData[a.id]=getArc(a.id)});
  let str='';
  try{str=JSON.stringify(d)}catch(e){return alert('导出失败：'+e.message)}
  const blob=new Blob([str],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='blue-sea-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function importAll(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!confirm('导入会覆盖现在所有数据，确定？'))return;
      if(d.cfg)save(LS.cfg,d.cfg);
      if(d.chars)save(LS.chars,d.chars);
      if(d.messages)Object.keys(d.messages).forEach(k=>save(LS.msg(k),d.messages[k]));
      if(d.memories)Object.keys(d.memories).forEach(k=>{if(d.memories[k])save(LS.mem(k),d.memories[k])});
      if(d.arcs)save(LS.arcs,d.arcs);
      if(d.arcData)for(const k of Object.keys(d.arcData)){try{await idbPut(k,d.arcData[k]);arcMem[k]=d.arcData[k]}catch(e){}}
      alert('导入完成，刷新一下');
      location.reload();
    }catch(e){alert('文件读不了：'+e.message)}
  };
  rd.readAsText(f);
}
function wipe(){
  if(!confirm('清空全部数据？角色、聊天、记忆、档案全没，不可恢复'))return;
  localStorage.clear();
  try{indexedDB.deleteDatabase('wh_db')}catch(e){}
  location.reload();
}
