/* ---------- 隐私：应用锁密码 ---------- */
async function setPassword(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 直接打开这个文件，或放到 https 网站里。');
  const pw=$('#s_pw').value;
  if(!pw)return alert('先输入密码');
  if(pw.length<4)return alert('密码至少 4 位');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    const oldKey=cryptKey;
    if(!store){
      store={};
      for(const k of allDataKeys()){
        const raw=localStorage.getItem(k);
        if(raw==null)continue;
        try{store[k]=JSON.parse(raw)}catch(e){}
      }
    }
    const entries={};
    for(const k of Object.keys(store)){entries[k]=await encVal(key,JSON.stringify(store[k]))}
    for(const k of Object.keys(entries)){localStorage.setItem(k,entries[k])}
    for(const st of ['arc','rawlog']){
      let ks=[];try{ks=await idbKeys(st)}catch(e){}
      for(const k of ks){
        let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
        let val;
        if(oldKey){try{val=JSON.parse(await decVal(oldKey,raw))}catch(e){continue}}
        else val=raw;
        try{await idbPutRaw(k,await encVal(key,JSON.stringify(val)),st)}catch(e){}
      }
    }
    cryptKey=key;
    localStorage.setItem(LS.pw,JSON.stringify({salt:Array.from(salt),check:check}));
    toast(oldKey?'密码已修改':'密码已设置，数据已加密');
    renderCfg();
  }catch(e){alert('设置失败：'+e.message)}
}
async function removePassword(){
  if(!cryptKey)return;
  if(!confirm('移除密码？聊天和记忆会变回明文存储（任何拿到设备的人都能看到）'))return;
  try{
    for(const k of Object.keys(store)){localStorage.setItem(k,JSON.stringify(store[k]))}
    for(const st of ['arc','rawlog']){
      let ks=[];try{ks=await idbKeys(st)}catch(e){}
      for(const k of ks){
        let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
        try{await idbPutRaw(k,JSON.parse(await decVal(cryptKey,raw)),st)}catch(e){}
      }
    }
    localStorage.removeItem(LS.pw);
    cryptKey=null;store=null;
    toast('密码已移除');
    renderCfg();
  }catch(e){alert('移除失败：'+e.message)}
}

/* ---------- 备份 ---------- */
const BK='wh_backup_handle';
const bkEveryMin=()=>{const n=+(cfg&&cfg.bkEvery);return (isFinite(n)&&n>0)?n:0;};   /* 0=实时 */
const bkWatchMs=()=>{const m=bkEveryMin();return m?m*60000:600000;};
async function bkPermState(){
  if(!backupHandle)return 'none';
  try{return await backupHandle.queryPermission({mode:'readwrite'})}catch(e){return 'prompt'}
}
async function ensureBkPerm(){
  try{
    if(await bkPermState()==='granted')return true;
    const p=await backupHandle.requestPermission({mode:'readwrite'});
    if(p==='granted'){bkNeed=false;return true}
  }catch(e){}
  bkNeed=true;return false;
}
/* 浏览器规定「重新授权」必须由用户点击触发：挂一个只生效一次的监听，你下次点屏幕就自动补授权 */
function armBkReauth(){
  if(bkArmed)return;bkArmed=true;
  const h=async()=>{
    document.removeEventListener('pointerdown',h,true);bkArmed=false;
    if(bkNeed&&backupHandle&&await ensureBkPerm()){await autoBackup(true);if(view==='cfg')renderCfg()}
  };
  document.addEventListener('pointerdown',h,true);
}
function startBkTick(){
  if(bkTick)return;
  bkTick=setInterval(()=>{
    if(!backupHandle)return;
    if(Date.now()-lastBackup<bkWatchMs())return;
    autoBackup();
  },30000);
}
function stopBkTick(){if(bkTick){clearInterval(bkTick);bkTick=null}}
function bkStatusText(){
  if(!backupHandle)return '⚪ 未开启自动备份。建议开启，避免清浏览器数据时聊天记录丢失。';
  const every=bkEveryMin();
  const mode=every?('每 '+every+' 分钟自动存一次'):'有改动就自动存（约 2.5 秒后落盘）';
  if(bkNeed)return '🟡 自动备份已开启（'+mode+'），但浏览器收回了写文件权限。点屏幕任意位置、或点下面「立即备份一次」重新授权。上次成功：'+ago(lastBackup)+'。';
  return '🟢 自动备份已开启 · '+mode+' · 上次：'+ago(lastBackup)+(bkErr?(' · 上次出错：'+bkErr):'');
}
async function backupNow(){
  if(!backupHandle){toast('还没开启自动备份');return}
  toast('备份中…');
  const ok=await autoBackup(true);
  toast(ok?'已备份到文件':'备份失败'+(bkErr?('：'+bkErr):''));
  if(view==='cfg')renderCfg();
}
async function backupPayload(){
  const d={v:6,at:Date.now(),cfg:cfg,chars:chars,messages:{},memories:{},todos:{},arcs:load(LS.arcs,[]),arcData:{},
    groups:groupsAll(),gmsgs:{}};
  chars.forEach(c=>{d.messages[c.id]=load(LS.msg(c.id),[]);d.memories[c.id]=load(LS.mem(c.id),null);d.todos[c.id]=todosOf(c.id)});
  d.arcs.forEach(a=>{d.arcData[a.id]=getArc(a.id)});
  d.groups.forEach(g=>{d.gmsgs[g.id]=gmsgsOf(g.id)});
  const str=JSON.stringify(d);
  if(cryptKey)return {str:await encVal(cryptKey,str),enc:true};
  return {str:str,enc:false};
}
async function exportAll(){
  let p;try{p=await backupPayload()}catch(e){return alert('导出失败：'+e.message)}
  const blob=new Blob([p.str],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='blue-sea-'+(p.enc?'enc-':'')+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast(p.enc?'已导出（加密）。恢复时需输入密码。':'已导出（未加密，请注意文件安全）');
}
function importAll(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      let s=String(rd.result);
      let d;
      if(s.indexOf('enc:')===0){
        if(!cryptKey)return alert('这个备份是加密的。请先设置/输入密码解锁后再导入。');
        try{s=await decVal(cryptKey,s)}catch(e){return alert('解密失败：密码不对或文件损坏')}
      }
      d=JSON.parse(s);
      if(!confirm('导入会覆盖现在所有数据，确定？'))return;
      if(d.cfg)save(LS.cfg,d.cfg);
      if(d.chars)save(LS.chars,d.chars);
      if(d.messages)Object.keys(d.messages).forEach(k=>save(LS.msg(k),d.messages[k]));
      if(d.memories)Object.keys(d.memories).forEach(k=>{if(d.memories[k])save(LS.mem(k),d.memories[k])});
      if(d.todos)Object.keys(d.todos).forEach(k=>{if(d.todos[k]&&d.todos[k].length)save(LS.todo(k),d.todos[k])});
      if(d.arcs)save(LS.arcs,d.arcs);
      if(d.arcData)for(const k of Object.keys(d.arcData)){try{const v=Array.isArray(d.arcData[k])?sanitizeArcMs(d.arcData[k]):d.arcData[k];await idbPut(k,v);arcMem[k]=v}catch(e){}}
      if(d.groups)save(LS.groups,d.groups);
      if(d.gmsgs)Object.keys(d.gmsgs).forEach(k=>{if(d.gmsgs[k])save(LS.gmsg(k),d.gmsgs[k])});
      alert('导入完成，刷新一下');
      location.reload();
    }catch(e){alert('文件读不了：'+e.message)}
  };
  rd.readAsText(f);
}
function wipe(){
  if(!confirm('清空全部数据？角色、聊天、记忆、档案、待办、群聊全没，不可恢复'))return;
  localStorage.removeItem(LS.pw);
  localStorage.removeItem(LS.priv);
  allDataKeys().forEach(k=>localStorage.removeItem(k));
  try{indexedDB.deleteDatabase('wh_db')}catch(e){}
  location.reload();
}
async function initBackup(){
  try{backupHandle=(await idbGetRaw(BK,'meta'))||null}catch(e){backupHandle=null}
  lastBackup=load('wh_lastBackup',0);
  if(backupHandle){
    if(await bkPermState()!=='granted'){bkNeed=true;armBkReauth()}
    startBkTick();
    if(Date.now()-lastBackup>bkWatchMs())autoBackup();
  }
}

async function chooseBackupFile(){
  if(!window.showSaveFilePicker)return alert('当前浏览器不支持自动落盘（需 Chrome/Edge 86+）。你可以继续用「导出备份」手动保存。');
  try{
    backupHandle=await window.showSaveFilePicker({
      suggestedName:'blue-sea-backup.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}]
    });
    await idbPutRaw(BK,backupHandle,'meta');
    const ok=await autoBackup(true);
    if(ok){lastBackup=Date.now();save('wh_lastBackup',lastBackup)}
    startBkTick();
    toast(ok?'已开启自动备份到文件':'文件已选定，但写入失败：'+(bkErr||'未知原因'));
    renderCfg();
  }catch(e){}
}
function scheduleBackup(){
  if(!backupHandle)return;
  if(bkEveryMin()>0){startBkTick();return;}   /* 定时模式：不每次改动都写 */
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{bkTimer=null;autoBackup()},2500);
}
async function autoBackup(force){
  if(!backupHandle)return false;
  clearTimeout(bkTimer);bkTimer=null;
  try{
    let p='prompt';
    try{p=await backupHandle.queryPermission({mode:'readwrite'})}catch(e){p='prompt'}
    if(p!=='granted'){
      if(!force){bkNeed=true;armBkReauth();return false}   /* 先记下，等你点屏幕时补授权 */
      if(!(await ensureBkPerm())){bkErr='没有写文件权限';return false}
    }
    const payload=await backupPayload();
    const w=await backupHandle.createWritable();
    await w.write(payload.str);
    await w.close();
    lastBackup=Date.now();bkErr='';bkNeed=false;
    save('wh_lastBackup',lastBackup);
    return true;
  }catch(e){
    bkErr=(e&&e.message)||'写入失败';
    console.warn('自动备份失败',e);
    return false;
  }
}

/* ---------- 启动 ---------- */
async function unlock(){
  let meta=null;
  try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(!meta||!meta.salt){if(window._unlockGo)window._unlockGo();return}
  const pw=$('#pw').value;
  if(!pw){$('#pwerr').textContent='输入密码';return}
  try{
    const salt=new Uint8Array(meta.salt);
    const key=await deriveKey(pw,salt);
    const ok=await decVal(key,meta.check);
    if(ok!=='ok')throw new Error('wrong');
    cryptKey=key;
    await decryptAll();
    $('#lock').style.display='none';
    $('#pwerr').textContent='';
    if(window._unlockGo)window._unlockGo();
  }catch(e){$('#pwerr').textContent='密码不对';}
}
function fixCfg(){
  if(!cfg)cfg={};
  if(cfg.arcTop==null)cfg.arcTop=5;
  if(cfg.wholeLimit==null)cfg.wholeLimit=20000;
  if(cfg.fullLimit==null)cfg.fullLimit=20000;
  if(!cfg.histMode)cfg.histMode='auto';
  if(!cfg.sumWrite)cfg.sumWrite='append';
  if(cfg.userEmoji==null)cfg.userEmoji='🙂';
  if(cfg.userAvatar==null)cfg.userAvatar='';
  if(cfg.userName==null)cfg.userName='';
  if(cfg.userGender==null)cfg.userGender='';
  if(cfg.userNote==null)cfg.userNote='';
  if(cfg.timeOn==null)cfg.timeOn=true;
  if(!THEMES[cfg.theme])cfg.theme='dark';
  if(!cfg.fs)cfg.fs=15;
  if(cfg.autoSumEvery==null)cfg.autoSumEvery=30;
  if(cfg.autoSum==null)cfg.autoSum=false;
  if(cfg.ctx==null)cfg.ctx=30;
}
async function initApp(){
  cfg=load(LS.cfg,{base:'https://api.openai.com/v1',key:'',model:'gpt-4o-mini',temp:.85,maxtok:900,ctx:30,theme:'dark',fs:15,autoOn:true,notify:false,arcTop:5,autoSum:false,autoSumEvery:30,wholeLimit:20000,timeOn:true,bkEvery:0,

  fixCfg();
  chars=load(LS.chars,[]);
  chars.forEach(c=>{if(!c.id)c.id=uid();if(typeof c.avatar!=='string')c.avatar=''});

  msgs=[];mem=EMPTY_MEM();memCtx={id:null,obj:null};
  if(!chars.length){
    chars=[{id:uid(),name:'鲸鱼',emoji:'🐋',avatar:'',
      persona:'你是鲸鱼。说话简洁直白。',
      scenario:'',style:'短句，口语，不写旁白',greeting:'醒了？',
      sysPrompt:'',examples:'',think:1,priv:false,
      auto:{on:false,min:10,max:30,quietStart:1,quietEnd:8,hint:''},todoPerm:{on:false}}];
    save(LS.chars,chars);
  }
  /* 上次如果停在隐私角色上，重启后不自动进入它 */
  if(!curId||!chars.find(c=>c.id===curId))curId=chars[0]?chars[0].id:null;
  const cc=chars.find(c=>c.id===curId);
  if(cc&&cc.priv){const f=chars.find(c=>!c.priv);curId=f?f.id:null;if(curId)save(LS.cur,curId)}
  if(curId)loadChar(curId);
  applyTheme();
  $$('nav button').forEach(b=>{
    b.onclick=()=>go(b.dataset.v);
    /* 离开聊天页时，把还没发出去的图片清掉 */
    b.addEventListener('click',()=>{if(b.dataset.v!=='chat')clearPicked()});
  });
  $('#send').onclick=send;
  $('#stop').onclick=()=>{if(curAbort)curAbort.abort();else toast('当前没有在生成')};
  /* 发图片 */
  const pic=$('#pic');
  if(pic)pic.onclick=()=>{const i=$('#imgIn');if(i){i.value='';i.click()}};
  $('#inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  /* 弹层按 Esc 也能关（配合右上角 ✕） */
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))closeSheet()});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)autoBackup();
    else{checkAuto();checkGroupAuto()}
  });
  window.addEventListener('focus',()=>{checkAuto();checkGroupAuto()});
  window.addEventListener('pagehide',()=>autoBackup());
  initBackup();
  initArcs();
  updateDots();
  go('chat');
  scheduleAuto(false);
  scheduleGroupAuto(false);
}
async function boot(){
  let meta=null;
  try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(meta&&meta.salt){
    $('#lock').style.display='flex';
    await new Promise(res=>{window._unlockGo=res});
  }
  initApp();
}
boot();
