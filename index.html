  </div>
</div>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS={cfg:'wh_cfg',chars:'wh_chars',cur:'wh_cur',arcs:'wh_arcs',pw:'wh_pw',
  msg:id=>'wh_msg_'+id,mem:id=>'wh_mem_'+id,arc:id=>'wh_arc_'+id,todo:id=>'wh_todo_'+id};

/* ---------- 存储基础（带加密支持） ---------- */
let store=null, cryptKey=null;
const _writes={};
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function load(k,d){
  if(cryptKey)return (store&&hasOwn(store,k))?store[k]:d;
  try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}
}
function save(k,v){
  if(cryptKey){store[k]=v;encWrite(k,v)}
  else{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('存不下：'+e.message)}}
}
function removeKey(k){localStorage.removeItem(k);if(store)delete store[k]}
function encWrite(k,v){
  const s=JSON.stringify(v);
  const prev=_writes[k]||Promise.resolve();
  _writes[k]=prev.then(()=>encVal(cryptKey,s)).then(enc=>localStorage.setItem(k,enc)).catch(()=>{});
}
function allDataKeys(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('wh_')===0&&k!==LS.pw)out.push(k);
  }
  return out;
}

/* ---------- 加密工具 ---------- */
const te=new TextEncoder(), td=new TextDecoder();
function bufToB64u(buf){let s='';buf.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encVal(key,v){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(v));
  return 'enc:'+bufToB64u(iv)+':'+bufToB64u(new Uint8Array(ct));
}
async function decVal(key,s){
  if(typeof s!=='string'||s.indexOf('enc:')!==0)return null;
  const p=s.split(':');
  const iv=b64uToBuf(p[1]),ct=b64uToBuf(p[2]);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return td.decode(pt);
}
async function decryptAll(){
  store={};
  for(const k of allDataKeys()){
    const raw=localStorage.getItem(k);
    if(raw==null)continue;
    try{
      if(raw.indexOf('enc:')===0){const pt=await decVal(cryptKey,raw);store[k]=JSON.parse(pt)}
      else store[k]=JSON.parse(raw);
    }catch(e){console.warn('解密失败',k,e)}
  }
}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const SUM_N=60,MAX_SCAN=4000;
const EMPTY_MEM=()=>({core:'',timeline:[],summaries:[],prefs:[],habits:[]});

let cfg=null, chars=[], curId=null;
let msgs=[],mem=EMPTY_MEM(),view='chat',busy=false,autoT=null,arcMem={};
let todoCharId=null,todoFilter='open';

function toast(m){
  const t=$('#toast');
  t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},4000);
}

/* ---------- IndexedDB ---------- */
let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db);
    if(!window.indexedDB)return rej(new Error('这个浏览器不支持 IndexedDB'));
    const r=indexedDB.open('wh_db',2);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('arc'))d.createObjectStore('arc');
      if(!d.objectStoreNames.contains('rawlog'))d.createObjectStore('rawlog');
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=()=>rej(r.error||new Error('IndexedDB 打不开'));
  });
}
async function idbPut(k,v,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise(async(res,rej)=>{
    let payload=v;
    if(cryptKey){try{payload=await encVal(cryptKey,JSON.stringify(v))}catch(e){return rej(e)}}
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).put(payload,k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('写入失败'));
  });
}
async function idbGet(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(k);
    q.onsuccess=async()=>{
      let v=q.result;
      if(cryptKey&&typeof v==='string'&&v.indexOf('enc:')===0){
        try{v=JSON.parse(await decVal(cryptKey,v))}catch(e){v=undefined}
      }
      res(v);
    };
    q.onerror=()=>rej(q.error);
  });
}
async function idbGetRaw(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(k);
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
async function idbPutRaw(k,v,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).put(v,k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('写入失败'));
  });
}
async function idbDel(k,store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).delete(k);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
  });
}
async function idbKeys(store){
  store=store||'arc';
  const d=await idbOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).getAllKeys();
    q.onsuccess=()=>res(q.result||[]);
    q.onerror=()=>rej(q.error);
  });
}
async function initArcs(){
  for(const a of load(LS.arcs,[])){
    const k=LS.arc(a.id),raw=localStorage.getItem(k);
    if(raw){
      try{const d=JSON.parse(raw);await idbPut(a.id,d);arcMem[a.id]=d;removeKey(k)}catch(e){}
    }
  }
  try{
    const keys=await idbKeys();
    for(const k of keys){if(!arcMem[k])arcMem[k]=await idbGet(k)}
  }catch(e){console.warn('档案加载失败',e)}
  if(view==='mem')renderMem();
}
const getArc=id=>arcMem[id]||[];

/* ---------- 原文日志 ---------- */
async function rawGet(id){try{return await idbGet(id,'rawlog')||''}catch(e){return ''}}
async function rawPut(id,text){try{await idbPut(id,text,'rawlog');return true}catch(e){return false}}

/* ---------- 基础 ---------- */
function applyTheme(){
  document.body.classList.toggle('light',cfg&&cfg.theme==='light');
  document.documentElement.style.setProperty('--fs',((cfg&&cfg.fs)||15)+'px');
}
const curChar=()=>chars.find(c=>c.id===curId)||null;
const modelOf=c=>(c&&c.model)||(cfg&&cfg.model);
const persist=()=>{if(curId)save(LS.msg(curId),msgs)};
const saveMem=()=>{if(curId)save(LS.mem(curId),mem)};
function loadChar(id){
  curId=id;save(LS.cur,id);
  msgs=load(LS.msg(id),[]);
  mem=Object.assign(EMPTY_MEM(),load(LS.mem(id),null)||{});
  scheduleAuto();
}
function openSheet(){$('#modal').classList.add('on')}
function closeSheet(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};

/* ---------- 视图 ---------- */
function go(v){
  view=v;
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#composer').style.display=(v==='chat')?'flex':'none';
  draw();scheduleAuto();
}
function draw(){
  $('#title').textContent={chat:'聊天',roles:'角色列表',mem:'记忆空间',todo:'待办事项',cfg:'设置'}[view];
  const c=curChar();
  $('#who').textContent=(view!=='cfg'&&view!=='todo'&&c)?((c.emoji||'')+' '+c.name):'';
  if(view==='chat')renderChat();
  else if(view==='roles')renderRoles();
  else if(view==='mem')renderMem();
  else if(view==='todo')renderTodo();
  else renderCfg();
}
const scrollDown=()=>{const m=$('#main');m.scrollTop=m.scrollHeight};

/* ---------- 档案检索 ---------- */
function grams(s){
  s=String(s||'').replace(/\s+/g,'').slice(0,240);
  const st=new Set();
  for(let i=0;i<s.length-1;i++)st.add(s.slice(i,i+2));
  return st;
}
function sim(a,b){let h=0;a.forEach(g=>{if(b.has(g))h++});return h/Math.max(1,a.size)}
function archiveBlock(query,c){
  const list=load(LS.arcs,[]);
  if(!list.length)return '';
  const out=[],top=(cfg.arcTop==null?5:cfg.arcTop);
  const lim=(cfg.wholeLimit==null?20000:cfg.wholeLimit);
  list.forEach(a=>{
    if(!a.whole)return;
    const ms=getArc(a.id);
    let t=ms.map(m=>(m.role==='user'?'她':c.name)+'：'+m.content).join('\n');
    if(lim>0&&t.length>lim)t=t.slice(0,lim)+'……';
    if(t)out.push('【《'+a.name+'》全文·这是你们真实发生过的过去】\n'+t);
  });
  if(top>0&&query&&query.trim().length>1){
    const gq=grams(query),hits=[];
    list.forEach(a=>{
      if(a.whole)return;
      const ms=getArc(a.id);
      const from=Math.max(0,ms.length-MAX_SCAN);
      for(let i=from;i<ms.length;i++){
        const t=ms[i].content;
        if(!t||t.length<6)continue;
        const s=sim(gq,grams(t));
        if(s>0.16)hits.push({s:s,a:a,i:i,ms:ms});
      }
    });
    hits.sort((x,y)=>y.s-x.s);
    const cut=hits.slice(0,top);
    if(cut.length){
      out.push('【旧日对话摘录】这是你和她过去真实聊过的片段，你记得这些事，可以自然地想起来、接着聊：\n'+
      cut.map(h=>{
        const seg=h.ms.slice(Math.max(0,h.i-1),h.i+2).map(m=>(m.role==='user'?'她':c.name)+'：'+m.content).join('\n');
        return '——摘自《'+h.a.name+'》\n'+seg;
      }).join('\n\n'));
    }
  }
  return out.join('\n\n');
}

/* ---------- 解析：JSON / Markdown / 纯文本 ---------- */
function isMsgLike(x){return x&&typeof x==='object'&&!Array.isArray(x)&&('content' in x||'text' in x||'message' in x||'contentParts' in x)&&('role' in x||'sender' in x||'type' in x||'author' in x)}
function normMsg(m){
  const rs=String(m.role||m.sender||m.type||m.author||'').toLowerCase();
  if(/system|tool/.test(rs))return null;
  const role=/user|human|me$|用户|我$/.test(rs)?'user':/assist|ai|bot|gpt|model|助手|模型/.test(rs)?'assistant':null;
  if(!role)return null;
  let c='';
  if(Array.isArray(m.contentParts))c=m.contentParts.filter(p=>p&&p.type==='text'&&p.text).map(p=>p.text).join('\n');
  if(!c&&m.content!=null)c=m.content;
  if(!c&&m.text!=null)c=m.text;
  if(!c&&m.message!=null)c=m.message;
  if(Array.isArray(c))c=c.map(p=>typeof p==='string'?p:((p&&(p.text||p.content))||'')).join('\n');
  else if(c&&typeof c==='object')c=c.text||c.content||'';
  c=String(c==null?'':c).trim();
  if(!c)return null;
  return {role:role,content:c,t:(typeof m.timestamp==='number'?m.timestamp:Date.now())};
}
function digSessions(node,name,out,depth){
  if(depth>10||!node)return;
  if(Array.isArray(node)){
    if(node.length&&node.some(isMsgLike)){
      const ms=node.map(normMsg).filter(Boolean);
      if(ms.length>=2){out.push({name:name||'导入的对话',messages:ms});return;}
    }
    node.forEach(v=>digSessions(v,name,out,depth+1));
    return;
  }
  if(typeof node==='object'){
    const nm=node.name||node.title||node.topic||node.subject||name;
    Object.keys(node).forEach(k=>{
      const v=node[k];
      if(v&&typeof v==='object')digSessions(v,nm,out,depth+1);
    });
  }
}
function parseText(text){
  const msgs=[];let cur=null;
  const push=()=>{if(cur){const c=cur.content.trim();if(c)msgs.push({role:cur.role,content:c,t:Date.now()});cur=null}};
  const uk=/^(you|user|human|me|用户|我|她)$/i,ak=/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)$/i;
  text.split('\n').forEach(raw=>{
    const l=raw.replace(/\s+$/,'');
    const s=l.replace(/^[#>\-*\s]+/,'').trim();
    if(!s){if(cur)cur.content+='\n';return}
    let role=null,rest='',m;
    m=s.match(/^(you|user|human|me|用户|我|她)\s*[:：]\s*(.*)$/i);
    if(m){role='user';rest=m[2]}
    else{
      m=s.match(/^(assistant|ai|chatbox|gpt|bot|助手|模型|回复)\s*[:：]\s*(.*)$/i);
      if(m){role='assistant';rest=m[2]}
      else if(uk.test(s)){role='user'}
      else if(ak.test(s)){role='assistant'}
    }
    if(role){push();cur={role:role,content:rest};return}
    if(cur)cur.content+=(cur.content?'\n':'')+l;
  });
  push();
  return msgs.length>=2?{name:'导入的对话',messages:msgs}:null;
}
function parseArchive(text){
  const t=String(text).trim();
  if(t[0]==='{'||t[0]==='['){
    try{
      const out=[];
      digSessions(JSON.parse(t),null,out,0);
      const clean=out.filter(x=>x.messages.length>=2);
      if(clean.length)return clean;
    }catch(e){}
  }
  const md=parseText(text);
  return md?[md]:[];
}
function slimHtml(h){
  return String(h)
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<svg[\s\S]*?<\/svg>/gi,'')
    .replace(/<head[\s\S]*?<\/head>/gi,'')
    .replace(/<img[^>]*>/gi,'')
    .replace(/url\(\s*["']?data:[^)]*\)/gi,'')
    .replace(/<\/(div|p|li|h[1-6]|tr|section|article|blockquote)>/gi,'\n')
    .replace(/<br\s*\/?>/gi,'\n');
}
function roleOfEl(el){
  let cur=el,hop=0;
  while(cur&&hop<4){
    const s=((cur.getAttribute&&cur.getAttribute('data-message-author-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('data-role'))||'')+' '+
            ((cur.getAttribute&&cur.getAttribute('class'))||'');
    const t=s.toLowerCase();
    if(/user|human|sender-self|消息-我|我发的/.test(t))return 'user';
    if(/assist|chatbox|\bai\b|\bbot\b|gpt|reply|model|助手/.test(t))return 'assistant';
    cur=cur.parentElement;hop++;
  }
  return null;
}
function parseHtmlArchive(html){
  let doc=null;
  try{doc=new DOMParser().parseFromString(slimHtml(html),'text/html')}catch(e){}
  if(doc){
    const sel='[data-message-author-role],[data-role],[class*="message"],[class*="msg"],[class*="bubble"],[class*="chat-item"],[class*="chatItem"],[class*="turn"],[class*="round"]';
    let els=[];
    try{els=Array.from(doc.querySelectorAll(sel))}catch(e){}
    if(els.length){
      const leaves=els.filter(el=>!els.some(o=>o!==el&&el.contains(o)));
      const got=[];
      leaves.forEach(el=>{
        const r=roleOfEl(el);
        if(!r)return;
        const t=(el.textContent||'').replace(/\n{2,}/g,'\n').trim();
        if(!t||t.length>20000)return;
        got.push({role:r,content:t,t:Date.now()});
      });
      const clean=[];
      got.forEach(m=>{const p=clean[clean.length-1];if(p&&p.role===m.role&&p.content===m.content)return;clean.push(m)});
      if(clean.length>=2)return {name:'',messages:clean};
    }
    const txt=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n');
    const md=parseText(txt);
    if(md&&md.messages.length>=2)return md;
  }
  return null;
}
function diagnose(text,isHtml){
  let sample='';
  try{
    if(isHtml){
      const doc=new DOMParser().parseFromString(slimHtml(text),'text/html');
      sample=(doc.body?(doc.body.textContent||''):'').replace(/\n{2,}/g,'\n').trim().slice(0,900);
    }else sample=String(text).trim().slice(0,900);
  }catch(e){sample='（连文字都没抠出来）'}
  $('#sheet').innerHTML='<div class="ttl">没认出来，帮我看看</div>'+
  '<p class="dim" style="font-size:12px;margin:0 0 8px">下面是从文件里抠出来的文字开头。截这张图发我，我照着加格式。</p>'+

  openSheet();
}

function readFileText(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result));
    rd.onerror=()=>rej(new Error('读文件失败'));
    rd.readAsText(f);
  });
}
async function importArchive(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  toast('读取中… '+(f.size/1048576).toFixed(1)+'MB');
  let text;
  try{text=await readFileText(f)}catch(e){return alert(e.message)}
  if(!text.trim())return alert('这文件是空的');
  toast('解析中，大文件要等几秒，别动…');
  await new Promise(r=>setTimeout(r,80));
  const isHtml=/\.html?$/i.test(f.name)||/^\s*<(!doctype|html)/i.test(text.slice(0,300));
  let found=[];
  try{
    if(isHtml){const one=parseHtmlArchive(text);found=one?[one]:[]}
    else found=parseArchive(text);
  }catch(e){console.warn(e)}
  if(!found.length){toast('没解析出来');return diagnose(text,isHtml)}
  const st=await ingestFound(found,f.name.replace(/\.[^.]+$/,''));
  toast('');
  alert('导入完成\n档案：'+st.added+' 份\n消息：'+st.total+' 条'+(st.fail?('\n失败：'+st.fail+' 份'):''));
}
async function ingestFound(found,fileName){
  const arcs=load(LS.arcs,[]);
  let added=0,total=0,fail=0;
  for(let i=0;i<found.length;i++){
    const f=found[i];
    const ms=f.messages.filter(m=>m.role==='user'||m.role==='assistant');
    if(ms.length<2)continue;
    const id=uid();
    const nm=fileName?(found.length>1?(fileName+' '+(i+1)):fileName):(f.name||('档案'+(arcs.length+1)));
    try{await idbPut(id,ms);arcMem[id]=ms}
    catch(e){fail++;console.warn(e);continue}
    arcs.push({id:id,name:nm,count:ms.length,whole:false,t:Date.now()});
    added++;total+=ms.length;
  }
  save(LS.arcs,arcs);
  if(view==='mem')renderMem();
  return {added:added,total:total,fail:fail};
}

/* ---------- token 估算 ---------- */
function estTokens(s){
  s=String(s||'');
  if(!s)return 0;
  const cjk=(s.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length;
  const other=s.length-cjk;
  return Math.max(1,Math.round(cjk + other/4));
}

function memBlock(m){
  const L=[],pk=(arr,n)=>arr.slice(-n).map(x=>'- '+x.text).join('\n');
  if(m.core)L.push('【角色核心设定】\n'+m.core);

  if(m.summaries&&m.summaries.length)L.push('【长期聊天记录总结】\n'+pk(m.summaries,10));
  if(m.prefs&&m.prefs.length)L.push('【偏好与认知】\n'+pk(m.prefs,20));
  if(m.habits&&m.habits.length)L.push('【性格与习惯】\n'+pk(m.habits,15));
  return L.join('\n\n');
}
function buildCtx(c,extra){
  const sys=[c.persona||('你是'+c.name+'。')];
  if(c.scenario)sys.push('【当前情境】'+c.scenario);
  const mb=memBlock(mem);if(mb)sys.push(mb);
  const lu=msgs.slice().reverse().find(x=>x.role==='user');
  const ab=archiveBlock(lu?lu.content:'',c);if(ab)sys.push(ab);
  if(c.style)sys.push('【说话风格】'+c.style);
  sys.push('【硬性要求】中文回复；像真人发消息一样，短句为主；不要写括号旁白、不要解释设定、不要自称AI或模型。');
  if(extra)sys.push(extra);
  const hist=msgs.slice(-(cfg.ctx||30)).map(x=>({role:x.role,content:x.content}));
  return [{role:'system',content:sys.join('\n\n')}].concat(hist);
}
async function callAPI(messages,opt){
  opt=opt||{};
  if(!cfg.key)throw new Error('先去设置里填 API Key');
  const url=String(cfg.base||'').replace(/\/+$/,'')+'/chat/completions';
  const body={model:opt.model||cfg.model,messages:messages,
    temperature:(opt.temp!=null?opt.temp:cfg.temp),max_tokens:opt.maxtok||cfg.maxtok,stream:!!opt.stream};
  if(opt.stream)body.stream_options={include_usage:true};
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  if(!res.ok){let t='';try{t=await res.text()}catch(e){};throw new Error('HTTP '+res.status+' '+String(t).slice(0,180))}
  if(!opt.stream){
    const j=await res.json();
    if(opt.onUsage&&j.usage)opt.onUsage(j.usage);
    return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  }
  if(!res.body){
    const t=await res.text();let out='';
    t.split('\n').forEach(l=>{l=l.trim();if(l.indexOf('data:')!==0)return;const d=l.slice(5).trim();if(d==='[DONE]')return;
      try{const j=JSON.parse(d);if(j.usage&&opt.onUsage)opt.onUsage(j.usage);
      const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
      if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}}catch(e){}});
    return out;
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){
    const r=await rd.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const raw of lines){
      const line=raw.trim();
      if(!line||line.indexOf('data:')!==0)continue;
      const d=line.slice(5).trim();
      if(d==='[DONE]')return out;
      try{
        const j=JSON.parse(d);
        if(j.usage&&opt.onUsage)opt.onUsage(j.usage);
        const de=j.choices&&j.choices[0]&&j.choices[0].delta;
        const c=de&&de.content;
        if(c){out+=c;if(opt.onDelta)opt.onDelta(c)}
      }catch(e){}
    }
  }
  return out;
}
async function askAndAppend(){
  const c=curChar(),box=$('#msgs');

function parseSummary(res){
  const out={core:null,timeline:[],summaries:[],prefs:[],habits:[]};
  const LAB={
    '核心':'core','核心设定':'core','角色核心':'core','角色设定':'core','人设':'core','设定':'core',
    '时间线':'timeline','事件':'timeline','关键事件':'timeline','时间':'timeline',
    '总结':'summaries','长期总结':'summaries','长期记忆总结':'summaries','长期聊天记录总结':'summaries','聊天总结':'summaries','对话总结':'summaries','内容总结':'summaries','这段对话':'summaries',
    '偏好':'prefs','偏好与认知':'prefs','认知':'prefs','在意':'prefs','忌讳':'prefs','喜好':'prefs',
    '习惯':'habits','性格':'habits','性格与习惯':'habits','行为习惯':'habits','说话习惯':'habits'
  };

    let s=raw.trim();
    if(!s)return;
    s=s.replace(/^[-*•·\d.\s、>]+/,'');
    s=s.replace(/^[【\[\s]+/,'').replace(/[】\]]/,'');
    s=s.replace(/^\*{1,2}/,'');
    const m=s.match(/^([^：:]{1,14}?)\s*[:：]\s*(.*)$/);
    if(m){
      const lab=m[1].replace(/[*】\]]+$/,'').trim();
      const k=LAB[lab];
      if(k){cur=k;addSumItem(out,k,m[2]);return}
    }
    if(cur)addSumItem(out,cur,s);
  });
  return out;
}
function addSumItem(out,k,v){
  v=String(v==null?'':v).trim();
  if(!v||/^(无|无。|暂无|none|n\/a)$/i.test(v))return;
  if(k==='core'){if(!out.core)out.core=v;return}
  if(k==='timeline'){v.split(/[；;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>out.timeline.push(x));return}
  out[k].push(v);
}
function applySummary(p){
  let hit=0;
  if(p.core){mem.core=(mem.core?mem.core+'\n':'')+p.core;hit++}
  ['timeline','summaries','prefs','habits'].forEach(k=>{
    p[k].forEach(t=>{mem[k]=mem[k]||[];mem[k].push({t:Date.now(),text:t});hit++});
  });
  return hit;
}
async function runSummary(slice,silent){
  const c=curChar();if(!c)return 0;
  try{
    const res=await callAPI([{role:'user',content:buildSummaryPrompt(slice)}],{model:modelOf(c),temp:.3,maxtok:1200});
    const raw=String(res||'').trim();
    if(!raw){if(!silent)alert('模型没返回内容，检查模型或网络');return 0}
    let hit=applySummary(parseSummary(raw));
    let fallback=false;
    if(!hit){
      mem.summaries=mem.summaries||[];
      mem.summaries.push({t:Date.now(),text:raw.slice(0,2000)});
      hit=1;fallback=true;
    }
    saveMem();if(view==='mem')renderMem();
    if(!silent)alert(fallback?'模型没按格式回，已把原文存进「长期聊天记录总结」，去记忆里整理一下':'已写进记忆 '+hit+' 条，去「记忆」里看看，不对就手改');
    return hit;
  }catch(e){
    if(!silent)alert('失败：'+e.message);else console.warn('自动总结失败',e);
    return 0;
  }
}
async function autoSummary(){
  const c=curChar();if(!c)return;
  if(msgs.length<4)return alert('聊天记录太少，没什么可总结的');
  const slice=msgs.slice(-SUM_N).map(x=>(x.role==='user'?'她':c.name)+'：'+x.content).join('\n');
  await runSummary(slice,false);
}
async function maybeAutoSummary(){
  if(!cfg.autoSum||!cfg.key||!curChar())return;
  const every=Math.max(6,parseInt(cfg.autoSumEvery,10)||30);
  const base=mem._lastSum||0;
  if(msgs.length-base<every)return;
  mem._lastSum=msgs.length;saveMem();
  const from=Math.max(0,msgs.length-every);
  const c=curChar();
  const slice=msgs.slice(from).map(x=>(x.role==='user'?'她':c.name)+'：'+x.content).join('\n');
  await runSummary(slice,true);
}

/* ---------- 自动发消息 ---------- */
function scheduleAuto(){
  clearTimeout(autoT);
  const c=curChar();
  if(!c||!cfg.autoOn||!c.auto||!c.auto.on||!cfg.key)return;
  const a=c.auto,mi=Math.max(1,+a.min||30),ma=Math.max(mi+1,+a.max||90);
  autoT=setTimeout(fireAuto,(mi+Math.random()*(ma-mi))*60000);
}
function isQuiet(a){
  const h=new Date().getHours(),qs=+a.quietStart,qe=+a.quietEnd;
  if(isNaN(qs)||isNaN(qe))return false;
  return qs<=qe?(h>=qs&&h<qe):(h>=qs||h<qe);
}
async function fireAuto(){
  const c=curChar();
  if(c&&c.auto&&c.auto.on&&cfg.autoOn&&!isQuiet(c.auto)){
    try{
      const extra='【系统】现在你先开口。主动给ta发一条消息，1-2句，符合你的性格和你们平时的相处方式，不解释为什么发。'+(c.auto.hint?('（'+c.auto.hint+'）'):'');
      const out=await callAPI(buildCtx(c,extra),{model:modelOf(c),temp:Math.min(1,(cfg.temp||.85)+.1)});
      if(out){
        msgs.push({role:'assistant',content:out,t:Date.now(),tok:estTokens(out)});persist();
        if(view==='chat')renderChat();
        notify(c.name,(c.emoji||'')+out.slice(0,80));
      }
    }catch(e){console.warn('自动消息失败',e)}
  }
  scheduleAuto();
}
function notify(title,body){
  if(!cfg.notify)return;
  if(document.visibilityState==='visible')return;
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}
}

/* ---------- 隐私：密码 ---------- */
async function setPassword(){
  if(!window.crypto||!crypto.subtle)return alert('当前打开方式不支持加密。请用 Chrome/Edge 直接打开这个文件，或放到 https 网站里。');
  const pw=$('#s_pw').value;
  if(!pw)return alert('先输入密码');
  if(pw.length<4)return alert('密码至少 4 位');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pw,salt);
    const check=await encVal(key,'ok');
    const oldKey=cryptKey;
    if(!store){
      store={};
      for(const k of allDataKeys()){
        const raw=localStorage.getItem(k);
        if(raw==null)continue;
        try{store[k]=JSON.parse(raw)}catch(e){}
      }
    }
    const entries={};
    for(const k of Object.keys(store)){entries[k]=await encVal(key,JSON.stringify(store[k]))}
    for(const k of Object.keys(entries)){localStorage.setItem(k,entries[k])}
    for(const st of ['arc','rawlog']){
      let ks=[];try{ks=await idbKeys(st)}catch(e){}
      for(const k of ks){
        let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
        let val;
        if(oldKey){try{val=JSON.parse(await decVal(oldKey,raw))}catch(e){continue}}
        else val=raw;
        try{await idbPutRaw(k,await encVal(key,JSON.stringify(val)),st)}catch(e){}
      }
    }
    cryptKey=key;
    localStorage.setItem(LS.pw,JSON.stringify({salt:Array.from(salt),check:check}));
    toast(oldKey?'密码已修改':'密码已设置，数据已加密');
    renderCfg();
  }catch(e){alert('设置失败：'+e.message)}
}
async function removePassword(){
  if(!cryptKey)return;
  if(!confirm('移除密码？聊天和记忆会变回明文存储（任何拿到设备的人都能看到）'))return;
  try{
    for(const k of Object.keys(store)){localStorage.setItem(k,JSON.stringify(store[k]))}
    for(const st of ['arc','rawlog']){
      let ks=[];try{ks=await idbKeys(st)}catch(e){}
      for(const k of ks){
        let raw;try{raw=await idbGetRaw(k,st)}catch(e){continue}
        try{await idbPutRaw(k,JSON.parse(await decVal(cryptKey,raw)),st)}catch(e){}
      }
    }
    localStorage.removeItem(LS.pw);
    cryptKey=null;store=null;
    toast('密码已移除');
    renderCfg();
  }catch(e){alert('移除失败：'+e.message)}
}

/* ---------- 备份 ---------- */
function exportAll(){
  const d={v:4,at:Date.now(),cfg:cfg,chars:chars,messages:{},memories:{},todos:{},arcs:load(LS.arcs,[]),arcData:{}};
  chars.forEach(c=>{d.messages[c.id]=load(LS.msg(c.id),[]);d.memories[c.id]=load(LS.mem(c.id),null);d.todos[c.id]=todosOf(c.id)});
  d.arcs.forEach(a=>{d.arcData[a.id]=getArc(a.id)});
  let str='';
  try{str=JSON.stringify(d)}catch(e){return alert('导出失败：'+e.message)}
  const blob=new Blob([str],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='blue-sea-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function importAll(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!confirm('导入会覆盖现在所有数据，确定？'))return;
      if(d.cfg)save(LS.cfg,d.cfg);
      if(d.chars)save(LS.chars,d.chars);
      if(d.messages)Object.keys(d.messages).forEach(k=>save(LS.msg(k),d.messages[k]));
      if(d.memories)Object.keys(d.memories).forEach(k=>{if(d.memories[k])save(LS.mem(k),d.memories[k])});
      if(d.todos)Object.keys(d.todos).forEach(k=>{if(d.todos[k]&&d.todos[k].length)save(LS.todo(k),d.todos[k])});
      if(d.arcs)save(LS.arcs,d.arcs);
      if(d.arcData)for(const k of Object.keys(d.arcData)){try{await idbPut(k,d.arcData[k]);arcMem[k]=d.arcData[k]}catch(e){}}
      alert('导入完成，刷新一下');
      location.reload();
    }catch(e){alert('文件读不了：'+e.message)}
  };
  rd.readAsText(f);
}
function wipe(){
  if(!confirm('清空全部数据？角色、聊天、记忆、档案、待办全没，不可恢复'))return;
  localStorage.clear();
  try{indexedDB.deleteDatabase('wh_db')}catch(e){}
  location.reload();
}

/* ---------- 启动 ---------- */
async function unlock(){
  let meta=null;
  try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(!meta||!meta.salt){if(window._unlockGo)window._unlockGo();return}
  const pw=$('#pw').value;
  if(!pw){$('#pwerr').textContent='输入密码';return}
  try{
    const salt=new Uint8Array(meta.salt);
    const key=await deriveKey(pw,salt);
    const ok=await decVal(key,meta.check);
    if(ok!=='ok')throw new Error('wrong');
    cryptKey=key;
    await decryptAll();
    $('#lock').style.display='none';
    $('#pwerr').textContent='';
    if(window._unlockGo)window._unlockGo();
  }catch(e){$('#pwerr').textContent='密码不对';}
}

async function boot(){
  let meta=null;
  try{meta=JSON.parse(localStorage.getItem(LS.pw))}catch(e){}
  if(meta&&meta.salt){
    $('#lock').style.display='flex';
    await new Promise(res=>{window._unlockGo=res});
  }
  initApp();
}
boot();
